# fixture-holds: one synthetic puck held six ways so every fixture-solid kind is drawn.
# The supply is the finished R15 x 20 puck itself (no allowance), so every setup's
# entry stock is known and each setup's scene is a complete fixture picture: vise with
# parallels on riser blocks (S1), angle plate + strap clamp (S2), custom nest + strap
# clamp (S3), dividing head with its chuck and a tailstock dead centre (S4), 4-jaw chuck
# (S5) and 3-jaw chuck (S6). Each setup finishes the top face with one prescribed
# cutter pose; the strap (S2, S3) and the dead centre (S4) stand over that face, so
# accessibility errors there are the expected fixture-collision findings. Every pose and
# dimension is a synthetic test specification, not a shop measurement.
part = "fixture-puck"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "../shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "round_bar"
form_verify = false
dia_mm = 30.0
length_mm = 20.0
origin_mm = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
note = "Authored supply equal to the finished puck: its side and bottom are supplied as-is."
as_is_faces = ["#17/ADVANCED_FACE[1]/", "#59/ADVANCED_FACE[3]/"]

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Vise: puck on 20 mm parallels standing on two 10 mm riser blocks; jaws along X."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-vise"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "test-parallels-20"
parallels_centres_mm = [[0.0, -11.0], [0.0, 11.0]] # y -14..-8 and 8..14, inside the jaw planes y = -15 / 15
riser = "test-riser-blocks"
riser_up = "height"
riser_along = "length"
riser_centres_mm = [[-35.0, 0.0], [35.0, 0.0]] # 60 x 12 blocks under the parallels, clear of the jaws
grip_mm = 8.0
jaw_above_parallels_mm = 8.0
jaw_center_along_mm = 0.0
stop = "none"
clamp = "hand snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
id = "S2"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S1"
note = "Angle plate: puck on the base against the upright, one strap across its top along X."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-angle-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [{ ref = "test-clamp-kit/strap", pose = { origin_mm = [0.0, 0.0, 20.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } }]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "upright face"
clamp = "strap snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
id = "S3"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S2"
note = "Custom nest: puck between two blocks on a floor plate, one strap across its top along Y."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-nest"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [{ ref = "test-clamp-kit/strap", pose = { origin_mm = [0.0, 0.0, 20.0], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } }]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "nest blocks"
clamp = "strap snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
id = "S4"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S3"
note = "Dividing head tilted vertical: its chuck grips the lower 6 mm; the head's dead centre bears on the top-face centre."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-head"
chuck = "test-chuck-head"
pose = { origin_mm = [0.0, 0.0, 6.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
jaw_clock_deg = 90.0
grip_mm = 6.0
support = "test-dead-centre"
support_tip_mm = [0.0, 0.0, 20.0]
quill_extension_mm = 15.0
fixed_jaw = "not_applicable"
stop = "chuck face"
clamp = "chuck key snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
