[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
id = "S6"
machine = "test-mill"
frame = "A"
coolant = "none"
