# fixture-holds/clash: the same synthetic puck, held so that `fixture_interference`
# discriminates. S1 turns the S1 riser blocks so their 60 mm edge runs across the jaws:
# they span y -30..30 against the y -15..15 opening closed on the puck. S2 drops the
# stud of a stud-and-heel strap through the puck (and through the plate, which has no
# hole there). S3 moves the same strap so its stud passes beside the puck through the
# plate's tapped hole and the heel stands on the plate: every solid only touches.
# Every pose and dimension is a synthetic test specification, not a shop measurement.
part = "fixture-puck"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "../shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "round_bar"
form_verify = false
dia_mm = 30.0
length_mm = 20.0
origin_mm = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
note = "Authored supply equal to the finished puck: its side and bottom are supplied as-is."
as_is_faces = ["#17/ADVANCED_FACE[1]/", "#59/ADVANCED_FACE[3]/"]

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Vise: puck on 20 mm parallels on riser blocks turned 90 degrees, wider than the jaw opening."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-vise"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "test-parallels-20"
parallels_centres_mm = [[0.0, -11.0], [0.0, 11.0]]
riser = "test-riser-blocks"
riser_up = "height"
riser_along = "width" # the 60 mm length runs across the jaws: y -30..30
riser_centres_mm = [[-35.0, 0.0], [35.0, 0.0]]
grip_mm = 8.0
jaw_above_parallels_mm = 8.0
jaw_center_along_mm = 0.0
stop = "none"
clamp = "hand snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
id = "S2"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S1"
note = "Tapped plate: stud-and-heel strap along Y placed 12 mm off centre, so its stud enters the puck."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-tapped-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [{ ref = "test-clamp-kit/stud-strap", pose = { origin_mm = [0.0, 12.0, 20.0], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } }]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "strap nut snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"

[[setups]]
id = "S3"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S2"
note = "Tapped plate: the same strap centred, stud in the plate's tapped hole beside the puck, heel on the plate."

[setups.stock_state]
top_feature = "top"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-tapped-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [{ ref = "test-clamp-kit/stud-strap", pose = { origin_mm = [0.0, 0.0, 20.0], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } }]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "strap nut snug"

[[setups.ops]]
op = 10
do = "finish_face"
feature = "top"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 20.0
direction = "climb"
