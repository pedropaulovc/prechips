# sharp-corner, failing candidate (PLAN.md rev 6 §4.2 internal corner radius). One setup
# finishes the sharp-cornered pocket with the 1/4 in end mill (R3.175). Expected:
# internal_corner_radius error (claimed corner radius 0 < cutter radius); the other
# geometry rows pass. Everything here is a synthetic test specification.
part = "slot-block"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "../shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "finished_test_solid"
form_verify = false
note = "The STEP solid is the stock; only the pocket is cut. No material is asserted."
as_is_faces = [
  "#17/ADVANCED_FACE[1]/",
  "#57/ADVANCED_FACE[2]/",
  "#88/ADVANCED_FACE[3]/",
  "#146/ADVANCED_FACE[4]/",
  "#170/ADVANCED_FACE[5]/",
  "#187/ADVANCED_FACE[6]/",
]

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Top face up on 20 mm parallels; jaws along X clamp the 40 mm width across Y."

[setups.stock_state]
top_feature = "pocket"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-vise"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "test-parallels-20"
grip_mm = 6.0
jaw_above_parallels_mm = 8.0
jaw_center_along_mm = 30.0 # jaw centre on the block's mid-length: 150 mm jaws span x -45..105
parallels_centres_mm = [[30.0, 5.0], [30.0, 35.0]] # 6 mm parallels under the solid margins, y 2..8 and 32..38, inside the jaw planes y 0 / 40
stop = "left end against the fixed-jaw stop"
clamp = "hand snug, then quarter turn"

[[setups.ops]]
op = 10
do = "finish_pocket"
feature = "pocket"
tool = "em-1-4in"
holder = "r8-collet-1-4in"
to_z = 14.0
direction = "climb"
