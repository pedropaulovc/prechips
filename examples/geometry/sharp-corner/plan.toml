# sharp-corner, failing candidate (PLAN.md rev 6 §4.2 internal corner radius).
# S1 numerically clears the authored supply with a diameter-only preparation cutter. S2
# finishes the vertical sharp-cornered pocket walls with the 1/4 in end mill (R3.175).
# Expected: internal_corner_radius error; prescribed corner poses may also collide.
part = "slot-block"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "../shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "rectangular_bar"
form_verify = false
section_mm = [60.0, 40.0]
length_mm = 21.0
origin_mm = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
section_axis = [1.0, 0.0, 0.0]
note = "Authored 60 x 40 x 21 mm supply: 1 mm top allowance over the synthetic 20 mm block; the other five outer surfaces are supplied as-is. S1's numeric clearance is not CAM proof."
as_is_faces = [
  "#17/ADVANCED_FACE[1]/",
  "#57/ADVANCED_FACE[2]/",
  "#146/ADVANCED_FACE[4]/",
  "#170/ADVANCED_FACE[5]/",
  "#187/ADVANCED_FACE[6]/",
]

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Synthetic rough preparation clears top allowance and pocket before S2. Only the preparation cutter diameter is authored; its other dimensions, holder and holding remain measurement debt."

hold = { fixture = "unknown", stop = "unknown", grip_mm = "unknown", clamp = "unknown", fixed_jaw = "unknown" }
stock_state = { top_z = "unknown", bottom_z = "unknown" }

[[setups.ops]]
op = 10
do = "rough_pocket"
feature = "pocket"
tool = "em-preparation"
holder = "unknown"
direction = "unknown"
faces = [
  "#88/ADVANCED_FACE[3]/",
  "#295/ADVANCED_FACE[11]/",
  "#199/ADVANCED_FACE[7]/",
  "#230/ADVANCED_FACE[8]/",
  "#254/ADVANCED_FACE[9]/",
  "#278/ADVANCED_FACE[10]/",
]
stock_removal_bounds = { x = [0.0, 60.0], y = [0.0, 40.0], z = [14.0, 21.0] }
note = "Only outside-finished material inside this box is cleared; the prep floor claim supplies coverage without a centred floor boundary pose at S2."

[[setups]]
id = "S2"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S1"
note = "Top face up on 20 mm parallels; jaws along X clamp the 40 mm width across Y."

[setups.stock_state]
top_feature = "pocket"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-vise"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "test-parallels-20"
grip_mm = 6.0
jaw_above_parallels_mm = 8.0
jaw_center_along_mm = 30.0 # jaw centre on the block's mid-length: 150 mm jaws span x -45..105
parallels_centres_mm = [[30.0, 5.0], [30.0, 35.0]] # 6 mm parallels under the solid margins, y 2..8 and 32..38, inside the jaw planes y 0 / 40
stop = "left end against the fixed-jaw stop"
clamp = "hand snug, then quarter turn"

[[setups.ops]]
op = 10
do = "finish_pocket"
feature = "pocket"
faces = [
  "#199/ADVANCED_FACE[7]/",
  "#230/ADVANCED_FACE[8]/",
  "#254/ADVANCED_FACE[9]/",
  "#278/ADVANCED_FACE[10]/",
]
tool = "em-1-4in"
holder = "r8-collet-1-4in"
to_z = 14.0
direction = "climb"
