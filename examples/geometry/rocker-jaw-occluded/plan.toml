# rocker-jaw-occluded, failing candidate (PLAN.md rev 6 §4.2 accessibility, §6 round 2:
# "a jaw standing beside a face"). S1/A and S2/B numerically clear opposite halves
# of an authored rectangular supply; only preparation cutter diameter is known.
# S3/V receives the derived arm and stands it on its tips in a synthetic 320 mm vise.
# The claimed +Z strap face (exported strap_datum_b) lies 2.27825 mm inside the rear
# jaw plane; jaw tops reach 4.705 mm above the pivot axis. Expected: accessibility
# error when the Ø8 cutter cylinder beside the strap hits the jaw and the hub boss.
# The numeric preparation is a fixture declaration, not CAM proof or a proposed route.
part = "rocker-arm"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "rectangular_bar"
form_verify = false
section_mm = [292.509136, 29.29464]
length_mm = 9.0565
origin_mm = [-146.254568, 0.0, -4.52825]
axis = [0.0, 0.0, 1.0]
section_axis = [1.0, 0.0, 0.0]
as_is_faces = []
note = "Authored synthetic rectangular supply at the STEP's measured global XY bbox, x +/-146.254568, y 0..29.29464 mm, with 1 mm allowance beyond each hub end in Z (+/-4.52825 mm). The preparation cutter's authored 4 mm radius bounds clearance declarations; this supply adds no XY allowance. This is a fixture choice, not measured shop stock; curved and inset source faces are not declared as-is."

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Authored +Z half preparation. Only the preparation cutter diameter is authored; its other dimensions, holder and holding remain measurement debt. The numeric clearance derives material for the next setup."

hold = { fixture = "unknown", stop = "unknown", grip_mm = "unknown", clamp = "unknown", fixed_jaw = "unknown" }
stock_state = { top_z = "unknown", bottom_z = "unknown" }

[[setups.ops]]
op = 10
do = "rough_profile"
feature = "profile_outer"
tool = "em-preparation"
holder = "unknown"
direction = "unknown"
faces = [
  "#49/ADVANCED_FACE[2]/HAF_ROD_HOLE__P01",
