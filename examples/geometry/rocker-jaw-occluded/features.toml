frame = "model"
plane = { frame = "model", axis = "z", value = 1.25 }
requirements = []
faces = ["#492/ADVANCED_FACE[13]/HAF_STRAP_DATUM_B__P01"]
note = "The +Z broad strap face (plane z = +1.25 mm, outward normal +Z), datum B. Its -Z twin is the exported strap_faces set."
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:28", "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:510-529"]

