# rocker-arm (MHA-071) face manifest for the PLAN.md rev 6 §4.2 accessibility fixture.
# The STEP is the consumer's labelled v40 export delivered as
# C:/src/dt-logs/features-bundles/rocker_arm/rocker-arm.STEP (raw bytes, CRLF preserved,
# SHA-256 19070131…): SolidWorks inches, eighteen ADVANCED_FACE records each labelled
# HAF_<FEATURE>__P<nn> (periodic surfaces split into P01/P02 patches share one feature
# label). The feature identities and `faces` lists below are the consumer's exported
# face sets (features-bundles/rocker_arm/features.toml), restricted to the features this
# fixture needs; a reference is #<entity>/ADVANCED_FACE[<file-order ordinal>]/<label>,
# never FreeCAD's import ordinal. Dimensions quoted in notes are the consumer's nominal
# source geometry, cited as in ../../rocker-arm/features.toml; nothing is measured.
part = "rocker-arm"
units = "mm"
precision = "unknown"
step = "rocker-arm.STEP"
step_sha256 = "19070131b1ae87020768e24acea45dd8462773c76131630dd299f0188745ef15"
construction = "one_piece"
cite_root = "harmonic-analyzer"

[cite]
part = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:1-2"
step_sha256 = "harmonic-analyzer/cad/out/features/rocker_arm/rocker-arm.STEP (delivered as C:/src/dt-logs/features-bundles/rocker_arm/rocker-arm.STEP; see examples/geometry/README.md)"
construction = "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:66-93 (no built-up permission note)"

# Model frame as exported: X along the arm (rod end +X), Y toward the top edge, Z the
# extrusion axis. Pivot axis at (0, 8); strap faces z = ±1.25; hub faces z = ±3.52825;
# outer R816 arc bottoms out at y = 0, the R800 top edge ends at y = 29.2946 (the tips).
[frames.model]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
cite = ["harmonic-analyzer/cad/scripts/build_rocker_arm.py:42-45", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:396-403", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:424-434"]

# Setup frame V: the arm stands on its tips with the pivot axis horizontal. Frame z is
# model -Y (up = toward the R816 outer arc), frame y is model +Z, origin on the pivot
# axis at the extrusion mid-plane; x cross y = z. Model (X, Y, Z) -> V (X, Z, 8 - Y):
# tips at z = -21.2946, outer arc apex at z = 8, hub faces at y = ±3.52825 spanning
# z -5.1..5.1, strap faces at y = ±1.25.
[frames.V]
origin = [0.0, 8.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "unknown"
note = "S1: vise jaws along X close across model Z onto the two hub faces; the strap faces lie 2.27825 mm inside each jaw plane."
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:424-429"]

# Only the claimed +Z strap face (the consumer's datum B face, exported as its own
# feature) carries a cutting op; every other face is declared as-stock in plan.toml so
# coverage is not the finding under test.
[features.strap_datum_b]
