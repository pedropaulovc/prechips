# hand-fed-saw (#335): a vertical bandsaw cut along a scribed line, the work fed by hand on
# the saw table. The rocker's R800 top edge is scribed from a template on the bench (S1),
# then the crescent of waste above it is sawn 0.45 mm outside the line on the vertical
# bandsaw (S2, hold.kind = "hand_fed": no fixture, stop, grip or clamp). The rest of the
# arm is not made here, so coverage stays an error. All dimensions are synthetic choices;
# S1's holding stays declared debt.
part = "rocker-arm"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "inventory.toml"
policy = "shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "rectangular_bar"
form_verify = false
material = "1018 low-carbon steel"
material_verify = false
section_mm = [292.509136, 29.29464]
length_mm = 9.0565
origin_mm = [-146.254568, 0.0, -4.52825]
axis = [0.0, 0.0, 1.0]
section_axis = [1.0, 0.0, 0.0]
as_is_faces = []
note = "Authored synthetic rectangular supply at the STEP's measured global XY bbox, x +/-146.254568, y 0..29.29464 mm, with 1 mm allowance beyond each hub end in Z (+/-4.52825 mm), as examples/geometry/rocker-jaw-occluded. In setup frame T (zero 8 mm up the bar) the blank spans Y -8.000 to 21.295: the R800 top edge ends on its top face at X +/-145.240 and dips to Y 8.000 at X 0. A fixture choice, not measured shop stock."

# Setup zero at the pivot axis on the upper hub face: the examples/rocker-arm TA frame.
[frames.T]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: zero at the pivot axis on the upper hub face, the R800 centre 808 above it."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72"]

[[setups]]
id = "S1"
machine = "test-bench"
frame = "T"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Blue the upper face and scribe the R800 top edge from the template. Holding remains measurement debt."

hold = { fixture = "unknown", stop = "unknown", grip_mm = "unknown", clamp = "unknown", fixed_jaw = "unknown" }
stock_state = { top_z = 1.0, bottom_z = -8.0565 }

[[setups.ops]]
op = 10
do = "scribe"
feature = "top_edge"
layout = "template"
guide = { template = "test-r800-template" }

[[setups]]
id = "S2"
machine = "test-bandsaw"
frame = "T"
coolant = "none: dry cut"
deburr_mm = 0.0
deburr_cite = ["AUTHOR'S CHOICE: the sawn edge is a rough, filed to the line later"]
stock_in = "S1"
note = "Saw the crescent of waste off above the top edge in vertical mode, just outside the scribed line."

[setups.hold]
kind = "hand_fed"
note = "bar flat on the saw table, scribed face up"
guide_above_mm = 6.0 # AUTHOR'S CHOICE: the 1/4 in top of the 1/8-1/4 in guard height Northeastern University Makerspaces' bandsaw guide gives (https://makerspaces.northeastern.edu/create/library/bandsaw/)
push_aid = "test-push-stick"
feed_from = "-X" # AUTHOR'S CHOICE: start at the -X tip and saw toward the rod-hole end
end_support = "push_aid" # Penn State Origin Labs vertical band saw procedure: "ALWAYS use a push stick when nearing the end of your cut."

[setups.stock_state]
top_z = 1.0
bottom_z = -8.0565

[[setups.ops]]
op = 10
do = "saw_cut"
tool = "test-bandsaw-blade"
follows = "S1:10"
allowance_mm = 0.45
stock_removal_bounds = { x = [-147.5, 147.5], y = [7.0, 22.5], z = [-9.0, 2.0] }
