# unclaimed-face, failing candidate (PLAN.md rev 6 §4.2 coverage). S1 numerically
# clears top allowance and the step, claiming only the final top, floor and wall.
# S2 finishes the vertical wall. The +X end face #185/ADVANCED_FACE[6]/ is never
# claimed or declared as-stock, even though prep physically exposes it.
# Expected: coverage error naming that face. All dimensions are synthetic choices.
part = "step-block"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "../shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "rectangular_bar"
form_verify = false
section_mm = [60.0, 40.0]
length_mm = 21.0
origin_mm = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
section_axis = [1.0, 0.0, 0.0]
note = "Authored 60 x 40 x 21 mm supply: 1 mm top allowance over the synthetic 20 mm block. Four outer surfaces are supplied as-is; the deliberate +X end-face coverage omission stays undeclared."
as_is_faces = [
  "#17/ADVANCED_FACE[1]/",
  "#57/ADVANCED_FACE[2]/",
  "#128/ADVANCED_FACE[4]/",
  "#168/ADVANCED_FACE[5]/",
]

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Synthetic rough preparation clears the top allowance and step before S2. Preparation cutter, holder and holding remain intentionally unknown."

hold = { fixture = "unknown", stop = "unknown", grip_mm = "unknown", clamp = "unknown", fixed_jaw = "unknown" }
stock_state = { top_z = "unknown", bottom_z = "unknown" }

[[setups.ops]]
op = 10
do = "rough_profile"
feature = "step"
tool = "unknown"
holder = "unknown"
direction = "unknown"
faces = [
  "#104/ADVANCED_FACE[3]/",
  "#202/ADVANCED_FACE[7]/",
  "#219/ADVANCED_FACE[8]/",
]
stock_removal_bounds = { x = [0.0, 60.0], y = [0.0, 40.0], z = [10.0, 21.0] }
note = "Only outside-finished material inside this box is cleared. Do not credit the unclaimed +X end face: it is intentionally absent from these claims."

[[setups]]
id = "S2"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "S1"
note = "Upper land up on 20 mm parallels; jaws along X clamp the 40 mm width across Y, 8 mm above the parallels so the jaws stay below the step floor."

[setups.stock_state]
top_feature = "step"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-vise"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "test-parallels-20"
grip_mm = 6.0
jaw_above_parallels_mm = 8.0
jaw_center_along_mm = 30.0 # jaw centre on the block's mid-length: 150 mm jaws span x -45..105
parallels_centres_mm = [[30.0, 5.0], [30.0, 35.0]] # 6 mm parallels under both lands, y 2..8 and 32..38, inside the jaw planes y 0 / 40
stop = "left end against the fixed-jaw stop"
clamp = "hand snug, then quarter turn"

[[setups.ops]]
op = 10
do = "finish_profile"
feature = "step"
faces = ["#219/ADVANCED_FACE[8]/"]
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 10.0
direction = "climb"
