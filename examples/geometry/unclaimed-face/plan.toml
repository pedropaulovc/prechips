# unclaimed-face, failing candidate (PLAN.md rev 6 §4.2 coverage). One setup finishes
# the step (floor + wall) with em-8-std; the six outer faces other than the +X end face
# are declared as-stock. The +X end face #185/ADVANCED_FACE[6]/ is cut by no op and
# declared by nothing. Expected: coverage error naming that face; the per-op geometry
# rows pass. Everything here is a synthetic test specification.
part = "step-block"
features = "features.toml"
construction = "one_piece"

[paths]
inventory = "../inventory.toml"
policy = "../shop-policy.toml"
cutting_data = "../../cutting-data.toml"

[stock]
form = "finished_test_solid"
form_verify = false
note = "The STEP solid is the stock; only the step is cut. No material is asserted."
as_is_faces = [
  "#17/ADVANCED_FACE[1]/",
  "#57/ADVANCED_FACE[2]/",
  "#104/ADVANCED_FACE[3]/",
  "#128/ADVANCED_FACE[4]/",
  "#168/ADVANCED_FACE[5]/",
]

[[setups]]
id = "S1"
machine = "test-mill"
frame = "A"
coolant = "none"
deburr_mm = 0.0
stock_in = "stock"
note = "Upper land up on 20 mm parallels; jaws along X clamp the 40 mm width across Y, 8 mm above the parallels so the jaws stay below the step floor."

[setups.stock_state]
top_feature = "step"
top_z = 20.0
bottom_z = 0.0

[setups.hold]
fixture = "test-vise"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "test-parallels-20"
grip_mm = 6.0
jaw_above_parallels_mm = 8.0
jaw_center_along_mm = 30.0 # jaw centre on the block's mid-length: 150 mm jaws span x -45..105
parallels_centres_mm = [[30.0, 5.0], [30.0, 35.0]] # 6 mm parallels under both lands, y 2..8 and 32..38, inside the jaw planes y 0 / 40
stop = "left end against the fixed-jaw stop"
clamp = "hand snug, then quarter turn"

[[setups.ops]]
op = 10
do = "finish_profile"
feature = "step"
tool = "em-8-std"
holder = "r8-collet-8mm"
to_z = 10.0
direction = "climb"
