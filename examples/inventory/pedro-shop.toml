# Metric gauge-block set (illustrative example item, rocker-only) for the Ø0.20
# A|B|C comparison readings: at each pin height a calibrated stack is wrung on the
# granite beside the pin, the 1 µm test indicator (gauges.rocker-datum-indicator,
# carried on gauges.rocker-position-height-gauge) is zeroed on the stack and the
# pin-top deviation from it is read, so no long absolute height-gauge scale enters
# the result: centre = actual stack height + indicator deviation - actual pin
# radius, the same way in both box orientations. Example stacks (chosen per part,
# not fixed measurements): reading 1 about 162.5 (100 + 50 + 12.5) at the A pin and
# 28 (25 + 3) at the rod pin; reading 2 about 123 (100 + 23) and 105 (100 + 5).
# Standard 103-piece metric composition: 1.005; 1.01-1.49 by 0.01; 0.5-24.5 by
# 0.5; 25, 50, 75, 100. Grade and per-block calibration are example labels in the
