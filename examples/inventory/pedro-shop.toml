p and free upper rolling do not prove no pinch. Passive side guards and0.258-clearance end stop provide capture only; no hand used as catcher. Demonstration operating-limit target: blade-down feed force at the work<=50N, to be independently qualified with an appropriate force measurement and the actual feed mechanism; this target is not an observed load or a substitute for dynamic/no-pinch evidence. No machine geometry is changed."
