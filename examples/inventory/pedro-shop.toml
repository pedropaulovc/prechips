  { name = "c-stop-bar", locates = "land C (the bar top is the C plane)", fastener = "two #8-32 x 5/8 in SHCS into the front wall; underside flush with the box base; no dowels", note = "AUTHOR'S CHOICE: O1 1/2 x 1/2 in precision-ground flat, seated on the box base with no dowels, because its lapped top is the C plane and dowels would not set it. Saw and mill to 40 long; drill the two #16 (0.177 in, 4.50) free-fit clearance holes (MH 27th Table 4 p.1934) and counterbore Ø8 x 4.5 for the #8 heads (MH 27th Table 5 p.1621), break all edges, before hardening; harden per the shop's O1 torch route: coat with ATP-641 anti-scale, heat in the fire-brick chamber with the TS8000 torch (equalise at dull red, then an even cherry red one shade past non-magnetic on the pickup magnet, hold about 5 min), quench moving in warm Park's AAA oil in the lidded M2A1 can, pull hand-warm and temper at once: 400 °F 2 h, air cool, twice, in the tempering oven checked with the oven thermometer (MH 27th p.496 Table 9: about Rc 60). Lap the top and bottom on the cast-iron lap plate to 12.700 ±0.002, parallel within 0.002, compared on the granite against a 12.70 gauge-block stack (11.5 + 1.20) with the 1 µm test indicator; stress-relief temper at 350 °F, then a final light lap. Assemble on the granite: stand the box and the bar on the plate, bar pressed to the front face at its left end, and tighten the two #8-32 x 5/8 in screws, so the bar's underside is flush with the box base", shape = "box", at_mm = [0.0, -12.7, 0.0], size_mm = [40.0, 12.7, 12.7], measured = { status = "measured", by = "example value (realistic, not a shop measurement)", date = "2026-10-11", instrument = "example fixture (no physical measurement)" } },
