solids = [
  { name = "base", label = "base, 1018 steel", note = "1018 flat 1/2 x 3-1/2 in (stock), sawn 138 long, six faces milled in the PM 6 vise to 80 x 134 x 10, faces parallel within 0.02 (height gauge on the surface plate); from below drill the five #10 close-fit clearances #9 (0.196 in) through at 1500 rpm and counterbore them 3/8 in x 5.5 deep with the 3/8 in end mill at 900 rpm, plunged by the quill (drill-index-115, endmills-lms-6784; #10 close fit #9 MH 27th Table 4 p.1934, #10 counterbore 3/8 in MH 27th Table 5 p.1621; speeds for 1018 at 125-175 HB, HSS drilling 90 fpm MH 27th Table 17 p.1061 -> 1750 rpm for the #9, HSS end milling 110 fpm MH 27th Table 11 p.1045 -> 1120 rpm for 3/8 in). With the saddles and the foot stop screwed on snug: drill 3.8 and ream 4.00 each dowel pair through the base and 7 into the part above (cone-fixture-reamers; MH 27th p.833 reaming allowance), press the Ø4 x 16 dowels in flush with the underside, then tighten the screws. Crank-pin holes: drill 3.8 and ream 4.00 through, square to the base. Cone-pin holes: base X along the table X, tilt the head 12.52° on its scale (±0.5°) so the hole leans toward -X going down, spot each entry with a 3/16 in end mill, then drill 3.8 and ream 4.00 through; each axis runs through X 1.028 and X -14.133 at Y 33.368, Z -29.512 (the hole rows' start, 0.5 above the base top), entering the base top at X 0.919 and X -14.241. The dowel's flat end is ground square to its axis, so a head-tilt error tips both pin tops alike: the cap then bears on the same-side edge of each Ø3.2 flat, at most 1.6 from its centre, which moves the sleeve at most 1.6 x tan 0.5° = 0.014 along its axis and leaves the roll set by the two pins unchanged. Press each pin to its Fastener-column distance from the post axis, read over the gauge arbor (gauges.cone-cradle-gauge-arbor) bedded in both seats against the foot stop: cradle on the surface plate, DTI on the height gauge zeroed on the crown of the arbor's body section, the post axis half its miked diameter below that zero; the tail section's crown must read half the difference of the two miked diameters higher within 0.01, or the seats are not on one axis. Read each pin top through the arbor's relief, highest reading over the top. Crank pins: 21.38 ±0.12 below the axis. Cone pins: 21.01 ±0.06 along each pin's own axis from the post axis (from the plane through the post axis square to the pins, the north-cap plane's offset), read as the high (-X) edge of each Ø3.2 flat 21.76 (+X pin) and 18.56 (-X pin) below the axis, ±0.06; the two cone readings' errors agree within 0.03, 0.12° of roll over the 14.8 spacing (the S6 op 20 mouth check allows 0.13°). AUTHOR'S CHOICE: each band is 25 % of the post band the pin sets, rounded down to the hundredth (crank sleeve north face, the post's two-place 0.51: 0.12; north cap, half of it as the cap sits ConeBossLen/2 off the post centre, 0.255: 0.06), leaving 75 % to the sleeve and the bond, because the shares must sum to the band they replace (MH 27th p.987, Transfer of Tolerances; harmonic-analyzer MHA-DT-005-TL-01); and the tops print from the post axis, not the base top, because a pin top sets a sleeve face against that axis and a chain through the seat height would spend the band twice. Accept the cradle on these readings and then a dry fit before its first bond: blue the north cap of an S2 sleeve, lay the S5 post in the saddles against the foot stop, push the dry sleeve through the cross-bore until the cap stops, and lift the post off: both pin tops must show blue. Re-seat it: the -X and +X edges of the crank-socket mouth, read with the DTI on the height gauge, agree within 0.05, and the south cap, read with the DTI swept along the post axis off the body top, stands proud by the miked sleeve length less the miked body diameter at the socket, within 0.02, which puts the north cap flush on the body. If not, draw or press the pins to correct their heights and repeat", shape = "box", at_mm = [-40.0, -12.0, -40.0], size_mm = [80.0, 134.0, 10.0], measured = { status = "measured", by = "example value (realistic, not a shop measurement)", date = "2026-10-11", instrument = "example fixture (no physical measurement)" } },
  { name = "body-saddle", label = "body saddle, 1018 steel", locates = "body Ø42", fastener = "2 × #10-24 × 1/2 in SHCS from below + 2 × Ø4 × 16 dowels", note = "1018 flat 3/4 x 2-1/2 in (stock), sawn and six faces milled to size; drill #25 (0.1495 in) x 12 deep at 2000 rpm and tap #10-24 UNC-2B x 10 deep by hand at the tabled screw positions (drill-index-115; taps-unc-hand/10-24-plug, finished with taps-unc-hand/10-24-bottoming in the T-wrench tap-wrench-t-1-16-1-4; #10-24 tap drill MH 27th Table 4 p.1934; 1018 at 125-175 HB, HSS drilling 90 fpm MH 27th Table 17 p.1061 -> 2300 rpm for the #25; the tap is started square from the drill chuck with the spindle off and turned by hand, so no tapping speed applies). After doweling (base), the base clamped flat on the table with its long edge trammed along table X: tilt the head 90° and, with the boring head (tools.cone-fixture-boring-head), bore both seats on one axis 30.00 above the base top (picked up on the base top), each to suit its mate on the S5 post, the body seat to the body (nominal Ø42.01) and the tail seat to the raw tail (nominal Ø44.45): bore, lay the post in with its body and tail blued, and open the seat until the blue marks its whole arc and the post does not rock across it; the bar entering each seat from the nearer base end (over the foot stop for the body seat) so the head body stays clear of the parts; then, head back at 0° and the cradle turned 90° with the long edge trammed along table Y, side-mill the foot stop's foot-B face square to the long edge with a 3/4 in end mill (endmills-lms-6784)", shape = "box", at_mm = [-30.0, 10.0, -30.0], size_mm = [60.0, 10.0, 15.0], measured = { status = "measured", by = "example value (realistic, not a shop measurement)", date = "2026-10-11", instrument = "example fixture (no physical measurement)" } },
