# Metric gauge-block set (illustrative example item, rocker-only) for the Ø0.20
# A|B|C comparison readings: at each pin height a calibrated stack is wrung on the
# granite beside the pin, the 1 µm test indicator (gauges.rocker-datum-indicator,
# carried on gauges.rocker-position-height-gauge) is zeroed on the stack and the
# pin-top deviation from it is read, so no long absolute height-gauge scale enters
# the result: centre = actual stack height + indicator deviation - actual pin
# radius, the same way in both box orientations. Example stacks (chosen per part,
# not fixed measurements): reading 1 about 162.5 (100 + 50 + 12.5) at the A pin and
# 28 (25 + 3) at the rod pin; reading 2 about 123 (100 + 23) and 105 (100 + 5).
# Standard 103-piece metric composition: 1.005; 1.01-1.49 by 0.01; 0.5-24.5 by
# 0.5; 25, 50, 75, 100. Grade and per-block calibration are example labels in the
# note, not a certificate; range_mm/sizes_mm/resolution_mm/pieces are plain
# numbers in the schema.
[gauges.rocker-position-blocks]
kind = "gauge_block_set"
note = "illustrative example item: 103-piece metric steel gauge-block set, ISO 3650 grade 1 (example), each block's actual length on an example calibration sheet with expanded uncertainty U <= 0.10 µm + 1 ppm (k = 2); stacks wrung on the granite as comparison references for the 1 µm test indicator; example labels, not a calibration certificate or measurement"
# measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "count of blocks in the case" } (pieces is a plain number in the schema)
pieces = 103
# measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "interferometric comparison against reference blocks (example calibration)" } (range_mm is a plain number list in the schema)
range_mm = [0.5, 100.0]
# measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "interferometric comparison against reference blocks (example calibration)" } (sizes_mm is a plain number list in the schema)
