  { name = "tail-saddle", label = "tail saddle, 1018 steel", locates = "raw tail", fastener = "2 × #10-24 × 1/2 in SHCS from below + 2 × Ø4 × 16 dowels", note = "1018 flat 3/4 x 2-1/2 in (stock), sawn and six faces milled to size; drill #25 (0.1495 in) x 12 deep at 2000 rpm and tap #10-24 UNC-2B x 10 deep by hand at the tabled screw positions (drill-index-115; taps-unc-hand/10-24-plug, finished with taps-unc-hand/10-24-bottoming in the T-wrench tap-wrench-t-1-16-1-4; #10-24 tap drill MH 27th Table 4 p.1934; 1018 at 125-175 HB, HSS drilling 90 fpm MH 27th Table 17 p.1061 -> 2300 rpm for the #25; the tap is started square from the drill chuck with the spindle off and turned by hand, so no tapping speed applies). After doweling (base), the base clamped flat on the table with its long edge trammed along table X: tilt the head 90° and, with the boring head (tools.cone-fixture-boring-head), bore both seats on one axis 30.00 above the base top (picked up on the base top), each to suit its mate on the S5 post, the body seat to the body (nominal Ø42.01) and the tail seat to the raw tail (nominal Ø44.45): bore, lay the post in with its body and tail blued, and open the seat until the blue marks its whole arc and the post does not rock across it; the bar entering each seat from the nearer base end (over the foot stop for the body seat) so the head body stays clear of the parts; then, head back at 0° and the cradle turned 90° with the long edge trammed along table Y, side-mill the foot stop's foot-B face square to the long edge with a 3/4 in end mill (endmills-lms-6784)", shape = "box", at_mm = [-30.0, 100.0, -30.0], size_mm = [60.0, 20.0, 15.0], measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers" } },
