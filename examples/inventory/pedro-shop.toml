# Riser bars, 63.5 mm across: they sit inside the rocker's 65 mm jaw opening (0.75 mm
# each side) under both parallels' full footprints; a 1-2-3 block's 50.8 mm edge cannot
# carry both parallels and its 76.2 mm edge cannot fit the opening. AUTHOR'S CHOICE: cut
# as a pair from one bought 1 x 2-1/2 in precision-ground O1 flat-stock bar (annealed,
# ground both broad faces), because the shop has no surface grinder and two pieces of one
# ground bar match in height; the shop only saws them 3 in long and mills the ends square.
[fixtures.rocker-riser-bars]
