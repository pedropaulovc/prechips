# Light toolmaker's parallel clamp for the inspection box (illustrative example
# matched pair, rocker-only, one owner). Frame: origin on the outer jaw's gripping
# face at the jaw tip, centred on the jaw section; +x from the screws toward the tip
# (jaws lie at x <= 0), +y across the throat from the outer jaw's gripping face to
# the inner jaw's, +z = x × y. The throat is drawn set to 15.2 mm (2.5 mm part strap
# + 12.7 mm box front wall). The front screw threads into the inner jaw with its knob
# outside the outer jaw; the rear screw threads through the inner jaw and bears on
# the outer jaw. Box-frame poses (x = [1, 0, 0], z = [0, 0, 1]): lower clamp origin
# [18.0, -2.5, 50.0], upper clamp origin [15.0, -2.5, 95.0]. The outer jaw bears on
# the part's lower strap face (box y = -2.5), the inner jaw on the front wall's
# inner face (box y = 12.7) inside the cavity, entering through the matching left
# window; screws and knobs stay at box x < -3, jaws at x <= 18 and z 43.65..101.35.
# Tighten finger-light only: the clamps hold B on the front face, never load C.
[fixtures.rocker-inspection-clamps]
kind = "parallel_clamp"
note = "illustrative example matched pair of light 3 in toolmaker's parallel clamps: 76.2 x 12.7 x 12.7 mm steel jaws, two M8 screws with 16 mm knurled knobs, about 50 mm capacity; finger-light inspection clamping only"
