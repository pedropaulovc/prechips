note = "illustrative example item: 103-piece metric steel gauge-block set, ISO 3650 grade 1 (example), each block's actual length on an example calibration sheet with expanded uncertainty U <= 0.10 µm + 1 ppm (k = 2); stacks wrung on the granite as comparison references for the 1 µm test indicator; example labels, not a calibration certificate or measurement"
