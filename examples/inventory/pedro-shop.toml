solids = [
  { name = "base", fastener = "the four counterbored 3/8-16 SHCS into table T-nuts", note = "AUTHOR'S CHOICE: bought 1 in Blanchard-ground A36 steel plate, sawn to 360 x 145 by the supplier (example purchase; faces flat and parallel within 0.025), because the pads and stand are bonded to a granite reference and the plate faces only sit flat on the table. Mill the -Y edge straight: it is the reference edge every hole and slot is positioned from. On the PM-30MV: mill the twelve pad slots 2.0 deep and the four rest slots 1.0 deep with the tools.rocker-slot-endmill (carbide), stepping over to width; plunge the stand counterbore 2.0 deep with the 3/8 in end mill (Ø9.525) and, in the same setup, drill the stepped shoulder-screw hole on the stand counterbore axis, each depth below the plate's top face to the tool tip on the quill stop: #25 (0.1495 in, 3.80; MH 27th Table 4 p.1934) to 18.2, letter D to 8.4, then the 6.5 mm reamer to 6.3, so the full Ø6.500 H7 bore runs 3.3 from the counterbore floor (the shoulder engages 3.0 of it) and the reamer's 1.0 lead ends 0.2 above the D step; then tap #10-24 UNC-2B by hand, the tap held square from the spindle, with the tools.taps-unc-hand/10-24-plug until its point is 17.0 deep and the tools.taps-unc-hand/10-24-bottoming until its point is 16.6 deep: full thread from 7.3 (below the D point) to 14.5. The screw's thread then ends 1.0 above the full-thread bottom and engages 6.2, 1.28 times the 0.190 in nominal, inside the one to 1-1/2 diameters MH 27th p.1776 bases the 2B minor-diameter tolerances on. AUTHOR'S CHOICE: that engagement, not the longer one MH 27th p.1510 Formula (1) asks to break a screw before its thread strips, because this slotted screw is only driven snug with a screwdriver to clamp washer, hub and stand, and the shoulder, not the thread, locates; drill #33 and ream the 3.00 rod-pin hole (tools.rocker-pin-reamer/3.0mm); drill 5/16 and tap the six 3/8-16 stud holes 13.2 deep (two for the S3 hub straps, four for the S4 rail clamps); drill 13/32 and counterbore Ø15.9 x 10.5 on the pilot (tools.rocker-holddown-counterbore) for the four hold-down screws. Bond the four rail rests first, plate face-up, each seated on its slot floor in EA 9462. Then bond the pads and the stand against the granite surface plate (gauges.granite-surface-plate), face-down: set each lapped pad in its slot on a bed of EA 9462 from the cartridge gun, standing about 0.5 proud of home (the non-sag paste holds it), and the stand the same way in its counterbore; tape-mask round every pocket so no epoxy reaches the granite or the blocks. On the clean granite, wring three 10.22 gauge-block stacks (9.0 + 1.22; 8.0 + 1.20 + 1.02; 7.0 + 1.0 + 1.15 + 1.07) for the plate's corner faces and set a 2.325 stack (1.005 + 1.32, the nearest the 103-piece set builds to the 2.328 nominal, inside its ±0.02) where the stand lands (a paper template traced from the plate places it). Turn the plate over and lower it face-down onto the three stacks: the granite pushes every pad back to one plane and the 2.325 stack sets the stand, leaving about 0.07 under each foot. Weight it, cure 24 h, lift. Verify face-up on the granite, height gauge carrying the 1 µm test indicator zeroed on gauge-block stacks: pad tops coplanar within 0.005; stand top 2.328 ±0.02 below the pad plane, measured and recorded on the plate's -Y edge (the hub shim stack absorbs it). Out: heat-release the epoxy (about 150 °C) and rebond. AUTHOR'S CHOICE: never lap on the granite (it is the measuring datum; the cast-iron lap plate is the lap), and condition the lap plate before lapping the pads and stand, because abrasive would wear the granite and an unconditioned lap rounds small faces", shape = "box", at_mm = [-180.0, -70.0, -40.4], size_mm = [360.0, 145.0, 25.4], measured = { status = "measured", by = "example value (realistic, not a shop measurement)", date = "2026-10-11", instrument = "example fixture (no physical measurement)" } },
  { name = "pad-r1", locates = "lower strap face", fastener = "bonded with EA 9462 in its slot (0.05 gap a side, about 0.07 under the foot); top set on the granite reference", note = "O1 1/8 x 1/2 in precision-ground flat, left annealed (a locating face under light strap clamping, not a wear face). Saw on the bandsaw, then mill to the listed length, width and 12.15 height (R1/L1 keep the 3.175 stock thickness): about 0.07 short of the slot floor, so the top, not the floor, sets the height. Break the four vertical corners 0.5 x 45° on the India stone so they clear the slot-end radii (R0.75 from the 1.5 end mill). Lap the top flat on the cast-iron lap plate, 400 then 800 compound with kerosene; bonded with the stand (see the base row)", shape = "box", at_mm = [10.05, -1.2875, -16.93], size_mm = [19.9, 3.175, 12.15175], measured = { status = "measured", by = "example value (realistic, not a shop measurement)", date = "2026-10-11", instrument = "example fixture (no physical measurement)" } },
