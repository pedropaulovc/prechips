included = ["chuck_3jaw_5in_inside_outside_jaws", "tailstock_adjustable", "spindle_centre", "dog_driver"]
# --- cone-pivot-post additions ---
# Headroom reads `height` as table to spindle axis (centre height, 3-15/16 in).
# Solids hang from the spindle nose (the back of the chuck the plan names):
# x = up (the plan pose x), z = toward the work, y = z cross x.
