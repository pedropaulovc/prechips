  { name = "shell", supply = "existing", fastener = "bought box parallel, Suburban BXP-050505-G", note = "AUTHOR'S CHOICE: mill the three windows on the PM-30MV with light cuts, the box held by toe clamps on parallels with soft clamping, never in the vise, drill and tap the two #8-32 holes (below), then characterise the box's base-to-right squareness by reversal on the gauges.granite-surface-plate (S4 op 50 steps 5-6), because milling can relieve stress and move it. Leave the base, the marked right side and the front face uncut: they are the reference faces", records = [{ check = "base-to-right squareness by reversal (E_box, S4 op 50 steps 5-6)", gauge = "rocker-datum-indicator", how = "on the gauges.rocker-position-height-gauge over the gauges.granite-surface-plate: read the box base-down, then tipped onto the marked right side; E_box = (s1 - s2 - p)/2, written on the box and applied as the op 50 correction", over_mm = 100.0 }], shape = "box", at_mm = [0.0, 0.0, 0.0], size_mm = [127.0, 127.0, 127.0], measured = { status = "measured", by = "example value (realistic, not a shop measurement)", date = "2026-10-11", instrument = "example fixture (no physical measurement)" } },
