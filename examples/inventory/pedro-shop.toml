# Shared S3/S4 profile fixture (illustrative example shop-made item). Frame: rocker
# frame A (pivot axis at the origin, upper hub face Z0, rod end +X); both plans pose it
# at the setup origin. Ground plate X-180..180, Y-70..75, Z-40.4..-15 under the whole
# 340 x 65 blank (raw Z-11.52825..4.47175). The plate is 25.4 thick so that, with the S4
# 1/4 in finisher at 25 mm projection (Z-6.02825 deepest), the R8 spindle nose stays 4.4
# mm above the PM-30MV's 2.4 in spindle-to-table minimum (frame-A Z0 is 40.4 above the
# table). Twelve strap pads (tops Z-4.77825 on the lower strap face, ~6 mm inside the
# finished outline, so outside the end mills' swept bands), a bored hub stand (OD 9.5
# with an 8.0 relief bore, top Z-7.0565 on the lower hub face; the relief clears the S3
# reamer exit and the S4 shoulder, which locates only in the reamed hub and the plate's
# 6.500 bore). Pad tops stand 2.27825 above the stand top, the hub-proud step S1 and S2
# cut from each hub face, so pads and stand carry the part at any hub length in its
# band. Z figures here are for the CAD part at the band minimum (hub 7.0565); the
# 7.080-aim part sits 0.0235 higher on the same pads and stand, so each setup touches Z
# on the part, never on the plate. Four rail rests sit under the retained rails at X+-70
# (>16 mm outside the outline). Each rest is a fixed 3.0 mm ground body (top Z-12) plus
# a shim stack, nominal 0.47175 mm to Z-11.52825: seat B on the pads and stand first,
# then build each stack with feeler gauges to the gap under that rail on the actual
# blank, without lifting the part, so the rails never overconstrain the strap seat. The
# plate has a 6.500 H7 locating bore for the S4 shoulder screw (Z-21..-15), a blind M5
# tap under it, blind 3/8-16 stud taps (13.2 deep) at X+-70 Y45 and Y-36 and four
# counterbored 3/8-16 socket-head hold-down screws to table T-nuts (heads 0.475 below
# the plate top). Tapped holes are voids at the thread major diameter plus a small
# clearance so a threaded engagement reads as mating, not interference. The Y-60/+65
# hold-down pitch (125 mm) is the example's assumed T-slot pair: confirm on the PM-30MV
# table before making the plate. The diamond pin is a separate item, permanently fitted
# in the plate's rod-pin hole and posed at the same pose in both S3 and S4.
[fixtures.rocker-profile-fixture]
name = "rocker profile fixture plate"
kind = "custom"
note = "illustrative example shop-made fixture: 360 x 145 x 25.4 mm ground plate, twelve strap pads, relieved hub stand, four 3.0 mm rail rests with per-blank shim stacks, shoulder-screw locating bore, rod-pin hole, stud and hold-down holes"
