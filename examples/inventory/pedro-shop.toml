# inner (gripping) plane at the jaw top, i.e. [-jaw_width/2, rear inner Y, jaw top]
# = [-79.3369, Y, -4.68295] (jaw_width 6.247 in = 158.6738 mm), x = setup +X,
# z = up. The base's mating face is local x = 0 and the base stays below the jaw top.
# The nose face is at local x = -90.6631 (= -170 + 79.3369), centred at local y
# -32.5 (blank centre) and Z-5. Poses (x = [1, 0, 0], z = [0, 0, 1]):
