name = "magnetic blank-end stop"
kind = "work_stop"
shop_made = true
note = "illustrative example shop-made magnetic end stop: 30 x 17 x 24 mm switchable rare-earth magnetic base, its magnetic face flat on the fixed jaw's left end face, its top 1.0 below the jaw top, its front side 0.5 behind the jaw's gripping plane and its on/off knob facing the back of the vise; an 11 x 10 x 65.2 mm 1018 arm, an 8 x 14 x 51 mm 1018 finger keyed to it and a bonded 6 mm hardened dowel-pin nose, one M6 screw along the arm axis 9.0 behind the gripping plane and 6.0 below the jaw top clamping finger, arm and base; nose face 90.7 from the base's magnetic face; gentle positioning contact only, no cutting or clamping load"
