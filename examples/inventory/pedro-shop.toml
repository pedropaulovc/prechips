  { hold = "arm: the sawn 1/2 in square 1018 in the mill vise on parallels, fixed jaw indicated along X; mill one face, then each next face against the fixed jaw, the milled face down; ends squared with the bar standing on its end against the fixed jaw", tool = "endmills-lms-6784/3-8in-4fl", rpm = [920, 1120], feed = "0.001 in/tooth", doc_mm = 1.0, cite = "MH 27th Table 11 p.1045 (1018, 125-175 HB: HSS end milling 110 fpm); 0.001 in/tooth from Table 15a p.1054 for a 1/4-1/2 in cutter at .050 in depth" },
