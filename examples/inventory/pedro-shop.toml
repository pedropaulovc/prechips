# S3/S4 rod-hole diamond pin (illustrative example rocker-only item, one owner): an
# in-process orientation locator, not datum C. Datum C is the finished rod-side tip
# land, cut in S4 op 40 and inspected off-machine in S4 op 50. Frame: origin on the
# rod-hole axis at the lower strap face (the pad-top plane), +x radial from the pivot
# to the rod hole, +z DOWN into the plate. S3 and S4 pose (same, permanently bonded
# in the plate): origin [133.067402, 8.456064, -4.80175] (the pad-top plane: the lower
# strap face at the 7.080 hub aim, as the profile fixture is posed), x = [0.997987, 0.063419, 0],
# z = [0, 0, -1]. The working tip is drawn Ø2.0035, 0.0005 under the 2.004 reamed rod
# hole the S2 reamer leaves, as its preloaded land contact; the bought pin itself is 1.9863-1.9873. Pedro ruling 3: a bought Class X gauge pin (1.9863-1.9873) is the
# working tip, bonded with Loctite 638 into a turned, unhardened 4140 body whose
# 2.990-2.998 shank is a bonded slip fit in the plate's reamed 3.00 hole and whose
# Ø4.5 collar seats on the plate top (Z-15..-9.1). Flats 1.76 across along the radial
# line: the full round lands orient the part about datum A in the reamed 2.000-2.010
# rod hole (0.0127-0.0237 diametral clearance); the flats tolerate the rod hole's
# radial position. Tip ends at Z-2.4, below the upper strap face. AUTHOR'S CHOICE: no
# neck; the bare Ø1.987 pin stands from the collar top to the tip, because the S4 op
# 25/27 end mill runs down to Z-6.02825 beside the rod hole: the old Ø3.0 neck stood
# 0.5 nearer that cut than the pin does, and the collar top stays 3.07 below the
# cutter tip. The pin carries no Z: the strap pads do. It is the positive tangential
# stop for the S4 closing profile pass (op 27) only, after the retained web is cut
# (the web reacts the earlier passes); in S3 the straps react the loads. Before
# tightening, the part is preloaded CCW (viewed from above, looking down -Z) against
# it. It is never a clamp or lift.
