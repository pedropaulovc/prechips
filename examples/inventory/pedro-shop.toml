# S10 saw cradle (illustrative example shop-made item, cone-pivot-post only), to the
# harmonic-analyzer print MHA-DT-005-TL-02 (HA #1249, 3219f2698): one milled 1018 block, no
# screws or dowels. Local frame = cone plan frame B6: post axis along -X (head top X0, foot B
# X86), cone cross-bore axis vertical (+Z, south cap up), so the post's body axis is Y0 Z0.
# Two saddles, milled from the solid, carry the body at X28.5..41.5 and X66..80 (clear of the
# head shoulder at X26.6, the crank sleeve at X2.3..24.3 and the cone sleeve at X44..61.2).
# Their seats are bored Ø43.6 together on one axis, larger than the largest printed body, with
# the seat bottoms on the nominal body's underside line (Z-21.0055), so the seat axis stands
# 0.7945 above the post axis. An 8 x 28 land under the cone axis (X48.63..56.63, Y-14..14) is
# left proud and milled down to suit the post until the north cap bears with the body seated,
# so the bridge's load runs down the cone sleeve onto the land and never through the bonded
# joint; it is drawn at its fitted nominal, flush with the seat bottoms. The 19.0 mm base ends
# at X2, 3 mm on the kept side of the 1.5 mm kerf at X-2.5..-1; the raw tail overhangs it and
# falls clear. The base is gripped across its 100 mm width by the bandsaw's own vise; those
# jaws (110 x 12 x 60 mm, from vise-bandsaw-4x6) are drawn here as closed on the base, rear jaw
# at +Y, so the scene shows every solid.
[fixtures.cone-saw-cradle]
kind = "custom"
note = "AUTHOR'S CHOICE: illustrative example shop-made saw cradle to the harmonic-analyzer print MHA-DT-005-TL-02: one 1018 steel block, 95 x 100 base 19.0 thick with two saddles 39.0 high milled from the solid, their seats bored Ø43.6 together on one axis, an 8 x 28 north-cap land fitted to suit the post (its cap bears with the body seated), and two 3/8-16 stud holes tapped through for the cap bridge; drawn with the bandsaw vise jaws closed on the base; post horizontal with the cone cross-bore vertical. No screws or dowels: the print does not permit a built-up cradle."
