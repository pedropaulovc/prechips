# --- pivot-bracket additions ---
# Illustrative angle plate. Local XY is the table plane; the front upright face
# is Y=0. TC outer-face Z0 sits 4 mm above its top, so the table is TC Z=-92.9.
# DataBracket7 (r8, BR-B1): AUTHOR'S CHOICE: the part stands 4 mm proud of the upright
# (was 2) because S4 op 10's Ø9.525 facing cutter overhangs the plate side at Z0 and the
# whole-tool clearance measure (engine/r8-clearance) put it 2.000 above the upright; at
# 4 mm it passes with room a novice can hand feed by. The seat still bears on 20.2 of
# the foot's 24.2 length, and the 4 mm lip is easier to sweep with the DTI.
# The shop-made foot-end ledge is a 16 x 6 x 17.9 mm 1018 block held to the upright
# face by two #10-32 x 5/8 in socket-head cap screws at X +/-4, Z -33.2, 9 mm below
# the part; the upright is drilled and tapped #10-32 for them (illustrative example).
# DataBracket7: the ledge is 17.9 high so that, standing on a 1-2-3 block's 2 in
# (50.8 mm) side on the table (TC Z -92.9), its top lands at TC Z -24.2 (68.7 above
# the table). Its screws sit 9.0 below its top, about mid-height, so the 1/8 in vise
# parallels clear both #7 holes when it is drilled.
# supply: base and upright are the purchased plate (existing; only its holes are made
# here); screws are bought; each screw head is drawn separately for clearance and is
# part of the bought screw, so it is marked existing to keep it off the buy list.
[fixtures.angle-plate]
kind = "angle_plate"
shop_made = true                 # purchased plate, drilled and tapped here for the ledge screws and bridge studs
note = "illustrative example item: 4 x 5 x 3-1/2 in machined cast-iron angle plate, slotted faces, drilled and tapped in the shop for the bracket ledge and bridge"
length_in = { value = 5.0, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "steel rule" } }
width_in = { value = 4.0, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "steel rule" } }
height_in = { value = 3.5, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "height gauge" } }
# Bracket mounting location: table to the held foot's bottom (TC Z=-24.2).
bed_height_mm = { value = 68.7, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "height gauge, table to held foot bottom" } }
solids = [
  { name = "base", supply = "existing", shape = "box", at_mm = [-63.5, 0.0, -92.9], size_mm = [127.0, 101.6, 12.7], fastener = "two 1/2-13 T-bolts with flange nuts through the base slots into the table T-slots", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers and height gauge" } },
  # DataBracket4/7: make note. Gray cast iron (ASTM Class 30 assumed) HSS drilling 80 fpm, Machinery's Handbook 27th ed. Table 20, p.1068 -> 1922 rpm for the #21 (0.159 in) and 770 rpm for the letter X (0.397 in); 1800 and 750 rpm are under them; the 3/8 in spot drill at 700 rpm runs 69 fpm. Feeds: p.1060 drill feeds 0.002-0.006 in/rev (1/8-1/4 in: 0.003 = 0.08 mm/rev) and 0.004-0.010 in/rev (1/4-1/2 in: 0.005 = 0.13 mm/rev); spotting 0.0016 in/rev inside 0.001-0.003 (under 1/8 in). Dry drilling and tapping: p.1147 "Cutting Fluids Recommended for Machining Operations", cast iron: drilling dry, tapping dry.
  { name = "upright", supply = "existing", shape = "box", at_mm = [-63.5, 0.0, -80.2], size_mm = [127.0, 12.7, 76.2], locates = "finished seat face (datum A)", note = "cast iron as bought: make the four holes only. 1. Lay the plate on the upright's front face across two 1 in parallels, one under each outer end 45-63 mm from the centreline, so every hole is over the open gap; clamp it to the PM-30MV table with two strap clamps from the clamping kit on the upright's back face over the parallels. 2. Edge-find one outer end and the upright's top edge; the centreline is 63.5 mm from that end. 3. Hole centres from the centreline and the top edge, each within ±0.05 on the DRO: two #10-32 tapped holes at ±4.0, 29.2 below the top edge (8.0 apart, matching the ledge's #7 holes); two letter X stud holes at ±20.0, 13.5 below it (40.0 apart, matching the bridge). 4. At each hole spot 1.0 mm deep (a Ø3.5 cone) with the 3/8 in 120° spot drill at 700 rpm and 0.04 mm/rev, then drill #21 (0.159 in) through at 1800 rpm and 0.08 mm/rev, or letter X (0.397 in) through at 750 rpm and 0.13 mm/rev, dry, by hand on the quill. 5. Tap each #21 hole #10-32 before moving the table: the #10-32 plug tap in the drill chuck, spindle off, turned two turns by hand under light quill pressure to start it square; then release the chuck and tap through with the tap wrench, dry, backing off every turn. 6. Stone the front face flat over every exit burr: it seats datum A.", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers and height gauge" } },
  # DataBracket4/7: make note. 1018 (125-175 HB) HSS drilling 90 fpm, Machinery's Handbook 27th ed. Table 17, p.1061 -> 1710 rpm for the #7 (0.201 in); 1500 rpm is under it. End-mill speed and feed are the S1 T1 values (examples/cutting-data.toml). Feed: p.1060 drill feed 0.002-0.006 in/rev for 1/8-1/4 in drills. The ledge sets the foot's tilt about Y (its top is the S4 foot-end rest), so its top is held parallel to the table within 0.02 over 16 (0.07°, about 0.04 mm at the 33 mm crown); its height is loose because S4 touches Z on the part.
  { name = "bolted foot-end ledge", shape = "box", at_mm = [-8.0, -6.0, -42.1], size_mm = [16.0, 6.0, 17.9], locates = "foot free end", fastener = "two #10-32 x 5/8 in SHCS into the tapped upright", note = "1018 cold-rolled 3/4 x 1/4 in flat bar, no heat treatment. 1. Bandsaw 21 mm off the bar. 2. Mill all six faces square in the vise with the 3/8 in 4-flute end mill at 900 rpm and 90 mm/min, at most 1 mm per pass, to 16.0 wide x 17.9 high x 6.0 thick (±0.05); top and bottom parallel within 0.02 and square to the back face that seats on the upright. 3. Clamp it flat, 6 mm up, the vise jaws on its top and bottom faces, on two 1/8 in thick parallels against the jaws. Edge-find one end and the top face: the hole centres are 4.0 and 12.0 mm from that end (8.0 apart ±0.05, matching the upright's tapped holes) and 9.0 below the top face. Spot each 1.0 mm deep with the 3/8 in 120° spot drill at 700 rpm and 0.04 mm/rev, then drill #7 (0.201 in) through at 1500 rpm and 0.08 mm/rev, with cutting oil. Break the edges. 4. Fit it: angle plate base down on the mill table; stand a 1-2-3 block on its 1 x 3 in face (2 in high) in front of the upright under the tapped holes; rest the ledge on it, back face flat on the upright, and tighten both #10-32 SHCS. Its top is then 68.7 mm above the table and 20.2 below the upright's top edge. 5. Check: sweep the ledge top along X with the DTI from the spindle; it must read 0.02 or less over the 16 mm. Lift the block out.", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers and height gauge, ledge top at TC Z=-24.2" } },
  { name = "left-ledge-screw", supply = "bought", shape = "cylinder", at_mm = [-4.0, -6.0, -33.2], axis = [0.0, 1.0, 0.0], dia_mm = 4.826, length_mm = 15.875, fastener = "#10-32 x 5/8 in SHCS", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers, #10-32 x 5/8 in SHCS" } },
  { name = "left-ledge-screw-head", supply = "existing", shape = "cylinder", at_mm = [-4.0, -10.826, -33.2], axis = [0.0, 1.0, 0.0], dia_mm = 7.938, length_mm = 4.826, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers, #10-32 SHCS head" } },
  { name = "right-ledge-screw", supply = "bought", shape = "cylinder", at_mm = [4.0, -6.0, -33.2], axis = [0.0, 1.0, 0.0], dia_mm = 4.826, length_mm = 15.875, fastener = "#10-32 x 5/8 in SHCS", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers, #10-32 x 5/8 in SHCS" } },
  { name = "right-ledge-screw-head", supply = "existing", shape = "cylinder", at_mm = [4.0, -10.826, -33.2], axis = [0.0, 1.0, 0.0], dia_mm = 7.938, length_mm = 4.826, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers, #10-32 SHCS head" } },
  # Ledge clearance: #10 free fit, #7 drill 0.2010 in (5.11 mm); upright tap drill for #10-32: #21, 0.1590 in (4.04 mm). Machinery's Handbook 27th ed. Table 4, p.1934.
  { name = "left-ledge-clearance-hole", shape = "cylinder", at_mm = [-4.0, -6.1, -33.2], axis = [0.0, 1.0, 0.0], dia_mm = 5.105, length_mm = 6.2, void = true, cuts = ["bolted foot-end ledge"], fastener = "#7 (0.201 in) drilled clearance hole for a #10-32 screw", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "pin gauge" } },
  { name = "right-ledge-clearance-hole", shape = "cylinder", at_mm = [4.0, -6.1, -33.2], axis = [0.0, 1.0, 0.0], dia_mm = 5.105, length_mm = 6.2, void = true, cuts = ["bolted foot-end ledge"], fastener = "#7 (0.201 in) drilled clearance hole for a #10-32 screw", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "pin gauge" } },
