# Shared S3/S4 profile fixture (illustrative example shop-made item). Frame: rocker
# frame A (pivot axis at the origin, upper hub face Z0, rod end +X); both plans pose
# it at the setup origin. Ground plate X-180..180, Y-70..75, Z-27.7..-15 under the
# whole 340 x 65 blank (raw Z-11.52825..4.47175). Twelve strap pads (tops Z-4.77825
# on the lower strap face, ~6 mm inside the finished outline, so outside the 3/8 in
# cutter's swept band), a bored hub stand (OD 9.5 / ID 6.6, top Z-7.0565 on the lower
# hub face, passes the S3 reamer exit at Z-9.0565), and four rail rests (tops
# Z-11.52825 under the retained rails at X+-70, >16 mm outside the outline). The
# plate has a 6.500 H7 locating bore for the S4 shoulder screw (Z-21..-15), an M5
# tap under it, 3/8-16 stud taps at X+-70 Y45 and Y-36 and four counterbored 3/8-16
# socket-head hold-down screws to table T-nuts (heads 0.475 below the plate top).
# Tapped holes are voids at the thread major diameter plus a small clearance so a
# threaded engagement reads as mating, not interference. The Y-60/+65 hold-down
