note = "AUTHOR'S CHOICE: 1018 steel base carrying a body saddle, a raw-tail saddle and a foot stop, each held by #10-24 UNC socket-head cap screws from below (MH 27th Table 4 p.1934 tap and clearance drills, Table 5 p.1621 counterbore) and located by two Ø4 m6 hardened dowels reamed through the base into the part; the seats and the stop face are machined after doweling so they stay on one axis, and each seat is a matched fit, bored to suit its mate on the S5 post (body; raw tail), so the post beds without rocking. Two cone pins and two crank pins are Ø4 m6 hardened dowels pressed into reamed through holes; each pin top sets a sleeve face against the post axis, so it is pressed to its distance from that axis, read over the gauge arbor (gauges.cone-cradle-gauge-arbor) bedded in both seats, not to a height from the base top. Gravity holding only, with no clamping force on a curing joint. The cone pins carry the cone sleeve's north cap and the crank pins its north face, so neither sleeve can slide through its clearance socket while the compound cures. The two cone pins stand 7.4 either side of the cap centre across the post axis, so their tops bear on the cap annulus between the journal bore and the Ø17.2 sleeve edge: they set the sleeve depth and the post's roll together, and still carry the finished post, journal bore through, in S12. Local frame is model R0: post axis +Y, crank socket axis +Z (vertical)."
