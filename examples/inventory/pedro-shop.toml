# DataBracket5 (r6) / DataBracket7 (r7): the shop has no hardening or precision grinding,
# so the bracket kit is bought finished from a tooling catalogue that sells configurable
# hardened and ground collars and stepped shafts, and checked on receipt (acceptance below;
# the S4F front sheet prints it as the PURCHASED TOOLING / RECEIPT CHECK table). Local frame:
# stud axis Z, Z0 on the outer ear face.
# DataBracket7 (r7, blind round 4 BR-B2): each locating diameter is bought to one ISO 286
# band and accepted on that same band, Machinery's Handbook 27th ed. Table 4 p.684 (IT6 =
# 0.009 for 6-10 mm, 0.011 for 10-18; IT7 = 0.015 for 6-10) and Table 5 p.685 (shaft
# deviation g = -0.005 for 6-10, -0.006 for 10-18; hole H = 0):
#   button OD 14 g6 = 13.983-13.994; button bore 6.5 H7 = 6.500-6.515; stud body and tail
#   6.5 g6 = 6.486-6.495; OD runout to bore 0.010 TIR (catalogue concentricity option).
# Radius stack against the part's reamed cross bore 6.500-6.530: centre shift
#   (6.515-6.486)/2 + (6.530-6.486)/2 + 0.010/2 = 0.0145 + 0.022 + 0.005 = 0.0415, so the
#   filed arch is R6.950 (13.983/2 - 0.0415) to R7.0385 (13.994/2 + 0.0415), inside R6.90-7.10.
# BR-B3, stud lengths (example, plausible, not measured; also on the solids below), from the
# head's upper face: locating body 13.5 +0/-0.2 to the thread shoulder, then a DIN 76 thread
# undercut so the nut runs free to the shoulder, then M6x1 x 10; head Ø12 x 5; tail 45 below
# the head. Stack it clamps: two buttons 4.00 ±0.02 + ear 5.9-6.1 = 13.86-14.14, at least
# 0.36 longer than the body, so the nut seats on the upper button before the shoulder;
# the M6 nut (5.2) on that stack ends at most 19.34 above the head, inside the thread end
# (23.3-23.5). In the S4F bench vise (jaws 25 deep) the tail shows 20 between the jaw tops
# and the head and the other 25 is gripped the full jaw depth.
[fixtures.bracket-arch-filing-buttons]
name = "bracket arch filing buttons"
kind = "filing_buttons"
note = "illustrative example purchase, bought finished: two bearing-steel precision collars through-hardened 58-62 HRC, OD 14 g6 (13.983-13.994) and faces ground, bore 6.5 H7 (6.500-6.515), 4.00 ±0.02 thick, as the buttons; one stepped stud ground 6.5 g6 (6.486-6.495) on body and tail with a Ø12 x 5 collar head, hardened 58-62 HRC on the ground diameters, body 13.5 +0/-0.2 from the head to the thread shoulder, M6x1 thread 10 mm long beyond a thread undercut, left soft, tail 45 below the head; one ISO 4032 M6 nut; the buttons seat on the two ear faces (6.0 apart)"
button_dia_limits_mm = { value = [13.983, 13.994], measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "receipt acceptance limits: 0-1 in micrometer on each button OD, bought Ø14 g6 (MH 27th Tables 4-5, pp.684-685)" } }
button_bore_limits_mm = { value = [6.500, 6.515], measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "receipt acceptance limits: 6.500 GO / 6.515 NO-GO pins in each button bore, bought 6.5 H7 (MH 27th Table 4, p.684)" } }
pin_dia_limits_mm = { value = [6.486, 6.495], measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "receipt acceptance limits: 0-1 in micrometer on the stud tail and body, bought 6.5 g6 (MH 27th Tables 4-5, pp.684-685)" } }
button_runout_mm = { value = 0.01, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "receipt acceptance limit: DTI on each button OD turned on the 6.500 GO pin held in a V-block, 0.01 TIR max, as bought" } }
# EngProc7 (r7): what is bought and its receipt checks, printed as the traveler's
# PURCHASED TOOLING / RECEIPT CHECK table (docs/inventory.md "Purchased tooling").
# DataBracket7 (r7): purchase bands and acceptance limits are the same ISO 286 bands.
purchase = "two bearing-steel collars hardened 58-62 HRC, OD 14 g6 ground (13.983-13.994), bore 6.5 H7 (6.500-6.515), OD runout to bore 0.01 TIR, 4.00 ±0.02 thick (the buttons); one stepped stud hardened and ground 6.5 g6 (6.486-6.495) on body and tail: Ø12 x 5 head, body 13.5 +0/-0.2 from the head to the thread shoulder (shorter than the 13.86 minimum button/ear/button stack, so the nut clamps the stack before the shoulder), DIN 76 thread undercut, M6x1 x 10 soft thread, tail 45 below the head (20 shows above the bench-vise jaws, 25 gripped); one ISO 4032 M6 nut"
