# an example value, plausible, not measured). A 380 x 110 x 12.7 mm ground steel base
# plate with a pressed 6.500 h6 pivot pin, a 2.000 diamond pin (flats radial) at the
# nominal rod-hole position X133.067 Y8.456 and a 14 mm x 3 mm deep relief under the hub,
# so the finished part lies on its lower strap face. Two 2.0 mm ground blades are doweled
# and screwed round it, each working edge 1.00 mm outside the nominal outline: top blade
# R799.00 and bottom blade R817.00 about the arc centre 808.00 above the pivot pin. Gaps
# are read with the kit's 0.02-1.00 mm feeler set at stations engraved on the blades;
# arc-length limits are lines engraved radially through the centre (top blade X+-144.808
# and +-145.309, bottom blade X+-132.668 and +-133.172 from the pivot pin, for arc lengths
# 291.59/292.61 and 266.19/267.21). A loose land square (40 mm convex R800.00 stock
# face ground with the top blade, 12 mm blade square to it at its end within 0.01 over
# 10) beds on the part's own top edge to read each tip-land angle off the template.
[gauges.rocker-profile-template]
kind = "profile_gauge"
note = "illustrative example pinned profile template made to order by an outside toolmaker, example dimensions (plausible, not measured): 380 x 110 x 12.7 mm ground base plate with 6.500 h6 pivot pin, 2.000 diamond pin at the nominal rod hole and a 14 x 3 mm hub relief; two 2.0 mm ground blades whose working edges sit 1.00 mm outside the nominal outline (top R799.00 and bottom R817.00 about the centre 808.00 above the pivot pin), engraved gap stations (top blade X 0, ±40, ±80, ±120, ±140; bottom blade X 0, ±40, ±80, ±120) and radial arc-length limit lines (top blade X±144.808/±145.309, bottom blade X±132.668/±133.172); supplied with a calibration report giving each blade edge's actual deviation from its radius at every gap station (within ±0.01) and the top blade's actual height over the pivot pin at X 0, so the S4 checks correct for the blades' real positions; kit includes a loose land square (40 mm convex R800.00 stock face, 12 mm blade square to it within 0.01 over 10) and a 0.02-1.00 mm feeler set"
range_mm = [0.0, 900.0] # example: the largest radius its blades are cut to
resolution_mm = 0.05 # example: feeler-gap reading, blade edges within 0.01 of the drawing

