# Pedro shop inventory, rev 7 (ILLUSTRATIVE EXAMPLE DATA).
# Everything the pilot bundles select carries a plausible value so each bundle can
# show a complete route. Every invented physical fact is labelled fact-locally with
# measured = { by = "example (plausible, not measured)", ... }; these are example
# values, not shop evidence (AGENTS.md "Examples policy"). Pedro's real vise
# measurements on fixtures.vise-pm-6 keep their real `by`. Items no pilot selects
# keep their original verify/unknown debt.
# Category cutover: workholding → fixtures; measuring → gauges; collet/QCTP sets → holders.
# Drill nominal diameters below are cited identities; member facts are example values.
# Centre-drill angle_deg = 60 is a centre-seat angle, NOT a drill point_angle.
stock = []

[machines]

[machines.PM-30MV]
kind = "mill"
make = "Precision Matthews"
source = "https://www.precisionmatthews.com/products/pm-30mv"
control = "cncjs over grbl-class controller; operated manually via XHC WHB04B-6 pendant + EL400 DRO emulator"
operation_mode = "manual_with_digital_positioning"
headstock_tilt_deg = 90
# The DRO grid the sheet prints and the kernel checks (docs/rules-coordinates.md).
resolution_mm = { value = 0.005, measured = { by = "example (plausible, not measured)", date = "2026-10-06", instrument = "glass-scale DRO readout, 5 um scales typical of this mill class" } }
# AUTHOR'S CHOICE (example): the cncjs/grbl-class control above takes typed G1/G2/G3 MDI
# moves, so arc and diagonal contour rows print one MDI move each (docs/inventory.md).
# Decision A in the ReviewLoop triage; pending Main's confirmation.
contouring = "mdi"
note = "CNC conversion replaces leadscrews/dials; envelope and travel below are illustrative example values (vendor numbers relabelled), not grbl soft limits."

[machines.PM-30MV.envelope]
spindle_to_table_max_in = { value = 17, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "steel rule, spindle nose to table at top of column" } }
spindle_to_table_min_in = { value = 2.4, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "steel rule, spindle nose to table at bottom of travel" } }

[machines.PM-30MV.envelope.travel_in]
x = { value = 23, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "DRO readout, limit to limit" } }
y = { value = 8.75, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "DRO readout, limit to limit" } }
z = { value = 14, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "DRO readout, limit to limit" } }

[machines.PM-30MV.spindle]
taper = "R8"
drawbar = "7/16-20"
rpm_min = 50
rpm_max = 3000
hp = 2
drive = "belt_bldc"
two_ranges = true
rotation = { value = "cw", measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "visual check of forward spindle rotation with right-hand cutters, viewed from above" } }


[machines.PM-30MV.leadscrew]
tpi = 10
dial_in = 0.001

[machines.PM-30MV.capacity_in]
drill = 1.25
end_mill = 0.75
face_mill = 3.5

[machines.PM-1127VF-LB]
kind = "lathe"
make = "Precision Matthews"
source = "http://web.archive.org/web/20220525213743/https://www.precisionmatthews.com/shop/pm-1127vf-lb/"
operation_mode = "manual"
swing_over_bed_in = 11
between_centres_in = 27.55
cross_slide_travel_in = 6
compound_travel_in = 3
weight_lb = 575
standard_accessories = ["chuck-3jaw-6-d1-4", "chuck-4jaw-6-d1-4", "faceplate-d1-4", "steady_rest", "follow_rest", "thread_dial", "dead_centre_headstock", "dead_centre_tailstock_mt3"]
# --- pivot-shaft additions ---
control = "manual; illustrative example item (plausible, not on hand): Electronica EL400 two-axis lathe DRO, X scale on the cross slide, Z scale on the bed"
# The DRO grid the sheet prints and the kernel checks (docs/rules-coordinates.md), one step
# for both axes. With 5 um scales the EL400 shows Z in 0.005 steps but X in diameter mode
# in 0.01 steps (each cross-slide count is doubled), so the grid is the coarser 0.01: every
# printed X diameter and Z is a number the display can show.
resolution_mm = { value = 0.01, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "EL400 lathe readout with 5 um glass scales: diameter-mode X display step 0.01 (Z 0.005)" } }
# --- end pivot-shaft additions ---

[machines.PM-1127VF-LB.spindle]
# precisionmatthews.com/shop/pm-1127vf-lb (web.archive.org 2022-05-25) states both
# "Variable Spindle Speeds From 70-2200 rpm (2 Ranges, Low 70-380 RPM for more torque,
# and High 380-2200 RPM for more speed) *This speed range is correct, machine updated as
# of 2019*" (feature list) and "Spindle Speeds, Infinitely Variable 70-2000 RPM (2 Steps)"
# (Main Specifications). This machine's build year is unknown, so the lower 2000 rpm top
# speed governs: no setup sheet may ask for more than the 2000 the page also promises.
ranges_rpm = [[70, 380], [380, 2000]]
bore_in = 1.5
mount = "D1-4"
hp = 1
drive = "vfd"

[machines.PM-1127VF-LB.tailstock]
taper = "MT3"
quill_travel_in = 4
# --- pivot-shaft additions ---
quill_dia_mm = { value = 32.0, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "calipers, quill OD" } }
# --- end pivot-shaft additions ---

[machines.PM-1127VF-LB.leadscrew]
tpi = 8
cross_feed_ipr = [0.001, 0.0056]

[machines.PM-1127VF-LB.threads]
inch_tpi = [8, 9, 10, 11, 12, 13, 14, 16, 18, 20, 22, 24, 26, 28, 32, 36, 40, 44, 48, 52, 56]
metric_pitch_mm = [0.5, 3.0]

[machines.PM-1127VF-LB.toolpost]
series = "AXA"
type = "wedge"
holders = 5
included = true
note = "a second AXA QCTP (250-111) came off the JET"
# --- EngBlade additions ---
# How each toolpost tool is set before its first touch-off in a setup: on spindle centre
# height, and a parting/grooving blade also squared to the spindle axis (docs/inventory.md).
centre_height = "set its cutting edge on spindle centre height with the holder's height nut: level with the tailstock dead-centre point, or so a facing cut leaves no pip at the centre"
square_blade = "square the blade to the spindle axis: spindle stopped, bring its side flat against the chuck face or a faced shoulder, swing the toolpost until no gap shows, then lock the toolpost"
cite = [
    "Moltrecht, Machining for Hobbyists: Getting Started (Industrial Press 2015) ch. 6 p136 Fig. 6-7: the nose of the cutting tool on centre, at the height of the lathe centers",
    "Moltrecht, Machining for Hobbyists: Getting Started (Industrial Press 2015) ch. 6 p147 Fig. 6-20: a cut-off blade perpendicular to the workpiece axis, its end cutting edge on center",
    "AUTHOR'S CHOICE: the AXA holder's height nut, checked against the tailstock dead-centre point or a pip-free facing cut, because both checks need no extra gauge",
    "AUTHOR'S CHOICE: square the blade off the chuck face or a faced shoulder because both are square to the spindle axis and at hand in every lathe setup",
]
# --- end EngBlade additions ---

# --- pivot-shaft additions ---
# Lathe envelope read by the lathe headroom screen (swing values are diameters).
[machines.PM-1127VF-LB.envelope]
swing_over_bed_in = { value = 11.0, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "steel rule, spindle axis to bed way doubled" } }
swing_over_cross_slide_in = { value = 6.69, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "steel rule, spindle axis to cross-slide top doubled" } }
between_centres_in = { value = 27.55, measured = { by = "example (plausible, not measured)", date = "2026-10-05", instrument = "tape measure, spindle nose to tailstock quill face, tailstock at bed end" } }
# --- end pivot-shaft additions ---

[machines.BS-0]
kind = "dividing_head"
make = "Precision Matthews"
sku = "DIVIDINGHEAD-BS-0"
source = "https://www.precisionmatthews.com/products/dividinghead-bs-0"
