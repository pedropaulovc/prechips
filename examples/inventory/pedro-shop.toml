name = "rod-hole diamond pin"
kind = "locating_pin"
shop_made = true
note = "illustrative example shop-made diamond pin: a bought Class X 0.0782 in plus gauge pin (1.9863-1.9873, flats 1.76 across) bonded with Loctite 638 into a turned 4140 body, Ø4.5 collar seated on the plate, 2.990-2.998 shank bonded in the plate's reamed 3.00 hole; in-process orientation locator and positive tangential stop for the closing profile pass only, not datum C and not a clamp"
