# Ø0.20 A|B|C rod-position inspection reference (illustrative example rocker-only
# assembly, one owner; inspection accessory only, never a machining hold). Pedro
# ruling 4: a bought Suburban BXP-050505-G box parallel (fixtures.box-parallel-
# bxp-050505-g: 127 mm cube, square within 0.0083 per 100 as sold) with milled windows
# and a lapped O1 C stop bar. AUTHOR'S CHOICE: characterise the box's actual
# base-to-right squareness by reversal and correct the view-2 reading for it (S4 op 50),
# because the catalogue squareness is short of the 0.003 per 100 the check needs.
# Frame (box frame): origin at the outer corner where the left face, the front face and
# the base meet; +x toward the right side, +y from the front face into the box (the
# body is y >= 0), +z up. Reference faces: base z = 0, right side x = 127 (marked) and
# front face y = 0 (datum B simulator). Walls 12.7 thick (example: confirm on
# receipt). The C stop bar is screwed to the front face with its underside flush with
# the base (both stand on the granite in view 1): top z = 12.70 (datum C simulator, by
# the bar's own lapped height), projecting y = -12.7..0 so the whole 2.5 mm C land
# thickness bears. Reading 1 (base down): part B face on y = 0, C land (outward normal
# -z) on the bar top, pivot A at x = 0 and z ≈ 159.392 (hub clear above the box top),
# rod hole near x = 15.843, z = 27.0, C land x = 5.43..11.02. Two light toolmaker's
# clamps (fixtures.rocker-inspection-clamps) grip part strap + front wall (2.5 + 12.7 =
# 15.2 mm) through the two left-side windows; they reach no further right than x = 18
# and no lower than z = 42, never x > 127 or z < 0. Reading 2: tip the whole assembly
# onto the marked right side x = 127 without unclamping (the bar keeps C contact). The
# back window is access only. No base, right-side or front-face reference area is cut.
