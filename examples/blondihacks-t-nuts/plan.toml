# F1: one final physical checkpoint/result per nut; no shared final approval.
[[setups]]
id = "F1a"
presentation_group = "F1"
machine = "bench-bandsaw"
stock_in = "B2a"
picture_panels = []
note = [{ text = "Final acceptance separately for each finished nut: caliper all required size bands, then actual-slot fit, intended-stud retention and visual finish; one overall pass/fail result per nut.", detail = "pro" }]
hold = { note = [{ text = "With powered tools stopped, support the nut at the bench and handle it securely by hand for calipers and the actual intended slot/stud comparison. Keep fingers clear of pinch points; do not apply a clamp load or force a wedged part or stud.", detail = "pro" }] }
[[setups.ops]]
op = 10
do = "inspect"
feature = ["base-envelope", "shoulders", "end-length", "threaded-hole"]
inspect_workpieces = ["nut1"]
checks = { base-envelope = { width = "calipers", height = "calipers" }, shoulders = { thickness = "calipers", width = "calipers" }, end-length = { length = "calipers" }, actual_slot_fit = "actual-slot", stud_retention = "mating-hardware" }
inspection_methods = { base-envelope = { width = "Caliper across both finished base sides; .873-.877 inch.", height = "Caliper finished bottom-to-top height; .498-.502 inch." }, shoulders = { thickness = "Caliper finished bottom-to-shelf thickness on BOTH shoulders; each .248-.252 inch.", width = "Caliper across both finished stem walls; .493-.497 inch." }, end-length = { length = "Caliper finished end-to-end length; .998-1.002 inch." }, actual_slot_fit = "In the actual intended slot, slide freely by hand without binding or objectionable rocking; pull up and confirm both shelves bear without bottoming/wedging and the top stays below table top.", stud_retention = "The intended 3/8-16 RH stud enters from the top by hand and stops before exiting at the bottom; do not force it. Confirm the nut does not rotate or pass through the intended slot." }
note = [{ text = "One overall result for this nut covers caliper base width, height, BOTH flange thicknesses, stem width and length, plus actual-slot fit and intended-stud retention. Also require uniform black/oiled finish, no loose residue and unobstructed fit/threads; no separate finish record. Manual fit does not replace any numeric size check or establish a load rating or thread class.", detail = "pro" }]
note_cite = ["https://www.youtube.com/watch?v=TL0OsfFkBL8&t=1027s", "geometry-provenance.md#demonstration-acceptance-and-source-exceptions"]

