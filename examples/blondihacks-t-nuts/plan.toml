# B0: source slot/hardware survey and rough bar cutoff.
[[setups]]
id = "B0"
machine = "video-bench"
stock_in = "stock"
coolant = "unknown"
deburr_mm = "unknown"
note = "Once for the four-piece batch. Complete and record the recipient-slot/hardware survey before loading stock; it is a prerequisite, not inspection of an already-made nut. HOLD until fit targets and a safe raw-bar cutoff length are approved."
[setups.hold]
fixture = "bench-vise"
stop = "unknown"
grip_mm = "unknown"
clamp = "Clamp the raw bar in the bench vise for the initial cutoff; retain the kept bar and arrange the offcut safely."
note = "BEFORE LOADING: use dial calipers to measure and record the actual slot throat width and wide undercut width. Measure undercut depth using the source's backstop against the underside of the slot lip; identify the reference surfaces. Check the intended rod with a matching 3/8-16 nut, not the misleading M10 x 1.5 near-fit. Establish approved nut targets/clearances so it will slide, pull up under the lips and stay below the table. Then establish safe blade engagement, raw-bar cutoff length and offcut support. HOLD while any prerequisite is unknown."
[[setups.ops]]
op = 20
do = "cut_off"
feature = "base-envelope"
tool = "initial-stock-saw"
cut_plane = { axis = "x", value = "unknown", keep = "below" }
note = "Use the portable band saw to cut one raw bar for four nominal 1 inch nuts, actual separation kerfs and cleanup. Retain the stock and support the offcut. Establish the safe blade engagement and cutoff length first."
note_cite = "https://www.youtube.com/watch?v=TL0OsfFkBL8&t=165s"

