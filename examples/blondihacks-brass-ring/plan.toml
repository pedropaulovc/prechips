tool = "fine-mill-file"
rpm = 200.0
note = "Before drilling, lightly file the exposed front outer edge and ring's rear outer edge with the fine-cut handled mill file; reach only the rear edge through the wide groove. Demonstrated speed is about 200 rpm. The bore has not yet been drilled; file the outer edges only. HOLD until the edge-break requirement and lathe-filing procedure are approved, including safe handled-file posture and rotating-file clearance/contact. Keep hands and clothing clear of jaws, no gloves."
note_cite = "https://www.youtube.com/watch?v=t9NGty1CVII&t=978s"

