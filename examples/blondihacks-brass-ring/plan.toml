feed_mm_rev = "unknown"
direction = "plunge_radial"
note = "Set the ring-side edge of the wide traditional ground Grizzly parting tool 0.100 inch behind front face with the machinist scale; lock carriage. Do not substitute a narrow parting blade. Touch the finished OD. Make only a partial groove: the demonstrated cut is 0.100-inch DIAMETER reduction plus a little more radial depth than the 0.050-inch wall. At exactly that nominal reduction, 0.725 - 0.100 = 0.625 inch, equal to the final drill nominal, so there is no nominal release margin. HOLD: establish and verify the additional depth so the actual groove root lies BELOW the actual final drill's cut diameter, with an approved positive release margin. Measure extra depth, actual root and groove width, and obtain approval of the required margin before proceeding; equality must not be relied on to release the ring. Do not part off now. Confirm groove geometry, tool centre height and safe final-drill breakthrough/retention before proceeding."
note_cite = "https://www.youtube.com/watch?v=t9NGty1CVII&t=864s"

