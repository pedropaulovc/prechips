instruction = "On the surface plate: bolt a back to a front (both through Setup 9), mating face to mating face, both B faces down, the N ends together against the side of a 1-2-3 block, with the pair's own two #8-32 screws through the front's ear holes into the back's taps, heads on the front's outside face."
