# Demo clamp pair: one traveler for both halves of a split clamp block, the
# front (clearance ears) and the back (tapped ears), which are squared alike
# from one bar, drilled apart and bored bolted together. A family plan: it
# binds each half's manifest under [[parts]] and has no [cad] table.
#
# A setup or operation with part = "front" or "back" binds that half's
# drawing values and draws its picture. The rest bind only what both
# manifests give alike: {{cad.width_mm}} binds because both halves are one
# width, {{cad.depth_mm}} is refused there because they are not, and
# {{cad.front.depth_mm}} or {{cad.back.depth_mm}} names a half anywhere. So a
# setup written once for both halves cannot print a number true of one only.
# [parts.parameters] lays a half's own numbers over [parameters].
#
# Authored values: the blank, skims, steps, feeds, holding and the pair's
# hardware are demo choices, as in the other demo plans; drawing values come
# from the two demo manifests.
title = "Demo clamp pair: front and back"
part = "{{cad.front.drawing_number}} front, {{cad.back.drawing_number}} back"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square (drawing: {{cad.material_spec}})"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.blank_count:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks ({{process.quantity:d}} fronts, {{process.quantity:d}} backs), {{process.bar_length_in:.1f}} in of bar with the kerfs."
note = "Inches. One sheet for the pair: {{process.quantity:d}} fronts ({{cad.front.drawing_number}}) and {{process.quantity:d}} backs ({{cad.back.drawing_number}}), bored bolted together. Setups 1–6, 9 and 12 serve both halves: every blank goes through a setup in turn before the next setup. Setup 7 is the fronts', Setups 8 and 11 the backs', Setup 10 the bolted pairs'. Finished sizes: Setup 1's table. Keep each back with its front from the pair bore (Setup 10) on: scribe the pair number on both."
shop = "shop.toml"
material_key = "arc-strap-1018-cold-finished"
milling_material = "steel_1018"

[[parts]]
id = "front"
label = "Front {{cad.drawing_number}}"
title = "{{cad.drawing_number}} demo clamp front"
file = "cad/clamp-front-v51.toml"
adapter = "clamp_half"
part = "clamp-front"

# The front's own numbers: the back's pre-face depth band (the pair
# picture's other half), the Ø.150 spot and the #9's peck, tip and feed.
[parts.parameters]
other_half_depth_min_mm = 15.24
other_half_depth_max_mm = 15.748
spot_dia_mm = 3.81
peck_mm = 4.572
drill_tip_height_mm = -2.496
drill_feed_per_min_mm = 91.44
drill_9_oal_mm = 88.9

[[parts]]
id = "back"
label = "Back {{cad.drawing_number}}"
title = "{{cad.drawing_number}} demo clamp back"
file = "cad/clamp-back-v51.toml"
adapter = "clamp_half"
part = "clamp-back"

# The back's own numbers: the front's depth band, the Ø.120 spot and the
# #29's peck, tip and feed, the tap, the bolted pair and its bore.
[parts.parameters]
other_half_depth_min_mm = 17.272
other_half_depth_max_mm = 17.526
spot_dia_mm = 3.048
peck_mm = 3.048
drill_tip_height_mm = -2.038
drill_feed_per_min_mm = 129.54
tap_point_depth_mm = 19.05
spacer_block_height_mm = 50.8
spacer_block_length_mm = 76.2
pair_jaw_span_mm = 109.093
bore_finish_stock_mm = 0.254
helix_pitch_mm = 0.508
bore_past_mm = 1.0
bore_tip_height_mm = -1.0
bore_open_mm = 0.0508
bore_open_radial_mm = 0.0254
bore_feed_per_min_mm = 279.27
bore_mill_projection_min_mm = 31.75
tap_stack_max_mm = 270.002
tap_wrench_reach_max_mm = 190.5

# What both halves share: the blank, the skims and facing passes, the holding
# and the machine-capacity inputs.
[parameters]
# Blanks sawn here, both halves together, and the bar they come off:
# blank_count × blank_length_max_in + (blank_count − 1) × kerf_in.
blank_count = 6
bar_length_in = 12.925
quantity = 3
blank_section_in = 0.75
blank_section_mm = 19.05
blank_length_min_in = 1.95
blank_length_max_in = 2.05
kerf_in = 0.125
end_skim_mm = 0.508
bottom_skim_mm = 0.508
mating_skim_mm = 0.508
face_step_max_mm = 1.27
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.08
# The facing passes reach this far past both edges of a face together.
face_overhang_mm = 0.5
drill_past_mm = 1.0
spot_feed_per_min_mm = 45.72
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044
vise_jaw_height_mm = 44.9453
vise_jaw_width_mm = 158.6738
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
vise_upright_inset_mm = -69.81
vise_lying_inset_mm = -55.33
upright_top_max_mm = 51.562
screw_head_dia_mm = 6.858
screw_head_height_mm = 3.9624
screw_length_mm = 31.75
spacer_block_width_mm = 25.4
back_parallel_end_mm = 15.875
r8_collet_gauge_mm = 6.3
drill_chuck_gauge_mm = 95.0
half_mill_projection_min_mm = 25.4
# The end mill's stick-out the setup pictures draw it at.
half_mill_projection_mm = 25.4
centre_drill_oal_mm = 47.625

