# Built-up example, not later integral-boss CAD. Stock, bonded construction, joint fits,
# tighter process holds, fixtures, cure and cutting settings are example process choices.
# v40 limits retain documented feature-file divergences. Crank bore moves 0.185 toward head
# top, sleeve unchanged. Conservative shop separation39.34–39.70 vs feature39.332–39.702;
# journal shop12.256–12.285 vs feature12.2558–12.2858.
title = "Cone pivot post — body + two bonded sleeves"
part = "MHA-016 · cone-pivot-post · quantity 1"
revision = "v40 example"
material = "1018 low-carbon steel"
stock = "Body Ø44.45×127; cone Ø19.05×75; crank Ø25×105 mm."
note = "mm throughout. Settings: rpm / mm/min; turning feeds mm/rev. Cutting oil; saw dry. Prerequisite: cone-pivot-post-fixtures.toml — reamer trials, bond cradle/arbor, saw cradle/bridge, buttons and tall jaws."

[[tools]]
id = "turn"
name = "Turn"
description = "AR turning/facing; R0.2 fine-nose shoulder tool; 1.6 mm parting blade."
[[tools]]
