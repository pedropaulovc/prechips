<?xml version="1.0" encoding="UTF-8"?>
<!-- Styles: prechips.palette roles (class); the traveler prints the legend once. -->
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="shaft-supported" viewBox="0 {{view.top}} 720 {{view.height}}" width="720" height="{{view.height}}" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect class="paper" y="{{view.top}}" width="720" height="{{view.height}}"/>

  <!-- schematic 3-jaw chuck body, behind the work -->
  <rect class="fixture-vise" x="{{view.chuck_x}}" y="{{view.chuck_y}}" width="{{view.chuck_w}}" height="{{view.chuck_h}}"/>

  <!-- setup material from CAD values and authored parameters -->
  <g id="removed" data-cad-group="part-removed" class="part-removed"/>
  <g id="waste" data-cad-group="part-rest" class="part-rest"/>
  <g id="arriving" data-cad-group="part-arriving" class="part-arriving"/>
  <g id="kept" data-cad-group="part-kept" class="part-kept"/>
  <g id="centre" data-cad-group="centre-line" class="centre-line"/>

  <!-- schematic jaws -->
  <g class="clamp">
    <rect id="jaw-upper" x="{{view.jaw_x}}" y="{{view.jaw_upper_y}}" width="{{view.jaw_w}}" height="{{view.jaw_h}}"/>
    <rect x="{{view.jaw_x}}" y="{{view.jaw_lower_y}}" width="{{view.jaw_w}}" height="{{view.jaw_h}}"/>
  </g>

  <!-- schematic turning tool from the operator side; tip at its anchor -->
  <path class="cutter" transform="translate({{view.tool_x}} {{view.tool_y}})" d="M0 0L18 5V50H0Z"/>

  <!-- schematic follow rest at its reset pose: back pad on the bearing, top pad dashed -->
  <g class="fixture-support">
    <rect id="rest-pad" x="{{view.rest_x}}" y="{{view.rest_pad_y}}" width="{{view.rest_w}}" height="10"/>
    <rect x="{{view.rest_arm_x}}" y="{{view.rest_arm_y}}" width="8" height="26"/>
  </g>
  <rect class="fixture-support" x="{{view.rest_x}}" y="{{view.rest_top_y}}" width="{{view.rest_w}}" height="10" fill="none" stroke-dasharray="3 2"/>

  <!-- schematic dead centre and tailstock quill at the plain end -->
  <g transform="translate({{view.centre_x}} {{view.axis}})">
    <path class="fixture-support" d="M0 0L20 -11H44V11H20Z"/>
    <rect class="fixture-vise" x="44" y="-16" width="26" height="32"/>
  </g>

  <!-- operation highlights, datums, dimensions and labels -->
  <g id="active" data-cad-group="active-face" class="active-face" stroke-width="4"/>
  <g id="datum" data-cad-group="datum" class="datum"/>
  <g id="arrows" data-cad-group="arrow" class="arrow"/>
  <g id="dims" data-cad-group="dims" class="dims"/>
  <g id="leaders" data-cad-group="leader" class="leader"/>
  <g id="labels" data-cad-group="label" class="label"/>
</svg>
