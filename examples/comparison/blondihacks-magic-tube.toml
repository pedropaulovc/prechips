# Archive: archive/pre-v0.10-2026-11-08, examples/blondihacks-magic-tube/
# Sources: plan.toml P1–F1; README.md:79–99; features.toml;
# inventory.toml; cutting-data.toml; expected/traveler.html.
# Adapted design, not a video drawing: 12L14 and final 11/16-in OD are choices.
# Older article's 3.5-in overall becomes BODY length; 3-in cavity and 0.500-in
# cap head yield a 4-in assembly. Video supplies 0.700-in preliminary OD,
# 0.500-in stub and 1/2-20 RH threads. No dimensional bands, thread class,
# seam limits or numeric rpm/feed supplied. Demonstrated final pass depths
# are not adopted settings for an unmeasured unsupported hold.

title = "Magic tube — body and removable cap"
part = "blondihacks-magic-tube"
revision = "source-size-design-1"
material = "12L14 steel"
stock = "One round bar; retain tube blank and chuck remnant. Allow gripping tail, kerfs and facing stock."
note = "Nominals only; acceptance bands and thread class unspecified. Establish bar size/allowances, centre-seat size, die blank diameter, tap penetration and chamfer sizes. Cutting oil."

[[tools]]
id = "turn"
name = "Turning bit"
description = "Turning/facing tool"

[[tools]]
id = "centre"
name = "Centre drill"
description = "Centre drill"

[[tools]]
id = "part"
name = "Parting blade"
description = "Parting blade; allow actual kerf"

[[tools]]
id = "chamfer"
name = "Chamfer bit"
description = "Chamfering tool"

[[tools]]
id = "die"
name = "1/2-20 die"
description = "1/2-20 RH die; tailstock-aligned holder"

[[tools]]
id = "pilot"
name = "1/4-in drill"
description = "1/4-in twist drill"

[[tools]]
id = "drill"
name = "15/32-in drill"
description = "15/32-in twist drill"

[[tools]]
id = "tap"
name = "1/2-20 tap"
description = "1/2-20 RH tap; wrench and tailstock follower"

[[setups]]
title = "Face and centre"
machine = "Lathe"
holding = "Four-jaw; short raw-bar projection."
datum = "Faced mouth = Z0; spindle axis = radial reference."

[[setups.operations]]
tool = "turn"
instruction = "Face clean. Preserve mating annulus edge."

[[setups.operations]]
tool = "centre"
instruction = "Centre drill for live centre; retain start for pilot."

[[setups]]
title = "Preliminary OD"
machine = "Lathe"
holding = "Extend same bar for body, gripping tail and part-off; live-centre support."
datum = "Reset mouth Z0."

[[setups.operations]]
tool = "turn"
instruction = "Cleanup and turn required length to Ø0.700 in. Separate finishing pass: finer feed, higher speed than roughing. This is NOT final Ø11/16 in."
inspection = "Check OD along length; retain assembled-finishing allowance."

[[setups]]
title = "Split bar; keep both pieces"
machine = "Lathe"
holding = "Retain grip; withdraw live centre."
datum = "Cutoff behind 3.500-in body plus grip and final part-off allowances."

[[setups.operations]]
tool = "part"
instruction = "Begin parting; pause with retaining web and file accessible rear burr. Complete cut. Reserve long tube blank; chuck remnant becomes cap."

[[setups]]
title = "Cap from chuck remnant"
machine = "Lathe"
holding = "Retained remnant; allow 1.000-in cap plus facing stock and kerf."
datum = "Faced male tip = Z0; indicator shoulder travel 0.500 in."

[[setups.operations]]
tool = "turn"
instruction = "Face tip. Clean cap OD to tube's preliminary OD or larger. Turn 0.500-in-long stub a few thou below Ø1/2 in; exact diameter to suit die. Finish shoulder square; preserve annulus edge."

[[setups.operations]]
tool = "chamfer"
instruction = "Chamfer male lead without touching shoulder."

[[setups.operations]]
tool = "die"
instruction = "Cut 1/2-20 RH by hand, spindle unpowered."

[[setups.operations]]
tool = "chamfer"
instruction = "Rebevel thread end. Retain root shoulder; no undercut."

[[setups.operations]]
tool = "part"
instruction = "Part cap with 0.500-in head behind shoulder plus facing allowance."

[[setups]]
title = "Retrieve tube; drill and tap"
machine = "Lathe"
holding = "Rechuck retained long blank on excess tail; protect OD. Original mouth out."
datum = "Mouth Z0; establish drill-point and tap-lead allowances."

[[setups.operations]]
tool = "pilot"
instruction = "Pilot Ø1/4 in from centre start; mark blind depth. Peck and clear chips."

[[setups.operations]]
tool = "drill"
instruction = "Open to Ø15/32 in, pecking. Cavity nominal 3.000 in; account for drill point to preserve nominal 0.500-in base."

[[setups.operations]]
tool = "tap"
instruction = "Hand tap 1/2-20 RH; full-thread depth beyond cap engagement, with lead/bottom clearance. Trial-fit actual cap."

[[setups.operations]]
tool = "chamfer"
instruction = "Chamfer INSIDE mouth to clear male root/shoulder. Preserve mating annulus; refit to full seating."

[[setups]]
title = "Face assembled cap"
machine = "Lathe"
holding = "Body remains chucked; cap shoulder fully seated, not bottomed on tip/root/runout."
datum = "Mouth/shoulder Z0; cap face +0.500 in."

[[setups.operations]]
tool = "turn"
instruction = "Face head to 0.500-in length. Cutting torque must tighten RH joint; stop at axis, never across it."

[[setups.operations]]
tool = "chamfer"
instruction = "Remove exposed cap-face outer burr only; leave seam annuli intact."

[[setups]]
title = "Align and finish together"
machine = "Lathe"
holding = "Extend assembly; grip protected solid tail. Indicate base in four-jaw; align free end with rolling bearing, then REMOVE bearing before turning. Final cut unsupported."
datum = "Reset mouth Z0; cap face +0.500 in; base −3.500 in."

[[setups.operations]]
tool = "turn"
instruction = "Repeat very light continuous cap/body passes toward chuck to Ø11/16 in and hidden seam; five or six or more passes. Establish cut depth for unsupported hold. Leave parting run. Persistent seam: inspect seating/mouth, not indefinite OD reduction."
inspection = "Measure body at multiple stations and cap across seam."

[[setups]]
title = "Final part-off"
machine = "Lathe"
holding = "Retain tail grip and seated cap."
datum = "Kept base 3.500 in behind mouth; verify bore-tip clearance."

[[setups.operations]]
tool = "part"
instruction = "Part closed body from tail, preserving blind base. Inspect face, pip and burr."

[[setups]]
title = "Final inspection"
machine = "Bench"

[[setups.operations]]
instruction = "Measure body 3.500 in, head 0.500 in, stub 0.500 in, cavity 3.000 in and Ø11/16-in body/cap. Record full-thread length excluding lead/runout; cavity measurement must account for drill point."

[[setups.operations]]
instruction = "Open/close repeatedly; check thread start, running fit and full shoulder seating. Inspect seam circumference, ends, threads and interior for chips, burrs and cracks."
