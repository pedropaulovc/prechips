# Source: archive/pre-v0.10-2026-11-08, examples/pivot-bracket/{plan,features}.toml,
# examples/inventory/pedro-shop.toml, examples/cutting-data.toml and
# examples/pivot-bracket/expected/traveler.html (read-only legacy checkout).
# No dimensioned v39 drawing exists. All acceptance bands below are the original
# hand-authored example intent, NOT certified drawing tolerances. Blank sizes,
# workholding, cutting settings and filing-button route are source process choices.
# RPM/feed pairs are the expected traveler's settings, derived from cutting-data.

title = "Pivot bracket — two pieces"
part = "{{cad.part}} · {{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "Plain carbon steel · {{cad.finish}}"
stock = "2 blanks: {{process.sawn_height_mm:g}} mm long × {{process.raw_width_mm:g}} × {{process.raw_length_mm:g}} mm flat bar; square to {{process.prepared_width_mm:g}} × {{cad.prepared_length:g}} × {{process.prepared_height_mm:.1f}} mm"
note = "All dimensions mm unless marked. Repeat every operation for both pieces. Mill conventionally with brushed cutting oil."
shop = "../shop.toml"
material_key = "bracket-plain-carbon-steel"

[cad]
file = "../cad/pivot-bracket-example-v39.toml"
adapter = "harmonic_pivot_bracket"

[parameters]
prepared_width_mm = 18.0
prepared_height_mm = 34.2
seat_face_allowance_mm = 1.0
outline_allowance_mm = 1.0
wall_leave_mm = 0.3
arch_breakthrough_mm = 0.3
floor_leave_mm = 0.3
raw_width_mm = 19.05
raw_length_mm = 31.75
sawn_height_mm = 38.0
seat_grip_mm = 19.55
foot_grip_mm = 3.67
bore_go_mm = 6.500
bore_no_go_mm = 6.530

[[tools]]
id = "face"
name = "3/4 in EM"
ref = "bracket-face"
[[tools]]
id = "end"
name = "3/8 in EM"
ref = "bracket-end"
[[tools]]
id = "long"
name = "Long 3/8 in EM"
ref = "bracket-long"
[[tools]]
id = "spot-long"
name = "1/4 in spot"
ref = "bracket-spot-long"
[[tools]]
id = "drill15"
name = "#15 drill"
ref = "bracket-drill15"
[[tools]]
id = "spot"
name = "3/8 in spot"
ref = "bracket-spot"
[[tools]]
id = "drillD"
name = "D drill"
ref = "bracket-drillD"
[[tools]]
id = "ream"
name = "6.5 mm reamer"
ref = "bracket-ream"

[[setups]]
machine_kind = "other"
title = "Saw and square — six holds"
machine = "4×6 bandsaw → PM-30MV"
holding = "6 in vise; jaws X, alignment ≤0.0254/100. Holds 2/3/5/6: round bar at moving jaw."
datum = "First wide reference face = LEFT."
inspection = ["{{process.prepared_width_mm:g}} ±0.10 × {{cad.prepared_length:g}} ±0.02 × {{process.prepared_height_mm:.1f}} ±0.02; flatness, squareness and parallelism ≤0.02 per face."]

[[setups.operations]]
tool = "face"
rpm = 450
feed = "90 mm/min"
instruction = "Saw two {{process.sawn_height_mm:g}} lengths flat: 4/6 bi-metal, dry, 200 ft/min. Six facing holds: 12.7 stepover in 1–4; 9 in 5–6."
[setups.operations.table]
columns = ["Hold", "Location / support", "Face / size"]
rows = [
  ["1", "LEFT up; 1-1/4 in parallels", "Face LEFT; {{cad.width_skim:.3f}} nominal skim"],
  ["2", "Outer up; LEFT to fixed jaw; 1 in parallels", "Face outer; {{cad.length_skim:.3f}} nominal, ≤1.4/pass"],
  ["3", "Free up; outer down; LEFT fixed; same parallels", "{{cad.prepared_length:g}} from outer; ≤1.4/pass"],
  ["4", "RIGHT up; LEFT down; outer fixed; 1-1/4 in parallels", "{{process.prepared_width_mm:g}} from LEFT; {{cad.width_skim:.3f}} nominal skim"],
  ["5", "Crown up; sawn seat down; LEFT fixed; 5/8 in parallels", "Align outer edge square; face crown, {{cad.height_skim:g}} nominal"],
  ["6", "Seat up; crown down; LEFT fixed; same parallels", "{{process.prepared_height_mm:.1f}} from crown; {{cad.height_skim:g}} nominal skim"]
]

[[setups]]
machine_kind = "other"
title = "Seat and foot outline"
machine = "PM-30MV"
holding = "Seat up, 1 in parallels; jaws along Y, fixed jaw −X, grip {{process.seat_grip_mm:g}}. Indicate ≤0.0254/100."
datum = "LEFT X{{cad.raw_x_min:.2f}}; outer edge Y{{cad.raw_y_min:.2f}}; finished seat Z0, raw +{{process.seat_face_allowance_mm:.1f}}."
[[setups.operations]]
tool = "end"
settings = "bracket-end-plain-carbon-steel"
instruction = "Face X{{cad.raw_x_min:.2f}}…{{cad.raw_x_max:.2f}},Y{{cad.raw_y_min:.2f}}…{{cad.raw_y_max:.2f}} to Z0: 1 DOC, 6.35 stepover. Rough foot to Z{{cad.foot_depth:.2f}}, 3 mm levels, {{process.wall_leave_mm:.1f}} radial leave; finish X{{cad.foot_x_min:.2f}}…{{cad.foot_x_max:.2f}},Y{{cad.foot_y_min:.2f}}…{{cad.foot_y_max:.2f}} full depth. Preserve ear stock below {{cad.foot_depth:.2f}}; jaws {{cad.seat_jaw_z:.2f}}."
inspection = "Foot width {{cad.foot_width_min:.2f}}–{{cad.foot_width_max:.2f}}; length {{cad.foot_length_min:.2f}}–{{cad.foot_length_max:.2f}}."

[[setups]]
machine_kind = "other"
title = "Deep grip — upper relief"
machine = "PM-30MV"
holding = "Seat down, 1-1/8 in narrow parallels; grip raw {{process.prepared_width_mm:g}} mm overhang, foot clear. Jaws along Y; grip 10.37, jaw tops Z+10.37."
datum = "Foot top Z0; seat {{cad.foot_depth:.2f}}; crown +{{cad.crown_z:.2f}}. Raw LEFT X{{cad.raw_x_min:.2f}},Y−12; free end Y{{cad.reverse_raw_y_min:.2f}},X0: pick at Z+20, traverse above +32."
[[setups.operations]]
tool = "long"
settings = "bracket-long-plain-carbon-steel"
instruction = "Rough free run X{{cad.raw_x_min:.2f}}…{{cad.raw_x_max:.2f}},Y{{cad.reverse_raw_y_min:.2f}}…{{cad.inner_y:.2f}} and strips X{{cad.raw_x_min:.2f}}…{{cad.ear_x_min:.2f}}/{{cad.ear_x_max:.2f}}…{{cad.raw_x_max:.2f}},Y{{cad.strip_y_min:.2f}}…{{cad.reverse_raw_y_max:.2f}} from +{{cad.crown_z:.2f}} to +16: ≤4 axial, 1 radial step, {{process.wall_leave_mm:.1f}} wall leave. Enter free run from −Y, strips from outside; retain square crown."

[[setups]]
machine_kind = "other"
title = "Foot grip — finish relief and drill"
machine = "PM-30MV"
holding = "Seat down, 1-5/8 in × 1/8 in parallels; X0 drill line clear. Foot grip {{process.foot_grip_mm:g}}; jaws Z{{cad.foot_jaw_z:.2f}}."
datum = "Foot top Z0; foot transfer ≤0.0254 TIR. Raw LEFT X{{cad.raw_x_min:.2f}} / free end Y{{cad.reverse_raw_y_min:.2f}}: pick at Z+8. Crown +{{cad.crown_z:.2f}}; traverse above +32."
[[setups.operations]]
tool = "long"
settings = "bracket-long-plain-carbon-steel"
instruction = "Rough same free run/strips +16→+{{process.floor_leave_mm:g}}: ≤3 axial, 1 radial step, {{process.wall_leave_mm:.1f}} wall leave. Finish inner wall Y{{cad.inner_y:.2f}}, ear sides X{{cad.ear_x_min:.2f}}…{{cad.ear_x_max:.2f}}, ledges Z0; ≤9.1 axial finish levels, {{process.wall_leave_mm:.1f}} radial. Keep square crown."
inspection = "Ear width {{cad.ear_width_min:.2f}}–{{cad.ear_width_max:.2f}}; seat-to-foot-top {{cad.foot_height_min:.2f}}–{{cad.foot_height_max:.2f}} on free run and both ledges."
[[setups.operations]]
tool = "spot-long"
rpm = 1050
feed = "42 mm/min"
instruction = "Spot both foot holes 0.6 deep from foot top: A X{{cad.hole_a_x:.2f}}, Y{{cad.hole_a_y:.2f}}; B X{{cad.hole_b_x:.2f}}, Y{{cad.hole_b_y:.2f}}."
[[setups.operations]]
tool = "drill15"
rpm = 1700
feed = "187 mm/min"
instruction = "Drill both holes through {{cad.foot_thickness:.2f}} mm foot, full diameter 2 mm beyond exit."
inspection = "Hole A Ø{{cad.hole_a_dia_min:.3f}}–{{cad.hole_a_dia_max:.3f}}, station {{cad.hole_a_station_min:.2f}}–{{cad.hole_a_station_max:.2f}}; B Ø{{cad.hole_b_dia_min:.3f}}–{{cad.hole_b_dia_max:.3f}}, station {{cad.hole_b_station_min:.2f}}–{{cad.hole_b_station_max:.2f}} from ear midplane."

[[setups]]
machine_kind = "other"
title = "Angle plate — face, crown and bore"
machine = "PM-30MV"
holding = "Fixture: ledge 22.6×17.9×6, two #10-24×5/8 in screws into upright; top parallel ≤0.02/22.6. Bridge 63.5×12.7×9.525; letter X holes 40±0.1 apart match upright X±20, 13.5 below top. Two 3/8-16×2-1/8 in studs. Seat against plate, outer face 4 proud; ledge Z{{cad.ledge_z:.2f}}, bridge Y{{cad.bridge_y:.2f}},Z−17.5; nuts 15 N·m. Seat lip ≤0.0254 TIR; plate ≤0.0254/100."
datum = "Foot LEFT X{{cad.foot_x_min:.2f}}; seat/upright Y0. Z0 on finished foot outer end, cutter centre X0,Y+1.5, not raw ear +1. Traverse above +5."
[[setups.operations]]
tool = "end"
settings = "bracket-end-plain-carbon-steel"
instruction = "Face X{{cad.foot_x_min:.2f}}…{{cad.foot_x_max:.2f}},Y{{cad.crown_y:.2f}}…0, +1→0: 1 DOC, 4 stepover; wipe finished foot end. Rough R{{cad.arch_radius:.2f}} crown, centre X{{cad.bore_x:.2f}},Y{{cad.bore_y:.2f}}, single-axis stairs to Z{{cad.crown_finish_depth:.2f}}: ≤3.2 axial, {{process.wall_leave_mm:.1f}} radial leave, ≤0.15 cusp."
inspection = "Ear thickness {{cad.ear_thickness_min:.2f}}–{{cad.ear_thickness_max:.2f}} after facing; foot length remains {{cad.foot_length_min:.2f}}–{{cad.foot_length_max:.2f}}."
[[setups.operations]]
tool = "spot"
rpm = 700
feed = "28 mm/min"
instruction = "Spot cross-bore at X{{cad.bore_x:.2f}},Y{{cad.bore_y:.2f}}, 0.6 deep."
[[setups.operations]]
tool = "drillD"
rpm = 1250
feed = "137.5 mm/min"
instruction = "Predrill cross-bore through {{cad.ear_thickness:.2f}} mm ear; full diameter 2 mm beyond exit."
[[setups.operations]]
tool = "ream"
rpm = 650
feed = "163.8 mm/min"
instruction = "Ream through, full diameter 2 mm beyond exit."
inspection = "Bore Ø{{cad.bore_dia_min:.3f}}–{{cad.bore_dia_max:.3f}}; plugs {{process.bore_go_mm:.3f}} GO both sides / {{process.bore_no_go_mm:.3f}} NO-GO. Bore centre {{cad.bore_height_min:.2f}}–{{cad.bore_height_max:.2f}} above seat."

[[setups]]
machine_kind = "other"
title = "Filing-button arch"
machine = "Fitting bench"
holding = "Hardened Ø14 g6 buttons (13.983–13.994), 4 thick, on Ø6.5 g6 stepped stud through bore; inner ear down. Grip stud tail with 20 exposed; M6 stack nut 4 N·m."
[[setups.operations]]
instruction = "File full {{cad.ear_thickness:.2f}} mm ear to both button rims."
inspection = "Radius {{cad.arch_radius_min:.2f}}–{{cad.arch_radius_max:.2f}}; R7 gauge."

[[setups]]
machine_kind = "other"
title = "Edge finish and {{cad.finish}}"
machine = "Finishing bench / outside finisher"
[[setups.operations]]
instruction = "Edge break R{{cad.edge_break_r:.2f}} / chamfer {{cad.chamfer_max:.2f}} max, including hole mouths; preserve reamed wall. Solvent-clean; {{cad.finish}} all over, no masking, oil dip."
inspection = "After coating wipe bore oil. Bore Ø{{cad.bore_dia_min:.3f}}–{{cad.bore_dia_max:.3f}}; plugs {{process.bore_go_mm:.3f}} GO enters either side / {{process.bore_no_go_mm:.3f}} NO-GO does not."
