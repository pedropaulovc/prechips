# Source: archive/pre-v0.10-2026-11-08, examples/pivot-shaft/{plan.toml,
# features.toml,expected/traveler.html}; examples/inventory/pedro-shop.toml;
# examples/cutting-data.toml (pivot-shaft and DataShaft4 rows).
# Drawing dimensions/limits follow features.toml, MHA-065 v40.
# Blank allowance, chuck/dead-centre/follow-rest route, DRO frames, feeds,
# rpm and 1.75 mm fit-up target are authored example choices, not drawing facts.
# This preserves plan rev 7's route, not the drawing's between-centres process line.
# Dome attachment setup follows the LMS 2569 manual linked in shared shop.toml.
# The 156.67 mm span is REF / CUT TO FIT, never a fixed finished-length limit.
title = "Pivot shaft — {{cad.drawing_number}}"
part = "{{cad.part}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel"
stock = "1 × Ø{{process.stock_dia_mm:g}} × {{cad.blank_length:g}} mm sawn blank; {{process.supply_length_mm:g}} mm supply length from north apex to plain end"
note = "Millimetres; X diametric, Z+ away from chuck. CRC cutting oil. Final length: fit to both ears; {{cad.span_ref:.2f}} REF."
shop = "../shop.toml"
material_key = "shaft-1018-cold-finished"
turning_material = "steel_1018"

[cad]
adapter = "harmonic_pivot_shaft"
file = "../cad/pivot-shaft-v40.toml"

# Authored tooling, stock and process choices, not shaft drawing requirements.
[parameters]
stock_dia_mm = 10.0
# Available round-stock length; the route requires the sawn blank printed above.
stock_length_mm = 180.5
short_grip_mm = 20.0
short_projection_mm = 15.0
reverse_grip_mm = 25.0
# Authored attachment-clearance positions; confirm actual full-sweep gap at setup.
reverse_jaw_offset_mm = 8.0
fit_grip_mm = 25.0
fit_jaw_offset_mm = 16.0
supply_length_mm = 175.0
plain_end_face_allowance_mm = 0.5
blade_width_mm = 1.6
blade_corner_radius_mm = 0.1
nose_radius_mm = 0.4
entering_angle_deg = 93.0
turn_rough_allowance_mm = 0.20
rough_radial_doc_mm = 0.5
body_rough_feed_mm_rev = 0.08
body_finish_feed_mm_rev = 0.05
journal_rough_feed_mm_rev = 0.10
journal_finish_feed_mm_rev = 0.05
shoulder_face_allowance_mm = 0.20
turn_start_clearance_mm = 0.30
stub_allowance_mm = 5.0
fit_apex_mm = 1.75
fit_min_mm = 1.50
fit_max_mm = 2.00
fit_face_allowance_mm = 0.50
scribe_expectation_tolerance_mm = 0.50
follow_rest_reset_z_mm = 152.0
follow_rest_lead_mm = 8.0
follow_rest_jaw_mm = 10.0
follow_rest_waste_margin_mm = 0.25
# #2 centre drill pilot (shop tools.shaft-centre); its speed is taken there.
centre_pilot_dia_mm = 1.98

[[tools]]
id = "ar"
name = "AR"
ref = "shaft-ar"

[[tools]]
id = "centre"
name = "#2 centre"
ref = "shaft-centre"

[[tools]]
id = "hss"
name = "HSS"
ref = "shaft-hss"
description = "3/8 in M42 RH bit, {{process.entering_angle_deg:g}}° entering angle, R{{process.nose_radius_mm:g}} nose"

[[tools]]
id = "ball"
name = "LMS 2569"
ref = "lms-2569"

[[tools]]
id = "blade"
name = "Blade"
ref = "shaft-blade"
description = "{{process.blade_width_mm:g}} mm M2 square blade, corner R{{process.blade_corner_radius_mm:g}}"

[[setups]]
machine_kind = "lathe"
title = "Short hold — face and centre plain end"
machine = "PM-1127VF-LB lathe"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw: {{process.short_grip_mm:g}} mm grip, {{process.short_projection_mm:g}} mm plain-end projection; remainder through spindle."
datum = "Sawn end Z+{{process.plain_end_face_allowance_mm:g}}; faced end Z0; X diametric."
diagram = { file = "diagrams/pivot-shaft/short.svg", alt = "Short plain-end hold: facing and centre drilling, with the remaining blank through the spindle." }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
sizing = "other"
instruction = "Face clean to Z0; {{cad.plain_end_face_passes:g}} passes ≤0.25 mm axial."
settings = "shaft-face-carbide-1018"
cut_diameter_mm = "{{process.stock_dia_mm}}"
feed = "0.05 mm/rev"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
sizing = "other"
instruction = "Centre-drill Ø3 mouth, 2.86 mm deep."
settings = "shaft-centre-drill-1018"
cut_diameter_mm = "{{process.centre_pilot_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Supported body and thrust shoulder"
machine = "PM-1127VF-LB lathe"
machine_ref = "pm-1127vf-lb"
holding = "North-stub grip {{cad.north_grip:g}} mm; projection {{cad.supported_projection:.1f}} ±0.3. Lubricated MT3 dead centre. Follow rest {{process.follow_rest_lead_mm:g}} mm behind tool; reset each rough/finish pass at Z{{process.follow_rest_reset_z_mm:g}} in waste."
datum = "All tools: thrust face Z0; plain end Z{{cad.plain_end_z:g}}. Blade Z at chuck-side corner."
diagram = { file = "diagrams/pivot-shaft/supported.svg", alt = "North stub in the chuck, bearing turning toward the chuck, dead-centre support and follow rest at the reset position." }
turning_support = { kind = "follower", chuck_z_mm = "{{cad.supported_chuck_z}}", centre_z_mm = "{{cad.plain_end_z}}", engage_z_mm = "{{process.follow_rest_reset_z_mm}}", offset_mm = "{{process.follow_rest_lead_mm}}", pad_width_mm = "{{process.follow_rest_jaw_mm}}" }

[[setups.operations]]
cut_kind = "other"
instruction = "Check shoulder OD; retain bar surface."
inspection = "Ø{{cad.shoulder_dia_min:.2f}}–{{cad.shoulder_dia_max:.2f}}."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Body rough", phase = "rough", start_z_mm = "{{cad.body_cut_start_z}}", end_z_mm = "{{process.shoulder_face_allowance_mm}}", kept_start_z_mm = "{{cad.body_kept_end_z}}", kept_end_z_mm = "{{process.shoulder_face_allowance_mm}}", start_diameter_mm = "{{process.stock_dia_mm}}", end_diameter_mm = "{{cad.bearing_rough_dia}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.body_rough_feed_mm_rev}}", minimum_diameter_mm = "{{cad.body_minimum_dia}}" },
]
speed_kind = "spindle"
tool = "hss"
sizing = "other"
instruction = "Rough Ø{{process.stock_dia_mm:g}} → Ø{{cad.bearing_rough_dia:.2f}}, Z{{cad.turn_start_z:.1f}} to Z{{process.shoulder_face_allowance_mm:g}}; four passes, ≤{{process.rough_radial_doc_mm:g}} mm radial depth."
settings = "shaft-rough-turn-hss-1018"
cut_diameter_mm = "{{cad.bearing_rough_dia}}"
feed = "{{process.body_rough_feed_mm_rev:.2f}} mm/rev"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "hss"
sizing = "other"
instruction = "Face thrust shoulder outward to Z0; {{process.shoulder_face_allowance_mm:g}} mm axial cut."
settings = "shaft-face-hss-1018"
cut_diameter_mm = "{{cad.shoulder_dia}}"
feed = "0.05 mm/rev"
inspection = "Thrust face Ra ≤{{cad.thrust_finish:g}} µm."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Body finish", phase = "finish", start_z_mm = "{{cad.body_cut_start_z}}", end_z_mm = 0.0, kept_start_z_mm = "{{cad.body_kept_end_z}}", kept_end_z_mm = 0.0, start_diameter_mm = "{{cad.bearing_rough_dia}}", end_diameter_mm = "{{cad.bearing_dia}}", max_radial_doc_mm = "{{cad.bearing_finish_radial_doc}}", feed_mm_rev = "{{process.body_finish_feed_mm_rev}}", minimum_diameter_mm = "{{cad.body_minimum_dia}}" },
]
speed_kind = "spindle"
tool = "hss"
sizing = "other"
instruction = "Finish Ø{{cad.bearing_dia:.2f}}, Z{{cad.turn_start_z:.1f}} to Z0; one supported pass."
settings = "shaft-finish-turn-hss-1018"
cut_diameter_mm = "{{cad.bearing_dia}}"
feed = "{{process.body_finish_feed_mm_rev:.2f}} mm/rev"
inspection = "Ø{{cad.bearing_dia_min:.3f}}–{{cad.bearing_dia_max:.3f}} at both ends and middle; Ra ≤{{cad.bearing_finish:g}} µm."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
sizing = "other"
instruction = "South relief Ø{{cad.south_relief_dia:.2f}}: plunge Z{{cad.south_relief_start:g}}…{{cad.south_relief_first_end:g}}, then Z{{cad.south_relief_second_start:g}}…{{cad.south_relief_end:g}}. Break shoulder OD and bearing-side edge Z{{cad.south_relief_end:g}} ≤{{cad.edge_break_max:g}}."
settings = "shaft-relief-1018"
cut_diameter_mm = "{{cad.south_relief_dia}}"
inspection = "Relief Ø{{cad.south_relief_dia_min:.2f}}–{{cad.south_relief_dia_max:.2f}}; width {{cad.south_relief_width_min:g}}–{{cad.south_relief_width_max:g}}; corner R≤{{cad.south_corner_max:g}}."

[[setups]]
machine_kind = "lathe"
title = "Reverse — journal, north relief and dome"
machine = "PM-1127VF-LB lathe"
machine_ref = "pm-1127vf-lb"
holding = "Protected body grip {{process.reverse_grip_mm:g}} mm; thrust face {{process.reverse_jaw_offset_mm:g}} mm beyond jaw fronts Z{{cad.reverse_jaw_z:g}}; nominal {{cad.reverse_projection:g}} mm projection, unsupported. Require ≥5 mm jaw-to-frame gap throughout full attachment sweep."
datum = "All tools: apex Z0; touch thrust plane at Z{{cad.thrust_z:g}}, not jaw face. Measure M = thrust-to-stub-end before clamping; stub Z=M{{cad.thrust_z:+g}}. Blade Z at chuck-side corner."
diagram = { file = "diagrams/pivot-shaft/reverse.svg", alt = "Reversed shaft with the thrust face beyond the jaw fronts: journal, relief and north dome machining." }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.reverse_jaw_z}}" }

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Journal rough", phase = "rough", start_z_mm = "{{process.stub_allowance_mm}}", end_z_mm = "{{cad.north_rough_stop}}", kept_start_z_mm = "{{cad.north_apex_z}}", kept_end_z_mm = "{{cad.north_rough_stop}}", start_diameter_mm = "{{process.stock_dia_mm}}", end_diameter_mm = "{{cad.journal_rough_dia}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.journal_rough_feed_mm_rev}}", minimum_diameter_mm = "{{cad.journal_minimum_dia}}" },
  { name = "Journal finish", phase = "finish", start_z_mm = "{{process.stub_allowance_mm}}", end_z_mm = "{{cad.north_shoulder_z}}", kept_start_z_mm = "{{cad.north_apex_z}}", kept_end_z_mm = "{{cad.north_shoulder_z}}", start_diameter_mm = "{{cad.journal_rough_dia}}", end_diameter_mm = "{{cad.journal_dia}}", max_radial_doc_mm = "{{cad.journal_finish_radial_doc}}", feed_mm_rev = "{{process.journal_finish_feed_mm_rev}}", minimum_diameter_mm = "{{cad.journal_minimum_dia}}" },
]
speed_kind = "spindle"
tool = "hss"
sizing = "other"
instruction = "Rough Ø{{cad.journal_rough_dia:.2f}}, Z+{{process.stub_allowance_mm:g}} to {{cad.north_rough_stop:g}}: four passes, ≤{{process.rough_radial_doc_mm:g}} mm radial. Face shoulder Z{{cad.north_shoulder_z:g}} at 1400 rpm / 0.05 mm/rev. Finish Ø{{cad.journal_dia:.2f}} through Z{{cad.north_shoulder_z:g}} at 1700 rpm / {{process.journal_finish_feed_mm_rev:.2f}} mm/rev."
settings = "shaft-rough-turn-hss-1018"
cut_diameter_mm = "{{cad.journal_rough_dia}}"
feed = "Rough {{process.journal_rough_feed_mm_rev:.2f}} mm/rev"
inspection = "Journal Ø{{cad.journal_dia_min:.3f}}–{{cad.journal_dia_max:.3f}}; Ra ≤{{cad.journal_finish:g}} µm."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
sizing = "other"
instruction = "Plunge north relief Ø{{cad.north_relief_dia:.2f}}: Z{{cad.north_relief_start:g}}…{{cad.north_relief_first_end:g}}, then Z{{cad.north_relief_second_start:g}}…{{cad.north_relief_end:g}}."
settings = "shaft-relief-1018"
cut_diameter_mm = "{{cad.north_relief_dia}}"
inspection = "Ø{{cad.north_relief_dia_min:.2f}}–{{cad.north_relief_dia_max:.2f}}; width {{cad.north_relief_width_min:g}}–{{cad.north_relief_width_max:g}}; corner R≤{{cad.north_corner_max:g}}."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "hss"
sizing = "other"
instruction = "Face stub to apex Z0; remove {{process.stub_allowance_mm:g}} mm in ≤1 mm passes. Rough outer corner, leaving material for dome finishing."
settings = "shaft-face-hss-1018"
cut_diameter_mm = "{{cad.journal_dia}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
sizing = "other"
instruction = "Finish north cap R{{cad.north_dome_radius:.2f}}; frame-edge-to-tip {{cad.north_frame_edge_to_tip:.2f}}, tip at centre height. Apex Z{{cad.north_apex_z:g}}, pivot Z{{cad.north_sphere_center_z:.2f}}, base Z{{cad.north_base_z:g}}. Stop infeed at continuous rim-to-centre cut."
instruction_detailed = """1. Set R{{cad.north_dome_radius:.2f}}: rotate inner frame 90°, bridge its end edges with a straightedge; measure edge-to-tip {{cad.north_frame_edge_to_tip:.2f}} mm. Tighten bit screw. Set tip to spindle centre height.
2. Locate: inner frame parallel to spindle; touch the faced apex Z{{cad.north_apex_z:g}}, then lock carriage. Pivot is Z{{cad.north_sphere_center_z:.2f}}.
3. Cut: retract cross-slide clear; sweep and advance to first contact. Take light cross-slide increments, swinging the handle after each. Sweep only base rim Z{{cad.north_base_z:g}} to apex.
4. Finish: stop infeed when one sweep cuts continuously from rim to centre and the apex flat is gone."""
settings = "shaft-dome-1018"
inspection = "Height {{cad.north_dome_height_min:g}}–{{cad.north_dome_height_max:g}}; journal length {{cad.journal_length_min:g}}–{{cad.journal_length_max:g}}; shoulder {{cad.shoulder_length_min:.2f}}–{{cad.shoulder_length_max:.2f}}. Break shoulder OD, journal-side relief edge Z{{cad.north_relief_end:g}} and dome rim ≤{{cad.edge_break_max:g}}."


[[setups]]
machine_kind = "lathe"
title = "Fit-scribe — finish plain end"
machine = "PM-1127VF-LB lathe / assembly bench"
machine_ref = "pm-1127vf-lb"
holding = "After scribing: protected body grip {{process.fit_grip_mm:g}} mm; jaws {{process.fit_jaw_offset_mm:g}} mm north of scribe. Stickout = scribe-to-end +{{process.fit_jaw_offset_mm:g}}. Runout ≤0.02 TIR. Require ≥5 mm jaw-to-frame gap throughout full attachment sweep."
datum = "All tools: scribe Z0; X trial cut on waste Z6…end. Blade Z at chuck-side corner."
diagram = { file = "diagrams/pivot-shaft/fit.svg", alt = "Fit-scribe datum, waste parting plane and final south dome; waste length follows the actual fit-up." }

[[setups.operations]]
cut_kind = "other"
instruction = "Fit both ears, shoulder against north ear; scribe south ear outer face. Scribe-to-end {{cad.scribe_expected_min:.2f}}–{{cad.scribe_expected_max:.2f}} reference; otherwise refit/rescribe. If still ≥{{cad.rest_scribe_min:.2f}}, use actual reading. Below {{cad.rest_scribe_min:.2f}} correct bank: rest mark would remain."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
sizing = "other"
instruction = "Part waste at chuck-side blade corner Z+{{cad.parting_z:.2f}}; X{{cad.bearing_dia:.2f}} → X0."
settings = "shaft-parting-1018"
cut_diameter_mm = "{{cad.bearing_dia}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "hss"
sizing = "other"
instruction = "Face apex Z+{{process.fit_apex_mm:.2f}}; remove {{process.fit_face_allowance_mm:.2f}} in ≤0.25 mm passes. Rough outer corner, leaving material for dome finishing."
settings = "shaft-face-hss-1018"
cut_diameter_mm = "{{cad.bearing_dia}}"
feed = "0.05 mm/rev"
inspection = "Scribe zero 0.00 ±0.05; end {{process.fit_min_mm:.2f}}–{{process.fit_max_mm:.2f}} beyond scribe. Reface if long; reject if short."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
sizing = "other"
instruction = "Finish south cap R{{cad.south_dome_radius:.2f}}; frame-edge-to-tip {{cad.south_frame_edge_to_tip:.2f}}. Apex Z{{cad.south_apex_z:.2f}}, pivot Z{{cad.south_sphere_center_z:.2f}}, base Z{{cad.south_base_z:.2f}}. Stop infeed at continuous rim-to-centre cut. Break rim ≤{{cad.edge_break_max:g}}; trial fit; oil."
instruction_detailed = "Use Op 110 steps 1–4: set R{{cad.south_dome_radius:.2f}}, frame-edge-to-tip {{cad.south_frame_edge_to_tip:.2f}} mm. Touch apex Z{{cad.south_apex_z:.2f}} in the scribe datum and lock carriage; pivot Z{{cad.south_sphere_center_z:.2f}}. Sweep only base rim Z{{cad.south_base_z:.2f}} to apex. Stop infeed at continuous rim-to-centre cut: further infeed shortens the fitted end. Break rim ≤{{cad.edge_break_max:g}}; trial fit; oil."
settings = "shaft-dome-1018"
inspection = "Dome height {{cad.south_dome_height_min:g}}–{{cad.south_dome_height_max:g}}; final length to actual ear fit."
