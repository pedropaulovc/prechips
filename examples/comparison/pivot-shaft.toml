# Source: archive/pre-v0.10-2026-11-08, examples/pivot-shaft/{plan.toml,
# features.toml,expected/traveler.html}; examples/inventory/pedro-shop.toml;
# examples/cutting-data.toml (pivot-shaft and DataShaft4 rows).
# Drawing dimensions/limits follow features.toml, MHA-065 v40.
# Blank allowance, chuck/dead-centre/follow-rest route, DRO frames, feeds,
# rpm and 1.75 mm fit-up target are authored example choices, not drawing facts.
# This preserves plan rev 7's route, not the drawing's between-centres process line.
# Dome attachment setup follows the LMS 2569 manual linked in shared shop.toml.
# The 156.67 mm span is REF / CUT TO FIT, never a fixed finished-length limit.
title = "Pivot shaft — {{cad.drawing_number}}"
part = "{{cad.part}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel"
stock = "1 × Ø{{process.stock_dia_mm:g}} × {{cad.blank_length:g}} mm sawn blank; {{process.supply_length_mm:g}} mm supply length from north apex to plain end"
note = "Millimetres; X diametric, Z+ away from chuck. CRC cutting oil. Final length: fit to both ears; {{cad.span_ref:.2f}} REF."
shop = "../shop.toml"
material_key = "shaft-1018-cold-finished"

[cad]
adapter = "harmonic_pivot_shaft"
file = "../cad/pivot-shaft-v40.toml"

# Authored tooling, stock and process choices, not shaft drawing requirements.
[parameters]
stock_dia_mm = 10.0
# Available round-stock length; the route requires the sawn blank printed above.
stock_length_mm = 180.5
short_grip_mm = 20.0
short_projection_mm = 15.0
reverse_grip_mm = 25.0
fit_grip_mm = 25.0
fit_jaw_offset_mm = 8.0
supply_length_mm = 175.0
plain_end_face_allowance_mm = 0.5
blade_width_mm = 1.6
blade_corner_radius_mm = 0.1
nose_radius_mm = 0.4
entering_angle_deg = 93.0
turn_rough_allowance_mm = 0.20
shoulder_face_allowance_mm = 0.20
turn_start_clearance_mm = 0.30
stub_allowance_mm = 5.0
fit_apex_mm = 1.75
fit_min_mm = 1.50
fit_max_mm = 2.00
fit_face_allowance_mm = 0.50
scribe_expectation_tolerance_mm = 0.50
follow_rest_reset_z_mm = 152.0
follow_rest_lead_mm = 8.0
follow_rest_jaw_mm = 10.0
follow_rest_waste_margin_mm = 0.25

[[tools]]
id = "ar"
name = "AR"
ref = "shaft-ar"

[[tools]]
id = "centre"
name = "#2 centre"
ref = "shaft-centre"

[[tools]]
id = "hss"
name = "HSS"
ref = "shaft-hss"
description = "3/8 in M42 RH bit, {{process.entering_angle_deg:g}}° entering angle, R{{process.nose_radius_mm:g}} nose"

[[tools]]
id = "ball"
name = "LMS 2569"
ref = "lms-2569"

[[tools]]
id = "blade"
name = "Blade"
ref = "shaft-blade"
description = "{{process.blade_width_mm:g}} mm M2 square blade, corner R{{process.blade_corner_radius_mm:g}}"

[[setups]]
title = "Short hold — face and centre plain end"
machine = "PM-1127VF-LB lathe"
holding = "3-jaw: {{process.short_grip_mm:g}} mm grip, {{process.short_projection_mm:g}} mm plain-end projection; remainder through spindle."
datum = "Sawn end Z+{{process.plain_end_face_allowance_mm:g}}; faced end Z0; X diametric."
diagram = { file = "diagrams/pivot-shaft/short.svg", alt = "Short plain-end hold: facing and centre drilling, with the remaining blank through the spindle." }

[[setups.operations]]
tool = "ar"
instruction = "Face clean to Z0; {{cad.plain_end_face_passes:g}} passes ≤0.25 mm axial."
rpm = 2000
feed = "0.05 mm/rev"

[[setups.operations]]
tool = "centre"
instruction = "Centre-drill Ø3 mouth, 2.86 mm deep."
rpm = 2000
feed = "Hand quill, 0.038 mm/rev"

[[setups]]
title = "Supported body and thrust shoulder"
machine = "PM-1127VF-LB lathe"
holding = "North-stub grip {{cad.north_grip:g}} mm; projection {{cad.supported_projection:.1f}} ±0.3. Lubricated MT3 dead centre. Follow rest {{process.follow_rest_lead_mm:g}} mm behind tool; reset each rough/finish pass at Z{{process.follow_rest_reset_z_mm:g}} in waste."
datum = "All tools: thrust face Z0; plain end Z{{cad.plain_end_z:g}}. Blade Z at chuck-side corner."
diagram = { file = "diagrams/pivot-shaft/supported.svg", alt = "North stub in the chuck, bearing turning toward the chuck, dead-centre support and follow rest at the reset position." }

[[setups.operations]]
instruction = "Check shoulder OD; retain bar surface."
inspection = "Ø{{cad.shoulder_dia_min:.2f}}–{{cad.shoulder_dia_max:.2f}}."

[[setups.operations]]
tool = "hss"
instruction = "Rough Ø{{process.stock_dia_mm:g}} → Ø{{cad.bearing_rough_dia:.2f}}, Z{{cad.turn_start_z:.1f}} to Z{{process.shoulder_face_allowance_mm:g}}; four passes, ≤0.5 mm radial depth."
rpm = 1350
feed = "0.08 mm/rev"

[[setups.operations]]
tool = "hss"
instruction = "Face thrust shoulder outward to Z0; {{process.shoulder_face_allowance_mm:g}} mm axial cut."
rpm = 850
feed = "0.05 mm/rev"
inspection = "Thrust face Ra ≤{{cad.thrust_finish:g}} µm."

[[setups.operations]]
tool = "hss"
instruction = "Finish Ø{{cad.bearing_dia:.2f}}, Z{{cad.turn_start_z:.1f}} to Z0; one supported pass."
rpm = 1700
feed = "0.05 mm/rev"
inspection = "Ø{{cad.bearing_dia_min:.3f}}–{{cad.bearing_dia_max:.3f}} at both ends and middle; Ra ≤{{cad.bearing_finish:g}} µm."

[[setups.operations]]
tool = "blade"
instruction = "South relief Ø{{cad.south_relief_dia:.2f}}: plunge Z{{cad.south_relief_start:g}}…{{cad.south_relief_first_end:g}}, then Z{{cad.south_relief_second_start:g}}…{{cad.south_relief_end:g}}. Break shoulder OD and bearing-side edge Z{{cad.south_relief_end:g}} ≤{{cad.edge_break_max:g}}."
settings = "shaft-relief-1018"
inspection = "Relief Ø{{cad.south_relief_dia_min:.2f}}–{{cad.south_relief_dia_max:.2f}}; width {{cad.south_relief_width_min:g}}–{{cad.south_relief_width_max:g}}; corner R≤{{cad.south_corner_max:g}}."

[[setups]]
title = "Reverse — journal, north relief and dome"
machine = "PM-1127VF-LB lathe"
holding = "Protected body grip {{process.reverse_grip_mm:g}} mm; thrust face against jaw fronts; nominal {{cad.reverse_projection:g}} mm projection, unsupported."
datum = "All tools: apex Z0, thrust Z{{cad.thrust_z:g}}. Measure M = thrust-to-stub-end before clamping; stub Z=M{{cad.thrust_z:+g}}. Blade Z at chuck-side corner."
diagram = { file = "diagrams/pivot-shaft/reverse.svg", alt = "Reversed shaft with the thrust face at the jaws: journal, relief and north dome machining." }

[[setups.operations]]
tool = "hss"
instruction = "Rough Ø{{cad.journal_rough_dia:.2f}}, Z+{{process.stub_allowance_mm:g}} to {{cad.north_rough_stop:g}}: four passes, ≤0.5 mm radial. Face shoulder Z{{cad.north_shoulder_z:g}} at 1400 rpm / 0.05 mm/rev. Finish Ø{{cad.journal_dia:.2f}} through Z{{cad.north_shoulder_z:g}} at 1700 rpm / 0.05 mm/rev."
rpm = 1350
feed = "Rough 0.10 mm/rev"
inspection = "Journal Ø{{cad.journal_dia_min:.3f}}–{{cad.journal_dia_max:.3f}}; Ra ≤{{cad.journal_finish:g}} µm."

[[setups.operations]]
tool = "blade"
instruction = "Plunge north relief Ø{{cad.north_relief_dia:.2f}}: Z{{cad.north_relief_start:g}}…{{cad.north_relief_first_end:g}}, then Z{{cad.north_relief_second_start:g}}…{{cad.north_relief_end:g}}."
settings = "shaft-relief-1018"
inspection = "Ø{{cad.north_relief_dia_min:.2f}}–{{cad.north_relief_dia_max:.2f}}; width {{cad.north_relief_width_min:g}}–{{cad.north_relief_width_max:g}}; corner R≤{{cad.north_corner_max:g}}."

[[setups.operations]]
tool = "hss"
instruction = "Face stub to apex Z0; remove {{process.stub_allowance_mm:g}} mm in ≤1 mm passes. Rough outer corner, leaving material for dome finishing."
rpm = 1400
feed = "0.08 mm/rev"

[[setups.operations]]
tool = "ball"
instruction = "Finish north cap R{{cad.north_dome_radius:.2f}}; frame-edge-to-tip {{cad.north_frame_edge_to_tip:.2f}}, tip at centre height. Apex Z{{cad.north_apex_z:g}}, pivot Z{{cad.north_sphere_center_z:.2f}}, base Z{{cad.north_base_z:g}}; sweep cap only."
instruction_detailed = "Set LMS 2569 tip to spindle centre height; check frame and handle sweep clearance. Rotate the inner frame 90°, bridge its two end edges with a straightedge and measure edge-to-tip {{cad.north_frame_edge_to_tip:.2f}} mm (CAD radius {{cad.north_dome_radius:.2f}} + 4.7625); tighten the bit screw. With the inner frame parallel to the spindle, bring the tip to the faced apex Z{{cad.north_apex_z:g}} and hold that carriage position. Retract the cross-slide clear, sweep the handle and advance to first contact. Feed the cross-slide in light increments, sweeping after each; this is a finishing tool, not a bulk rougher. Finish only apex to base Z{{cad.north_base_z:g}}, not a full ball or the journal. Sphere centre/pivot is Z{{cad.north_sphere_center_z:.2f}}. Check cap height and base before breaking the rim."
settings = "shaft-dome-1018"
inspection = "Height {{cad.north_dome_height_min:g}}–{{cad.north_dome_height_max:g}}; journal length {{cad.journal_length_min:g}}–{{cad.journal_length_max:g}}; shoulder {{cad.shoulder_length_min:.2f}}–{{cad.shoulder_length_max:.2f}}. Break shoulder OD, journal-side relief edge Z{{cad.north_relief_end:g}} and dome rim ≤{{cad.edge_break_max:g}}."


[[setups]]
title = "Fit-scribe — finish plain end"
machine = "PM-1127VF-LB lathe / assembly bench"
holding = "After scribing: protected body grip {{process.fit_grip_mm:g}} mm; jaws {{process.fit_jaw_offset_mm:g}} mm north of scribe. Stickout = scribe-to-end +{{process.fit_jaw_offset_mm:g}}. Runout ≤0.02 TIR."
datum = "All tools: scribe Z0; X trial cut on waste Z6…end. Blade Z at chuck-side corner."
diagram = { file = "diagrams/pivot-shaft/fit.svg", alt = "Fit-scribe datum, waste parting plane and final south dome; waste length follows the actual fit-up." }

[[setups.operations]]
instruction = "Fit both ears, shoulder against north ear; scribe south ear outer face. Scribe-to-end {{cad.scribe_expected_min:.2f}}–{{cad.scribe_expected_max:.2f}} reference; otherwise refit/rescribe. If still ≥{{cad.rest_scribe_min:.2f}}, use actual reading. Below {{cad.rest_scribe_min:.2f}} correct bank: rest mark would remain."

[[setups.operations]]
tool = "blade"
instruction = "Part waste at chuck-side blade corner Z+{{cad.parting_z:.2f}}; X{{cad.bearing_dia:.2f}} → X0."
settings = "shaft-parting-1018"

[[setups.operations]]
tool = "hss"
instruction = "Face apex Z+{{process.fit_apex_mm:.2f}}; remove {{process.fit_face_allowance_mm:.2f}} in ≤0.25 mm passes. Rough outer corner, leaving material for dome finishing."
rpm = 1400
feed = "0.05 mm/rev"
inspection = "Scribe zero 0.00 ±0.05; end {{process.fit_min_mm:.2f}}–{{process.fit_max_mm:.2f}} beyond scribe. Reface if long; reject if short."

[[setups.operations]]
tool = "ball"
instruction = "Finish south cap R{{cad.south_dome_radius:.2f}}; frame-edge-to-tip {{cad.south_frame_edge_to_tip:.2f}}. Apex Z{{cad.south_apex_z:.2f}}, pivot Z{{cad.south_sphere_center_z:.2f}}, base Z{{cad.south_base_z:.2f}}; sweep cap only. Break rim ≤{{cad.edge_break_max:g}}; trial fit; oil."
instruction_detailed = "Use the north-dome attachment method, resetting for this end: CAD radius {{cad.south_dome_radius:.2f}}, frame-edge-to-tip {{cad.south_frame_edge_to_tip:.2f}} mm (radius + 4.7625). Touch apex Z{{cad.south_apex_z:.2f}} in the scribe datum and hold the carriage here. Sphere centre/pivot Z{{cad.south_sphere_center_z:.2f}}; sweep only to base Z{{cad.south_base_z:.2f}}. Check height and base; break rim ≤{{cad.edge_break_max:g}}, trial fit and oil."
settings = "shaft-dome-1018"
inspection = "Dome height {{cad.south_dome_height_min:g}}–{{cad.south_dome_height_max:g}}; final length to actual ear fit."
