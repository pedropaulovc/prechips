title = "Cone pivot post — fixtures and reamer trials"
part = "cone-pivot-post-fixtures"
revision = "v40 example"
material = "1018 steel; 6061 aluminium; C360 brass"
stock = "Bond cradle: 1/2 × 3-1/2 in and 3/4 × 2-1/2 in 1018 flat; arbor Ø2 in ×160. Saw cradle: 1-3/4 ×4 in 1018 flat ×99; bridge 5/8 ×1 in ×80; brass pad Ø1 in ×7. Buttons Ø3/4 in 6061; jaws 1×3 in 6061 ×162 each. Trials: two15 mm 1018 offcuts, oneØ25, oneØ19.05."
note = "mm throughout. Trials before bonding; fit bond cradle/arbor to turned post and saw land to cured/bored post. Companion: cone-pivot-post.toml."

[[tools]]
id = "turn"
name = "Turn"
description = "AR turning/facing tool; 1.6 mm parting blade; #2 centre drill."
[[tools]]
id = "drill"
name = "Trials"
description = "Trial drills/reamers: sizes and settings below."
[[tools]]
id = "fixture"
name = "Fixture cuts"
description = "Boring head,1/2 in bar; end mills, drills, reamers, countersink and hand taps sized at each cut."

[[setups]]
