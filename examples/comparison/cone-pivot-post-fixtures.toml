tool = "turn"
instruction = "Arbor: Ø50.8×160 1018, 30 gripped in 3-jaw; face body end Z0, centre-drill Ø4 mouth (~3.7 deep), support dead centre. In ONE setting turn body section Z0…−25 to actual body Ø, relief Ø30×70, tail section Z−95…−122 to actual raw tail Ø; match each within0.005 at both ends/two diameters. Square shoulders, break edges0.3×45°. Rough660 rpm/0.10,1 DOC; finish660/0.05,0.02 DOC. Groove at−122 toØ22 (320/0.03,0.25 pecks); grip relief in saw, cut web, file stub flush."
[[setups.operations]]
cut_kind = "other"
instruction = "Seat setting arbor in BOTH saddles against B stop; common post axis is half body-section diameter below its crown. Set pins from that axis, not base: crank tops21.38±0.12 below; cone tops21.01±0.06 along pin axis. Cone high-edge vertical offsets: +X21.76, −X18.56 below axis, each±0.06; paired height errors agree≤0.03. Seats coaxial within0.01. Dry fit: both cone pins contact; crank-socket-mouth −X/+X edges at head top level≤0.05; north cap flush, south cap proud, no rocking."
