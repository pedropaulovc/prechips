[[setups.operations]]
cut_kind = "other"
tool = "fixture"
instruction = "Cradle strapped upright: crank-pin holes (X±6,Y72.70) square through. Cone pins: tilt head12.52°±0.5°, holes leaning toward −X downward; entry coordinates (X0.919,Y33.368), (−14.241,33.368). Spot with3/16 in mill 0.5 deep at2200 rpm/0.02 mm/rev; drill3.8 through at2000/0.08; ream4.00 at1400/0.12 along each axis. Press Ø4 m6 pins (flat Ø3.2 ends): cone +X length16, −X length20; crank length16."
[[setups.operations]]
