title = "Qualify running-bore reamers before assembly"
machine = "PM-30MV"
holding = "Each offcut separately in vise; bore clear of parallels."
[[setups.operations]]
tool = "drill"
instruction = "#2 spot (3000 rpm/120 mm/min); drill/ream with oil, point/lead fully through. Both mouths must meet bore limits; replace oversize-cutting reamer and repeat trial."
