  { name = "notch plunge", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", flutes = 3, feed_per_tooth_mm = "{{process.eighth_plunge_chip_mm}}", stations_mm = 295.72 },
]

[[setups.operations]]
speed_kind = "spindle"
