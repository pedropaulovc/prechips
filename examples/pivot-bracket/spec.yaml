part: pivot-bracket
step_sha256: "<sha256 of cad/out/step/pivot-bracket.step>"
drawing:
  number: MHA-123
  source: "cad/config/parts/pivot-bracket.yaml:2; cad/scripts/build_pivot_bracket.py:1"
units: mm
material:
  spec: Plain Carbon Steel
  source: "cad/config/parts/pivot-bracket.yaml:3; cad/scripts/build_pivot_bracket.py:74"
  finish:
    kind: coating
    designation: black oxide
    source: "cad/config/parts/pivot-bracket.yaml:4"
quantity:
  nominal: 2
  source: "cad/config/parts/pivot-bracket.yaml:6"
frames:
  model:
    note: "Consumer model origin is beneath the cross-bore on the seat plane; X is foot/ear width, Y is rise, Z is foot run and bore axis."
    source: "cad/scripts/pivot_bracket_spec.py:7-12; cad/scripts/build_pivot_bracket.py:19-26"
  A:
    parent: model
    transform:
      origin: [0, 0, 0]
      x: [1, 0, 0]
      y: [0, 0, 1]
      z: [0, -1, 0]
      source: "cad/scripts/pivot_bracket_spec.py:7-12,21-30; authored right-handed seat-up orientation: model point (X,Y,Z) maps to A=(X,Z,-Y), with origin at the consumer seat plane."
    note: "Origin at the finished seat contact face; setup +Z is model -Y. The seat contact is z=0, not a bottom-origin stock-thickness offset."
  B:
    parent: model
    transform:
      origin: [0, 6, 0]
      x: [1, 0, 0]
      y: [0, 0, -1]
      z: [0, 1, 0]
      source: "cad/scripts/pivot_bracket_spec.py:7-12,22,25-30; origin Y=FOOT_H=6; authored right-handed foot-top-up orientation: B=(X,-Z,Y-FOOT_H)."
    note: "Origin at the foot-top contact face; setup +Z is model +Y. Foot top is z=0 and foot seat is z=-6."
  C:
    parent: model
    transform:
      origin: [0, 0, 3]
      x: [1, 0, 0]
      y: [0, 1, 0]
      z: [0, 0, 1]
      source: "cad/scripts/pivot_bracket_spec.py:7-12,24-25; cad/scripts/build_pivot_bracket.py:193-210; origin Z=EAR_T/2=6/2=3; authored right-handed inner-ear-up orientation: C=(X,Y,Z-EAR_T/2)."
    note: "Origin at the ear inner entry contact face; setup +Z is model +Z. Cross-bore cutting axis -C.Z maps exactly to model -Z; entry z=0, exit z=-6. No indexed-angle feature or dividing-head indexing is declared."
features:
  - id: seat_face
    kind: face
    frame: A
    plane:
      z: 0
      source: "cad/scripts/pivot_bracket_spec.py:7,21-22; seat model Y=0 maps to A.z=-Y=0."
    note: "Finished seating datum; no sourced flatness or roughness acceptance value."
  - id: foot_profile
    kind: pocket
    frame: model
    representation: stock_minus_part
    profile:
      x_min: -8
      x_max: 8
      y_min: 0
      y_max: 6
      z_min: -3
      z_max: 21.2
      source: "cad/scripts/pivot_bracket_spec.py:7,21-30; X=+/-FOOT_W/2=+/-16/2, Y=0..FOOT_H=6, Z=FOOT_Z0=-EAR_T/2=-6/2 through FOOT_Z1=21.2."
    note: "Rectangular foot boundary, not an invented pocket centre; nominal length 21.2-(-3)=24.2."
  - id: foot_top
    kind: face
    frame: B
    plane:
      z: 0
      source: "cad/scripts/pivot_bracket_spec.py:22,57; free-run foot top model Y=FOOT_H=6 maps to B.z=6-6=0."
    note: "Only the free run outside the ear; no sourced flatness or roughness acceptance value."
  - id: ear_relief
    kind: pocket
    frame: B
    representation: stock_minus_part
    bounds_model:
      z_min: 3
      z_max: 21.2
      y_min: 6
      y_max: 32.2
      source: "cad/scripts/pivot_bracket_spec.py:22,24,29,31,34-35,57; free run begins EAR_T/2=3; foot ends Z=21.2; shelf Y=6; crown envelope Y=BORE_H+EAR_W/2=25.2+14/2=32.2."
    note: "Remove the rectangular blank above the foot in the free run, retaining the ear band model Z=-3..+3. This is the L-foot relief, not a fabricated internal pocket."
  - id: ear_sides
    kind: pocket
    frame: B
    representation: stock_minus_part
    bounds_model:
      x_min: -7
      x_max: 7
      y_min: 6
      y_max: 32.2
      z_min: -3
      z_max: 3
      source: "cad/scripts/pivot_bracket_spec.py:22-25,31,34-35; retain X=+/-EAR_W/2=+/-7, Y=FOOT_H=6 to EAR_TOP_Y=25.2+7=32.2, Z=+/-EAR_T/2=+/-3."
    note: "Remove the side strips above the foot to obtain the ear width; the crown is finished separately. Cutter reach is not proved."
  - id: ear_arch
    kind: pocket
    frame: C
    representation: stock_minus_part
    center:
      x: 0
      y: 25.2
      z: 0
      source: "cad/scripts/pivot_bracket_spec.py:7-12,31,34-35; cad/scripts/build_pivot_bracket.py:168-188; circle centre model (0,BORE_H,EAR_T/2) maps to C=(0,25.2,0)."
    profile:
      kind: upper_semicircle
      radius: 7
      through_thickness: 6
      source: "cad/scripts/pivot_bracket_spec.py:23-24,34; cad/scripts/build_pivot_bracket.py:168-188; R=EAR_W/2=14/2=7, through EAR_T=6."
    note: "Machine the complement of the upper half-round centred on the bore. This is a retained convex crown, not a fillet; its centre is a geometry reference, not an endmill-centre coordinate."
  - id: cross_bore
    kind: hole
    frame: C
    entry_face: ear_inner
    axis: [0, 0, -1]
    source: "cad/scripts/build_pivot_bracket.py:193-210; entering model Z=+EAR_T/2 along model -Z is setup -C.Z."
    center:
      x: 0
      y: 25.2
      z: 0
      source: "cad/scripts/pivot_bracket_spec.py:7-12,24,31; cad/scripts/build_pivot_bracket.py:193-199; C=(0,BORE_H,EAR_T/2-EAR_T/2)=(0,25.2,0)."
    diameter:
      nominal: 6.5
      source: "cad/scripts/pivot_bracket_spec.py:33"
    end:
      condition: through
      source: "cad/scripts/build_pivot_bracket.py:193-210"
    through_thickness:
      nominal: 6
      source: "cad/scripts/pivot_bracket_spec.py:24; cad/scripts/build_pivot_bracket.py:205-210; material path is EAR_T, not the CAD cut-extrusion overrun."
    note: "Geometric cross-bore is represented as kind hole to use the specified spot-drill-ream chain. Consumer process requires reaming but supplies no bore diameter acceptance band."
  - id: hold_down_a
    kind: hole
    frame: B
    entry_face: foot_top
    axis: [0, 0, -1]
    source: "cad/scripts/build_pivot_bracket.py:215-235; model -Y maps to setup -B.Z."
    center:
      x: 0
      y: -8.2
      z: 0
      source: "cad/scripts/pivot_bracket_spec.py:43,77-103; cad/scripts/build_pivot_bracket.py:215-225; HOLE_Z[0]=8.2 and B=(X,-Z,Y-6) at model (0,8.2 along Z,6 along Y) gives (0,-8.2,0)."
    diameter:
      nominal: 4.572
      source: "cad/scripts/pivot_bracket_spec.py:40-41; cad/scripts/_hole_spec.py:44-57,111-130; CLEARANCE_MM[('#8','close')]=4.572."
    end:
      condition: through
      source: "cad/scripts/build_pivot_bracket.py:215-235"
    through_thickness:
      nominal: 6
      source: "cad/scripts/pivot_bracket_spec.py:22; material path is FOOT_H, not the CAD cut-extrusion overrun."
    note: "#8 close-clearance identity is not a numeric diameter tolerance. Design ligament calculations at spec.py:51-56 are not substituted for missing drawing acceptance bands."
  - id: hold_down_b
    kind: hole
    frame: B
    entry_face: foot_top
    axis: [0, 0, -1]
    source: "cad/scripts/build_pivot_bracket.py:215-235; model -Y maps to setup -B.Z."
    center:
      x: 0
      y: -16
      z: 0
      source: "cad/scripts/pivot_bracket_spec.py:43,77-103; cad/scripts/build_pivot_bracket.py:215-225; HOLE_Z[1]=16.0 and B=(X,-Z,Y-6) at model (0,16.0 along Z,6 along Y) gives (0,-16,0)."
    diameter:
      nominal: 4.572
      source: "cad/scripts/pivot_bracket_spec.py:40-41; cad/scripts/_hole_spec.py:44-57,111-130; CLEARANCE_MM[('#8','close')]=4.572."
    end:
      condition: through
      source: "cad/scripts/build_pivot_bracket.py:215-235"
    through_thickness:
      nominal: 6
      source: "cad/scripts/pivot_bracket_spec.py:22; material path is FOOT_H, not the CAD cut-extrusion overrun."
    note: "No threads or counterbores are present. No diameter or position acceptance band is supplied."
