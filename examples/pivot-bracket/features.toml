# pivot-bracket (MHA-123) requirement manifest — HAND-AUTHORED example, not a consumer
# export (example divergence: the other bundles are generated; this one is written by hand).
# Geometry: pivot-bracket.STEP (harmonic-analyzer v39 STEP, mm, no HAF_ face labels, so
# every face ref carries label NONE). Sizes: harmonic-analyzer v39 bundle. The v39 bundle
# holds only png/pivot-bracket/pivot-bracket_isometric.png for this part — no
# pivot-bracket_drawing.png sheet was found — so every band below is an
# example (plausible) choice, not a printed tolerance: machined sizes ±0.10 from the
# consumer's machined_block class (tolerances.yaml:14, parts/pivot-bracket.yaml:5),
# drilled holes +0.10/0 (title_block.yaml:66), reamed bore 6.50/6.53 (example, plausible).
# Face map verified against a FreeCAD dump of the STEP (16 faces). Model frame: seat
# y = 0, foot top y = 6, ear inner face z = +3, outer face z = -3 (one plane, #103,
# shared by the ear outer face and the foot's near end), foot free end z = 21.2.

part = "pivot-bracket"
units = "mm"
precision = 2                    # example (plausible): two-place mm sizes
step = "pivot-bracket.STEP"
step_sha256 = "6cd4ab60f57b1c9771cec083fbbd0ef1f94171f1d95f9485a135a4dec0b2dabc"
construction = "one_piece"       # no note permits built-up construction

[cite]
part = "harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:1-2"
step_sha256 = "harmonic-analyzer-v39 pivot-bracket.STEP (copied into this bundle)"
precision = "example (plausible): no v39 drawing sheet for this part"

[drawing]
