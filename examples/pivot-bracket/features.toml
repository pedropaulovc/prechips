# ---------------------------------------------------------------- S3 features

[features.ear_arch]
kind = "pocket"
representation = "stock_minus_part"
frame = "model"
at = [0.0, 25.2, 3.0]            # model; the arc centre (bore axis) on the ear inner face — a real centre, not a centroid
axis = [0.0, 0.0, -1.0]
arc = "upper_semicircle"         # retained convex crown about the bore, not a fillet
requirements = ["radius"]
radius = "unknown"
