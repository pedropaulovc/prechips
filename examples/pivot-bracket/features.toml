# pivot-bracket (MHA-123) requirement manifest — hand-written for PLAN.md rev 6 (§3.2),
# mirroring what the M3 generator will emit. Consumer: harmonic-analyzer, read-only;
# every cite below is a current consumer file:line (verified 2026-10-02).
#
# NO DRAWING EXISTS for this part: cad/scripts/_drawing_registry.py carries no
# pivot_bracket DrawingSpec and there is no cad/scripts/draw_pivot_bracket.py. So:
# - no general tolerance, precision class or drilled-hole band is adopted (the
#   consumer's title_block.yaml / tolerances.yaml classes exist but no sheet prints them);
# - every size/location the spec defines is a requirement whose band is "unknown";
# - requirements the consumer does not define (flatness, roughness, GD&T position,
#   fit class) are absent. With no drawing that absence is asserted from the
#   source contract only (pivot_bracket_spec.py + parts/pivot-bracket.yaml).
# Drawing dimension count cross-check: no sheet, so there are 0 printed annotations to
# count. Source dimension count (pivot_bracket_spec.py:21-41,96-102): FOOT_W, FOOT_H,
# FOOT_LEN, EAR_W, EAR_T, EAR_ARCH_R, BORE_H, BORE_DIA, HOLE_DIA (two holes), HOLE_Z (two
# stations) = 12 requirement fields below. Stale summary text in cad/config/dimensions.yaml:803
# ("Ø4.2 holes", "× 24" foot) disagrees with the current spec (4.572, 24.2); the spec wins.

part = "pivot-bracket"
units = "mm"
precision = "unknown"            # no drawing, so no general precision class is adopted
step_sha256 = "unknown"          # no STEP exported: cad/out holds only sldprt/, stl/, png/ for this part
construction = "one_piece"       # default; no drawing note permits built-up construction

[cite]
part = "harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:1-2"
precision = "harmonic-analyzer/cad/scripts/_drawing_registry.py (no pivot_bracket DrawingSpec); no cad/scripts/draw_pivot_bracket.py"
construction = "PLAN.md rev 6 §3.2: absence of a permission note is one_piece"
step_sha256 = "harmonic-analyzer/cad/out (pivot-bracket.SLDPRT, .STL, _isometric.png only)"

[frames.model]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
note = "Part frame: seat face at y = 0, origin under the bore on the seat plane; X across foot/ear width, Y rise, Z along the foot run and the bore axis."
cite = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:7-12", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:19-26"]

# Setup frames: numeric, in model coordinates, right-handed (x × y = z). Each is the
# machine-aligned frame of one setup (frame x = table +X right, y = +Y away, z = +Z up).
# binding = "unknown": the origins are sourced nominal geometry; how a real part is bound
# to them is the zero recipe in plan.toml, not a measured fit.
[frames.A]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "unknown"
note = "S1, seat up: origin on the finished seat; model (X,Y,Z) -> A (X, Z, -Y). Seat is z = 0, foot top is z = -6."
cite = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:7-12,21-22"]

[frames.B]
origin = [0.0, 6.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "unknown"
note = "S2, foot top up: origin on the foot top (model Y = FOOT_H = 6); model -> B (X, -Z, Y - 6). Foot top z = 0, seat z = -6, foot free end y = -21.2."
cite = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:7-12,22,29"]

[frames.C]
origin = [0.0, 0.0, 3.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "unknown"
note = "S3, inner ear face up: origin on the ear inner face (model Z = EAR_T/2 = 3); model -> C (X, Y, Z - 3). Ear inner face z = 0, ear outer face z = -6, foot free end z = 18.2."
cite = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:7-12,24-25,29"]

[material]
spec = "Plain Carbon Steel"
finish = "black oxide"
cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:3-4", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:74"]

[general_tolerances]
# Not adopted (no drawing). For the record only: title_block.yaml:25-28 (.X/.XX/.XXX ±,
# angular) and :66 (drilled holes +0.10/0); parts/pivot-bracket.yaml:5 names
# tolerance_class machined_block = "+/-0.10" (tolerances.yaml:14). pivot_bracket_spec.py:43-56
# reasons about "printed bands" (.XX edges, .X stations) of a sheet that does not exist.
linear_1pl = "unknown"
linear_2pl = "unknown"
linear_3pl = "unknown"
angular_deg = "unknown"
drilled_hole = "unknown"

# ---------------------------------------------------------------- S1 features

[features.seat_face]
kind = "face"
frame = "model"                  # every coordinate in this manifest is model-frame; setups name the cutting frame
requirements = []                # the seat is the origin plane; no flatness/roughness is sourced
faces = "unknown"                # awaiting the M3 export face-set mapping (swStepExportFaceEdgeProps)

[features.seat_face.plane]
frame = "model"
axis = "y"
value = 0.0

[features.seat_face.cite]
plane = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:7"

[features.foot_profile]
kind = "pocket"
representation = "stock_minus_part"
frame = "model"
requirements = ["width", "length"]
width = "unknown"                # no band: no drawing
width_nominal = 16.0             # FOOT_W
length = "unknown"
length_nominal = 24.2            # FOOT_LEN = FOOT_Z1 - FOOT_Z0 = 21.2 - (-3)
faces = "unknown"                # awaiting the M3 export face-set mapping

[features.foot_profile.bounds]   # model frame; a rectangle boundary, no centre is claimed
x = [-8.0, 8.0]
y = [0.0, 6.0]
z = [-3.0, 21.2]

[features.foot_profile.precision]
width = "unknown"
length = "unknown"

[features.foot_profile.cite]
width = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:21"
length = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:25,29-30"
bounds = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:21-30", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:104-134"]

# ---------------------------------------------------------------- S2 features

[features.foot_top]
kind = "face"
frame = "model"
requirements = ["height"]
height = "unknown"
height_nominal = 6.0             # FOOT_H, seat to foot top
faces = "unknown"                # awaiting the M3 export face-set mapping

[features.foot_top.plane]
frame = "model"
axis = "y"
value = 6.0

[features.foot_top.bounds]       # the free run outside the ear band
x = [-8.0, 8.0]
z = [3.0, 21.2]

[features.foot_top.precision]
height = "unknown"

[features.foot_top.cite]
height = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:22"
bounds = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:21,57"

[features.ear_relief]
kind = "pocket"
representation = "stock_minus_part"
frame = "model"
requirements = ["thickness"]
thickness = "unknown"
thickness_nominal = 6.0          # EAR_T: the relief cuts the ear inner face at model Z = +3
faces = "unknown"                # awaiting the M3 export face-set mapping

[features.ear_relief.bounds]     # model frame; removed above the foot in the free run; y_max is the part envelope
y = [6.0, 32.2]
z = [3.0, 21.2]

[features.ear_relief.precision]
thickness = "unknown"

[features.ear_relief.cite]
thickness = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:24"
bounds = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:22,24,29,35,57"

[features.ear_sides]
kind = "pocket"
representation = "stock_minus_part"
frame = "model"
requirements = ["width"]
width = "unknown"
width_nominal = 14.0             # EAR_W
faces = "unknown"                # awaiting the M3 export face-set mapping

[features.ear_sides.bounds]      # model frame; the retained ear block
x = [-7.0, 7.0]
y = [6.0, 32.2]
z = [-3.0, 3.0]

[features.ear_sides.precision]
width = "unknown"

[features.ear_sides.cite]
width = "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:23"
bounds = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:22-24,35", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:136-166"]

[features.hold_down_a]
kind = "hole"
frame = "model"
at = [0.0, 6.0, 8.2]             # model; axis meets the foot top (entry face)
axis = [0.0, -1.0, 0.0]          # model; drilled from the foot top toward the seat
requirements = ["dia", "station", "thru"]
dia = "unknown"                  # #8 close clearance identity; no band (no drawing adopts +0.10/0)
dia_nominal = 4.572
hole_spec = "#8 clearance, close fit"
station = "unknown"
station_nominal = 8.2            # HOLE_Z[0], model Z
thru = true
through_thickness = 6.0          # FOOT_H material path, not the CAD cut overrun
faces = "unknown"                # awaiting the M3 export face-set mapping

[features.hold_down_a.precision]
dia = "unknown"
station = "unknown"

[features.hold_down_a.cite]
at = ["harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:22,43,96-102", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:215-238"]
