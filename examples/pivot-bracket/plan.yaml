part: pivot-bracket
spec_sha256: 5b568910623220f1baa30ec62146a7abaa9535071e5da310c5253200d3c97da7
policy: policy.yaml
quantity: 2
note: "Authored lot choice agrees with cad/config/parts/pivot-bracket.yaml:6. All RPM, paper compensation and blank allowances below are proposed process choices, not consumer specification dimensions or inventory measurements. This reference is blocked, not executable or attested."
stock:
  state: prepared_blank
  material_spec: Plain Carbon Steel
  section_mm: {w: 18, t: 26.2}
  length_mm: 34.2
  note: "Authored procurement/preparation choice: model X width 16+2=18, model Z length (21.2-(-3))+2=26.2, model Y height (25.2+14/2)+2=34.2. Nominal centred X stock edges +/-9 and Z stock edges -4,22.2 provide 1 mm each side/end. Nominal model Y stock extends -1..33.2: authored 1 mm seat-facing allowance plus 1 mm above the finished crown, totalling 2 mm; facing establishes the finished seat at model Y=0. Source dimensions: cad/scripts/pivot_bracket_spec.py:21-35. Allowances are authored. inventory/pedro-shop.yaml:165 lists no on-hand stock; this does not claim stock exists or that blank preparation was verified."
setups:
  - id: S1
    machine: PM-30MV
    frame: A
    workholding:
      kind: vise
      ref: vise-pm-6
      orientation: jaws_normal_to_x
      parallels: {ref: parallels-lms-6745, item: 1in}
      note: "Seat-up blank on listed 1 in parallels; grip the unmachined body across X. Nominal parallel height=1*25.4=25.4 mm; raw seat top=25.4+34.2=59.6 mm; remove authored 1 mm seat allowance to put finished seat at 58.6 mm above the vise bed. The 6 mm foot-profile bottom is then 58.6-6=52.6 mm, nominally 52.6-1.825*25.4=6.245 mm above the listed 46.355 mm jaw top. Nominal jaw engagement=46.355-25.4=20.955 mm. Vise and parallels inherit verify:true; confirm actual support, engagement and cutter clearance before cutting, not measured grip/collision proof. Finish only the foot boundary through FOOT_H=6 from the seat; leave upper stock for S2/S3. Indicate blank alignment and measure nominal stock positions."
    pickup:
      x: {feature: stock_left, side: -x, tool: edge-finder, tool_dia_mm: 5.08, sets: -9, note: "Authored centred 18 mm blank: edge X=-9; tool centre=-9-5.08/2=-11.54 mm. Tip diameter 0.2 in x25.4=5.08 from inventory:140 is verify:true, not measured."}
      y: {feature: stock_outer_end, side: -y, tool: edge-finder, tool_dia_mm: 5.08, sets: -4, note: "Authored blank model Z=-4 maps to A.y=-4; tool centre=-4-2.54=-6.54 mm. Reconfirm the prepared blank bounds before assigning the offsets."}
      z: {feature: frame_origin_face, side: +z, method: paper, paper_mm: 0.08, sets: 0, note: "Remove the authored 1 mm seat allowance from nominal raw model Y=-1, then establish the finished seat at model Y=0 as A.z=0. Proposed 0.08 mm paper compensation is separate from sets; do not add it to the zero. The first facing row is a datum-establishment operation, not a prespecified point on raw stock."}
    holders:
      - {ref: r8-collets-lms-4860, item: 3-8in}
    features: [seat_face, foot_profile]
    operations:
      - {op: 10, do: face, feature: seat_face, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, note: "Remove the authored 1 mm seat allowance; finished model Y=0 leaves nominal 33.2 mm stock height before the crown is profiled.", inspect: {method: visual_and_caliper, gauge: calipers, note: "Establish a clean seating face; no sourced flatness/roughness acceptance band."}}
      - {op: 20, do: rough_profile, feature: foot_profile, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, depth_mm: 6, note: "Nominal foot-height extent from A.z=0 to -FOOT_H=-6; shallow passes and finishing allowance are authored choices, not verified cutter reach.", inspect: {method: caliper, gauge: calipers, note: "Leave material for finishing; do not treat a rough cut as dimensional acceptance."}}
      - {op: 30, do: finish_profile, feature: foot_profile, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, depth_mm: 6, inspect: {method: caliper, gauge: calipers, note: "Record nominal foot width 16 and run 24.2 from spec; acceptance bands are absent."}}
  - id: S2
    machine: PM-30MV
    frame: B
    workholding:
      kind: vise
      ref: vise-pm-6
      orientation: jaws_normal_to_x
      riser: {ref: blocks-123-lms-2881, orientation: one_inch_height}
      parallels: {ref: parallels-lms-6745, item: 5-8in}
      note: "Seat-down, grip the finished foot across X. Proposed packing uses the listed 1-2-3 block at 1 in height plus 5/8 in parallels, supporting both foot edges and leaving the x=0 drilling line clear. Nominal stack=(1+5/8)*25.4=41.275 mm; listed jaw height 1.825*25.4=46.355 mm; foot top=41.275+6=47.275 gives nominal 0.920 mm above jaws and 5.080 mm jaw overlap. Block dimensions, parallels and vise all inherit verify:true. Confirm support quantity, actual jaw engagement and clamp/cutter clearance; these arithmetic values are not measured grip proof."
    pickup:
      x: {feature: foot_left, side: -x, tool: edge-finder, tool_dia_mm: 5.08, sets: -8, note: "Consumer FOOT_W/2=16/2=8; edge B.x=-8, tool centre=-10.54 mm for a verified 5.08 tip."}
      y: {feature: foot_free_end, side: -y, tool: edge-finder, tool_dia_mm: 5.08, sets: -21.2, note: "Model Z=FOOT_Z1=21.2 maps to B.y=-21.2; tool centre=-23.74 mm."}
      z: {feature: frame_origin_face, side: +z, method: paper, paper_mm: 0.08, sets: 0, note: "After rough relief, finish the shelf at FOOT_H=6 relative to the established seat, then touch the finished foot top at B.z=0. Until that face exists, use the seat datum to establish the 6 mm height; do not paper-touch raw ear stock and call it the foot top. Paper compensation is separate."}
    holders:
      - {ref: r8-collets-lms-4860, item: 3-8in}
      - {ref: drill-chuck-r8}
    features: [ear_relief, foot_top, ear_sides, hold_down_a, hold_down_b]
    operations:
      - {op: 10, do: rough_pocket, feature: ear_relief, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, note: "Remove free-run stock in shallow steps while retaining model Z=-3..+3 ear band. Work from the established seat until foot top exists.", inspect: {method: caliper, gauge: calipers, note: "Check remaining nominal foot height from the seat; measured acceptance tolerance is unavailable."}}
      - {op: 20, do: finish_pocket, feature: ear_relief, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, inspect: {method: caliper, gauge: calipers, note: "Record foot-height and ear-thickness nominal geometry; not a tolerance pass."}}
      - {op: 30, do: face, feature: foot_top, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, inspect: {method: caliper, gauge: calipers, note: "Seat to foot-top nominal FOOT_H=6; no flatness/roughness value sourced."}}
      - {op: 40, do: rough_profile, feature: ear_sides, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, note: "Reduce ear side strips and outer Z allowance while preserving the finished foot. Ear reach from crown to foot=32.2-6=26.2 mm; cutter flute/projection and jaw clearance are missing measurements.", inspect: {method: caliper, gauge: calipers, note: "Leave finish allowance, not a dimensional acceptance."}}
      - {op: 50, do: finish_profile, feature: ear_sides, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, inspect: {method: caliper, gauge: calipers, note: "Record EAR_W=14 and EAR_T=6 nominal; no profile/size tolerance sourced."}}
      - {op: 60, do: spot, feature: hold_down_a, tool: center-drills-lms-4859/2, holder: drill-chuck-r8, rpm: 700, inspect: {method: visual, note: "Confirm entry at B=(0,-8.2,0); centre drill geometry is unverified."}}
      - {op: 70, do: drill, feature: hold_down_a, tool: "drill-index-115/#15", holder: drill-chuck-r8, rpm: 900, end: through, inspect: {method: caliper, gauge: calipers, note: "Record nominal 4.572 mm hole; #15 standard nominal is 0.180 in=4.572 mm. Measured drill diameter, shank/point geometry and acceptance band are absent."}}
      - {op: 80, do: spot, feature: hold_down_b, tool: center-drills-lms-4859/2, holder: drill-chuck-r8, rpm: 700, inspect: {method: visual, note: "Confirm entry at B=(0,-16,0); centre drill geometry is unverified."}}
      - {op: 90, do: drill, feature: hold_down_b, tool: "drill-index-115/#15", holder: drill-chuck-r8, rpm: 900, end: through, inspect: {method: caliper, gauge: calipers, note: "Record nominal 4.572 mm hole and nominal 7.8 mm station separation; tolerance/gauge capability not supplied."}}
  - id: S3
    machine: PM-30MV
    frame: C
    workholding:
      kind: angle_plate
      ref: angle-plate
      clamps: {ref: clamping-kit-lms-1144}
      support: {ref: parallels-lms-6745, item: 1-2in}
      note: "REQUIRES AN ABSENT ANGLE PLATE. Seat model Y=0 against the vertical plate, inner ear model Z=+3 upward; plate normal is model Y, not the bore axis. Support ONLY the foot outer edge on listed 1/2 in parallels so the bore/arch has open exit below the ear; nominal support height 12.7 mm is unverified. Strap-clamp the free foot to the plate away from the ear, with studs outside the part; do NOT pass 3/8 in clamp-kit studs through 4.572 mm hold-down holes. Plate slots/mounts, clamp geometry and actual support arrangement are unknown. BS-0 dog driver/three-jaw is not a faceplate and no chuck adapter is invented. This setup uses no indexing."
    pickup:
      x: {feature: foot_left, side: -x, tool: edge-finder, tool_dia_mm: 5.08, sets: -8, note: "C.x=model X; finished left foot edge -FOOT_W/2=-8; nominal tool centre -10.54 mm."}
      y: {feature: foot_top, side: +y, tool: edge-finder, tool_dia_mm: 5.08, sets: 6, note: "Use the exposed free-foot top side model Y=FOOT_H=6, not the inaccessible seat against the plate. C.y=6; +y contact gives tool centre 6+2.54=8.54 mm, then compensate radius to set 6."}
      z: {feature: frame_origin_face, side: +z, method: paper, paper_mm: 0.08, sets: 0, note: "Touch the finished inner ear face model Z=EAR_T/2=3, which is C.z=3-3=0. The 0.08 mm paper is independently compensated; entry is 0 and the outer exit is -6."}
    holders:
      - {ref: r8-collets-lms-4860, item: 3-8in}
      - {ref: drill-chuck-r8}
    features: [ear_arch, cross_bore]
    operations:
      - {op: 10, do: rough_profile, feature: ear_arch, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, note: "Remove crown complement above the retained R7 upper semicircle in XY; contour extents come from the sidecar, not a single invented feature centre coordinate.", inspect: {method: visual_and_caliper, gauge: calipers, note: "Leave finish stock; toolpath/kernel access is outside M1/M1b proof."}}
      - {op: 20, do: finish_profile, feature: ear_arch, tool: endmills-lms-6784/3-8in-4fl, holder: r8-collets-lms-4860/3-8in, rpm: 900, depth_mm: 6, inspect: {method: caliper, gauge: calipers, note: "Record nominal crown envelope Y=25.2+7=32.2 and width 14; profile acceptance/gauge capability is not supplied."}}
      - {op: 30, do: spot, feature: cross_bore, tool: center-drills-lms-4859/2, holder: drill-chuck-r8, rpm: 700, inspect: {method: visual, note: "C entry (0,25.2,0); spindle -C.Z is model -Z, not model -Y."}}
      - {op: 40, do: drill, feature: cross_bore, tool: drill-index-115/1-4in, holder: drill-chuck-r8, rpm: 700, end: through, note: "Authored predrill choice 1/4 in=6.35 mm leaves 6.5-6.35=0.15 mm diametral stock (0.005905511811023622 in); no reaming allowance specification or measured drill geometry is claimed.", inspect: {method: caliper, gauge: calipers, note: "Confirm predrill location and open exit; do not treat the predrill as final nominal size."}}
      - {op: 50, do: ream, feature: cross_bore, tool: reamers-metric/6.5mm, holder: drill-chuck-r8, rpm: 250, end: through, inspect: {method: caliper, gauge: calipers, note: "Record nominal 6.5 only. Reamer is absent; diameter acceptance limits and suitable bore-gauge capability are absent. A caliper does not certify an unspecified reamed fit."}}
postprocess:
  finish: black oxide
  source: "cad/config/parts/pivot-bracket.yaml:4"
  note: "Required consumer coating retained, not invented roughness or hardness. Coating recipe/acceptance, dimensional effect and bore masking requirements are not specified and are outside these fourteen scoped declared-input checks. Obtain the consumer's coating requirements before production."
