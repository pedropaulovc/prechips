# pivot-bracket process plan — PLAN.md rev 6 §3.1. Three PM-30MV setups, carried from the
# rev-3 route: S1 seat up (seat + foot boundary), S2 foot top up (L relief, ear width,
# hold-down holes), S3 inner ear face up on an angle plate (arch + reamed cross-bore).
# Blank placement, holding and cutting choices belong to the plan author; the rev-3
# prepared blank is restored below. New process choices are marked explicitly.
# *_verify = true retains unmeasured inventory arithmetic. Nothing here is executable
# or attested: the shop lacks the S3 angle plate, R8 drill chuck and 6.5 mm reamer.

part = "pivot-bracket"
features = "features.toml"
construction = "one_piece"   # author's route: all bracket features cut from one prepared blank
quantity = 2
quantity_cite = "harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:6"

[drawing]
number = "MHA-123"
revision = "unknown"             # v39 bundle has no drawing sheet for this part; no certified revision to pair
cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:2", "harmonic-analyzer/cad/scripts/_drawing_registry.py (no pivot_bracket DrawingSpec)"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "Plain Carbon Steel"
material_cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:3", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:74"]
form = "prepared_blank"          # author's choice, restored from rev 3
section_mm = [18.0, 26.2]        # author's choice: model X width / model Z run, 1 mm each side
length_mm = 34.2                 # author's choice: model Y -1..33.2, seat/crown allowances
on_hand = false                  # inventory stock = [] (pedro-shop.toml:7): known none on hand; no procurement claimed
origin_mm = [9.0, -1.0, -4.0]    # author's choice: blank corner, model X 9..-9, Y -1..33.2, Z -4..22.2
axis = [0.0, 1.0, 0.0]           # 34.2 length along model Y
section_axis = [-1.0, 0.0, 0.0]  # 18 mm section along model -X; axis x section_axis = +Z (26.2 run)
as_is_faces = []                 # every finished face is cut

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs"
radius_mode = true

[dro.direction]                  # manual §6.2 Direction; set once in S1, same on every sheet
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames (author's choice), model coordinates, bound nominally by the
# zero recipes below.
[frames.TA]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "nominal"              # S1: Z0 is the faced seat (op 10)
note = "AUTHOR'S CHOICE: S1 seat up; model (X,Y,Z) -> (X, Z, -Y). Seat z = 0, foot top z = -6."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

[frames.TB]
origin = [0.0, 6.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"              # S2: X/Y picked up on the raw overhang, Z0 the faced foot top
note = "AUTHOR'S CHOICE: S2 foot top up; model -> (X, -Z, Y - 6). Foot top z = 0, seat z = -6."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

[frames.TC]
origin = [0.0, 0.0, -3.0]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"              # S3: Z0 the outer face faced by op 10
note = "AUTHOR'S CHOICE: S3 outer face up, seat against the angle-plate upright (frame y = 0 plane, plate on +y); model -> (X, -Y, -3 - Z). Outer face z = 0, ear inner face z = -6, foot free end z = -24.2."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

# ======================================================================= S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"                     # seat up; frame x/y/z = machine +X/+Y/+Z
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break R0.25 adopted
stock_in = "stock"

[setups.stock_state]             # frame A, surfaces as S1 receives them
top_z = 1.0                      # author's choice: raw seat at model Y = -1
bottom_z = -33.2                 # author's choice: raw crown-side face at model Y = 33.2

[setups.stock_state.local_thickness]   # S1 has no holes

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # rev 3: jaws normal to X, gripping the unmachined body across X
fixed_jaw = "left"               # author's choice: fixed jaw on -X, jaws run along Y
parallels = "parallels-lms-6745/1in"
stop = "blank outer end at A Y = -4 against end stop" # author's choice
grip_mm = 19.5453                # rev-3 derivation, measured jaw: jaw height 1.7695 in - 1 in parallels, x 25.4
grip_mm_verify = true            # vise and parallels are verify = true
jaw_above_parallels_mm = 19.5453
jaw_above_parallels_mm_verify = true
clamp = "hand plus quarter turn" # author's choice; verify actual grip before cutting
note = "Seat side up on 1 in parallels; centred X stock -9..9, model Z -4..22.2. Raw seat is A Z = 1, finished seat 0; finish only the foot boundary down to -6. Nominal jaw engagement 19.5453 and finished-seat height 58.6 above the bed give 7.6547 clearance from the cut bottom to jaw top; inventory dimensions remain verify-only. Leave stock below for S2/S3."

[setups.zero.x]
edge = "blank_left"
edge_mm = -9.0                   # author's choice: centred 18 mm blank
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice; jog without touching again

[setups.zero.y]
edge = "blank_outer_end"
edge_mm = -4.0                   # author's choice: raw model Z = -4
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice; not an inventory measurement
tool = "endmills-lms-6784/3-8in-4fl" # author's choice: first cutting tool
check_jog_mm = 10.0              # author's choice
retouch_after = [10]             # op 10 faces the seat to z = 0

[[setups.ops]]
op = 10
do = "face"
feature = "seat_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0                       # establishes the seat, frame A z = 0
direction = "conventional"       # author's choice for a hand-fed mill

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = -6.0                      # -FOOT_H
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: radial stock on the outline
contour = { method = "linear_table", step_mm = 1.0 } # author's choice: straight sides

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = -6.0
direction = "conventional"       # author's choice
contour = { method = "linear_table", step_mm = 1.0 } # author's choice

[setups.ops.checks]
width = "calipers"
length = "calipers"

# ======================================================================= S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "TB"                     # foot top up, seat down
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S1"

[setups.stock_state]             # frame B
top_z = 27.2                     # author's choice: remaining model Y = 33.2 minus FOOT_H
bottom_z = -6.0                  # finished seat (S1 op 10)

[setups.stock_state.local_thickness]
hold_down_a = 6.0                # FOOT_H at the station, entry on the foot top once op 30 faces it
hold_down_b = 6.0


[setups.stock_state.entry_z]     # author's choice: distinguish free run, ear band and holes
ear_relief = 27.2
foot_top = 27.2
ear_sides = 27.2
hold_down_a = 27.2               # free-run surface advances with relief and foot-top cuts
hold_down_b = 27.2
[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # grips the finished foot sides across X
fixed_jaw = "left"               # author's choice: fixed jaw on -X
parallels = "parallels-lms-6745/5-8in"
riser = "blocks-123-lms-2881"    # rev-3 authored packing: block on its 1 in face under the 5/8 parallels
support_orientation = "1 in height" # author's existing 1 in block orientation, made operative
grip_mm = 3.6703                 # rev-3 derivation, measured jaw: 1.7695 in jaw - (1 + 5/8) in stack, x 25.4
grip_mm_verify = true
jaw_above_parallels_mm = 3.6703
jaw_above_parallels_mm_verify = true
stop = "finished free end at B Y = -21.2 against end stop" # author's choice
clamp = "hand plus quarter turn" # author's choice
note = "Seat down; support both foot edges on the 1 in block plus 5/8 in parallels, keeping x = 0 drilling line clear. Nominal stack 41.275, jaw overlap 3.6703 and foot top 2.3297 above jaws remain verify-only arithmetic. Raw ear/free-run top is B Z = 27.2; relief rough/finish advances only the free run to 0.3/0, never the retained ear top."

[setups.zero.transfer]
from = "S1"
indicate = ["foot_profile"]

# Pickup option 2: touch the unfinished upper-stock overhang, not the foot.
# S1 profiles only model Y 0..6: remaining model X -9..9 / Z -4..22.2
# becomes B X -9..9 / Y -22.2..4 / Z 0..27.2. It masks the finished
# foot's 2.3297 mm exposed band; the stop also blocks its finished free end.
# Flat, accessible jaw/stop reference faces are not established by inventory.
# Touch the raw faces above the jaw/stop; verify their nominal blank placement
# before using these offsets. Finished foot/frame-B cut coordinates stay unchanged.
[setups.zero.x]
edge = "raw_overhang_left"
edge_mm = -9.0                   # unfinished centred blank, not finished foot X = -8
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "raw_overhang_free_end"
edge_mm = -22.2                  # unfinished model Z = 22.2 -> B y = -22.2
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "endmills-lms-6784/3-8in-4fl" # author's choice
check_jog_mm = 10.0              # author's choice
retouch_after = [30]             # author's choice: same end mill for 10–50; later tools touch finished foot top

[[setups.ops]]
op = 10
do = "rough_pocket"
feature = "ear_relief"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.3                       # author's choice: finished foot Z = 0 plus floor allowance
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: stock on floor and retained ear wall
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # author's existing raw blank placement and open free-run sweep, explicit rather than inferred from stock size

[[setups.ops]]
op = 20
do = "finish_pocket"
feature = "ear_relief"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0
direction = "conventional"       # author's choice
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # same raw blank sweep; retained ear wall at setup Y -3

[setups.ops.checks]
thickness = "calipers"

[[setups.ops]]
op = 30
do = "face"
feature = "foot_top"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0
direction = "conventional"       # author's choice

[setups.ops.checks]
height = "calipers"

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "ear_sides"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.3                       # author's choice: finished foot Z = 0 plus floor allowance
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0 } # author's choice

[[setups.ops]]
op = 50
do = "finish_profile"
feature = "ear_sides"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0                       # down to the foot top
direction = "conventional"       # author's choice
contour = { method = "linear_table", step_mm = 1.0 } # author's choice

[setups.ops.checks]
width = "calipers"

[[setups.ops]]
op = 60
do = "spot"
feature = "hold_down_a"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 2.0                   # author's choice: spot from the finished foot top

[[setups.ops]]
op = 70
do = "drill"
feature = "hold_down_a"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
exit_mm = 2.0                    # author's choice: full diameter beyond local exit face

[setups.ops.checks]
dia = "pin-gauges"               # #8 clearance go/no-go
station = "calipers"

[[setups.ops]]
op = 80
do = "spot"
feature = "hold_down_b"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 2.0                   # author's choice

[[setups.ops]]
op = 90
do = "drill"
feature = "hold_down_b"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "pin-gauges"               # #8 clearance go/no-go
station = "calipers"

# ======================================================================= S3
# Author's fix of the earlier inner-face-up S3: the outer face (#103, ear outer face and
# foot near end in one plane) faces away from every earlier setup and was never cut.
# With the outer face up, one angle-plate setup faces it, profiles the arch and drills/
# reams the cross bore from the same side.
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TC"                     # outer face up; seat against the angle-plate upright on +y
coolant = "cutting-oil"          # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S2"

[setups.stock_state]             # frame TC
top_feature = "outer_face"
top_z = 1.0                      # author's choice: raw outer face at model Z = -4
bottom_z = -24.2                 # foot free end, model Z = 21.2

[setups.stock_state.local_thickness]
cross_bore = 6.0                 # ear thickness after op 10

[setups.stock_state.entry_z]
cross_bore = 0.0                 # faced outer face
ear_arch = 0.0

[setups.hold]
fixture = "angle-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # author's choice: plate frame = TC
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
supports = "not_applicable"      # the plate itself locates the seat
clamp = "clamping-kit-lms-1144"
grip_mm = "not_applicable"       # strap contact, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "finished left foot edge at TC X = -8 against a plate stop" # author's choice
note = "Seat (model Y = 0) against the angle-plate upright, outer face up and 2 mm proud of the plate top; strap the free foot top toward the plate, studs outside the part, never through the 4.572 hold-down holes."

[setups.zero.transfer]
from = "S2"
indicate = ["foot_profile", "foot_top"]
tool = "dti"

[setups.zero.x]
edge = "foot_left"
edge_mm = -8.0
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "seat_against_plate"
edge_mm = 0.0                    # the seat plane is the plate face
from = "+y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0              # author's choice
retouch_after = [10, 20]         # op 10 faces the outer face to z = 0; op 30 changes tool

[[setups.ops]]
op = 10
do = "face"
feature = "outer_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = 0.0                       # outer face, model Z = -3
direction = "conventional"       # author's choice

[[setups.ops]]
op = 15
do = "rough_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = -5.7                      # author's choice: ear inner face -6 plus floor allowance
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: radial crown stock
contour = { method = "arc_table", step_deg = 10.0 } # author's choice: upper semicircle

[[setups.ops]]
op = 20
do = "finish_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = -6.0                      # ear inner face
direction = "conventional"       # author's choice
contour = { method = "arc_table", step_deg = 10.0 } # author's choice

[setups.ops.checks]
radius = "unknown"               # no radius gauge in the inventory; reported, not assumed

[[setups.ops]]
op = 30
do = "spot"
feature = "cross_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
depth_mm = 2.0                   # author's choice: spot from the faced outer face

[[setups.ops]]
op = 40
do = "drill"
feature = "cross_bore"
tool = "drill-index-115/1-4in"   # predrill 6.35 leaves 0.15 diametral for the reamer
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[[setups.ops]]
op = 50
do = "ream"
feature = "cross_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "pin-gauges"               # 6.50 go / 6.53 no-go
height = "calipers"              # seat to lower bore edge plus half the gauged diameter
