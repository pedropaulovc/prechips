# pivot-bracket process plan — PLAN.md rev 6 §3.1. Three PM-30MV setups, carried from the
# rev-3 route: S1 seat up (seat + foot boundary), S2 foot top up (L relief, ear width,
# hold-down holes), S3 inner ear face up on an angle plate (arch + reamed cross-bore).
# Rev-3 authored blank allowances, paper thickness, pass allowances and RPMs had no consumer
# or inventory source and are now "unknown"; derived numbers retained from rev 3 carry
# *_verify = true. Nothing here is executable or attested: the shop lacks the S3 angle
# plate, an R8 drill chuck and a 6.5 mm reamer.

part = "pivot-bracket"
features = "features.toml"
quantity = 2
quantity_cite = "harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:6"

[drawing]
number = "MHA-123"
revision = "unknown"             # no drawing exists, so there is no certified revision to pair
cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:2", "harmonic-analyzer/cad/scripts/_drawing_registry.py (no pivot_bracket DrawingSpec)"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "Plain Carbon Steel"
material_cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:3", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:74"]
form = "unknown"                 # rev 3 authored an 18 x 26.2 x 34.2 prepared blank (1 mm allowances); unsourced
section_mm = "unknown"
length_mm = "unknown"
on_hand = false                  # inventory stock = [] (pedro-shop.toml:7): known none on hand; no procurement claimed

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs"
radius_mode = true

[dro.direction]                  # manual §6.2 Direction; set once in S1, same on every sheet
x = "right"
y = "away"
z = "up"

# ======================================================================= S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "A"                      # seat up; frame x/y/z = machine +X/+Y/+Z
coolant = "unknown"
deburr_mm = "unknown"            # no drawing adopts the title-block edge break
stock_in = "blank"

[setups.stock_state]             # frame A, surfaces as S1 receives them
top_z = "unknown"                # raw seat-side face: seat allowance is not sourced
bottom_z = "unknown"             # raw blank face beyond the crown: blank height is not sourced

[setups.stock_state.local_thickness]   # S1 has no holes

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # rev 3: jaws normal to X, gripping the unmachined body across X
fixed_jaw = "unknown"
parallels = "parallels-lms-6745/1in"
stop = "unknown"
grip_mm = 20.955                 # rev-3 derived: jaw height 1.825 in - 1 in parallels, x 25.4
grip_mm_verify = true            # vise and parallels are verify = true
jaw_above_parallels_mm = 20.955
jaw_above_parallels_mm_verify = true
clamp = "unknown"
note = "Seat side up on the 1 in parallels; finish only the foot boundary through FOOT_H = 6 from the seat, leave the stock below for S2/S3. Clearance from the cut bottom (A z = -6) to the jaw top depends on the unsourced blank height."

[setups.zero.x]
edge = "blank_left"
edge_mm = "unknown"              # blank size and placement are not sourced
from = "-x"
tool = "edge-finder"
check_jog_mm = "unknown"

[setups.zero.y]
edge = "blank_outer_end"
edge_mm = "unknown"
from = "-y"
tool = "edge-finder"
check_jog_mm = "unknown"

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = "unknown"             # rev 3 proposed 0.08; no source
tool = "unknown"
check_jog_mm = "unknown"
retouch_after = [10]             # op 10 faces the seat to z = 0

[[setups.ops]]
op = 10
do = "face"
feature = "seat_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0                       # establishes the seat, frame A z = 0
direction = "unknown"

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.0                      # -FOOT_H
direction = "unknown"
rough_allowance_mm = "unknown"
contour = "unknown"

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.0
direction = "unknown"
contour = "unknown"

[setups.ops.checks]
width = "calipers"
length = "calipers"

# ======================================================================= S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "B"                      # foot top up, seat down
coolant = "unknown"
deburr_mm = "unknown"
stock_in = "S1"

[setups.stock_state]             # frame B
top_z = "unknown"                # raw stock over the free run and the ear band (blank height unsourced)
bottom_z = -6.0                  # finished seat (S1 op 10)

[setups.stock_state.local_thickness]
hold_down_a = 6.0                # FOOT_H at the station, entry on the foot top once op 30 faces it
hold_down_b = 6.0

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # grips the finished foot sides across X
fixed_jaw = "unknown"
parallels = "parallels-lms-6745/5-8in"
riser = "blocks-123-lms-2881"    # rev-3 authored packing: block on its 1 in face under the 5/8 parallels
grip_mm = 5.08                   # rev-3 derived: 1.825 in jaw - (1 + 5/8) in stack, x 25.4
grip_mm_verify = true
jaw_above_parallels_mm = 5.08
jaw_above_parallels_mm_verify = true
stop = "unknown"
clamp = "unknown"
note = "Seat down; support both foot edges and keep the x = 0 drilling line clear. Nominal foot top 0.92 above the jaws (verify-only arithmetic)."

[setups.zero.transfer]
from = "S1"
indicate = ["foot_profile"]

[setups.zero.x]
edge = "foot_left"
edge_mm = -8.0                   # -FOOT_W / 2
from = "-x"
tool = "edge-finder"
check_jog_mm = "unknown"

[setups.zero.y]
edge = "foot_free_end"
edge_mm = -21.2                  # model Z = FOOT_Z1 -> B y = -21.2
from = "-y"
tool = "edge-finder"
check_jog_mm = "unknown"

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = "unknown"
tool = "unknown"
check_jog_mm = "unknown"
retouch_after = [30]             # op 30 faces the foot top to z = 0; holes are touched off it

[[setups.ops]]
op = 10
do = "rough_pocket"
feature = "ear_relief"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = "unknown"                 # rough floor allowance not sourced
direction = "unknown"
rough_allowance_mm = "unknown"

[[setups.ops]]
op = 20
do = "finish_pocket"
feature = "ear_relief"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0
direction = "unknown"

[setups.ops.checks]
thickness = "calipers"

[[setups.ops]]
op = 30
do = "face"
feature = "foot_top"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0
direction = "unknown"

[setups.ops.checks]
height = "calipers"

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "ear_sides"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = "unknown"
direction = "unknown"
rough_allowance_mm = "unknown"
contour = "unknown"

[[setups.ops]]
op = 50
do = "finish_profile"
feature = "ear_sides"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0                       # down to the foot top
direction = "unknown"
contour = "unknown"

[setups.ops.checks]
width = "calipers"

[[setups.ops]]
op = 60
do = "spot"
feature = "hold_down_a"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = "unknown"

[[setups.ops]]
op = 70
do = "drill"
feature = "hold_down_a"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
exit_mm = "unknown"

[setups.ops.checks]
dia = "calipers"
station = "calipers"

[[setups.ops]]
op = 80
do = "spot"
feature = "hold_down_b"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = "unknown"

[[setups.ops]]
op = 90
do = "drill"
feature = "hold_down_b"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
exit_mm = "unknown"

[setups.ops.checks]
dia = "calipers"
station = "calipers"

# ======================================================================= S3
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "C"                      # inner ear face up; seat against the angle plate on the -y side
coolant = "unknown"
deburr_mm = "unknown"
stock_in = "S2"

[setups.stock_state]             # frame C
top_z = 18.2                     # foot free end, model Z = FOOT_Z1 = 21.2 -> C z = 18.2
bottom_z = -6.0                  # ear outer face / foot outer end, model Z = -3

[setups.stock_state.local_thickness]
cross_bore = 6.0                 # EAR_T

[setups.stock_state.entry_z]
cross_bore = 0.0                 # ear inner face, not the stock top (the foot stands above it)

[setups.hold]
fixture = "angle-plate"          # NOT IN THE SHOP
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "parallels-lms-6745/1-2in"
clamp = "clamping-kit-lms-1144"
grip_mm = "unknown"
jaw_above_parallels_mm = "not_applicable"
stop = "unknown"
note = "Seat (model Y = 0) against the vertical plate, inner ear face up. Support only the foot outer end on the 1/2 in parallels so the bore and arch exit below the ear is open. Strap the free foot to the plate away from the ear with studs outside the part: the kit's 3/8-16 studs do not pass the 4.572 hold-down holes. Plate slots, mounting and clamp layout are unknown."

[setups.zero.transfer]
from = "S2"
indicate = ["foot_profile", "foot_top", "ear_relief"]

[setups.zero.x]
edge = "foot_left"
edge_mm = -8.0
from = "-x"
tool = "edge-finder"
check_jog_mm = "unknown"

[setups.zero.y]
edge = "foot_top"
edge_mm = 6.0                    # exposed free-run foot top, model Y = FOOT_H; the seat is against the plate
from = "+y"
tool = "edge-finder"
check_jog_mm = "unknown"

[setups.zero.z]
face = "ear_inner"
method = "paper"
paper_mm = "unknown"
tool = "unknown"
check_jog_mm = "unknown"
retouch_after = []               # no op changes the ear inner face

[[setups.ops]]
op = 10
do = "rough_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = "unknown"
direction = "unknown"
rough_allowance_mm = "unknown"
contour = "unknown"

[[setups.ops]]
op = 20
do = "finish_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.0                      # ear outer face; any overrun is not authored
direction = "unknown"
contour = "unknown"

[setups.ops.checks]
radius = "unknown"               # no radius gauge named

[[setups.ops]]
op = 30
do = "spot"
feature = "cross_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = "unknown"

[[setups.ops]]
op = 40
do = "drill"
feature = "cross_bore"
tool = "drill-index-115/1-4in"   # rev-3 predrill choice: 6.35 leaves 0.15 diametral for the reamer
holder = "drill-chuck-r8"
exit_mm = "unknown"

[[setups.ops]]
op = 50
do = "ream"
feature = "cross_bore"
tool = "reamers-metric/6.5mm"    # NOT IN THE SHOP
holder = "drill-chuck-r8"
exit_mm = "unknown"

[setups.ops.checks]
dia = "unknown"                  # a caliper does not certify an unspecified reamed fit; no bore gauge named
height = "unknown"               # no height gauge in the shop
