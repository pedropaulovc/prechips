# Illustrative pivot-bracket process plan. No dimensioned v39 drawing exists; the
# adjacent hand-authored manifest's bands are plausible example design intent.
# Three PM-30MV setups: S1 seat up (seat + foot boundary), S2 foot top up
# (L relief, ear width, hold-down holes), S3 outer ear face up on an angle plate
# (outer face, arch + reamed cross-bore). All sheets remain PLANNED, not executable
# machining instructions or a first-article attestation.

part = "pivot-bracket"
features = "features.toml"
construction = "one_piece"   # author's route: all bracket features cut from one prepared blank
quantity = 2
quantity_cite = "harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:6"

[drawing]
number = "MHA-123"
revision = "example-v39"          # local illustrative contract on v39 STEP, not a certified drawing revision
cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:2", "harmonic-analyzer/cad/scripts/_drawing_registry.py (no pivot_bracket DrawingSpec)", "example (plausible, no dimensioned drawing): hand-authored contract on v39 STEP"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "Plain Carbon Steel"
material_cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:3", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:74"]
form = "prepared_blank"          # author's choice, restored from rev 3
section_mm = [18.0, 26.2]        # author's choice: model X width / model Z run, 1 mm each side
length_mm = 34.2                 # author's choice: model Y -1..33.2, seat/crown allowances
on_hand = false                  # inventory stock = [] (pedro-shop.toml:7): known none on hand; no procurement claimed
origin_mm = [9.0, -1.0, -4.0]    # author's choice: blank corner, model X 9..-9, Y -1..33.2, Z -4..22.2
axis = [0.0, 1.0, 0.0]           # 34.2 length along model Y
section_axis = [-1.0, 0.0, 0.0]  # 18 mm section along model -X; axis x section_axis = +Z (26.2 run)
as_is_faces = []                 # every finished face is cut

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs"
radius_mode = true

[dro.direction]                  # manual §6.2 Direction; set once in S1, same on every sheet
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames (author's choice), model coordinates, bound nominally by the
# zero recipes below.
[frames.TA]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "nominal"              # S1: Z0 is the faced seat (op 10)
note = "AUTHOR'S CHOICE: S1 seat up. In this Setup, the faced seat is Z0 and the foot top is Z -6."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

[frames.TB]
origin = [0.0, 6.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"              # S2: X/Y picked up on the raw overhang, Z0 the faced foot top
note = "AUTHOR'S CHOICE: S2 foot top up. In this Setup, the faced foot top is Z0 and the finished seat is Z -6."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

[frames.TC]
origin = [0.0, 0.0, -3.0]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"              # S3: Z0 the outer face faced by op 10
note = "AUTHOR'S CHOICE: S3 outer face up, finished seat against the angle-plate upright at Y0, plate behind the part on +Y. In this Setup, the faced outer face is Z0, ear inner face Z -6 and foot free end Z -24.2."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

# ======================================================================= S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"                     # seat up; frame x/y/z = machine +X/+Y/+Z
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break R0.25 adopted
stock_in = "stock"

[setups.stock_state]             # frame A, surfaces as S1 receives them
top_z = 1.0                      # author's choice: raw seat at model Y = -1
bottom_z = -33.2                 # author's choice: raw crown-side face at model Y = 33.2

[setups.stock_state.local_thickness]   # S1 has no holes

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # rev 3: jaws normal to X, gripping the unmachined body across X
fixed_jaw = "left"               # author's choice: fixed jaw on -X, jaws run along Y
parallels = "parallels-lms-6745/1in"
jaw_center_along_mm = 9.1         # author's choice: centre the 26.2 mm raw blank run in the jaws
stop = "No end stop: clamp the blank centrally over the parallels, then edge-find its left face and outer end for this Setup's X/Y zeros." # author's choice
grip_mm = 19.5453                # rev-3 derivation, measured jaw: jaw height 1.7695 in - 1 in parallels, x 25.4
jaw_above_parallels_mm = 19.5453
clamp = "hand plus quarter turn" # author's choice; verify actual grip before cutting
parallels_along = "y"
parallels_centres_mm = [[-6.5, 9.1], [6.5, 9.1]] # author's choice: under the blank edges
note = "Seat side up on 1 in parallels; blank X -9..9 and Y -4..22.2 in this Setup. Raw seat is Z +1, finished seat Z0. Finish the foot boundary only down to Z -6, leaving the ear-side stock below for S2/S3. Jaw engagement is 19.5453 mm; the foot-profile cut bottom is 7.6547 mm above the jaws."

[setups.zero.x]
edge = "blank_left"
edge_mm = -9.0                   # author's choice: centred 18 mm blank
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice; jog without touching again

[setups.zero.y]
edge = "blank_outer_end"
edge_mm = -4.0                   # author's choice: raw model Z = -4
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice; not an inventory measurement
tool = "endmills-lms-6784/3-8in-4fl" # author's choice: first cutting tool
check_jog_mm = 10.0              # author's choice
retouch_after = [10]             # op 10 faces the seat to z = 0

[[setups.ops]]
op = 10
do = "face"
feature = "seat_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0                       # establishes the seat, frame A z = 0
direction = "conventional"       # author's choice for a hand-fed mill
stock_removal_bounds = { x = [-9.0, 9.0], y = [-4.0, 22.2], z = [0.0, 1.0] } # AUTHOR'S CHOICE: face full raw top
note = "Face the complete raw top, X -9..9 and Y -4..22.2, from Z +1 to Z0 before profiling the foot. Do not leave the raw overhang rails at the future finished-face boundary."

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = -6.0                      # -FOOT_H
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: radial stock on the outline
contour = { method = "linear_table", step_mm = 1.0 } # author's choice: straight sides
# Clear only the top six millimetres around the foot. Preserve the stock below
# A Z = -6 for the upright ear and the subsequent opposite-side setup.
stock_removal_bounds = { x = [-9.0, 9.0], y = [-4.0, 22.2], z = [-6.0, 1.0] }

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = -6.0
direction = "conventional"       # author's choice
contour = { method = "linear_table", step_mm = 1.0 } # author's choice
stock_removal_bounds = { x = [-9.0, 9.0], y = [-4.0, 22.2], z = [-6.0, 1.0] }

[setups.ops.checks]
width = "calipers"
length = "calipers"

# ======================================================================= S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "TB"                     # foot top up, seat down
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S1"

[setups.stock_state]             # frame B
top_z = 27.2                     # author's choice: remaining model Y = 33.2 minus FOOT_H
bottom_z = -6.0                  # finished seat (S1 op 10)

[setups.stock_state.local_thickness]
hold_down_a = 6.0                # FOOT_H at the station, entry on the foot top once op 30 faces it
hold_down_b = 6.0


[setups.stock_state.entry_z]     # author's choice: distinguish free run, ear band and holes
ear_relief = 27.2
foot_top = 27.2
ear_sides = 27.2
hold_down_a = 27.2               # free-run surface advances with relief and foot-top cuts
hold_down_b = 27.2
[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # grips the finished foot sides across X
jaw_center_along_mm = -9.1        # author's choice: centre the 24.2 mm finished foot run
fixed_jaw = "left"               # author's choice: fixed jaw on -X
parallels = "bracket-high-parallels/1-5-8in" # tall narrow pair fits between the closed jaws
grip_mm = 3.6703                 # jaw height 1.7695 in minus 1-5/8 in parallels, x 25.4
jaw_above_parallels_mm = 3.6703
stop = "No end stop: seat the finished foot on the parallels and against the fixed jaw, clamp, then edge-find the raw upper overhang for this Setup's X/Y zeros." # author's choice
clamp = "hand plus quarter turn" # author's choice
parallels_along = "y"
parallels_centres_mm = [[-6.25, -9.1], [6.25, -9.1]]
note = "Seat down on one pair of 1-5/8 in tall, 1/8 in thick ground parallels, keeping the X0 drilling line clear. Do not use 1-2-3 blocks between the jaws closed on this 16 mm foot. Stack 41.275 mm, jaw engagement 3.6703 mm and foot top 2.3297 mm above jaws. Take shallow axial passes through the open free run. Rough the retained inner wall and separate left/right side strips, then finish all walls while leaving the same Z +0.1 floor skin. Only after both side strips are open, skim the whole foot-top floor and its narrow side ledges to Z0 in op 56; then spot and drill. Retain a straight rectangular crown for S3, not an arch sculpted from above. The 31.75 mm flute end mill reaches the 26.2 mm inner wall."

[setups.zero.transfer]
from = "S1"
indicate = ["foot_profile"]
tool = "dti"
runout_limit_mm = 0.0254          # author's choice: max 0.001 in TIR, two 0.0005 in DTI divisions; not a measured alignment

# Pickup option 2: touch the unfinished upper-stock overhang, not the foot.
# S1 profiles only model Y 0..6: remaining model X -9..9 / Z -4..22.2
# becomes B X -9..9 / Y -22.2..4 / Z 0..27.2. It masks the finished
# foot's 2.3297 mm exposed band. No end stop is used; each blank is edge-found.
# Flat jaw reference faces are not established by inventory.
# Touch the raw faces above the jaws; verify their nominal blank placement
# before using these offsets. Finished foot/frame-B cut coordinates stay unchanged.
[setups.zero.x]
edge = "raw_overhang_left"
edge_mm = -9.0                   # unfinished centred blank, not finished foot X = -8
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "raw_overhang_free_end"
edge_mm = -22.2                  # unfinished model Z = 22.2 -> B y = -22.2
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "bracket-long-endmill"     # 31.75 mm flutes reach the 26.2 mm inner wall
check_jog_mm = 10.0              # author's choice
retouch_after = [56]             # author's choice: same end mill for 10–56; later tools touch the finished whole foot top

[[setups.ops]]
op = 10
do = "rough_pocket"
feature = "ear_relief"
faces = ["#96/ADVANCED_FACE[7]/NONE"] # retained inner wall only; floor skin remains, whole floor is claimed at 56
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.3                       # author's choice: finished foot Z = 0 plus floor allowance
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: stock on floor and retained ear wall
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # author's existing raw blank placement and open free-run sweep, explicit rather than inferred from stock size
stock_removal_bounds = { x = [-9.0, 9.0], y = [-22.2, -3.0], z = [0.0, 27.2] } # TB: clear the whole open run, including raw overhang

[[setups.ops]]
op = 20
do = "finish_pocket"
feature = "ear_relief"
faces = ["#96/ADVANCED_FACE[7]/NONE"] # finish the retained inner wall, not the uncleared side ledges
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.1                       # leave the same floor spring skin as the side-wall finish; op 56 removes it
direction = "conventional"       # author's choice
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # same raw blank sweep; retained ear wall at setup Y -3
stock_removal_bounds = { x = [-9.0, 9.0], y = [-22.2, -3.0], z = [0.0, 27.2] }

[[setups.ops]]
op = 40
do = "rough_pocket"
feature = "ear_sides"
faces = ["#41/ADVANCED_FACE[4]/NONE"] # left ear wall only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.3                       # author's choice: finished foot Z = 0 plus floor allowance
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, -7.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "-x" } # outside-in left-strip rasters, not a closed ear outline
stock_removal_bounds = { x = [-9.0, -7.0], y = [-3.0, 4.0], z = [0.0, 27.2] } # left strip only; retain the rectangular crown
note = "Left ear side only, X -7 in this Setup; clear the narrow X -9..-7 strip. Preserve the straight rectangular crown for S3; do not repeat the right-side coordinates in this cut."

[[setups.ops]]
op = 45
do = "rough_pocket"
feature = "ear_sides"
faces = ["#451/ADVANCED_FACE[14]/NONE"] # right ear wall only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 0.3                       # finished foot Z = 0 plus floor allowance
direction = "conventional"
rough_allowance_mm = 0.3         # radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [7.0, 9.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "+x" } # outside-in right-strip rasters
stock_removal_bounds = { x = [7.0, 9.0], y = [-3.0, 4.0], z = [0.0, 27.2] } # right strip only; no full-X crown clearance
note = "Right ear side only, X +7 in this Setup; clear the narrow X +7..+9 strip. Preserve the straight rectangular crown for S3; do not repeat the left-side coordinates in this cut."

[[setups.ops]]
op = 50
do = "finish_pocket"
feature = "ear_sides"
faces = ["#41/ADVANCED_FACE[4]/NONE"]
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.1                       # finish the wall while keeping the common floor spring skin
direction = "conventional"       # author's choice
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, -7.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "-x" } # finish only the open left strip
stock_removal_bounds = { x = [-9.0, -7.0], y = [-3.0, 4.0], z = [0.0, 27.2] }
note = "Finish the left ear wall only, X -7 in this Setup; clear the narrow X -9..-7 strip down to Z +0.1. Keep the floor spring skin until op 56 skims the whole foot top and both now-open side ledges. Preserve the straight rectangular crown for S3; do not repeat the right-side coordinates."

[[setups.ops]]
op = 55
do = "finish_pocket"
feature = "ear_sides"
faces = ["#451/ADVANCED_FACE[14]/NONE"]
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 0.1                       # finish the wall while keeping the common floor spring skin
direction = "conventional"
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [7.0, 9.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "+x" } # finish only the open right strip
stock_removal_bounds = { x = [7.0, 9.0], y = [-3.0, 4.0], z = [0.0, 27.2] }
note = "Finish the right ear wall only, X +7 in this Setup; clear the narrow X +7..+9 strip down to Z +0.1. Keep the floor spring skin until op 56 skims the whole foot top and both now-open side ledges. Preserve the straight rectangular crown for S3; do not repeat the left-side coordinates. Check ear width after both walls are finished."

[setups.ops.checks]
width = "calipers"

[[setups.ops]]
op = 56
do = "face"
feature = "foot_top"
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0
direction = "conventional"       # author's choice
stock_removal_bounds = { x = [-9.0, 9.0], y = [-22.2, 4.0], z = [0.0, 0.3] } # final whole-floor spring pass, after both ear-side strips are open
note = "Skim the free-run floor and both narrow side ledges to Z0 only after the inner and side walls are finished. The preceding wall passes leave a common 0.1 mm floor skin; this is the first operation claiming the whole foot-top floor."

[setups.ops.checks]
height = "calipers"

[[setups.ops]]
op = 60
do = "spot"
feature = "hold_down_a"
tool = "bracket-spot-drill"       # long 120-degree spotter keeps the chuck above the ear
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 0.6                   # 2.08 mm spot diameter, smaller than the following #15 drill

[[setups.ops]]
op = 70
do = "drill"
feature = "hold_down_a"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
exit_mm = 2.0                    # author's choice: full diameter beyond local exit face

[setups.ops.checks]
dia = "pin-gauges"               # #8 clearance go/no-go
station = "calipers"

[[setups.ops]]
op = 80
do = "spot"
feature = "hold_down_b"
tool = "bracket-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 0.6

[[setups.ops]]
op = 90
do = "drill"
feature = "hold_down_b"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "pin-gauges"               # #8 clearance go/no-go
station = "calipers"

# ======================================================================= S3
# Author's fix of the earlier inner-face-up S3: the outer face (#103, ear outer face and
# foot near end in one plane) faces away from every earlier setup and was never cut.
# With the outer face up, one angle-plate setup faces it, profiles the arch and drills/
# reams the cross bore from the same side.
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TC"                     # outer face up; seat against the angle-plate upright on +y
coolant = "cutting-oil"          # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S2"

[setups.stock_state]             # frame TC
top_feature = "outer_face"
top_z = 1.0                      # author's choice: raw outer face at model Z = -4
bottom_z = -24.2                 # foot free end, model Z = 21.2

[setups.stock_state.local_thickness]
cross_bore = 6.0                 # ear thickness after op 10

[setups.stock_state.entry_z]
cross_bore = 0.0                 # faced outer face
ear_arch = 0.0

[setups.hold]
fixture = "angle-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # author's choice: plate frame = TC
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
supports = "not_applicable"      # the plate assembly includes the load-bearing foot-end ledge
clamps = [
  { ref = "clamping-kit-lms-1144/bracket-bridge", pose = { origin_mm = [0.0, -6.0, -16.0], x = [1.0, 0.0, 0.0], z = [0.0, -1.0, 0.0] }, note = "bridge underside on the finished foot top; force +Y toward the seat/angle plate, two studs at Setup X +/-20 through the upright, rear nuts behind it; bar maximum Setup Z -9.65" },
]
method = "strap_clamps"
clamp = "shop-made two-stud bridge tightened on the free foot, reacting through rear washers and nuts against the angle plate"
grip_mm = "not_applicable"       # bridge contact, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "Rest the foot free end on the bolted plate ledge at Setup Z -24.2; align the finished left foot edge at Setup X -8 before clamping."
note = "Seat the finished seat face against the angle-plate upright, outer face up and 2 mm proud of the plate top. Coordinates below are relative to this Setup's zero. Rest the foot free end on the bolted ledge at Z -24.2 to take the downward facing/drilling load. The bridge underside bears on the finished foot top at Y -6, centred at Z -16, and presses the foot toward the plate (+Y); two studs at X +/-20 pass through the upright, with rear washers touching the plate back and rear nuts behind it. Indicate the exposed 2 mm seat lip with a small-ball DTI above the plate, then tighten and recheck. Establish a preliminary paper-Z reference with the stationary edge-finder on the raw outer face (Z +1) before the side pickups. Pick up the left foot face at Y -3, Z -4, above the bridge; pick up the common plate front from -Y at X +45, Z -5, clear of the bridge hardware. Retract above Z +5 before traversing between pickups, then paper-zero the cutting tool as specified. The bridge bar reaches maximum Z -9.65; studs, washers and nuts stay outside the foot width, clear of the foot-end ledge/base, arch and cross-bore."

[setups.zero.transfer]
from = "S2"
indicate = ["foot_profile", "foot_top", "seat_face"] # transfer the actual height datum, not only its adjacent faces
tool = "dti"
runout_limit_mm = 0.0254          # author's choice: max 0.001 in TIR, two 0.0005 in DTI divisions; not a measured alignment

[setups.zero.x]
edge = "foot_left"
edge_mm = -8.0
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "plate_front_beside_part"  # exposed plate face at TC X = 45, Z = -5, clear of the bridge hardware
edge_mm = 0.0                    # plate face and seated datum A share Y0
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0              # author's choice
retouch_after = [10, 20]         # op 10 faces the outer face to z = 0; op 30 changes tool

[[setups.ops]]
op = 10
do = "face"
feature = "outer_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = 0.0                       # outer face, model Z = -3
direction = "conventional"       # author's choice
stock_removal_bounds = { x = [-8.0, 8.0], y = [-33.2, 0.0], z = [0.0, 1.0] } # AUTHOR'S CHOICE: face full raw top
note = "Face the complete top of the actual S3 entry stock, X -8..8 and Y -33.2..0, from Z +1 to Z0 before profiling the arch. Include the retained rectangular crown, not merely the finished outer-face outline."

[[setups.ops]]
op = 11
do = "inspect"
feature = "ear_relief"
note = "Check 6 mm ear thickness only after both faces are finished; it was still 7 mm in S2."

[setups.ops.checks]
thickness = "calipers"

[[setups.ops]]
op = 15
do = "rough_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = -5.7                      # author's choice: ear inner face -6 plus floor allowance
direction = "conventional"       # author's choice
rough_allowance_mm = 0.3         # author's choice: radial crown stock
contour = { method = "arc_table", step_deg = 10.0 } # author's choice: upper semicircle
stock_removal_bounds = { x = [-7.0, 7.0], y = [-33.2, -25.2], z = [-6.0, 1.0] } # TC: remove crown stock from the rectangular ear retained in S2

[[setups.ops]]
op = 20
do = "finish_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = -6.0                      # ear inner face
direction = "conventional"       # author's choice
contour = { method = "arc_table", step_deg = 10.0 } # author's choice
stock_removal_bounds = { x = [-7.0, 7.0], y = [-33.2, -25.2], z = [-6.0, 1.0] }

[setups.ops.checks]
radius = "radius-gauge"

[[setups.ops]]
op = 30
do = "spot"
feature = "cross_bore"
tool = "bracket-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
depth_mm = 0.6                   # 2.08 mm spot diameter, below the 1/4 in predrill diameter

[[setups.ops]]
op = 40
do = "drill"
feature = "cross_bore"
tool = "drill-index-115/1-4in"   # predrill 6.35 leaves 0.15 diametral for the reamer
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[[setups.ops]]
op = 50
do = "ream"
feature = "cross_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "bracket-cross-bore-pins"   # metric 6.500 go / 6.530 no-go, not inch-step pins
height = "height-gauge"

[setups.ops.inspection_methods]
height = "After release, seat datum A on the surface plate with the 6.500 mm go pin in the bore. Measure the pin top and subtract half the pin diameter; accept the 25.1-25.3 mm centre height."
