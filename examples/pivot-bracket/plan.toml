station = "calipers"

[[setups.ops]]
op = 80
do = "spot"
feature = "hold_down_b"
# AUTHOR'S CHOICE: the 1/4 in long-series spotter, as op 60, because one spotter serves both
# hold-down holes and its 50 mm projection keeps the chuck about 22 mm above the Z27.2 crown.
tool = "bracket-long-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 0.6                   # 2.08 mm spot diameter, smaller than the following #15 drill

[[setups.ops]]
op = 90
do = "drill"
feature = "hold_down_b"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
