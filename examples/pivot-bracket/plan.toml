# Illustrative pivot-bracket process plan. No dimensioned v39 drawing exists; the
# adjacent hand-authored manifest's bands are plausible example design intent.
# Four PM-30MV setups: S1 seat up (seat + foot boundary), S2 foot top up gripped deep
# on the raw overhang (rough the free run and ear strips to Z +16), S3 foot top up
# gripped on the finished foot (finish the L relief, ear width, hold-down holes), S4
# outer ear face up on an angle plate (outer face, arch + reamed cross-bore). All
# sheets remain PLANNED, not executable machining instructions or a first-article
# attestation.

part = "pivot-bracket"
features = "features.toml"
construction = "one_piece"   # author's route: all bracket features cut from one prepared blank
quantity = 2
quantity_cite = "harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:6"

[drawing]
number = "MHA-123"
revision = "example-v39"          # local illustrative contract on v39 STEP, not a certified drawing revision
cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:2", "harmonic-analyzer/cad/scripts/_drawing_registry.py (no pivot_bracket DrawingSpec)", "example (plausible, no dimensioned drawing): hand-authored contract on v39 STEP"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "Plain Carbon Steel"
material_cite = ["harmonic-analyzer/cad/config/parts/pivot-bracket.yaml:3", "harmonic-analyzer/cad/scripts/build_pivot_bracket.py:74"]
form = "prepared_blank"          # author's choice, restored from rev 3
section_mm = [18.0, 26.2]        # author's choice: model X width / model Z run, 1 mm each side
length_mm = 34.2                 # author's choice: model Y -1..33.2, seat/crown allowances
on_hand = false                  # inventory stock = [] (pedro-shop.toml:7): known none on hand; no procurement claimed
origin_mm = [9.0, -1.0, -4.0]    # author's choice: blank corner, model X 9..-9, Y -1..33.2, Z -4..22.2
axis = [0.0, 1.0, 0.0]           # 34.2 length along model Y
section_axis = [-1.0, 0.0, 0.0]  # 18 mm section along model -X; axis x section_axis = +Z (26.2 run)
as_is_faces = []                 # every finished face is cut
# DataBracket (r3): the blank's preparation, before S1. The engine cannot route squaring
# setups (every non-saw op must claim a manifest feature), so the steps are stock text.
prerequisite = "saw and square the blank to 18.0 × 26.2 × 34.2 mm, as listed under STOCK AND ROUTE" # AUTHOR'S CHOICE: printed as the job page's Before S1 line
note = "AUTHOR'S CHOICE: The blank is 1 mm over the finished part on every face. (1) Bandsaw 38 mm off 3/4 × 1-1/4 in flat bar. (2) Vise on parallels: face one wide side flat — the left side. (3) Left side to the fixed jaw: square one edge — the outer end. (4) Left side to the fixed jaw, outer end down: face the opposite edge to 26.2 — the free end. (5) Left side down: face the other wide side to 18.0. (6) Sawn end down, left side to the fixed jaw, outer end indicated square: face the crown end; flip it crown down and face the seat end to 34.2. (7) Mic 18.0 ±0.1, 26.2 and 34.2 ±0.02; mark the left side, outer end and crown end. S1 picks up the left side and outer end; S2/S3 pick up the left side and free end and touch Z on the crown end."
cite = ["AUTHOR'S CHOICE: 3/4 x 1-1/4 in, a common flat-bar section over 18 x 26.2; 38 mm saws 1.9 mm over each 34.2 end", "AUTHOR'S CHOICE: six-face vise squaring with the left side as the reference face, because S1-S3 edge-find it", "AUTHOR'S CHOICE: 26.2 and 34.2 held to +/-0.02 because S2/S3 zero on the free and crown ends, opposite the S1 references"]

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs"
radius_mode = true

[dro.direction]                  # manual §6.2 Direction; set once in S1, same on every sheet
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames (author's choice), model coordinates, bound nominally by the
# zero recipes below.
[frames.TA]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "nominal"              # S1: Z0 is the faced seat (op 10)
note = "AUTHOR'S CHOICE: S1 seat up. In this Setup, the faced seat is Z0 and the foot top is Z -6."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

[frames.TB]
origin = [0.0, 6.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"              # S2/S3: X/Y picked up on the raw overhang, Z0 the faced foot top
note = "AUTHOR'S CHOICE: S2 and S3 foot top up. In these Setups, the faced foot top is Z0 and the finished seat is Z -6."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

[frames.TC]
origin = [0.0, 0.0, -3.0]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"              # S4: Z0 the outer face faced by op 10
note = "AUTHOR'S CHOICE: S4 outer face up, finished seat against the angle-plate upright at Y0, plate behind the part on +Y. In this Setup, the faced outer face is Z0, ear inner face Z -6 and foot free end Z -24.2."
cite = ["AUTHOR'S CHOICE", "pivot-bracket.STEP"]

# ======================================================================= S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"                     # seat up; frame x/y/z = machine +X/+Y/+Z
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break R0.25 adopted
stock_in = "stock"

[setups.stock_state]             # frame A, surfaces as S1 receives them
top_z = 1.0                      # author's choice: raw seat at model Y = -1
bottom_z = -33.2                 # author's choice: raw crown-side face at model Y = 33.2

[setups.stock_state.local_thickness]   # S1 has no holes

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # rev 3: jaws normal to X, gripping the unmachined body across X
fixed_jaw = "left"               # author's choice: fixed jaw on -X, jaws run along Y
parallels = "parallels-lms-6745/1in"
jaw_center_along_mm = 9.1         # author's choice: centre the 26.2 mm raw blank run in the jaws
stop = "No end stop: clamp the blank centrally over the parallels, then edge-find its left face and outer end for this Setup's X/Y zeros." # author's choice
grip_mm = 19.5453                # rev-3 derivation, measured jaw: jaw height 1.7695 in - 1 in parallels, x 25.4
jaw_above_parallels_mm = 19.5453
clamp = "hand plus quarter turn" # author's choice; verify actual grip before cutting
parallels_along = "y"
parallels_centres_mm = [[-6.5, 9.1], [6.5, 9.1]] # author's choice: under the blank edges
note = "Seat side up on 1 in parallels; blank X -9..9 and Y -4..22.2 in this Setup. Raw seat is Z +1, finished seat Z0. Finish the foot boundary only down to Z -6, leaving the ear-side stock below for S2-S4. The foot-profile cut bottom stays 7.655 mm above the jaw tops." # DataBracket (r3): jaw tops print at Z -13.655

[setups.zero.x]
edge = "blank_left"
edge_mm = -9.0                   # author's choice: centred 18 mm blank
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice; jog without touching again

[setups.zero.y]
edge = "blank_outer_end"
edge_mm = -4.0                   # author's choice: raw model Z = -4
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice; not an inventory measurement
tool = "endmills-lms-6784/3-8in-4fl" # author's choice: first cutting tool
check_jog_mm = 10.0              # author's choice
retouch_after = [10]             # op 10 faces the seat to z = 0

[[setups.ops]]
op = 10
do = "face"
feature = "seat_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0                       # establishes the seat, frame A z = 0
direction = "conventional"       # author's choice for a hand-fed mill
doc_mm = 1.0                     # AUTHOR'S CHOICE: the whole 1 mm skim in one axial pass
stock_removal_bounds = { x = [-9.0, 9.0], y = [-4.0, 22.2], z = [0.0, 1.0] } # AUTHOR'S CHOICE: face full raw top
contour = { method = "linear_table", step_mm = 6.35 } # AUTHOR'S CHOICE: 2/3 of the 9.525 cutter per pass
note = "Face the complete raw top, X -9..9 and Y -4..22.2, from Z +1 to Z0 before profiling the foot. Do not leave the raw overhang rails at the future finished-face boundary."

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = -6.0                      # -FOOT_H
direction = "conventional"       # author's choice
doc_mm = 3.0                     # AUTHOR'S CHOICE: two axial levels over the 6 mm foot, about 0.3D
rough_allowance_mm = 0.3         # author's choice: radial stock on the outline
contour = { method = "linear_table", step_mm = 1.0 } # author's choice: straight sides
# Clear only the top six millimetres around the foot. Preserve the stock below
# A Z = -6 for the upright ear and the subsequent opposite-side setup.
stock_removal_bounds = { x = [-9.0, 9.0], y = [-4.0, 22.2], z = [-6.0, 1.0] }

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "foot_profile"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = -6.0
direction = "conventional"       # author's choice
doc_mm = 6.0                     # AUTHOR'S CHOICE: one full-depth finish pass at 0.3 mm radial, about 0.63D
contour = { method = "linear_table", step_mm = 1.0 } # author's choice
stock_removal_bounds = { x = [-9.0, 9.0], y = [-4.0, 22.2], z = [-6.0, 1.0] }

[setups.ops.checks]
width = "calipers"
length = "calipers"

# ======================================================================= S2
# AUTHOR'S CHOICE: rough the upper free run and the ear side strips while the raw
# overhang is gripped 10.37 mm deep, so S3 (gripping only 3.67 mm of the 6 mm foot)
# never rough-mills more than 16 mm above the foot top. The jaws close on the raw
# 18 mm overhang above the 16 mm finished foot; the foot hangs between them untouched.
# 1-1/8 in parallels (not 1 in) put the jaw tops 5.63 mm below the Z +16 roughing floor.
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "TB"                     # foot top up, seat down
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S1"

[setups.stock_state]             # frame B
top_z = 27.2                     # author's choice: remaining model Y = 33.2 minus FOOT_H
bottom_z = -6.0                  # finished seat (S1 op 10)

[setups.stock_state.local_thickness]

[setups.stock_state.entry_z]
ear_relief = 27.2
ear_sides = 27.2

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # grips the raw overhang sides across X
jaw_center_along_mm = -9.1        # author's choice: centre the 26.2 mm raw overhang run
fixed_jaw = "left"               # author's choice: fixed jaw on -X
parallels = "bracket-high-parallels/1-1-8in" # AUTHOR'S CHOICE: 10.37 mm grip leaves 5.63 mm under the Z +16 floor
grip_mm = 10.3703                # jaw above parallels 16.3703 minus the 6 mm foot below the overhang
jaw_above_parallels_mm = 16.3703 # jaw height 1.7695 in minus 1-1/8 in parallels, x 25.4
stop = "No end stop: seat the finished seat on the parallels, close the jaws on the raw overhang above the foot, then edge-find the raw left side and free end above the jaw tops for this Setup's X/Y zeros." # author's choice
clamp = "hand plus quarter turn" # author's choice
parallels_along = "y"
parallels_centres_mm = [[-6.25, -9.1], [6.25, -9.1]] # author's choice: under the 16 mm foot
note = "Seat down on the 1-1/8 in parallels. The jaws grip the raw 18 mm overhang from the foot top up to Z +10.37; the finished 16 mm foot sits between the jaws without touching them. Rough only down to Z +16, 5.63 mm above the jaw tops. Before the X/Y pickups, touch the stationary edge-finder tip on the raw top (Z +27.2) with 0.05 paper and Axis Set Z 27.25 for a preliminary Z. Raise above Z +32 before every traverse between pickups. Touch the raw left side and free end with the tip at Z +20, 9.6 mm above the jaw tops."

[setups.zero.x]
edge = "raw left side at Y -12, Z +20, above the fixed jaw"
edge_mm = -9.0                   # unfinished centred blank
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "raw free end at X 0, Z +20"
edge_mm = -22.2                  # unfinished model Z = 22.2 -> B y = -22.2
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "bracket-long-endmill"
check_jog_mm = 10.0              # author's choice
retouch_after = []               # one end mill for every op in this Setup

[[setups.ops]]
op = 10
do = "rough_pocket"
feature = "ear_relief"
faces = ["#96/ADVANCED_FACE[7]/NONE"] # retained inner wall, roughed down to Z +16 only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 16.0                      # AUTHOR'S CHOICE: 5.63 mm above the jaw tops at Z +10.37
direction = "conventional"       # author's choice
doc_mm = 4.0                     # AUTHOR'S CHOICE: three axial levels at 1 mm radial step, about 0.4D
rough_allowance_mm = 0.3         # author's choice: stock on the retained ear wall
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # open free-run sweep from the raw free end
stock_removal_bounds = { x = [-9.0, 9.0], y = [-22.2, -3.0], z = [16.0, 27.2] } # TB: upper free run only

[[setups.ops]]
op = 20
do = "rough_pocket"
feature = "ear_sides"
faces = ["#41/ADVANCED_FACE[4]/NONE"] # left ear wall, roughed down to Z +16 only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 16.0                      # AUTHOR'S CHOICE: 5.63 mm above the jaw tops
direction = "conventional"       # author's choice
doc_mm = 4.0                     # AUTHOR'S CHOICE: three axial levels at 1 mm radial step
rough_allowance_mm = 0.3         # author's choice: radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, -7.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "-x" } # outside-in left-strip rasters
stock_removal_bounds = { x = [-9.0, -7.0], y = [-3.0, 4.0], z = [16.0, 27.2] } # left strip above Z +16 only

[[setups.ops]]
op = 30
do = "rough_pocket"
feature = "ear_sides"
faces = ["#451/ADVANCED_FACE[14]/NONE"] # right ear wall, roughed down to Z +16 only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 16.0                      # AUTHOR'S CHOICE: 5.63 mm above the jaw tops
direction = "conventional"       # author's choice
doc_mm = 4.0                     # AUTHOR'S CHOICE: three axial levels at 1 mm radial step
rough_allowance_mm = 0.3         # author's choice: radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [7.0, 9.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "+x" } # outside-in right-strip rasters
stock_removal_bounds = { x = [7.0, 9.0], y = [-3.0, 4.0], z = [16.0, 27.2] } # right strip above Z +16 only

# ======================================================================= S3
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TB"                     # foot top up, seat down
coolant = "cutting-oil"           # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S2"

[setups.stock_state]             # frame B
top_z = 27.2                     # ear crown, still raw
bottom_z = -6.0                  # finished seat (S1 op 10)

[setups.stock_state.local_thickness]
hold_down_a = 6.0                # FOOT_H at the station, entry on the foot top once op 20 finishes it
hold_down_b = 6.0


[setups.stock_state.entry_z]     # S2 roughed the free run and both ear strips to Z +16
ear_relief = 16.0
foot_top = 16.0
ear_sides = 16.0
hold_down_a = 16.0               # free-run surface advances with the relief cuts
hold_down_b = 16.0
[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"                 # grips the finished foot sides across X
jaw_center_along_mm = -9.1        # author's choice: centre the 24.2 mm finished foot run
fixed_jaw = "left"               # author's choice: fixed jaw on -X
parallels = "bracket-high-parallels/1-5-8in" # tall narrow pair fits between the closed jaws
grip_mm = 3.6703                 # jaw height 1.7695 in minus 1-5/8 in parallels, x 25.4
jaw_above_parallels_mm = 3.6703
stop = "No end stop: seat the finished foot on the parallels and against the fixed jaw, clamp, then edge-find the raw left side and free end below the Z +16 step for this Setup's X/Y zeros." # author's choice
clamp = "hand plus quarter turn" # author's choice
parallels_along = "y"
parallels_centres_mm = [[-6.25, -9.1], [6.25, -9.1]]
note = "Seat down on one pair of 1-5/8 in tall, 1/8 in thick ground parallels, keeping the X0 drilling line clear. Do not use 1-2-3 blocks between the jaws closed on this 16 mm foot. The jaws grip 3.67 mm of the foot; the foot top is 2.33 mm above the jaw tops. S2 already roughed everything above Z +16, so the roughing here stays within 18.33 mm of the jaw tops. Retain a straight rectangular crown for S4, not an arch sculpted from above. Before the X/Y pickups, touch the stationary edge-finder tip on the crown top (Z +27.2) with 0.05 paper and Axis Set Z 27.25 for a preliminary Z. Raise above Z +32 before every traverse between pickups. S2 left the raw left side and free end standing only from the foot top (Z0) up to its Z +16 step: touch them with the tip at Z +8, 10.3 mm above the jaw tops." # DataBracket (r3): 16 + 2.33 above the jaw tops at Z -2.330

[setups.zero.transfer]
from = "S1"
indicate = ["foot_profile"]
tool = "dti"
runout_limit_mm = 0.0254          # author's choice: max 0.001 in TIR, two 0.0005 in DTI divisions; not a measured alignment

# Pickup option 2: touch the unfinished upper-stock overhang, not the foot.
# S1 profiles only model Y 0..6: remaining model X -9..9 / Z -4..22.2
# becomes B X -9..9 / Y -22.2..4 / Z 0..27.2; S2 roughs only above Z +16, so the
# raw left side (X -9) and free end (Y -22.2) stand only from Z0 to Z +16 here
# (kernel S3 stock_in bbox X -9..9, Y -22.2..4, Z -6..27.2). The pickups touch them at
# Z +8, 10.3 mm above the jaw tops (Z -2.33) and 8 mm below the S2 step. No end stop is
# used; each blank is edge-found. Finished foot/frame-B cut coordinates stay unchanged.
[setups.zero.x]
edge = "raw left side at Y -12, Z +8, below the Z +16 step"
edge_mm = -9.0                   # unfinished centred blank, not finished foot X = -8
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "raw free end at X 0, Z +8, below the Z +16 step"
edge_mm = -22.2                  # unfinished model Z = 22.2 -> B y = -22.2
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "bracket-long-endmill"     # 31.75 mm flutes reach the 27.2 mm inner wall
check_jog_mm = 10.0              # author's choice
retouch_after = [55]             # author's choice: same end mill for 10–55; later tools touch the untouched crown top

[[setups.ops]]
op = 10
do = "rough_pocket"
feature = "ear_relief"
faces = ["#96/ADVANCED_FACE[7]/NONE"] # retained inner wall; the floor is finished by op 20
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.3                       # author's choice: finished foot Z = 0 plus floor allowance
direction = "conventional"       # author's choice
doc_mm = 3.0                     # AUTHOR'S CHOICE: light axial levels from Z +16 at 1 mm radial step, about 0.3D, for the 3.67 mm foot grip
rough_allowance_mm = 0.3         # author's choice: stock on floor and retained ear wall
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # author's existing raw blank placement and open free-run sweep, explicit rather than inferred from stock size
stock_removal_bounds = { x = [-9.0, 9.0], y = [-22.2, -3.0], z = [0.0, 16.0] } # TB: lower free run left by S2

[[setups.ops]]
op = 20
do = "finish_pocket"
feature = "ear_relief"
faces = ["#96/ADVANCED_FACE[7]/NONE"] # inner wall; its free-run floor goes to Z0 here, the whole foot top is claimed at 55
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0                       # finish the inner wall and the free-run floor together
direction = "conventional"       # author's choice
doc_mm = 9.1                     # AUTHOR'S CHOICE: wall finish at 0.3 mm radial in three equal axial levels over 27.2 mm
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, 9.0], y = [6.0, 33.2], z = [3.0, 22.2] }, open_side = "-y" } # same raw blank sweep; retained ear wall at setup Y -3
stock_removal_bounds = { x = [-9.0, 9.0], y = [-22.2, -3.0], z = [0.0, 27.2] }

[[setups.ops]]
op = 40
do = "rough_pocket"
feature = "ear_sides"
faces = ["#41/ADVANCED_FACE[4]/NONE"] # left ear wall only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.3                       # author's choice: finished foot Z = 0 plus floor allowance
direction = "conventional"       # author's choice
doc_mm = 3.0                     # AUTHOR'S CHOICE: light axial levels from Z +16 at 1 mm radial step
rough_allowance_mm = 0.3         # author's choice: radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, -7.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "-x" } # outside-in left-strip rasters, not a closed ear outline
stock_removal_bounds = { x = [-9.0, -7.0], y = [-3.0, 4.0], z = [0.0, 16.0] } # left strip only; retain the rectangular crown
note = "Left ear side only; clear the narrow X -9..-7 strip. Keep the crown square for S4."

[[setups.ops]]
op = 45
do = "rough_pocket"
feature = "ear_sides"
faces = ["#451/ADVANCED_FACE[14]/NONE"] # right ear wall only
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 0.3                       # finished foot Z = 0 plus floor allowance
direction = "conventional"
doc_mm = 3.0                     # AUTHOR'S CHOICE: light axial levels from Z +16 at 1 mm radial step
rough_allowance_mm = 0.3         # radial ear-side stock
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [7.0, 9.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "+x" } # outside-in right-strip rasters
stock_removal_bounds = { x = [7.0, 9.0], y = [-3.0, 4.0], z = [0.0, 16.0] } # right strip only; no full-X crown clearance
note = "Right ear side only; clear the narrow X +7..+9 strip. Keep the crown square for S4."

[[setups.ops]]
op = 50
do = "finish_pocket"
feature = "ear_sides"
faces = ["#41/ADVANCED_FACE[4]/NONE"] # left ear wall and its foot-top ledge
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
to_z = 0.0                       # finish the wall and its foot-top ledge together
direction = "conventional"       # author's choice
doc_mm = 9.1                     # AUTHOR'S CHOICE: wall finish at 0.3 mm radial in three equal axial levels over 27.2 mm
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [-9.0, -7.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "-x" } # finish only the open left strip
stock_removal_bounds = { x = [-9.0, -7.0], y = [-3.0, 4.0], z = [0.0, 27.2] }
note = "Left ear wall and left ledge to Z0. Keep the crown square for S4."

[[setups.ops]]
op = 55
do = "finish_pocket"
feature = "ear_sides"
faces = ["#451/ADVANCED_FACE[14]/NONE", "#28/ADVANCED_FACE[3]/NONE"] # right ear wall; the foot top is complete after this op
tool = "bracket-long-endmill"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice: rapid plane above the current stock top
to_z = 0.0                       # finish the wall and its foot-top ledge together
direction = "conventional"
doc_mm = 9.1                     # AUTHOR'S CHOICE: wall finish at 0.3 mm radial in three equal axial levels over 27.2 mm
contour = { method = "linear_table", step_mm = 1.0, sweep_frame = "model", sweep_bounds = { x = [7.0, 9.0], y = [6.0, 33.2], z = [-4.0, 3.0] }, open_side = "+x" } # finish only the open right strip
stock_removal_bounds = { x = [7.0, 9.0], y = [-3.0, 4.0], z = [0.0, 27.2] }
note = "Right ear wall and right ledge to Z0. Keep the crown square for S4. Check the ear width after both walls are finished."

[setups.ops.checks]
width = "calipers"

[[setups.ops]]
op = 57
do = "inspect"
feature = "foot_top"
note = "Measure seat to foot top on the free run and on both ledges."

[setups.ops.checks]
height = "calipers"

[[setups.ops]]
op = 60
do = "spot"
feature = "hold_down_a"
# AUTHOR'S CHOICE: the 1/4 in long-series spotter because the 3/8 in spotter's body passes
# 0.44 mm from the ear relief wall that stands 5.2 mm from this hole axis, and its chuck face
# stops 3.2 mm above the Z27.2 ear crown; the 1/4 in body clears that wall by 2.0 mm and its
# 50 mm projection keeps the chuck about 22 mm above the crown.
tool = "bracket-long-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 0.6                   # 2.08 mm spot diameter, smaller than the following #15 drill

[[setups.ops]]
op = 70
do = "drill"
feature = "hold_down_a"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
exit_mm = 2.0                    # author's choice: full diameter beyond local exit face

[setups.ops.checks]
dia = "pin-gauges"               # #8 clearance go/no-go
station = "calipers"

[[setups.ops]]
op = 80
do = "spot"
feature = "hold_down_b"
# AUTHOR'S CHOICE: the 1/4 in long-series spotter, as op 60, because one spotter serves both
# hold-down holes and its 50 mm projection keeps the chuck about 22 mm above the Z27.2 crown.
tool = "bracket-long-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
depth_mm = 0.6                   # 2.08 mm spot diameter, smaller than the following #15 drill

[[setups.ops]]
op = 90
do = "drill"
feature = "hold_down_b"
tool = "drill-index-115/#15"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author\'s choice: rapid plane above the current stock top
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "pin-gauges"               # #8 clearance go/no-go
station = "calipers"

# ======================================================================= S4
# Author's fix of the earlier inner-face-up setup: the outer face (#103, ear outer face and
# foot near end in one plane) faces away from every earlier setup and was never cut.
# With the outer face up, one angle-plate setup faces it, profiles the arch and drills/
# reams the cross bore from the same side.
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "TC"                     # outer face up; seat against the angle-plate upright on +y
coolant = "cutting-oil"          # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S3"

[setups.stock_state]             # frame TC
top_feature = "outer_face"
top_z = 1.0                      # author's choice: raw outer face at model Z = -4
bottom_z = -24.2                 # foot free end, model Z = 21.2

[setups.stock_state.local_thickness]
cross_bore = 6.0                 # ear thickness after op 10

[setups.stock_state.entry_z]
cross_bore = 0.0                 # faced outer face
ear_arch = 0.0

[setups.hold]
fixture = "angle-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # author's choice: plate frame = TC
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
supports = "not_applicable"      # the plate assembly includes the load-bearing foot-end ledge
clamps = [
  { ref = "clamping-kit-lms-1144/bracket-bridge", pose = { origin_mm = [0.0, -6.0, -16.0], x = [1.0, 0.0, 0.0], z = [0.0, -1.0, 0.0] }, torque_nm = 15.0, note = "presses the foot toward the plate (+Y); bar top at Setup Z -9.65; studs, washers and nuts outside the foot width, clear of the foot-end ledge, arch and cross-bore" },
]                                # torque_nm: AUTHOR'S CHOICE, firm hand torque on the 3/8-16 front nuts for a 6 mm foot
clamp_order = [1]
method = "strap_clamps"
locate = "Seat the finished seat face flat against the angle-plate upright, outer face up and 2 mm proud of the plate top"
# DataBracket (r3): one ordered HOLD step per ";" clause (the sheet splits clamp on ";").
clamp = "fit the two bridge studs through the upright at Setup X +/-20, with the rear washers against the plate back and the rear nuts behind them; lay the bridge underside on the finished foot top at Setup Y -6, centred at Setup Z -16, and run the front washers and nuts down by hand until the bridge just holds the foot against the plate; indicate the exposed 2 mm seat lip with a small-ball DTI above the plate and tap the part until the lip sweeps flat"
grip_mm = "not_applicable"       # bridge contact, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "Rest the foot free end on the bolted plate ledge at Setup Z -24.2, which carries the downward facing and drilling load; align the finished left foot edge at Setup X -8 before clamping."
note = "Recheck the seat lip with the DTI after full torque. Before the X/Y pickups, touch the stationary edge finder on the raw outer face (Z +1) with paper for a preliminary Z. Raise above Z +5 before every traverse between pickups."

[setups.zero.transfer]
from = "S3"
indicate = ["foot_profile", "foot_top", "seat_face"] # transfer the actual height datum, not only its adjacent faces
tool = "dti"
runout_limit_mm = 0.0254          # author's choice: max 0.001 in TIR, two 0.0005 in DTI divisions; not a measured alignment

[setups.zero.x]
edge = "foot left face at Y -3, Z -4, above the bridge"
edge_mm = -8.0
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "plate front beside the part at X +45, Z -5, clear of the bridge hardware"
edge_mm = 0.0                    # plate face and seated datum A share Y0
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0              # author's choice
retouch_after = [10, 15]         # op 10 faces the outer face to z = 0; op 30 changes tool

[[setups.ops]]
op = 10
do = "face"
feature = "outer_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = 0.0                       # outer face, model Z = -3
direction = "conventional"       # author's choice
doc_mm = 1.0                     # AUTHOR'S CHOICE: the whole 1 mm skim in one axial pass
stock_removal_bounds = { x = [-8.0, 8.0], y = [-33.2, 0.0], z = [0.0, 1.0] } # AUTHOR'S CHOICE: face full raw top
contour = { method = "linear_table", step_mm = 4.0 } # AUTHOR'S CHOICE: 4.0 mm stepover (0.42 of the 9.525 cutter) so the five passes over X -8..8 land 4.000 apart on the 0.005 DRO grid
note = "Face the complete top of the S4 entry stock, X -8..8 and Y -33.2..0, from Z +1 to Z0 before profiling the arch. Include the retained rectangular crown, not merely the finished outer-face outline."

[[setups.ops]]
op = 11
do = "inspect"
feature = "ear_relief"
note = "Check 6 mm ear thickness only after both faces are finished; it was still 7 mm before op 10."

[setups.ops.checks]
thickness = "calipers"

[[setups.ops]]
op = 15
do = "rough_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = -6.3                      # AUTHOR'S CHOICE: through the 6 mm ear into the open relief below; radial allowance only
direction = "conventional"       # author's choice
doc_mm = 3.2                     # AUTHOR'S CHOICE: two axial levels, about 0.34D
rough_allowance_mm = 0.3         # author's choice: radial crown stock
contour = { method = "stairs", cusp_mm = 0.15 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.3 allowance + 0.15 cusp leaves 0.45, inside the 0.5 filing cap for the S4F buttons
stock_removal_bounds = { x = [-7.0, 7.0], y = [-33.2, -25.2], z = [-6.0, 1.0] } # TC: remove crown stock from the rectangular ear retained in S3

[[setups.ops]]
op = 30
do = "spot"
feature = "cross_bore"
tool = "bracket-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
depth_mm = 0.6                   # 2.08 mm spot diameter, below the letter D predrill diameter

[[setups.ops]]
op = 40
do = "drill"
feature = "cross_bore"
tool = "drill-index-115/D"       # predrill 6.248 leaves 0.264 diametral (0.13 mm, .0052 in, radial) for the 6.512 reamer, inside Machinery's Handbook 27th ed. p.1133 reamer depth of cut .004-.008 in for holes over 1/8 in
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[[setups.ops]]
op = 50
do = "ream"
feature = "cross_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "bracket-cross-bore-pins"   # metric 6.500 go / 6.530 no-go, not inch-step pins
height = "height-gauge"

[setups.ops.inspection_methods]
height = "After release, seat datum A on the surface plate with the 6.500 mm go pin in the bore. Measure the pin top and subtract half the pin diameter; accept the 25.1-25.3 mm centre height."

# ======================================================================= S4F
# EngManualArc: bench filing of the R7 arch to filing buttons on the reamed cross bore.
[[setups]]
id = "S4F"
machine = "fitting-bench"
frame = "TC"                     # outer face up on the button stud, stud tail down in the vise
stock_in = "S4"
coolant = "none: bench filing"
deburr_mm = 0.25                 # example (plausible): title-block edge break
note = "AUTHOR'S CHOICE: file the arch to filing buttons because the reamed cross bore is their pin, so the R7 comes out concentric with the bore without a second mill setup. Off the angle plate, clamp the buttons on both ear faces through the cross bore and grip the stud tail upright in the bench vise."

[setups.stock_state]             # frame TC
top_feature = "outer_face"
top_z = 0.0                      # outer face, under the top button
bottom_z = -24.2                 # foot free end

[setups.hold]
fixture = "bench-vise-4in"
pose = { origin_mm = [0.0, -25.2, -35.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # AUTHOR'S CHOICE: jaw tops 10.8 mm below the foot end, closed on the stud tail
clamps = [
  { ref = "bracket-arch-filing-buttons", restraint = "press", pose = { origin_mm = [0.0, -25.2, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "stud through the reamed cross bore, one button on each ear face, nut tightened by hand" },
]
clamp_order = [1]
support = "none"
grip_on = "AUTHOR'S CHOICE: the button stud tail in the vise jaws; the part is clamped between the buttons and never touches the jaws"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: none; steady the foot by hand against the file stroke"
clamp = "M6 nut on the button stud, hand tight, pressing the buttons on the two ear faces"

[[setups.ops]]
op = 10
do = "file_to_line"
feature = "ear_arch"
guide = { buttons = "bracket-arch-filing-buttons", bore = "cross_bore", gauge = "radius-gauge" } # AUTHOR'S CHOICE: buttons because the reamed bore centres them; the R7 leaf checks the arch
note = "File the crown stairs left by S4 op 15 down to the hardened button rims across the full 6 mm ear, working from one arch end over the crown to the other; stop when the file rides on both buttons without cutting."

[setups.ops.checks]
radius = "radius-gauge"

# ======================================================================= S5
# Finishing is bench work off the mill: no spindle, holder, DRO or zero recipe.
[[setups]]
id = "S5"
machine = "finishing-bench"
frame = "TB"                     # seat down on the rest plate, foot top up
stock_in = "S4F"
coolant = "none: bench finishing"
deburr_mm = 0.25                 # example (plausible): title-block edge break
note = "AUTHOR'S CHOICE: Off the mill, break the edges, clean the part and send it out for black oxide with nothing masked; re-gauge the bore when it comes back."

[setups.stock_state]             # frame B, the finished part
top_z = 26.2                     # ear crown: bore axis (model Y 25.2) + R7, after S4F op 10
bottom_z = -6.0                  # finished seat

[setups.hold]
fixture = "finishing-rest-plate"
support = "none"
grip_on = "AUTHOR'S CHOICE: gravity only; the finished seat rests flat on the plate, nothing clamps the part"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = { origin_mm = [0.0, -9.0, -6.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # author's choice: plate top under the seat
stop = "AUTHOR'S CHOICE: none; the part is free on the plate for hand work"
clamp = "none"

[[setups.ops]]
op = 10
do = "deburr"
feature = "foot_profile"
note = "Break every machined edge R0.25 or 0.25 chamfer max with a file and stone, including both cross-bore mouths and the hold-down hole entries; do not touch the reamed bore wall. Wipe off chips and oil with solvent."

[[setups.ops]]
op = 20
do = "coating"
feature = "foot_profile"         # the whole part goes out; the outer L profile names it on the sheet
process = "black-oxide-vendor"
note = "Send the part out for black oxide as the drawing calls for. Leave every face open to the bath; the finish adds about 1 µm or less, well inside the 0.03 mm bore band. Ask the vendor for the oil dip after blackening."

[[setups.ops]]
op = 30
do = "inspect"
feature = "cross_bore"
note = "On return from black oxide: wipe excess oil from the bore and re-gauge it before release."

[setups.ops.checks]
dia = "bracket-cross-bore-pins"

[setups.ops.inspection_methods]
dia = "The 6.500 GO pin enters the bore from either side; the 6.530 NO-GO pin does not."
