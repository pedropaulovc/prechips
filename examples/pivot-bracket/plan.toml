station = "calipers"

# ======================================================================= S4
# Author's fix of the earlier inner-face-up setup: the outer face (#103, ear outer face and
# foot near end in one plane) faces away from every earlier setup and was never cut.
# With the outer face up, one angle-plate setup faces it, profiles the arch and drills/
# reams the cross bore from the same side.
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "TC"                     # outer face up; seat against the angle-plate upright on +y
coolant = "cutting-oil"          # author's choice: brush listed cutting oil on cuts
deburr_mm = 0.25                 # example (plausible): title-block edge break
stock_in = "S3"

[setups.stock_state]             # frame TC
top_feature = "outer_face"
top_z = 1.0                      # author's choice: raw outer face at model Z = -4
bottom_z = -24.2                 # foot free end, model Z = 21.2

[setups.stock_state.local_thickness]
cross_bore = 6.0                 # ear thickness after op 10

[setups.stock_state.entry_z]
cross_bore = 0.0                 # faced outer face
ear_arch = 0.0

[setups.hold]
fixture = "angle-plate"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # author's choice: plate frame = TC
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
align = { indicator = "dti", face = "upright", limit_mm = 0.0254, over_mm = 100.0, cite = "AUTHOR'S CHOICE: the upright face that seats datum A squared to the X travel to 0.001 in (0.0254 mm) over 100 mm of its 127 mm length because the shop test indicator (gauges.dti) reads 0.0005 in, so the limit is two graduations it resolves" }
parallels = "not_applicable"
supports = "not_applicable"      # the plate assembly includes the load-bearing foot-end ledge
clamps = [
  { ref = "clamping-kit-lms-1144/bracket-bridge", pose = { origin_mm = [0.0, -6.0, -16.0], x = [1.0, 0.0, 0.0], z = [0.0, -1.0, 0.0] }, torque_nm = 15.0, note = "presses the foot toward the plate (+Y); bar top at Setup Z -9.65; studs, washers and nuts outside the foot width, clear of the foot-end ledge, arch and cross-bore" },
]                                # torque_nm: AUTHOR'S CHOICE, firm hand torque on the 3/8-16 front nuts for a 6 mm foot
clamp_order = [1]
method = "strap_clamps"
locate = "Seat the finished seat face flat against the angle-plate upright, outer face up and 2 mm proud of the plate top"
# DataBracket (r3): one ordered HOLD step per ";" clause (the sheet splits clamp on ";").
clamp = "fit the two bridge studs through the upright at Setup X +/-20, with the rear washers against the plate back and the rear nuts behind them; lay the bridge underside on the finished foot top at Setup Y -6, centred at Setup Z -16, and run the front washers and nuts down by hand until the bridge just holds the foot against the plate; indicate the exposed 2 mm seat lip with a small-ball DTI above the plate and tap the part until the lip sweeps flat"
grip_mm = "not_applicable"       # bridge contact, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "Rest the foot free end on the bolted plate ledge at Setup Z -24.2, which carries the downward facing and drilling load; align the finished left foot edge at Setup X -8 before clamping."
note = "Recheck the seat lip with the DTI after full torque. Before the X/Y pickups, touch the stationary edge finder on the raw outer face (Z +1) with paper for a preliminary Z. Raise above Z +5 before every traverse between pickups."

[setups.zero.transfer]
from = "S3"
indicate = ["foot_profile", "foot_top", "seat_face"] # transfer the actual height datum, not only its adjacent faces
tool = "dti"
runout_limit_mm = 0.0254          # author's choice: max 0.001 in TIR, two 0.0005 in DTI divisions; not a measured alignment

[setups.zero.x]
edge = "foot left face at Y -3, Z -4, above the bridge"
edge_mm = -8.0
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.y]
edge = "plate front beside the part at X +45, Z -5, clear of the bridge hardware"
edge_mm = 0.0                    # plate face and seated datum A share Y0
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0              # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05                  # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0              # author's choice
retouch_after = [10, 15]         # op 10 faces the outer face to z = 0; op 30 changes tool

[[setups.ops]]
op = 10
do = "face"
feature = "outer_face"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = 0.0                       # outer face, model Z = -3
direction = "conventional"       # author's choice
doc_mm = 1.0                     # AUTHOR'S CHOICE: the whole 1 mm skim in one axial pass
stock_removal_bounds = { x = [-8.0, 8.0], y = [-33.2, 0.0], z = [0.0, 1.0] } # AUTHOR'S CHOICE: face full raw top
contour = { method = "linear_table", step_mm = 4.0 } # AUTHOR'S CHOICE: 4.0 mm stepover (0.42 of the 9.525 cutter) so the five passes over X -8..8 land 4.000 apart on the 0.005 DRO grid
note = "Face the complete top of the S4 entry stock, X -8..8 and Y -33.2..0, from Z +1 to Z0 before profiling the arch. Include the retained rectangular crown, not merely the finished outer-face outline."

[[setups.ops]]
op = 11
do = "inspect"
feature = "ear_relief"
note = "Check 6 mm ear thickness only after both faces are finished; it was still 7 mm before op 10."

[setups.ops.checks]
thickness = "calipers"

[[setups.ops]]
op = 15
do = "rough_profile"
feature = "ear_arch"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0                # author's choice
to_z = -6.3                      # AUTHOR'S CHOICE: through the 6 mm ear into the open relief below; radial allowance only
direction = "conventional"       # author's choice
doc_mm = 3.2                     # AUTHOR'S CHOICE: two axial levels, about 0.34D
rough_allowance_mm = 0.3         # author's choice: radial crown stock
contour = { method = "stairs", cusp_mm = 0.15 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.3 allowance + 0.15 cusp leaves 0.45, inside the 0.5 filing cap for the S4F buttons
stock_removal_bounds = { x = [-7.0, 7.0], y = [-33.2, -25.2], z = [-6.0, 1.0] } # TC: remove crown stock from the rectangular ear retained in S3

[[setups.ops]]
op = 30
do = "spot"
feature = "cross_bore"
tool = "bracket-spot-drill"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
depth_mm = 0.6                   # 2.08 mm spot diameter, below the letter D predrill diameter

[[setups.ops]]
op = 40
do = "drill"
feature = "cross_bore"
tool = "drill-index-115/D"       # predrill 6.248 leaves 0.264 diametral (0.13 mm, .0052 in, radial) for the 6.512 reamer, inside Machinery's Handbook 27th ed. p.1133 reamer depth of cut .004-.008 in for holes over 1/8 in
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[[setups.ops]]
op = 50
do = "ream"
feature = "cross_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
approach_mm = 5.0                # author's choice
exit_mm = 2.0                    # author's choice

[setups.ops.checks]
dia = "bracket-cross-bore-pins"   # metric 6.500 go / 6.530 no-go, not inch-step pins
height = "height-gauge"

[setups.ops.inspection_methods]
height = "After release, seat datum A on the surface plate with the 6.500 mm go pin in the bore. Measure the pin top and subtract half the pin diameter; accept the 25.1-25.3 mm centre height."

# ======================================================================= S4F
# EngManualArc: bench filing of the R7 arch to filing buttons on the reamed cross bore.
[[setups]]
id = "S4F"
machine = "fitting-bench"
frame = "TC"                     # outer face up on the button stud, stud tail down in the vise
stock_in = "S4"
coolant = "none: bench filing"
deburr_mm = 0.25                 # example (plausible): title-block edge break
note = "AUTHOR'S CHOICE: file the arch to filing buttons because the reamed cross bore is their pin, so the R7 comes out concentric with the bore without a second mill setup. Off the angle plate, clamp the buttons on both ear faces through the cross bore and grip the stud tail upright in the bench vise."

[setups.stock_state]             # frame TC
top_feature = "outer_face"
top_z = 0.0                      # outer face, under the top button
bottom_z = -24.2                 # foot free end

[setups.hold]
fixture = "bench-vise-4in"
pose = { origin_mm = [0.0, -25.2, -35.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # AUTHOR'S CHOICE: jaw tops 10.8 mm below the foot end, closed on the stud tail
clamps = [
  { ref = "bracket-arch-filing-buttons", restraint = "press", pose = { origin_mm = [0.0, -25.2, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "stud through the reamed cross bore, one button on each ear face, nut tightened by hand" },
]
clamp_order = [1]
support = "none"
grip_on = "AUTHOR'S CHOICE: the button stud tail in the vise jaws; the part is clamped between the buttons and never touches the jaws"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: none; steady the foot by hand against the file stroke"
clamp = "M6 nut on the button stud, hand tight, pressing the buttons on the two ear faces"

[[setups.ops]]
op = 10
do = "file_to_line"
feature = "ear_arch"
guide = { buttons = "bracket-arch-filing-buttons", bore = "cross_bore", gauge = "radius-gauge" } # AUTHOR'S CHOICE: buttons because the reamed bore centres them; the R7 leaf checks the arch
note = "File the crown stairs left by S4 op 15 down to the hardened button rims across the full 6 mm ear, working from one arch end over the crown to the other; stop when the file rides on both buttons without cutting."

[setups.ops.checks]
radius = "radius-gauge"

# ======================================================================= S5
# Finishing is bench work off the mill: no spindle, holder, DRO or zero recipe.
[[setups]]
id = "S5"
machine = "finishing-bench"
frame = "TB"                     # seat down on the rest plate, foot top up
stock_in = "S4F"
coolant = "none: bench finishing"
deburr_mm = 0.25                 # example (plausible): title-block edge break
note = "AUTHOR'S CHOICE: Off the mill, break the edges, clean the part and send it out for black oxide with nothing masked; re-gauge the bore when it comes back."

[setups.stock_state]             # frame B, the finished part
top_z = 26.2                     # ear crown: bore axis (model Y 25.2) + R7, after S4F op 10
bottom_z = -6.0                  # finished seat

[setups.hold]
fixture = "finishing-rest-plate"
support = "none"
grip_on = "AUTHOR'S CHOICE: gravity only; the finished seat rests flat on the plate, nothing clamps the part"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = { origin_mm = [0.0, -9.0, -6.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # author's choice: plate top under the seat
stop = "AUTHOR'S CHOICE: none; the part is free on the plate for hand work"
clamp = "none"

[[setups.ops]]
op = 10
do = "deburr"
feature = "foot_profile"
note = "Break every machined edge R0.25 or 0.25 chamfer max with a file and stone, including both cross-bore mouths and the hold-down hole entries; do not touch the reamed bore wall. Wipe off chips and oil with solvent."

[[setups.ops]]
op = 20
do = "coating"
feature = "foot_profile"         # the whole part goes out; the outer L profile names it on the sheet
process = "black-oxide-vendor"
note = "Send the part out for black oxide as the drawing calls for. Leave every face open to the bath; the finish adds about 1 µm or less, well inside the 0.03 mm bore band. Ask the vendor for the oil dip after blackening."

[[setups.ops]]
op = 30
do = "inspect"
feature = "cross_bore"
note = "On return from black oxide: wipe excess oil from the bore and re-gauge it before release."

[setups.ops.checks]
dia = "bracket-cross-bore-pins"

[setups.ops.inspection_methods]
dia = "The 6.500 GO pin enters the bore from either side; the 6.530 NO-GO pin does not."
