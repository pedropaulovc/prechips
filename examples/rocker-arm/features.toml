# rocker-arm requirement manifest (PLAN.md rev 6 §3.2), hand-written for M1 to
# mirror what the consumer export (M3) must emit. Every value is cited to the
# consumer, harmonic-analyzer (C:/src/harmonic-analyzer), read 2026-10-02.
# A field the drawing requires but no source sets is "unknown"; a field not in
# a feature's `requirements` is known absent (no tolerance is invented).
#
# Drawing cross-check (draw_rocker_arm.py build(), rocker_arm_notes.py):
#   sheet annotations, 11:
#     1  PivotDia Ø6.50 +0.03/0            front keep    draw_rocker_arm.py:269-270   -> pivot_bore.dia
#     2  TopAbovePivot 8.00 +0.50/0         front keep    draw_rocker_arm.py:271-275   -> top_edge.height_above_pivot
#     3  HubLength 7.057 +0.05/0            end-view keep draw_rocker_arm.py:280-282   -> hub_faces.length
#     4  rod-pin hole callout #47 THRU ALL  native callout draw_rocker_arm.py:432-445  -> rod_hole.dia, rod_hole.thru
#     5  rod-pin X location, BASIC          draw_rocker_arm.py:453-463                 -> rod_hole.at
#     6  rod-pin Y location, BASIC          draw_rocker_arm.py:464-474                 -> rod_hole.at
#     7  datum A on the pivot bore          draw_rocker_arm.py:486-495                 -> datums.A
#     8  pivot bore Ra 1.6                  draw_rocker_arm.py:499-509                 -> pivot_bore.finish_ra
#     9  datum B on the broad face          draw_rocker_arm.py:514-529                 -> datums.B
#    10  datum C on the rod-side tip face   draw_rocker_arm.py:530-538                 -> datums.C
#    11  position Ø0.20 |A|B|C| frame       draw_rocker_arm.py:539-549                 -> rod_hole.position_dia
#   numeric values in the linked notes (rocker_arm_notes.py:53-78), 10:
#     STRAP 2.50 THICK (:60) -> strap_faces.thickness; ALL HOLES THRU (:60) -> thru
#     R800.00 (:61) -> top_edge.radius; R816.00 (:61) -> profile_outer.bottom_radius
#     808.00 REF (:63) -> top_edge.centre_from_pivot_ref (REF, no requirement)
#     STRAP DEPTH 16.00 REF (:64) -> profile_outer.depth_ref (REF, no requirement)
#     292.10 TOP (:65) -> top_edge.arc_len; 266.70 BOTTOM (:65) -> profile_outer.bottom_arc_len
#     5.59 RADIAL LAND PERP (:67) -> profile_outer.tip_land, profile_outer.land_angle_deg
#     HUB DIA 10.20 (:72) -> hub_od.dia; COAXIAL Ø0.50 (:75) -> hub_od.coaxiality_dia
#     PIVOT HOLE: REAM (:71) -> pivot_bore.process; MIRROR-SYMMETRIC (:58) -> profile_outer.mirror_symmetric
#   marked model dimensions (rocker_arm_notes.py:41-51): TopRadius, BottomRadius
#   (note-only, draw_rocker_arm.py:277), PivotDia, HubLength, TopAbovePivot; all mapped above.
# Stale consumer comments NOT used as evidence: draw_rocker_arm.py:448-449 ("7.30 mm
# above its mid-height") and build_rocker_arm.py:181 ("# 15.303"); the current
# computation (rocker_arm_spec.py:33-34,57-59) gives Y 16.456, 8.456 above the pivot.
part = "rocker-arm"
units = "mm"
precision = 2 # .XX: the notes print :.2f (rocker_arm_notes.py:60-76); fields override below
# The bound STEP is the consumer's labelled v40 export, delivered as
# C:/src/dt-logs/features-bundles/rocker_arm/rocker-arm.STEP and kept byte-for-byte (CRLF,
# .gitattributes `-text`). SolidWorks inches; eighteen ADVANCED_FACE records labelled
# HAF_<FEATURE>__P<nn>, periodic surfaces split into P01/P02 patches under one feature
# label. Each `faces` list below is the consumer's exported face set for the feature of
# the same name (features-bundles/rocker_arm/features.toml); the export's extra features
# strap_datum_b (+Z broad face #492/ADVANCED_FACE[13]), tip_land_pos_x (#248/[6]) and
# tip_land_neg_x (#431/[10]) have no counterpart in this hand-written manifest and are
# not invented here. A reference is #<entity>/ADVANCED_FACE[<file-order ordinal>]/<label>.
step = "rocker-arm.STEP"
step_sha256 = "19070131b1ae87020768e24acea45dd8462773c76131630dd299f0188745ef15"
construction = "one_piece" # no built-up permission note exists (rocker_arm_notes.py:53-78): default, not a fabricated note
cite_root = "harmonic-analyzer"

[drawing]
number = "MHA-071"
revision = "unknown" # release.yaml:3 configures v38 for the next release; no certified export pairing
cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:2", "harmonic-analyzer/cad/config/release.yaml:1-3", "harmonic-analyzer/cad/scripts/_common.py:1751-1765"]

[material]
spec = "LOW-CARBON STEEL OR GRAY IRON"
finish = "matte black oxide"
cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:3-4", "harmonic-analyzer/cad/config/parts/_defaults.yaml:25-27"]

# Every part's title block carries these rows (_common.py:1772-1789, required on the
# drawing by _drawing_common.py:1997-2020); values are value_in x 25.4.
[general_tolerances]
linear_1pl = 0.762 # 0.03 in
linear_2pl = 0.508 # 0.02 in; the hub OD is sized against it (rocker_arm_spec.py:100-112)
linear_3pl = 0.127 # 0.005 in
angular_deg = 1.0
drilled_hole_plus = 0.10
drilled_hole_minus = 0.0
edge_break_r = 0.25
chamfer_max = 0.25

[general_tolerances.cite]
linear_1pl = "harmonic-analyzer/cad/config/title_block.yaml:25"
linear_2pl = "harmonic-analyzer/cad/config/title_block.yaml:26"
linear_3pl = "harmonic-analyzer/cad/config/title_block.yaml:27"
angular_deg = "harmonic-analyzer/cad/config/title_block.yaml:28"
drilled_hole = "harmonic-analyzer/cad/config/title_block.yaml:52-66"
edge_break = "harmonic-analyzer/cad/config/title_block.yaml:43-45"

# Model frame: consumer front profile in XY, +X toward the rod end, pivot axis at
# (0, 8), bottom-arc midpoint at the origin, strap and hub extruded mid-plane in Z.
[frames.model]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
cite = ["harmonic-analyzer/cad/scripts/build_rocker_arm.py:42-45", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:396-403", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:424-434"]

# Setup frame A (S1, S3): origin on the pivot axis at the upper hub face
# (0, ARM_DEPTH/2, HUB_LENGTH/2); axes = model axes; X+ rod end, Y+ toward the top edge.
# A setup frame, not the drawing's datum reference frame |A|B|C|.
[frames.A]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "unknown" # nominal from source geometry; the fit to a measured part is not established
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:424-429"]

# Setup frame B (S2): the part flipped 180° about model X; origin on the pivot axis
# at the lower hub face; x cross y = z.
[frames.B]
origin = [0.0, 8.0, -3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "unknown"
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:424-429"]

[datums.A]
feature = "pivot_bore"
surface = "pivot bore cylinder"
cite = "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:476-495"

[datums.B]
feature = "strap_faces"
surface = "unknown" # one broad face, picked in the end view at RIGHT_CENTER x - ARM_THICKNESS/2; which side is not stated
cite = "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:510-529"

[datums.C]
feature = "profile_outer"
surface = "rod-side (+X) radial tip land"
cite = ["harmonic-analyzer/cad/scripts/draw_rocker_arm.py:125-128", "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:530-538"]

[features.pivot_bore]
kind = "hole"
frame = "model"
at = [0.0, 8.0, 0.0] # pivot axis at the extrusion mid-plane
axis = [0.0, 0.0, 1.0]
dia = [6.50, 6.53] # PIVOT_HOLE_DIA 6.5, band (upper 0.03, lower 0), native on PivotDia
thru = true # cut 20 mm both ways through hub + strap; note 2 ALL HOLES THRU
finish_ra = 1.6 # MACHINED_UM on the bore cylinder
process = "ream" # note 6
datum = "A"
requirements = ["dia", "thru", "finish_ra", "process"]
faces = ["#233/ADVANCED_FACE[5]/HAF_PIVOT_BORE__P01", "#382/ADVANCED_FACE[8]/HAF_PIVOT_BORE__P01"] # consumer export: two periodic patches, one label
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:32", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:37-39", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:107", "harmonic-analyzer/cad/scripts/_surface_finish.py:48", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:436-458", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:578-582", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:60", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:71"]

[features.pivot_bore.precision]
dia = 2 # printed Ø6.50 (rocker_arm_notes.py:36)
finish_ra = "unknown" # rendered decimals of the Ra symbol not stated in source

[features.rod_hole]
kind = "hole"
frame = "model"
# X = 127.3738 - MECHANISM_X_SHIFT(-5.69360213488344);
# Y = 816 - sqrt(816^2 - X^2) + 5.53312035905. BASIC from the pivot: 133.0674, 8.4561.
at = [133.06740213488345, 16.456064115939025, 0.0]
axis = [0.0, 0.0, 1.0]
drill = "#47"
dia = [1.994, 2.094] # #47 = 1.994; drilled-hole general tolerance +0.10/0
thru = true # HoleSpec end through_all; note 2 ALL HOLES THRU; 2.5 strap only
position_dia = 0.20
position_datums = ["A", "B", "C"]
requirements = ["at", "dia", "thru", "position_dia"]
faces = ["#49/ADVANCED_FACE[2]/HAF_ROD_HOLE__P01", "#343/ADVANCED_FACE[7]/HAF_ROD_HOLE__P01"] # consumer export: two periodic patches, one label
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:33-35", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:57-59", "harmonic-analyzer/cad/scripts/cone_pivot_post_installation.py:19", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:509-518", "harmonic-analyzer/cad/scripts/_hole_spec.py:82", "harmonic-analyzer/cad/scripts/_hole_spec.py:104", "harmonic-analyzer/cad/config/title_block.yaml:52-66", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:124-126", "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:447-474", "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:539-549"]

[features.rod_hole.precision]
at = "unknown" # BASIC X/Y decimals come from the drawing template default; not stated in source
dia = 2 # callout prints Ø1.99 (rocker_arm_notes.py:36)
position_dia = 2 # "0.20" (rocker_arm_spec.py:125)

[features.hub_od]
kind = "boss"
frame = "model"
at = [0.0, 8.0, 0.0] # coaxial with the pivot axis
axis = [0.0, 0.0, 1.0]
dia = [9.692, 10.708] # note 7 HUB DIA 10.20 under the .XX general band (spec sizes the OD against that band)
dia_nominal = 10.20 # rocker_arm_spec.py:112; acceptance-band midpoint is not an authored toolpath
coaxiality_dia = 0.50 # note 7: hub OD coaxial with the pivot bore
coaxial_to = "pivot_bore"
requirements = ["dia", "coaxiality_dia"]
faces = ["#166/ADVANCED_FACE[4]/HAF_HUB_OD__P01", "#486/ADVANCED_FACE[12]/HAF_HUB_OD__P01", "#495/ADVANCED_FACE[14]/HAF_HUB_OD__P02", "#514/ADVANCED_FACE[16]/HAF_HUB_OD__P02"] # consumer export: both hubs, two patches each
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:100-112", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:25-32", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:72-76", "harmonic-analyzer/cad/config/title_block.yaml:26", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:406-434"]

[features.hub_od.precision]
dia = 2 # note prints {HUB_DIA:.2f}
coaxiality_dia = 2 # note prints {HUB_COAXIALITY_DIA:.2f}

[features.hub_faces]
kind = "face"
frame = "model"
length = [7.0565, 7.1065] # HUB_LENGTH 7.0565, band (upper 0.05, lower 0)
upper_z = 3.52825 # mid-plane extrusion, +/- HUB_LENGTH/2
lower_z = -3.52825
requirements = ["length"]
faces = ["#553/ADVANCED_FACE[18]/HAF_HUB_FACES__P01", "#448/ADVANCED_FACE[11]/HAF_HUB_FACES__P02"] # consumer export: -Z and +Z hub end planes
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:424-432", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:570-573"]

[features.hub_faces.precision]
length = 3 # apply_drawing_precision HubLength 3 (build_rocker_arm.py:583-586)

[features.strap_faces]
kind = "face"
frame = "model"
thickness = [1.992, 3.008] # note 2 STRAP 2.50 THICK under the .XX general band
upper_z = 1.25 # both-directions extrusion of ARM_THICKNESS about Z0
lower_z = -1.25
datum = "B" # one broad face; which side: datums.B.surface
requirements = ["thickness"]
faces = ["#20/ADVANCED_FACE[1]/HAF_STRAP_FACES__P01"] # consumer export: the -Z broad face only; the +Z face is exported as strap_datum_b (#492/ADVANCED_FACE[13]), not bound here
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:28", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:60", "harmonic-analyzer/cad/config/title_block.yaml:26", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:396-403"]

[features.strap_faces.precision]
thickness = 2

[features.top_edge]
kind = "profile"
frame = "model"
height_above_pivot = [8.0, 8.5] # TOP_EDGE_ABOVE_PIVOT 8.0, band (upper 0.50, lower 0); measured from pivot_bore's axis
height_from = "pivot_bore"
radius = [799.492, 800.508] # note 3 R800.00 under the .XX general band
radius_nominal = 800.0 # rocker_arm_spec.py:26,42
arc_len = [291.592, 292.608] # note 4 292.10 under the .XX general band
arc_centre = [0.0, 816.0, 0.0] # CENTER_Y = 816; not a DRO position
centre_from_pivot_ref = 808.0 # note 3 REF: no requirement
end = [145.24006587149398, 29.294640118904454] # +X arc endpoint, R800 at half-angle 292.1/1600; -X endpoint mirrors X
requirements = ["height_above_pivot", "radius", "arc_len"]
faces = ["#163/ADVANCED_FACE[3]/HAF_TOP_EDGE__P01"] # consumer export: the R800 top-edge cylinder
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:26", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:29", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:42-49", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:74-88", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:61-66", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:574-577", "harmonic-analyzer/cad/config/title_block.yaml:26"]

[features.top_edge.precision]
height_above_pivot = 2 # apply_drawing_precision TopAbovePivot 2 (build_rocker_arm.py:583-586)
radius = 2
arc_len = 2

[features.profile_outer]
kind = "profile"
frame = "model"
bottom_radius = [815.492, 816.508] # note 3 R816.00 under the .XX general band
bottom_radius_nominal = 816.0 # rocker_arm_spec.py:26-27,43
arc_centre = [0.0, 816.0, 0.0] # rocker_arm_spec.py:44
top_edge_feature = "top_edge" # paired radial land connects to this manifest boundary
bottom_arc_len = [266.192, 267.208] # note 4 266.70 under the .XX general band
tip_land = [5.08, 6.096] # TIP_FACE 5.588 (prints 5.59) under the .XX general band
land_angle_deg = "unknown" # note 5 PERP TO TOP EDGE; no stated angular limit for an implied 90°
land_angle_nominal_deg = 90.0
mirror_symmetric = true # note 1, about the pivot axis
depth_ref = 16.0 # note 3 STRAP DEPTH REF: no requirement
bottom_end = [132.75725545686896, 10.871742438784054] # +X bottom-arc endpoint
radial_tip_end = [146.25456773160636, 23.799503180135] # +X land outer end; tapered straight end runs to bottom_end
datum = "C" # the +X radial land
requirements = ["bottom_radius", "bottom_arc_len", "tip_land", "land_angle_deg", "mirror_symmetric"]
faces = ["#532/ADVANCED_FACE[17]/HAF_PROFILE_OUTER__P01", "#426/ADVANCED_FACE[9]/HAF_PROFILE_OUTER__P02", "#505/ADVANCED_FACE[15]/HAF_PROFILE_OUTER__P03"] # consumer export: the two tapers and the R816 bottom arc; the radial tip lands are exported as tip_land_pos_x / tip_land_neg_x, not bound here
cite = ["harmonic-analyzer/cad/scripts/rocker_arm_spec.py:26-31", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:42-54", "harmonic-analyzer/cad/scripts/build_rocker_arm.py:149-166", "harmonic-analyzer/cad/scripts/rocker_arm_notes.py:58-68", "harmonic-analyzer/cad/config/title_block.yaml:26", "harmonic-analyzer/cad/scripts/draw_rocker_arm.py:530-538"]

[features.profile_outer.precision]
bottom_radius = 2
bottom_arc_len = 2
tip_land = 2
land_angle_deg = "unknown"
