id = "S2"
machine = "PM-30MV"
frame = "TB"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S1"
note = "Lower side, rod-hole end still at +X. The part is turned over about X, so Y reverses from S1: in this setup the narrow rail (S1 Y 31.7..37) lies at Y -37..-31.7 and the wide rail at Y 20..28. Indicate the S1 pilot, then rough-face and finish-face the internal field to qualify the lower hub face, and rough before finishing the lower strap face and hub OD. The face rasters cut the field out to the rail walls (narrow rail Y -31.7, wide rail Y 20) and the ear walls (X ±160); the rails and ears stay full thickness. The op 50 top-edge rough uses a 1/4 in end mill, so the cutter stays at least 3.2 mm clear of the narrow rail wall (Y -31.7) at both tips. Adjust the two support jacks to just bear on the S1-finished strap without lifting the rail frame from its parallels. Spot, drill and ream the rod hole and pass its process gauge hold before opening the outer pockets; then rough the opposed pockets leaving the 0.42 mm web. Final A|B|C position inspection follows S4 land finishing."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the lower hub face; strap face ops do not move it
top_z = 4.44825 # raw model Z-8 face in frame TB (Z0 the lower hub face at the 7.080 aim): S1 leaves 11.52825 under its hub face, minus the 7.080 hub = 4.44825
bottom_z = -7.080 # S1 hub face: the op 10 measured touch sets frame B Z0 so the hub lands at the AUTHOR'S CHOICE 7.080 aim inside the drawing band
bottom_feature = "hub_faces" # the S1-faced hub face, down in S2
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.55175 # raw model Z+8 face (the S1 raw top) in frame TB: 4.44825 - 16.0 raw thickness; rails, not the faced hub, seat on the supports

[setups.stock_state.local_thickness]
rod_hole = 2.5235 # AUTHOR'S CHOICE derived: 7.080 hub aim minus the two 2.27825 hub-proud steps (S1 op 25, S2 op 20)

[setups.stock_state.local_thickness_cite]
rod_hole = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"

[setups.stock_state.entry_z]
rod_hole = -2.27825 # lower strap face, uppermost in frame B

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "rocker-riser-bars"
riser = "rocker-riser-bars"
riser_up = "height"
riser_along = "length"
riser_centres_mm = [[-40.0, -4.5], [40.0, -4.5]] # author's choice, frame B (Y flipped)
parallels_centres_mm = [[0.0, -34.5], [0.0, 25.5]] # author's choice, wholly under retained rails
clamps = [
  { ref = "rocker-s2-support-jack", restraint = "none", pose = { origin_mm = [40.0, -1.0, -4.80175], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, -1.0] }, note = "passive upward-bearing support jack, not a clamp; adjust to touch the finished strap without lifting the rail frame, then lock the jack" },
  { ref = "rocker-s2-support-jack", restraint = "none", pose = { origin_mm = [-40.0, -1.0, -4.80175], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, -1.0] }, note = "mirrored support jack, adjusted and locked independently without preload" },
]
clamp_order = [] # the jack entries are passive supports, not tightening actions
grip_on = "full-thickness rectangular rails and ears"
grip_mm = 6.0 # author's choice, minimum vertical jaw engagement on the full-thickness retained rails/ears
jaw_above_parallels_mm = 6.8453 # nominal stack: 44.9453 measured jaw - 25.4 example riser - 12.7 example parallel
jaw_center_along_mm = 0.0369 # set by the end stop: its 90.7 nose reach off the fixed jaw's left end puts the blank end at X-170, so the jaw end is at X-79.3 (jaws 158.6738 wide)
stop_fixture = "rocker-vise-stop"
stop_pose = { origin_mm = [-79.3, 28.0, -4.70645], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
stop = "switch on the magnetic fixed-jaw end stop and bring the left blank end gently against its nose; then indicate the pilot to transfer datum"
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Seat the retained rails, not the thin strap or a hub rim. Risers: the same matched O1 pair as S1 (76.2 along the jaws x 63.5 across x 25.4 high, heights within 0.01), on the vise floor centred X -40 and X +40, Y -4.5 in this frame; parallels on the risers under the rails at Y -34.5 and Y 25.5. Use light conventional cuts at the outboard tips; stop and resolve chatter before deepening the cut."

[setups.zero]
# Op 10 is the 4fl finisher's first cut: its Z is set from the measured hub
# length so the finished hub lands at the AUTHOR'S CHOICE aim of 7.080 mm.
[[setups.zero.tool_touches]]
tool = "endmills-lms-6784/3-8in-4fl"
z_face = "hub_faces"
method = "measure_then_set"
edge_mm = 0.20 # nominal op-5 face; the Axis Set uses the measured length
paper_mm = 0.05 # author's choice
z_gauge = "micrometers/0-1in"
z_measure = "hub length, S1 hub face to the op-5 face"
z_offset_mm = -7.080 # AUTHOR'S CHOICE: finished hub length aim inside the drawing band
before_ops = [10]

[setups.zero.transfer]
from = "S1"
indicate = "pivot_bore" # the S1 pilot
tool = "rocker-datum-indicator"
runout_limit_mm = 0.02 # authored pilot-pickup TIR criterion, not a drawing tolerance or a measured reading

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0 # frame B origin is on the pivot axis
radius_mm = 0.0 # indicated centre, no finder radius
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-2fl" # op 5 rougher touches the raw top first
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 15, 20, 28, 29, 32, 33, 34, 40] # retouch before each changed cutting tool, including every rod-hole tool, the return to the rougher and the 1/4 in top-edge rougher; op 10's tool is set by the measured touch above

# Frame B reverses Y: op 5 and op 10 face the walled internal field between the
# lower rail Y 20..28 and the upper rail Y -37..-31.7, inside the ears outside
# X ±160. The raster's cutter edge finishes on those walls (pass ends X ±155.235 put
# the Ø9.525 edge 0.0025 short of X ±160), so each box is its coverage.
[[setups.ops]]
op = 5
do = "rough_face"
feature = "hub_faces"
faces = ["#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"] # exported -Z hub end, upward in frame B
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.20 # author's choice, finish hub face Z0 + 0.20 allowance
rough_allowance_mm = 0.20 # author's choice, same leave as the strap and profile roughs
doc_mm = 1.5 # author's choice, largest step per pass over the 4.24825 mm from the raw top
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the retained rails
note = "Field raster: passes along X, stepping from the narrow rail (Y -31.7) toward the wide rail (Y 20). The field is walled on all four sides, so at every pass start plunge the centre-cutting end mill straight down to the level Z at light quill feed, then feed the pass; lift to the retract Z and rapid back to the next start. The cutter edge finishes on the rail walls and ear walls; the rails and ears stay at raw height. Then mic the hub length from the S1 hub face to this face, clear of burrs: the op 10 Z re-touch is set from that reading."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.4725, 150.4725], y = [-26.935, 15.225], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: on-grid rows Y -26.935..15.225 at 5.270 (55% of the 9.525 cutter), pass ends X ±155.235; the cutter edge stops 0.0025/0.0125 short of the rail walls Y -31.7/20 and 0.0025 short of the ear walls X ±160
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [0.0, 5.0] }

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"] # exported -Z hub end, upward in frame B
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # lower hub face; Z0 is set from the measured hub length before op 10
doc_mm = 0.3 # author's choice: one level removes the measured stock left by op 5 (0.20 nominal, up to 0.30 on a thick blank)
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the retained rails
note = "Finish raster: the same passes as op 5 at one depth to Z 0, after the measured Z re-touch; plunge at each pass start as in op 5."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.4725, 150.4725], y = [-26.935, 15.225], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: same on-grid rows and pass ends as op 5
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [0.0, 5.0] }

[setups.ops.checks]
length = "micrometers/0-1in"

[[setups.ops]]
op = 15
do = "rough_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825
rough_allowance_mm = 0.20
direction = "conventional"
doc_mm = 1.5 # author's choice, largest step per pass over the 2.07825 mm below Z0
approach_mm = 5.0
note = "Field raster round the hub island on the supported lower strap: the same passes as op 5 at each level, leaving 0.20 mm for the finish pass. The Ø11.0 island keep-out (hub Ø10.2 plus 0.20 rough allowance and 0.20 clearance a side) splits each pass that crosses it: stop at the listed end, lift over the island, rapid to the next piece and plunge again. The corners left round the island lie within R7.4 of the pivot axis: the op 28 stairs rough them and op 29 finishes them down to the strap face."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.4725, 150.4725], y = [-26.935, 15.225], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 11.0 }] } # AUTHOR'S CHOICE: op 5 rows and pass ends; island keep-out about the pivot axis
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [-2.27825, 5.0] }

[[setups.ops]]
op = 20
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm left by op 15
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Finish raster: the op 15 rows at one depth, removing the 0.20 mm left by op 15; plunge at each piece start. Its Ø10.6 island keep-out (hub Ø10.2 plus the 0.20 rough allowance a side) ends each piece 0.20 nearer the hub than op 15, so the finisher also takes op 15's 0.20 clearance ring down to this face. It leaves corners round the island, within R7.3 of the pivot axis, standing to the hub face: the op 28 stairs rough them to 0.20 above this face and the op 29 clean-up finishes them."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.4725, 150.4725], y = [-26.935, 15.225], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: op 15 rows and pass ends, island at the hub's 0.20 leave so the finisher never cuts the allowance the S3F file takes
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [-2.27825, 5.0] }

[[setups.ops]]
op = 25
do = "inspect"
feature = "strap_faces"
note = "Check the strap thickness with a micrometer after finishing both sides; measure clear of the hub, support contacts and edge burrs."
[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 28
do = "rough_profile"
feature = "hub_od"
faces = ["#518/ADVANCED_FACE[16]/HAF_HUB_OD__P01", "#539/ADVANCED_FACE[17]/HAF_HUB_OD__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # AUTHOR'S CHOICE: 0.20 above the finished strap face Z-2.27825, because a rough op leaves its 0.20 allowance on the strap face as on the hub wall; op 29 finishes the strap face round the hub
doc_mm = 1.5 # author's choice, same axial step as the op 15 face rough
rough_allowance_mm = 0.20
direction = "conventional"
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap for the S3F buttons
note = "Lower hub island about the transferred pilot axis; filed round to the buttons in S3F after the bore is reamed. The stairs also rough the corners the op 15/20 rasters leave round the island, within R7.4 of the pivot axis, down to 0.20 above the strap face."

[[setups.ops]]
op = 29
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # lower strap face, as op 20
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm the op 28 stairs leave on the strap face
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Corner clean-up round the hub: rows along Y at the strap face, 1.95 mm apart, each split round the same Ø10.6 island as op 20 (stop at the listed end, lift over the island, rapid to the next piece and plunge again). They cross the op 20 rows and finish the corners op 20 left round the island, which the op 28 stairs roughed to 0.20 above this face. Then mic the strap thickness clear of the hub."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-11.7, 11.7], y = [-8.0, 8.0], z = [-2.27825, 5.0] }, open_side = "-x", step_mm = 2.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: rows along Y because they cross the op 20 X rows, and 13 rows X -11.7..11.7 at 1.95 because a straight raster round a round island leaves corners between its piece ends; with op 20 these rows leave stock outside the island only within R5.50 of the pivot axis, inside the 0.5 filing cap the S3F file takes off the hub
stock_removal_bounds = { x = [-8.0, 8.0], y = [-8.0, 8.0], z = [-2.27825, 5.0] } # the op 20 corners lie within R7.3; outside this box op 20 already finished the face

[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 32
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot from the lower strap face in frame B, inside the #2 pilot length (1.98 mm, Machinery's Handbook 27th ed. Table 6 p.873)
approach_mm = 5.0

[[setups.ops]]
op = 33
do = "drill"
feature = "rod_hole"
tool = "rocker-rod-pilot-drill/1.85mm" # illustrative metric purchase, 0.154 mm diametral (0.077 mm, .0030 in, radial) stock for the 2.004 reamer, inside Machinery's Handbook 27th ed. p.1133 reamer depth of cut .003-.004 in for holes 1/8 in or less
holder = "drill-chuck-r8"
exit_mm = 1.5 # author's choice, full drill diameter beyond local strap exit
approach_mm = 5.0
note = "Drill the undersize pilot while the full-thickness outside stock still supports the strap; do not expect a twist drill to hold the reamed rod-hole size the S3/S4 orientation pin needs."

[[setups.ops]]
op = 34
do = "ream"
feature = "rod_hole"
tool = "rocker-rod-reamer/2.0mm" # illustrative purchase, 2.004 mm example working diameter
holder = "drill-chuck-r8"
exit_mm = 1.5 # clears the 0.4 mm lead beyond the 2.5235 mm strap (7.080 hub aim)
approach_mm = 5.0
note = "Ream through the strap while the full-thickness outside stock still supports it."
inspection_note = "Gauge before op 40. If the hole fails a drawing plug or the process hold, stop; do not open the outer pockets until the hole is resolved."
process_holds = [{ feature = "rod_hole", requirement = "dia", band = [2.000, 2.010], gauge = "rocker-rod-limit-gauges", go_no_go = { go = 2.000, no_go = 2.010 }, reason = "AUTHOR'S CHOICE: the S3/S4 diamond pin is an in-process orientation locator in this hole (not datum C); a looser hole spends the S4 position budget" }]
go_no_go = { dia = { go = 2.000, no_go = 2.090 } } # drawing band as printed, 2.00-2.09

[setups.ops.checks]
dia = "rocker-rod-limit-gauges" # three plugs: GO 2.000 (drawing and process hold), process NO-GO 2.010, drawing NO-GO 2.090

[setups.ops.inspection_methods]
dia = "Plug-gauge after deburring both mouths. The drawing GO plug (2.000) must pass by hand through the strap. Offer the drawing NO-GO plug (2.090) gently at each mouth, then the process-hold NO-GO plug (2.010): neither may enter. Never force a plug."

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # AUTHOR'S CHOICE: 3.32825 below each hub face from both sides leaves a 0.42 mm web at the 7.080 hub aim
doc_mm = 1.5 # author's choice, same axial step as the face roughs
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.4 } # AUTHOR'S CHOICE: stairs because the R816 arc and tapered ends need two handwheels at once otherwise; S4 op 27 re-roughs the same faces, so the cusp may exceed the filing cap here
note = "Bottom arc, radial lands and tapered ends; rails and ears stay continuous. Work the stair tables in this order: +X join, bottom arc, -X join. Enter each table from the scrap side; never plunge beside the part edge. Move one handwheel at a time to each listed point at the listed Z. Retract clear of stock and fixturing before moving to the next table."
# Frame B reverses Y: the complete upper-land cutter corridor reaches -26.9581.
# It overlaps op 50's top-edge pocket; rails remain Y20..28 and -37..-31.7,
# ears remain outside X ±160, and the opposed cuts retain the 0.42 mm web.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-27.0, 20.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/1-4in-2fl" # AUTHOR'S CHOICE: the 1/4 in rougher keeps the tip-corner sweep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # AUTHOR'S CHOICE: 3.32825 below each hub face from both sides leaves a 0.42 mm web at the 7.080 hub aim
doc_mm = 1.5 # author's choice, same axial step as the face roughs
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.4 } # AUTHOR'S CHOICE: stairs because the R800 edge needs two handwheels at once otherwise; S4 op 25 re-roughs it, so the cusp may exceed the filing cap here
# Upper-rail material remains frame-B Y -37..-31.7; the cutter's whole
# swept diameter stays inside the clearing box and outside the rail.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, -3.24], z = [-3.32825, 5.0] }


# ---------------------------------------------------------------- S3
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S2"
note = "Strap-held ream setup: tram the plate and indicate the empty plate bore before loading. Lower the blank straight down over the permanent rod-hole diamond pin onto the lower-strap support pads; with the strap seated, build the hub shim stack to the gap under the lower hub face, then match the rail-rest shims, all without lifting the part. Indicate the D pilot and confirm its centre is within 0.20 mm radial of the empty plate-bore reference before tightening. If the rod hole will not drop over the pin with the pilot inside 0.20 mm, stop and inspect S2 hole spacing; do not force it. Re-indicate the pilot as working A, then ream without relocating. The fixture's Z figures are drawn for the CAD part at the bottom of the hub-length band; the 7.080 part sits 0.0235 higher on the same pads and hub shims, so touch Z on its upper hub face, never on the plate. Remote studs and stepped straps clear the raw rails; do not profile across these straps. The pin stays fitted for S4."

[setups.stock_state]
top_feature = "hub_faces" # Z touches the upper hub face
top_z = 0.0 # upper hub face (S1 op 10)
bottom_z = -7.080 # lower hub face (S2 op 10) at the AUTHOR'S CHOICE 7.080 hub-length aim, inside the 7.0565-7.1065 band
bottom_feature = "hub_faces" # the seated lower hub face
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # the raw rail frame seats on the fixture's outer rests

[setups.stock_state.local_thickness]
pivot_bore = 7.080 # bore runs the full hub length at the 7.080 aim

[setups.stock_state.local_thickness_cite]
pivot_bore = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:542-544"

[setups.stock_state.entry_z]
pivot_bore = 0.0

[setups.hold]
fixture = "rocker-profile-fixture" # illustrative example fixture (inventory solids)
pose = { origin_mm = [0.0, 0.0, -0.0235], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # fixture frame = frame A of the CAD (7.0565) hub; the 7.080-aim hub stands 0.0235 higher above the pads
clamps = [
  { ref = "rocker-hub-strap", pose = { origin_mm = [70.0, 3.27, -2.27825], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "rod-side supported toe; bridge clears the raw rail and the stud is outside the blank at Y45" },
  { ref = "rocker-hub-strap", pose = { origin_mm = [-70.0, 3.27, -2.27825], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored supported toe and remote stud" },
  { ref = "rocker-rod-diamond-pin", restraint = "locate", pose = { origin_mm = [133.06740213488345, 8.456064115939025, -4.80175], x = [0.9979869699018047, 0.06341930231573287, 0.0], z = [0.0, 0.0, -1.0] }, note = "permanently fitted in-process orientation locator in the rod hole, unchanged for S4; not datum C; no clamp or lift load" },
]
clamp_order = [1, 2] # only the two hub straps tighten; the permanent pin is a locator
locate = "first tram the plate with its hold-down screws snug: sweep a dial test indicator along its milled -Y reference edge (the edge its bore and pin hole were positioned from) from X -150 to X 150, tap it until the reading varies by no more than 0.01 mm, tighten the four hold-down screws and re-check; then indicate the empty plate bore and retain its X/Y reference; lower the blank straight down over the permanent rod-hole pin onto the pads and indicate the D pilot"
supports = "not_applicable" # the fixture's own support pads carry the strap
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable" # author's choice, supported plate/strap contacts, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "before tightening the straps, confirm the indicated pilot is within 0.20 mm radial of the empty plate-bore reference; then re-indicate the pilot as working datum A" # author's clearance control, not a drawing tolerance
clamp = "two stepped padded straps on upper datum face B, remote studs outside the retained rail frame; supported toes, no stud through the part"
note = "The permanent pin and coarse arm alignment keep the part over its twelve support pads and the strap toes on face B; they do not establish datum C. Seat the lower strap face first, then build the hub shim stack and match the shimmed rail rests to the actual raw rails without lifting the part. The 8 mm stand relief clears the reamer after the 0.20 mm placement check."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.transfer]
from = "S2"
indicate = "pivot_bore"
tool = "rocker-datum-indicator"
runout_limit_mm = 0.02 # same drilled-pilot pickup criterion before the in-place pivot ream

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "reamers-metric/6.5mm" # the only cutter in this setup since the hub moved to the S3F buttons
check_jog_mm = 10.0 # author's choice
retouch_after = []

[[setups.ops]]
op = 20
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, past the 1.0 mm reamer lead
approach_mm = 5.0
note = "Indicate the pilot centre before reaming and record it; re-indicate the reamed bore after op 20 and record the centre shift ______. PROCESS STOP (not a drawing limit): if the reamed centre has moved more than 0.020 mm radially from the pilot, stop the batch; the shift would carry pilot error into datum A and the rod-hole position."

[setups.ops.checks]
dia = "rocker-bore-limit-gauges" # calibrated example GO 6.500 / NO-GO 6.530 plugs
finish_ra = "roughness-comparator"

# ---------------------------------------------------------------- S3F
# EngManualArc: bench filing of the hub OD to filing buttons on the reamed bore A.
[[setups]]
id = "S3F"
machine = "fitting-bench"
frame = "TA"
stock_in = "S3"
coolant = "none: bench filing"
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
note = "AUTHOR'S CHOICE: File the hub round to the filing buttons because the reamed bore A is their pin, so the hub comes out coaxial with A without indicating anything. Off the S3 fixture, clamp the buttons on both hub faces through bore A and grip the stud tail upright in the bench vise."

[setups.stock_state]
top_feature = "hub_faces"
top_z = 0.0 # upper hub face, under the top button
bottom_z = -7.080 # lower hub face, on the lower button, at the AUTHOR'S CHOICE 7.080 hub-length aim
bottom_feature = "hub_faces" # the seated lower hub face
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # the raw rail frame is still on; it is removed in S4 op 27

[setups.hold]
fixture = "bench-vise-4in"
pose = { origin_mm = [0.0, 0.0, -31.0235], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # AUTHOR'S CHOICE: jaw tops about 20 mm below the rail frame, closed on the stud tail, its end on the vise body
clamps = [
  { ref = "rocker-hub-filing-buttons", restraint = "press", tighten = "hand", pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "stud through reamed bore A, one button on each hub face, nut over the spacer sleeve" },
]
clamp_order = [1]
support = "none"
grip_on = "AUTHOR'S CHOICE: the button stud tail in the vise jaws; the part is clamped between the buttons and never touches the jaws"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: none; steady the arm by hand against the file stroke"
clamp = "1/4-20 nut on the button stud over the spacer sleeve, hand tight, pressing the buttons on the two hub faces"

[[setups.ops]]
op = 10
do = "file_to_line"
feature = "hub_od"
guide = { buttons = "rocker-hub-filing-buttons", bore = "pivot_bore", gauge = "radius-gauge" } # AUTHOR'S CHOICE: buttons because the reamed bore centres them; the radius gauge checks the round
note = "File the upper hub projection, then the lower one, each down to its own hardened button rim: lay a safe-edge hand file flat on that button's rim with the safe edge running on the strap face, so the strap is never cut, and work round the projection in short strokes kept inside the scrap rails; stop when the file rides on the button all round without cutting."

[setups.ops.checks]
dia = "calipers" # illustrative example gauge for the drawing's 1.02 mm OD band; S4 op 60 checks coaxiality to the reamed bore

# ---------------------------------------------------------------- S4
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush"
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S3F"
note = "Lower the part from S3F straight down over the permanent rod-hole pin onto the support pads and the hub shim stack built in S3 (re-feeler it; rebuild it if a feeler enters under the hub). Fit the shoulder screw and washer through the reamed pivot bore. Match each shimmed rail rest to the actual raw rail without lifting the part. Rotate the part counterclockwise viewed from above (looking down setup -Z) to preload the rod hole against the closing-cut side of the pin, then tighten the shoulder screw and washer. Indicate the lapped screw head after tightening to establish the fixture axis; the head is coaxial with the shoulder, not an exposed part-bore touch. Clamp the scrap rails independently. Touch Z on an unobstructed upper strap patch, not the washer-covered hub. Scribe the outline from the template (ops 10 and 20), rough it outside the line in stairs with light conventional passes (ops 25 and 27), then file it to the line (ops 30 and 40); ops 25 and 27 use a 1/4 in end mill so the cutter keeps clear of both rail walls."

[setups.stock_state]
top_feature = "hub_faces"
top_z = 0.0
bottom_z = -7.080 # lower hub face at the AUTHOR'S CHOICE 7.080 hub-length aim
bottom_feature = "hub_faces" # the seated lower hub face
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # scrap rails remain seated and independently clamped through outline release

[setups.stock_state.entry_z]
# Along the outline the stock top is the upper strap face: the hub island is inside it
# and the retained rails and ears are clear of the whole cutter sweep.
top_edge = -2.27825
profile_outer = -2.27825

[setups.hold]
fixture = "rocker-profile-fixture"
pose = { origin_mm = [0.0, 0.0, -0.0235], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # as S3: pad tops at the 7.080-aim lower strap face
clamps = [
  { ref = "rocker-pivot-screw", restraint = "press", pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "lapped locating shoulder through reamed datum A; bored washer clamps the hub" },
  { ref = "rocker-rod-diamond-pin", restraint = "locate", pose = { origin_mm = [133.06740213488345, 8.456064115939025, -4.80175], x = [0.9979869699018047, 0.06341930231573287, 0.0], z = [0.0, 0.0, -1.0] }, note = "in-process orientation locator (positive tangential stop), not datum C; radial flats allow centre-distance variation, the collar seats on the plate, and the pin carries no clamp or lift load" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [70.0, 34.5, 4.47175], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "upper scrap rail held on its own rest; stud outside the blank" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [-70.0, 34.5, 4.47175], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored upper scrap rail hold-down" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [70.0, -25.5, 4.47175], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "lower scrap rail held on its own rest; stud outside the blank" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [-70.0, -25.5, 4.47175], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored lower scrap rail hold-down" },
]
clamp_order = [1, 3, 4, 5, 6] # shoulder screw first, then the four scrap hold-downs; pin 2 never tightens
preload_direction = "counterclockwise" # viewed from above, looking down setup -Z
locate = "reamed bore A on the shoulder screw, lower strap face on support pads, rod hole on the diamond pin as the in-process orientation locator (datum C is the finished land, not the pin)"
supports = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "shoulder screw locates A; preload counterclockwise against the diamond pin before tightening; its radial flats allow centre-distance variation"
clamp = "washer and shoulder screw prevent hub lift; pads carry Z; separate toe clamps retain both scrap rails on matched shimmed rests"
note = "The part and scrap frame are held independently. The web transmits early profile loads to the clamped frame; the hardened diamond pin is an in-process orientation locator, not datum C: it is the positive tangential stop during and after the closing cut in op 27. Keep every scrap clamp tight through op 27. The pin's clearance in the rod hole (S2 op 34 process hold) is part of the orientation budget."

[setups.zero]
tool_touches = []

[setups.zero.transfer]
from = "S3"
indicate = "lapped head of the shoulder screw" # indirect fixture-axis pickup; actual A is checked off-machine
tool = "rocker-datum-indicator"
runout_limit_mm = 0.01 # authored ground-head axis pickup criterion; the 1 µm indicator is labelled illustrative inventory

[setups.zero.x]
edge = "lapped_shoulder_screw_head_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "lapped_shoulder_screw_head_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "strap_datum_b"
edge_mm = -2.27825 # source-backed upper strap station in frame A; the washer covers the hub touch face
# Paper-touch a clear upper strap patch at X40, away from the hub washer and fixture hardware.
method = "paper"
paper_mm = 0.05
tool = "endmills-lms-6784/1-4in-4fl"
check_jog_mm = 10.0
retouch_after = []

[[setups.ops]]
op = 10
do = "scribe"
feature = "top_edge"
layout = "template" # AUTHOR'S CHOICE: template because an R800 line is beyond any trammel on this bench
guide = { template = "rocker-outline-template" }
note = "Outline template (make before S4; a scribing template, not the op 30 profile template, which is the inspection gauge): a 1.5 thick O1 gauge-plate cut-out of the finished rocker outline, its edges ON the nominal outline within 0.02. The nominal outline, from the bore A axis with Y toward the arc centre: top edge R800.00 about X 0, Y 808.00, from X -145.240, Y 21.295 to X 145.240, Y 21.295; at each end a 5.59 radial land to X ±146.255, Y 15.800; a straight taper to X ±132.757, Y 2.872; bottom arc R816.00 about the same centre between those two points (Y -8.00 at X 0). AUTHOR'S CHOICE: wire-EDM cut by an outside shop to these dimensions, because no machine here holds an R800 line to 0.02. Over the hub it has a Ø14.1 hole with a Ø14 x 7.8 long steel bush bonded in it, flush with the template underside: a Ø11 clearance bore 3.9 deep clears the hub and the Ø9 washer, then an 8.000-8.015 bore 3.9 long slips over the Ø8 shoulder-screw head. At X 133.067, Y 8.456 from the bush axis it has a Ø2.0 sight hole over the rod hole. Lay-out: blue the upper strap face; drop the bush over the screw head so the template lies flat on the strap face; turn it until the rod hole shows concentric through the sight hole (the pin tip ends 0.12 below the strap face); hold it down by hand and scribe the top edge along the template edge."

[[setups.ops]]
op = 20
do = "scribe"
feature = "profile_outer"
layout = "template" # AUTHOR'S CHOICE: template because the R816 arc's centre is 808 mm off the part
guide = { template = "rocker-outline-template" }
note = "Without moving the template, scribe the bottom arc, the tapered ends and both tip lands; lift the template off."

[[setups.ops]]
op = 25
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/1-4in-4fl" # AUTHOR'S CHOICE: the 1/4 in finisher keeps the tip-corner sweep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, 1.2265 below the lower strap face Z-4.80175 at the 7.080 hub aim
exit_mm = 1.2265 # author's choice, through the 2.5235 mm strap; fixture base top is frame-A Z -15.00
doc_mm = 3.75 # author's choice: one full-depth finish level from the strap face (0.20 radial)
rough_allowance_mm = 0.20 # AUTHOR'S CHOICE: the 0.20 radial the earlier roughs left, kept for the file
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap
note = "Rough the top arc outside the scribed line in stairs with light conventional passes. Its two endpoints are the joins for op 27; this cut does not complete the outline release. It passes more than 9 from the LOC2 rod-hole pin; the nearest cut to the pin is op 27's +X join. Keep every scrap-rail clamp tight for the closing stairs in op 27."

[[setups.ops]]
op = 27
do = "rough_profile"
feature = "profile_outer"
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/1-4in-4fl" # AUTHOR'S CHOICE: same 1/4 in end mill as op 25; its join corners near the tips keep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, 1.2265 below the lower strap face Z-4.80175 at the 7.080 hub aim
exit_mm = 1.2265 # author's choice, same through-profile depth as op 25
doc_mm = 3.75 # author's choice: one full-depth finish level, same as op 25
rough_allowance_mm = 0.20 # AUTHOR'S CHOICE: the 0.20 radial the earlier roughs left, kept for the file
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap
note = "Work the stair tables in this order: -X join, bottom arc, +X join; the joins meet the op 25 top-arc end points. The outline releases during this op. Enter each table from the scrap side; never plunge beside the part edge. Move one handwheel at a time at the listed Z, pushing into the counterclockwise-preloaded pin contact. Retract clear of stock and fixturing before moving to the next table. LOC2 clearance: the +X join passes the pin's bare Ø1.987 gauge-pin shank (no neck: the pin stands straight out of the collar) at 3.017, the distance the CLEARANCE table and the holding picture give (to the pin's Ø2.0035 contact cylinder; the real Ø1.987 shank clears 0.008 more), set by the part's own web between the rod hole and the outline plus the 0.20 left for the file, at nominal positions; worst case about 0.07 less (plate hole position ±0.02, bond eccentricity 0.012, shank gap 0.01, zero and DRO 0.01, cutter runout and diameter 0.016). The Ø4.5 collar lies wholly below the cutter tip (collar top Z -9.1, cutter tip Z -6.025: 3.07 clear). Before cutting the +X join, with the spindle stopped, jog the cutter at the listed Z to the rows nearest the pin and pass a 0.090 in (2.286) gauge pin between cutter and pin at each, about 0.67 under the worst-case gap (3.025 - 0.07); if it does not pass, stop and re-check the zero. Keep every scrap-rail clamp tight until the op is complete and the cutter is retracted, then remove the scrap. The diamond pin takes the closing-cut load; the shoulder screw and washer prevent lift and the pads carry Z."

[[setups.ops]]
op = 30
do = "file_to_line"
feature = "top_edge"
guide = { template = "rocker-outline-template", gauge = "rocker-profile-template" } # AUTHOR'S CHOICE: file to the scribed line because chords would slant across both handwheels and the R800 centre is off any rotary table
note = "Draw-file the top arc down to the op 10 line, the file square to the strap faces; the part stays on the screw, pin and pads."

[setups.ops.checks]
height_above_pivot = "rocker-profile-template" # final bench inspection on a 6.5 mm pin after removing the fixture screw
radius = "rocker-profile-template"
arc_len = "rocker-profile-template" # engraved arc-length limit lines on the template's top blade
[setups.ops.inspection_methods]
height_above_pivot = [
  "Profile template (make before S4; example dimensions, plausible, not measured; AUTHOR'S CHOICE: made to order by the same outside wire-EDM shop as the S4 op 10 outline template, because the shop cannot hold the R799/R817 blade edges to 0.01): ground steel base plate 380 x 110 x 12.7 with a pressed 6.500 h6 pivot pin, a 2.000 diamond pin with radial flats at X 133.067, Y 8.456 from the pivot pin (the nominal rod hole) and a Ø14 x 3 deep relief under the hub.",
  "Template blades: two 2.0 blades, doweled and screwed round the part position, each working edge 1.00 outside the nominal outline given at S4 op 10: top blade R799.00 and bottom blade R817.00, both about the arc centre 808.00 above the pivot pin, each blade edge within 0.01 of its radius.",
  "Template engraving: gap stations on the top blade at X 0, ±40, ±80, ±120 and ±140 and on the bottom blade at X 0, ±40, ±80 and ±120 from the pivot pin; arc-length limit lines, radial through the arc centre, on the top blade at X ±144.808 and ±145.309 from the pivot pin (top-edge arc length 291.59 and 292.61) and on the bottom blade at X ±132.668 and ±133.172 (bottom arc length 266.19 and 267.21).",
  "Template calibration report (supplied with the template by its maker; re-checked yearly): at every gap station, the blade edge's actual deviation d from its radius, + outward (away from the arc centre), each within ±0.01; and the top blade's actual height over the pivot pin at X 0, H (nominally 9.00). The checks below use these actual values, so the drawing limits are the acceptance limits.",
  "The kit also holds a loose land square (ground steel block with a 40 long convex R800.00 stock face ground with the top blade, and a 12 blade square to the stock face at its end within 0.01 over 10) and a 0.02 to 1.00 feeler set.",
  "Set-up, after op 40: clean the part and the template. Lower the part over both pins onto its lower strap face with the hub in the relief, turn it counterclockwise against the diamond pin and hold it down by hand.",
  "At the X 0 station, find the thickest feeler stack, built in 0.01 steps, that enters between the top blade and the top edge: {g}. Copy the template's H from its calibration report: {H}.",
  "Calculate: the top edge lies between H - g - 0.01 = {low} and H - g = {high} over the pivot (the 0.01 is the feeler step). Accept if low is at least 8.00 and high at most 8.50, the drawing's limits. If either limit falls between low and high, the reading cannot decide: tag the part HOLD with the readings for the shop owner; it is not accepted or scrapped on this reading.",
]
radius = [
  "Same template set-up as height over pivot. The top edge must lie between R799.49 and R800.51 about the template centre (title-block ±0.51 on R800, no CR); with the blade at R799 + d, the gap there must be 0.49 - d to 1.51 - d.",
  "At each top-blade gap station (X 0, ±40, ±80, ±120, ±140), find the thickest feeler stack, in 0.01 steps, that enters: {g at each station}. Copy that station's d from the calibration report: {d at each station}.",
  "Calculate at each station: the edge lies between R799 + d + g and R799 + d + g + 0.01 = {low, high at each station}. Accept if every low is at least 799.49 and every high at most 800.51; if a limit falls between low and high at any station, tag the part HOLD with the readings for the shop owner.",
  "Between stations, slide the thinnest station's stack along the blade, tip to tip, and look for light under it where the gap narrows: {no narrower spot, OK / not OK}; if it binds anywhere, gauge that spot as a station using the nearer station's d.",
]
arc_len = [
  "Same template set-up. Each top-edge tip corner must lie between the top blade's two engraved arc-length lines at its end.",
  "+X corner between its lines: {+X, OK / not OK}.",
  "-X corner between its lines: {-X, OK / not OK}.",
]

[[setups.ops]]
op = 40
do = "file_to_line"
feature = "profile_outer"
# The op 40 filing finishes both exported radial lands, including rod-side datum C.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
guide = { template = "rocker-outline-template", gauge = "rocker-profile-template" } # AUTHOR'S CHOICE: file to the scribed line because chords would slant across both handwheels and the R816 centre is off any rotary table
note = "Draw-file the bottom arc, the tapered ends and both tip lands down to the op 20 line, the file square to the strap faces; the part stays on the screw, pin and pads."

[setups.ops.checks]
bottom_radius = "rocker-profile-template"
bottom_arc_len = "rocker-profile-template"
[setups.ops.inspection_methods]
bottom_radius = [
  "Same profile-template set-up as S4 op 30, after op 40. The bottom edge must lie between R815.49 and R816.51 about the template centre (title-block ±0.51 on R816, no CR); with the blade at R817 + d (d + outward), the gap there must be 0.49 + d to 1.51 + d.",
  "At each bottom-blade gap station (X 0, ±40, ±80, ±120), find the thickest feeler stack, in 0.01 steps, that enters: {g at each station}. Copy that station's d from the calibration report: {d at each station}.",
  "Calculate at each station: the edge lies between R817 + d - g - 0.01 and R817 + d - g = {low, high at each station}. Accept if every low is at least 815.49 and every high at most 816.51; if a limit falls between low and high at any station, tag the part HOLD with the readings for the shop owner.",
  "Between stations, slide the thinnest station's stack along the blade, end to end: {no narrower spot, OK / not OK}; if it binds anywhere, gauge that spot as a station using the nearer station's d.",
]
bottom_arc_len = [
  "Same template set-up. Each bottom-arc end must lie between the bottom blade's two engraved arc-length lines at that end.",
  "+X end between its lines: {+X, OK / not OK}.",
  "-X end between its lines: {-X, OK / not OK}.",
]

[[setups.ops]]
op = 43
do = "inspect"
feature = "tip_land_pos_x"
note = "After the op 40 filing, check the rod-hole-end land width and its 90° angle to the top edge."
[setups.ops.checks]
tip_land = "calipers" # author's choice
land_angle_deg = "rocker-profile-template" # the kit's loose land square, bedded on the part's own top edge, against the title-block ±1° band
[setups.ops.inspection_methods]
land_angle_deg = [
  "Take the part off the profile template onto a clean bench.",
  "Bed the land square's R800 stock face on the part's top edge, the blade end at the +X tip corner and the blade across the +X land. The square registers on the top edge, so hole clocking does not affect the reading.",
  "Feeler the gap between blade and land at the land's top-edge end {gap at top} and at its bottom-edge end {gap at bottom}.",
  "Calipers: measure the land length between those two feeler stations {L}.",
  "Calculate: allowed = L x tan 1° = L / 57.29 = {allowed} (the drawing's 89° to 91°).",
