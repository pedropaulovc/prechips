# rocker-arm process plan (PLAN.md rev 6 §3.1), M1 reference fixture.
# The three-setup route is the rev-3 fixture's (vise S1 upper side, vise S2
# flipped lower side, supported fixture S3 finish), kept whole. Blank, placement
# and 0.20 mm allowances are restored from rev 3; other process decisions marked
# author's choice are proposals, not measured stock or inventory facts.
# RPM/feed come from the illustrative example cutting data; the R8 drill chuck,
# 6.5 H7 reamer and supported profile fixture are illustrative example items.
part = "rocker-arm"
features = "features.toml"
construction = "one_piece"   # author's route: all rocker features cut from one prepared blank
quantity = 20
quantity_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:5"

[drawing]
number = "MHA-071"
revision = "v40" # source manifest revision; illustrative plan, not released or approved
cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:2", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "1018 low-carbon steel" # rev-3 author's pick inside the drawing's family; not a sourced grade
material_verify = false # illustrative example: 1018 accepted for the pilot
drawing_material = "LOW-CARBON STEEL OR GRAY IRON"
material_cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:3", "harmonic-analyzer/cad/config/parts/_defaults.yaml:25-27", "rev-3 rocker-arm/plan.yaml:7"]
form = "rectangular_blank" # rev-3 prepared blank with rectangular reference edges; no stock on hand claimed
form_verify = false # illustrative example: prepared blank accepted for the pilot
section_mm = [45.0, 16.0] # author's choice, restored from rev-3 plan
length_mm = 310.0 # author's choice, restored from rev-3 plan
origin_mm = [-155.0, -8.0, -8.0] # author's model-frame blank corner, made explicit from the note
axis = [1.0, 0.0, 0.0] # length direction
section_axis = [0.0, 1.0, 0.0] # 45 mm section direction; axis × section_axis is 16 mm Z
note = "Author's prepared blank: model X -155..155, Y -8..37, Z -8..8 (16 mm centred on model Z0). No stock on hand or measured surface is asserted. Retain rectangular rails and end ears through S1/S2; leave a 0.40 mm connecting web between opposed rough-profile depths. Integral hub from the bar: no brazed boss, loose bushing, rod tap or counterbore."
as_is_faces = [] # every finished face is cut

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs" # manual §7.4 Axis Set in ABS
radius_mode = true # manual §6.2
units = "mm"

[dro.direction] # manual §6.2 Direction; set once before S1, proved by each check jog
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames. The export's A/B frames carry binding = "unknown";
# TA/TB repeat their transforms and record how each is bound on the machine.
[frames.TA]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal" # S1: Z0 is the faced upper hub face; S3: indicated on the reamed pilot
note = "AUTHOR'S CHOICE: export frame A (upper hub face, pivot axis), bound by the S1 op 10 touch and the S3 indicated pilot"
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

[frames.TB]
origin = [0.0, 8.0, -3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal" # S2: X/Y indicated on the S1 pilot, Z0 the faced lower hub face
note = "AUTHOR'S CHOICE: export frame B (lower hub face, flipped about X), bound by the indicated S1 pilot and the S2 op 10 touch"
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

# ---------------------------------------------------------------- S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice; brush-on cutting oil, supply/suitability to confirm
deburr_mm = 0.25 # title block: break edges R0.25 or chamfer 0.25 max
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "stock"
note = "Upper side: qualify the upper hub face (frame A Z0), finish the upper strap face, rough the hub, top edge and outer profile, spot and drill the pivot pilot. Keep the rails and ears continuous. Contour tables are nominal boundary offsets: interrupt at clamped rails/ears, preserve the 0.40 mm web, and confirm actual cutter access before using any checkpoint."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the upper hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, raw model Z8 minus frame A origin 3.52825
bottom_z = -11.52825 # author's choice, raw model Z-8 minus frame A origin 3.52825

[setups.stock_state.local_thickness]
pivot_bore = 11.52825 # author's choice derived: S1 op 10 entry Z0 to raw blank bottom -11.52825

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "blocks-123-lms-2881"
support_orientation = "1 in height"
riser_up = "height" # 1-2-3 blocks on their 1 in face
riser_along = "length" # 3 in edge along the jaws
riser_centres_mm = [[-40.0, 6.5], [40.0, 6.5]] # author's choice, under both parallels inside the 6 in jaws
parallels_centres_mm = [[0.0, -13.0], [0.0, 26.0]] # author's choice, under the retained rails
grip_on = "full-thickness rectangular rails"
grip_mm = 6.0 # author's choice, horizontal engagement into each retained rectangular rail
jaw_above_parallels_mm = 6.8453 # author's choice nominal target: 44.9453 measured jaw (1.7695 in) - 25.4 block - 12.7 parallel; measure
jaw_center_along_mm = 0.0 # author's choice: jaws centred on the 310 mm blank (frame A x -155..155)
stop = "left blank end against fixed-jaw stop" # author's choice
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Grip the rails on the 1-2-3 blocks plus 1/2 in parallels; never rest the thinned strap on an unsupported island."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.x]
edge = "blank_left_end"
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -155.0 # author's choice, restored centred 310 mm blank
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "blank_front_edge"
from = "-y"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -16.0 # author's choice, restored model Y-8 minus frame A origin Y8
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 20, 25, 50, 60] # op 10 makes the hub face Z0; each later op listed is followed by a tool change

[[setups.ops]]
op = 10
do = "face"
feature = "hub_faces"
faces = ["#374/ADVANCED_FACE[8]/HAF_HUB_FACES__P02"] # exported +Z hub end only
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # the upper hub face becomes frame A Z0; the lower face stays overstock for S2
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the blank

[[setups.ops]]
op = 20
do = "rough_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # author's choice, finish strap Z-2.27825 + 0.20 allowance
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Around the hub island, keeping the rails."

[[setups.ops]]
op = 25
do = "finish_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # upper strap face: HUB_PROUD = (7.0565 - 2.5)/2 below the hub face
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0

[[setups.ops]]
op = 30
do = "rough_profile"
feature = "hub_od"
faces = ["#75/ADVANCED_FACE[3]/HAF_HUB_OD__P02", "#464/ADVANCED_FACE[10]/HAF_HUB_OD__P02"] # upper hub patches
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # author's choice, finish upper hub-wall Z-2.27825 + 0.20
rough_allowance_mm = 0.20 # author's choice, radial allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 } # author's choice, continuous circle through checkpoints
note = "Upper hub island about the pivot axis; finished in S3 with the bore."

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, model mid-plane Z-3.52825 + 0.20; retained web
rough_allowance_mm = 0.20 # author's choice, normal allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
note = "Bottom arc, radial lands and tapered ends; rails and ears stay continuous. The 5.59 lands are profile lines, not chamfers."
# Interrupted cut: clears the bottom arc, tapers and lands round both tips up to
# frame-A Y22 (just above the tips; the clearing wraps round each tip in one
# piece); the lower rail (frame-A Y -16..-10) and the ears beyond X ±150 stay on.
# Op 50 then clears the rest above the top edge.
stock_removal_bounds = { x = [-150.0, 150.0], y = [-10.0, 22.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, model mid-plane Z-3.52825 + 0.20; retained web
rough_allowance_mm = 0.20 # author's choice, radial allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
note = "R800 top edge and the upper ends of the tapers; leave the rails and ears connected."
# Interrupted cut: clears above the top edge, round both tips, to the retained
# upper rail (frame-A Y 26.05..29) and the ears beyond X ±150.
stock_removal_bounds = { x = [-150.0, 150.0], y = [3.24, 26.05], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 60
do = "spot"
feature = "pivot_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot inside the #2 pilot length
approach_mm = 5.0

[[setups.ops]]
op = 70
do = "drill"
feature = "pivot_bore"
tool = "drill-index-115/1-4in"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, full drill diameter beyond raw exit face
approach_mm = 5.0
note = "Pilot for the S3 ream and the S2/S3 pickups. Drill size kept from the earlier plan; the ream allowance it leaves is not confirmed."

# ---------------------------------------------------------------- S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "TB"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S1"
note = "Lower side, flipped about model X: qualify the lower hub face to the hub length, finish the lower strap face and lower hub OD, rough the lower side of the top edge and profile. Rails and ears stay on. Interrupt roughing at clamped rails/ears, retain the 0.40 mm web and verify access; nominal boundary checkpoints are not an approved full contour cut."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the lower hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, flipped raw model Z-8 relative to frame B Z-3.52825
bottom_z = -7.0565 # S1 hub face, HUB_LENGTH below frame B Z0 (nominal; band +0.05/0)
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # author's choice, raw model Z8 after flip; rails, not faced hub, seat on supports

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "blocks-123-lms-2881"
support_orientation = "1 in height"
riser_up = "height"
riser_along = "length"
riser_centres_mm = [[-40.0, -6.5], [40.0, -6.5]] # author's choice, frame B (Y flipped)
parallels_centres_mm = [[0.0, -26.0], [0.0, 13.0]] # author's choice, under the retained rails
grip_on = "full-thickness rectangular rails and ears"
grip_mm = 6.0 # author's choice, horizontal engagement into retained rails/ears
jaw_above_parallels_mm = 6.8453 # author's choice nominal target: 44.9453 measured jaw (1.7695 in) - 25.4 block - 12.7 parallel; verify actual seating
jaw_center_along_mm = 0.0 # author's choice: jaws centred on the 310 mm blank (frame B x -155..155, B origin on model X0)
stop = "left blank end against fixed-jaw stop; indicate pilot to transfer datum" # author's choice
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Seat the retained rails, not the thin strap or a hub rim."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.transfer]
from = "S1"
indicate = "pivot_bore" # the S1 pilot
tool = "dti"

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "dti"
edge_mm = 0.0 # frame B origin is on the pivot axis
radius_mm = 0.0 # indicated centre, no finder radius
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "dti"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 30] # op 10 makes the lower hub face Z0; op 40 changes tool

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"] # exported -Z hub end, upward in frame B
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # lower hub face; approach the length from long, never below 7.0565
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the retained rails

[setups.ops.checks]
length = "micrometers/0-1in"

[[setups.ops]]
op = 20
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0

[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 25
do = "inspect"
feature = "strap_datum_b"
note = "Same strap-thickness micrometer check after both sides are finished; export names the upper datum face separately."
[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "hub_od"
faces = ["#518/ADVANCED_FACE[16]/HAF_HUB_OD__P01", "#539/ADVANCED_FACE[17]/HAF_HUB_OD__P01"] # lower hub patches
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # lower hub OD runs down to the lower strap face
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 } # author's choice, continuous circle
note = "Lower hub OD about the transferred pilot axis."

[setups.ops.checks]
dia = "calipers" # author's choice; range/resolution nominally capable, verify=true retained
coaxiality_dia = "dial-indicator"

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, symmetric rough depth leaves 0.40 mm web with S1
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
# Interrupted cut (frame B, Y flipped): bottom arc, tapers and lands round both
# tips from frame-B Y10 (model Y-2) to Y-22 (just past the tips); the lower rail
# (frame-B Y 10..16) and ears beyond X ±150 stay on. Runs before op 50, as in S1.
stock_removal_bounds = { x = [-150.0, 150.0], y = [-22.0, 10.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, symmetric rough depth leaves 0.40 mm web with S1
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
# Interrupted cut: above the top edge and round both tips to the retained upper
# rail (frame-B Y -29..-26.05) and the ears beyond X ±150.
stock_removal_bounds = { x = [-150.0, 150.0], y = [-26.05, -3.24], z = [-3.32825, 5.0] }

# ---------------------------------------------------------------- S3
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S2"
note = "Finish on a supported profile fixture: upper hub OD and ream without relocating, top edge, outer profile (frees the rails and ears), rod-pin hole, deburr, black oxide."

[setups.stock_state]
top_feature = "hub_faces" # Z touches the upper hub face
top_z = 0.0 # upper hub face (S1 op 10)
bottom_z = -7.0565 # lower hub face (S2 op 10), nominal hub length
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"

[setups.stock_state.local_thickness]
pivot_bore = 7.0565 # bore runs the full hub length
rod_hole = 2.5 # rod bore runs the strap only

[setups.stock_state.local_thickness_cite]
pivot_bore = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:542-544"
rod_hole = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:542-545"

[setups.stock_state.entry_z]
pivot_bore = 0.0
rod_hole = -2.27825 # upper strap face

[setups.hold]
fixture = "rocker-profile-fixture" # illustrative example fixture (inventory solids)
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # fixture frame = frame A
clamps = [
  { ref = "clamping-kit-lms-1144/strap-pad", pose = { origin_mm = [70.0, 3.27, -2.27825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "rod side, on the finished upper strap face" },
  { ref = "clamping-kit-lms-1144/strap-pad", pose = { origin_mm = [-70.0, 3.27, -2.27825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "opposite side, mirrored" },
]
locate = "datum A indicated on the pivot pilot, broad face B seated on the support pads, rod-side radial land C clocked"
supports = "not_applicable" # the fixture's own support pads carry the strap
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable" # author's choice, supported plate/strap contacts, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "indicate pivot pilot axis A, seat broad face B, clock rod-side radial land C" # author's choice
clamp = "two padded strap clamps on the finished upper strap face, snug before the rails and ears release" # author's choice
note = "Illustrative example fixture: twelve pads 6 mm inside the outline support the lower strap face; the clamps press over pads so clamp load cannot bow the strap."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.transfer]
from = "S2"
indicate = "pivot_bore"
tool = "dti"
reindicate_after = [20] # re-find the reamed datum A before the rod-pin hole

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "dti"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "dti"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 20, 42, 50] # each listed op is followed by a tool change

[[setups.ops]]
op = 10
do = "finish_profile"
feature = "hub_od"
faces = ["#75/ADVANCED_FACE[3]/HAF_HUB_OD__P02", "#464/ADVANCED_FACE[10]/HAF_HUB_OD__P02"] # upper hub patches
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # upper hub OD runs down to the upper strap face
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 } # author's choice, continuous circle
note = "Upper hub OD; no relocation before the ream (note 7: turn hub and ream bore in one setup)."

[setups.ops.checks]
dia = "calipers" # author's choice
coaxiality_dia = "dial-indicator"

[setups.ops.inspection_methods]
coaxiality_dia = "indicate the hub OD with the dial indicator in the spindle while the reamed bore stays on the indicated axis; half the total reading is the axis offset"

[[setups.ops]]
op = 20
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, past the 1.0 mm reamer lead
approach_mm = 5.0

[setups.ops.checks]
dia = "pin-gauges" # 6.500 go / 6.530 no-go minus pins
finish_ra = "roughness-comparator"

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, lower strap Z-4.77825 minus 1.25 exit
exit_mm = 1.25 # author's choice; fixture/cutter clearance is not established
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice

[setups.ops.checks]
height_above_pivot = "rocker-profile-template" # template on a 6.5 mm pin in the reamed bore
radius = "rocker-profile-template"
arc_len = "rocker-profile-template" # scribed arc-end marks on the template

[[setups.ops]]
op = 40
do = "finish_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, lower strap Z-4.77825 minus 1.25 exit
exit_mm = 1.25 # author's choice; no fixture-clearance claim
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
note = "Bottom arc and tapered ends in one contour with ops 41/42; the rails and ears come off when op 42 closes the outline, only under the fixture's support."

[setups.ops.checks]
bottom_radius = "rocker-profile-template"
bottom_arc_len = "rocker-profile-template"

[[setups.ops]]
op = 41
do = "finish_profile"
feature = "tip_land_pos_x" # rod-side radial land, datum C
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # same contour depth as op 40
exit_mm = 1.25
direction = "conventional" # author's choice
approach_mm = 5.0

[[setups.ops]]
op = 42
do = "finish_profile"
feature = "tip_land_neg_x"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # same contour depth as op 40
exit_mm = 1.25
direction = "conventional" # author's choice
approach_mm = 5.0

[[setups.ops]]
op = 43
do = "inspect"
feature = "tip_land_pos_x"
note = "Each-end land checks after ops 41/42, keyed to the exported rod-side land."
[setups.ops.checks]
tip_land = "calipers" # author's choice
land_angle_deg = "rocker-profile-template" # the export leaves the limit unknown

[[setups.ops]]
op = 44
do = "inspect"
feature = "tip_land_neg_x"
note = "Same each-end land checks, keyed to the separately exported opposite land."
[setups.ops.checks]
tip_land = "calipers"
land_angle_deg = "rocker-profile-template"

[[setups.ops]]
op = 50
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot from upper strap face
approach_mm = 5.0

[[setups.ops]]
op = 60
do = "drill"
feature = "rod_hole"
tool = "drill-index-115/#47"
holder = "drill-chuck-r8"
exit_mm = 1.5 # author's choice, full drill diameter beyond local strap exit
approach_mm = 5.0

[setups.ops.checks]
dia = "pin-gauges" # 1.994 go / 2.094 no-go
position_dia = "height-gauge"

[setups.ops.inspection_methods]
position_dia = "6.5 mm pin in the pivot bore and 1.99 mm pin in the rod hole; rocker on parallels on the surface plate with the pivot pin levelled, height gauge over both pins and a 90° re-check gives the X/Y offset"

[[setups.ops]]
op = 70
do = "deburr"
feature = "profile_outer"
note = "Author's choice: hand-file and stone burrs, visually check edges and hole entries to R0.25 or 0.25 chamfer max without changing lands, top height, strap or bore edges; abrasive supplies to confirm."

[[setups.ops]]
op = 80
do = "coating"
feature = "profile_outer"
note = "Matte black oxide after machining, as the drawing calls for; no bath or vendor in the shop list. Protect or re-measure the bore."
note_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:4"
