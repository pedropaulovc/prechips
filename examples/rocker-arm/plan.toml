# Rocker-arm illustrative process plan: four explicit holding states.
# Vise S1/S2 retain a full-thickness rail frame around a 340 x 65 mm blank.
# S3 straps hold the supported part for upper-hub finishing and pivot reaming;
# S4 shoulder-screw/pin location holds the part while separately clamped scrap
# rails release. Authored process dimensions are proposals, not shop measurements.
# RPM/feed come from the illustrative example cutting data; the R8 drill chuck,
# 6.5 H7 reamer and supported profile fixture are illustrative example items.
part = "rocker-arm"
features = "features.toml"
construction = "one_piece"   # author's route: all rocker features cut from one prepared blank
quantity = 20
quantity_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:5"

[drawing]
number = "MHA-071"
revision = "v40" # source manifest revision; illustrative plan, not released or approved
cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:2", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "1018 low-carbon steel" # rev-3 author's pick inside the drawing's family; not a sourced grade
material_verify = false # illustrative example: 1018 accepted for the pilot
drawing_material = "LOW-CARBON STEEL OR GRAY IRON"
material_cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:3", "harmonic-analyzer/cad/config/parts/_defaults.yaml:25-27", "rev-3 rocker-arm/plan.yaml:7"]
form = "rectangular_blank" # rev-3 prepared blank with rectangular reference edges; no stock on hand claimed
form_verify = false # illustrative example: prepared blank accepted for the pilot
section_mm = [65.0, 16.0] # author's choice: rails outside the full 9.525 mm cutter sweep
length_mm = 340.0 # author's choice: 10 mm retained ears beyond X ±160
origin_mm = [-170.0, -20.0, -8.0] # author's model-frame blank corner
axis = [1.0, 0.0, 0.0] # length direction
section_axis = [0.0, 1.0, 0.0] # 65 mm section direction; axis × section_axis is 16 mm Z
note = "Illustrative prepared 340 x 65 x 16 mm blank, length left-to-right with the future rod-hole end at +X. Relative to Setup S1 zero, the raw blank is X -170..170 and Y -28..37. The S1/S2 face rasters cut the internal field out to the full-thickness lower rail (Y -28..-20), upper rail (Y 31.7..37) and end ears (outside X ±160); the rails and ears stay continuous to S4. The opposed S1/S2 rough pockets leave a 0.42 mm web at the 7.080 mm hub-length aim. Make the hub integral with the bar; no brazed boss, loose bushing, rod tap or counterbore."
prerequisite = "saw 345 mm of 3 x 3/4 in 1018 cold-finished flat bar; mill both broad faces flat and parallel to 16.0 thick, both long edges to 65.0 wide and square to the faces, and both ends square to 340.0 long; break all edges. Check 340.0 x 65.0 x 16.0 with calipers and the faces parallel within 0.05 with a micrometer. The left end and the front long edge are the S1 X/Y pick-up edges" # AUTHOR'S CHOICE: a common US bar size squared all round, so S1 sits on a flat face and picks up square edges
as_is_faces = [] # every finished face is cut

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs" # manual §7.4 Axis Set in ABS
radius_mode = true # manual §6.2
units = "mm"

[dro.direction] # manual §6.2 Direction; set once before S1, proved by each check jog
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames. The export's A/B frames carry binding = "unknown";
# TA/TB repeat their transforms and record how each is bound on the machine.
[frames.TA]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal" # S1: Z0 is the faced upper hub face; S3: indicated on the reamed pilot
note = "AUTHOR'S CHOICE: Setup S1/S3 zero is the upper hub face at the pivot axis, established by the S1 op 10 touch and the S3 indicated pilot."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

[frames.TB]
origin = [0.0, 8.0, -3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal" # S2: X/Y indicated on the S1 pilot, Z0 the faced lower hub face
note = "AUTHOR'S CHOICE: Setup S2 zero is the lower hub face at the pivot axis, rod-hole end at +X: X/Y indicated on the S1 pilot, Z set from the measured hub length before op 10."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

# ---------------------------------------------------------------- S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice; brush-on cutting oil, supply/suitability to confirm
deburr_mm = 0.25 # title block: break edges R0.25 or chamfer 0.25 max
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "stock"
note = "Upper side: rough-face, then finish-face the internal field to make the upper hub face Setup S1 Z0; rough and finish the upper strap face around the hub island; rough the hub, top edge and outer profile; spot and drill the pivot pilot. The face rasters cut the field out to the rail walls (Y -20, Y 31.7) and the ear walls (X ±160); the rails and ears stay full thickness and continuous. The op 50 top-edge rough uses a 1/4 in end mill, so the cutter stays at least 3.2 mm clear of the upper rail wall at both tips."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the upper hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, raw model Z8 minus frame A origin 3.52825
bottom_z = -11.52825 # author's choice, raw model Z-8 minus frame A origin 3.52825

[setups.stock_state.local_thickness]
pivot_bore = 11.52825 # author's choice derived: S1 op 10 entry Z0 to raw blank bottom -11.52825

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "rocker-riser-bars"
riser = "rocker-riser-bars"
riser_up = "height" # matched 25.4 mm ground height
riser_along = "length" # 76.2 mm edge along the jaws; 64 mm edge across the 65 mm opening
riser_centres_mm = [[-40.0, 4.5], [40.0, 4.5]] # author's choice, both parallels fully carried inside the jaws
parallels_centres_mm = [[0.0, -25.5], [0.0, 34.5]] # author's choice, wholly under retained full-thickness rails
grip_on = "full-thickness rectangular rails"
grip_mm = 6.0 # author's choice, minimum vertical jaw engagement on the full-thickness retained rails
jaw_above_parallels_mm = 6.8453 # nominal stack: 44.9453 measured jaw - 25.4 example riser - 12.7 example parallel
jaw_center_along_mm = 0.0 # author's choice: jaws centred on the 340 mm blank
stop_fixture = "rocker-vise-stop"
stop_pose = { origin_mm = [-79.3369, 37.0, -4.68295], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # magnetic base against the fixed jaw's left end
stop = "switch on the magnetic fixed-jaw end stop and bring the left blank end gently against its nose; positioning contact only, no cutting load"
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Grip the full-thickness rails on matched narrow risers plus 1/2 in parallels. The 64 mm risers fit between the 65 mm closed jaws and fully carry both parallels. Use light conventional cuts at the outboard tips; stop and resolve chatter before deepening the cut."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.x]
edge = "blank_left_end"
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -170.0 # author's choice, left end of the centred 340 mm blank
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "blank_front_edge"
from = "-y"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -28.0 # author's choice, model Y -20 minus frame-A origin Y8
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-2fl" # op 5 rougher touches the raw top first
check_jog_mm = 10.0 # author's choice
retouch_after = [5, 10, 20, 25, 30, 32, 40, 50, 60] # op 10 makes the hub face Z0; each op listed is followed by a tool change

# Op 5 and op 10 face the walled internal field: the lower rail is Y -28..-20,
# the upper rail Y 31.7..37 and the ears lie outside X ±160. The raster's cutter
# edge finishes on those walls, so each face op's box is exactly its coverage.
[[setups.ops]]
op = 5
do = "rough_face"
feature = "hub_faces"
faces = ["#374/ADVANCED_FACE[8]/HAF_HUB_FACES__P02"] # exported +Z hub end only
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.20 # author's choice, finish hub face Z0 + 0.20 allowance
rough_allowance_mm = 0.20 # author's choice, same leave as the strap and profile roughs
doc_mm = 1.5 # author's choice, largest step per pass over the 4.27175 mm from the raw top
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the blank
note = "Field raster: passes along X, stepping from the front rail toward the back rail. The field is walled on all four sides, so at every pass start plunge the centre-cutting end mill straight down to the level Z at light quill feed, then feed the pass; lift to the retract Z and rapid back to the next start. The cutter edge finishes on the rail walls and ear walls; the rails and ears stay at raw height."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.2375, 150.2375], y = [-15.225, 26.935], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: on-grid rows Y -15.225..26.935 at 5.270 (55% of the 9.525 cutter), pass ends X ±155.000; the cutter edge stops 0.0125/0.0025 short of the rail walls Y -20/31.7 and 0.24 short of the ear walls X ±160
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [0.0, 5.0] }

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#374/ADVANCED_FACE[8]/HAF_HUB_FACES__P02"] # exported +Z hub end only
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # the upper hub face becomes frame A Z0; the lower face stays overstock for S2
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm left by op 5
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the blank
note = "Finish raster: the same passes as op 5 at one depth, removing the 0.20 mm left by op 5; plunge at each pass start as in op 5."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.2375, 150.2375], y = [-15.225, 26.935], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: same on-grid rows as op 5
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [0.0, 5.0] }

[[setups.ops]]
op = 20
do = "rough_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # author's choice, finish strap Z-2.27825 + 0.20 allowance
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
doc_mm = 1.5 # author's choice, largest step per pass over the 2.07825 mm below Z0
approach_mm = 5.0
note = "Field raster round the hub island: the same passes as op 5 at each level. The Ø11.0 island keep-out (hub Ø10.2 plus 0.20 rough allowance and 0.20 clearance a side) splits each pass that crosses it: stop at the listed end, lift over the island, rapid to the next piece and plunge again. The corners left round the island lie within R7.4 of the pivot axis: the op 30 stairs rough them and op 32 finishes them down to the strap face."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.2375, 150.2375], y = [-15.225, 26.935], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 11.0 }] } # AUTHOR'S CHOICE: op 5 rows; island keep-out about the pivot axis
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [-2.27825, 5.0] }

[[setups.ops]]
op = 25
do = "finish_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # upper strap face: HUB_PROUD = (7.0565 - 2.5)/2 below the hub face
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm left by op 20
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Finish raster: the op 20 rows at one depth, removing the 0.20 mm left by op 20; plunge at each piece start. Its Ø10.6 island keep-out (hub Ø10.2 plus the 0.20 rough allowance a side) ends each piece 0.20 nearer the hub than op 20, so the finisher also takes op 20's 0.20 clearance ring down to this face. It leaves corners round the island, within R7.3 of the pivot axis, standing to the hub face: the op 30 stairs rough them to 0.20 above this face and the op 32 clean-up finishes them."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.2375, 150.2375], y = [-15.225, 26.935], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: op 20 rows, island at the hub's 0.20 leave so the finisher never cuts the allowance the S3F file takes
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [-2.27825, 5.0] }

[[setups.ops]]
op = 30
do = "rough_profile"
feature = "hub_od"
faces = ["#75/ADVANCED_FACE[3]/HAF_HUB_OD__P02", "#464/ADVANCED_FACE[10]/HAF_HUB_OD__P02"] # upper hub patches
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # AUTHOR'S CHOICE: 0.20 above the finished strap face Z-2.27825, because a rough op leaves its 0.20 allowance on the strap face as on the hub wall; op 32 finishes the strap face round the hub
doc_mm = 1.5 # author's choice, same axial step as the op 20 face rough
rough_allowance_mm = 0.20 # author's choice, allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap for the S3F buttons
note = "Upper hub island about the pivot axis; filed round to the buttons in S3F after the bore is reamed. The stairs also rough the corners the op 20/25 rasters leave round the island, within R7.4 of the pivot axis, down to 0.20 above the strap face."

[[setups.ops]]
op = 32
do = "finish_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # upper strap face, as op 25
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm the op 30 stairs leave on the strap face
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Corner clean-up round the hub: rows along Y at the strap face, 1.95 mm apart, each split round the same Ø10.6 island as op 25 (stop at the listed end, lift over the island, rapid to the next piece and plunge again). They cross the op 25 rows and finish the corners op 25 left round the island, which the op 30 stairs roughed to 0.20 above this face."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-11.7, 11.7], y = [-8.0, 8.0], z = [-2.27825, 5.0] }, open_side = "-x", step_mm = 2.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: rows along Y because they cross the op 25 X rows, and 13 rows X -11.7..11.7 at 1.95 because a straight raster round a round island leaves corners between its piece ends; with op 25 these rows leave stock outside the island only within R5.50 of the pivot axis, inside the 0.5 filing cap the S3F file takes off the hub
stock_removal_bounds = { x = [-8.0, 8.0], y = [-8.0, 8.0], z = [-2.27825, 5.0] } # the op 25 corners lie within R7.3; outside this box op 25 already finished the face

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # AUTHOR'S CHOICE: 3.32825 below each hub face from both sides leaves a 0.42 mm web at the 7.080 hub aim
doc_mm = 1.5 # author's choice, same axial step as the face roughs
rough_allowance_mm = 0.20 # author's choice, normal allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.4 } # AUTHOR'S CHOICE: stairs because the R816 arc and tapered ends need two handwheels at once otherwise; S4 op 27 re-roughs the same faces, so the cusp may exceed the filing cap here
note = "Bottom arc, radial lands and tapered ends; rails and ears stay continuous. Work the stair tables in this order: -X join, bottom arc, +X join. Enter each table from the scrap side; never plunge beside the part edge. Move one handwheel at a time to each listed point at the listed Z. Retract clear of stock and fixturing before moving to the next table."
# The complete 9.525 mm cutter sweep round the upper land corners reaches
# frame-A Y26.9581; authorize Y27 inside the already planned upper pocket.
# The lower rail remains Y-28..-20, the upper rail Y31.7..37, and the ears
# outside X ±160. Remove material only within these bounds and retain the
# central 0.42 mm web; no depth, normal allowance or support stock changes.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 27.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/1-4in-2fl" # AUTHOR'S CHOICE: the 1/4 in rougher keeps the tip-corner sweep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # AUTHOR'S CHOICE: 3.32825 below each hub face from both sides leaves a 0.42 mm web at the 7.080 hub aim
doc_mm = 1.5 # author's choice, same axial step as the face roughs
rough_allowance_mm = 0.20 # author's choice, radial allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.4 } # AUTHOR'S CHOICE: stairs because the R800 edge needs two handwheels at once otherwise; S4 op 25 re-roughs it, so the cusp may exceed the filing cap here
note = "R800 top edge and the upper ends of the tapers; leave the rails and ears connected."
# Clear above the top edge round both tips, preserving the upper rail
# frame-A Y 31.7..37 and the ears outside X ±160.
stock_removal_bounds = { x = [-160.0, 160.0], y = [3.24, 31.7], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 60
do = "spot"
feature = "pivot_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot inside the #2 pilot length (1.98 mm drill length, Machinery's Handbook 27th ed. Table 6 p.873)
approach_mm = 5.0

[[setups.ops]]
op = 70
do = "drill"
feature = "pivot_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, full drill diameter beyond raw exit face
approach_mm = 5.0
note = "The letter-D pilot leaves about 0.26 mm on diameter for the S3 reamer. Indicate this pilot for the S2 and S3 pickups."

# ---------------------------------------------------------------- S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "TB"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S1"
note = "Lower side, rod-hole end still at +X. Indicate the S1 pilot, then rough-face and finish-face the internal field to qualify the lower hub face, and rough before finishing the lower strap face and hub OD. The face rasters cut the field out to the rail walls (Y -31.7, Y 20) and the ear walls (X ±160); the rails and ears stay full thickness. The op 50 top-edge rough uses a 1/4 in end mill, so the cutter stays at least 3.2 mm clear of the upper rail wall (Y -31.7) at both tips. Adjust the two support jacks to just bear on the S1-finished strap without lifting the rail frame from its parallels. Spot, drill and ream the rod hole and pass its process gauge hold before opening the outer pockets; then rough the opposed pockets leaving the 0.42 mm web. Final A|B|C position inspection follows S4 land finishing."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the lower hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, flipped raw model Z-8 relative to frame B Z-3.52825
bottom_z = -7.080 # S1 hub face: the op 10 measured touch sets frame B Z0 so the hub lands at the AUTHOR'S CHOICE 7.080 aim inside the drawing band
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # author's choice, raw model Z8 after flip; rails, not faced hub, seat on supports

[setups.stock_state.local_thickness]
rod_hole = 2.5235 # AUTHOR'S CHOICE derived: 7.080 hub aim minus the two 2.27825 hub-proud steps (S1 op 25, S2 op 20)

[setups.stock_state.local_thickness_cite]
rod_hole = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"

[setups.stock_state.entry_z]
rod_hole = -2.27825 # lower strap face, uppermost in frame B

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "rocker-riser-bars"
riser = "rocker-riser-bars"
riser_up = "height"
riser_along = "length"
riser_centres_mm = [[-40.0, -4.5], [40.0, -4.5]] # author's choice, frame B (Y flipped)
parallels_centres_mm = [[0.0, -34.5], [0.0, 25.5]] # author's choice, wholly under retained rails
clamps = [
  { ref = "rocker-s2-support-jack", restraint = "none", pose = { origin_mm = [40.0, -1.0, -4.77825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, -1.0] }, note = "passive upward-bearing support jack, not a clamp; adjust to touch the finished strap without lifting the rail frame, then lock the jack" },
  { ref = "rocker-s2-support-jack", restraint = "none", pose = { origin_mm = [-40.0, -1.0, -4.77825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, -1.0] }, note = "mirrored support jack, adjusted and locked independently without preload" },
]
clamp_order = [] # the jack entries are passive supports, not tightening actions
grip_on = "full-thickness rectangular rails and ears"
grip_mm = 6.0 # author's choice, minimum vertical jaw engagement on the full-thickness retained rails/ears
jaw_above_parallels_mm = 6.8453 # nominal stack: 44.9453 measured jaw - 25.4 example riser - 12.7 example parallel
jaw_center_along_mm = 0.0 # author's choice: jaws centred on the 340 mm blank
stop_fixture = "rocker-vise-stop"
stop_pose = { origin_mm = [-79.3369, 28.0, -4.68295], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
stop = "switch on the magnetic fixed-jaw end stop and bring the left blank end gently against its nose; then indicate the pilot to transfer datum"
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Seat the retained rails, not the thin strap or a hub rim. Use light conventional cuts at the outboard tips; stop and resolve chatter before deepening the cut."

[setups.zero]
# Op 10 is the 4fl finisher's first cut: its Z is set from the measured hub
# length so the finished hub lands at the AUTHOR'S CHOICE aim of 7.080 mm.
[[setups.zero.tool_touches]]
tool = "endmills-lms-6784/3-8in-4fl"
z_face = "hub_faces"
method = "measure_then_set"
edge_mm = 0.20 # nominal op-5 face; the Axis Set uses the measured length
paper_mm = 0.05 # author's choice
z_gauge = "micrometers/0-1in"
z_measure = "hub length, S1 hub face to the op-5 face"
z_offset_mm = -7.080 # AUTHOR'S CHOICE: finished hub length aim inside the drawing band
before_ops = [10]

[setups.zero.transfer]
from = "S1"
indicate = "pivot_bore" # the S1 pilot
tool = "rocker-datum-indicator"
runout_limit_mm = 0.02 # authored pilot-pickup TIR criterion, not a drawing tolerance or a measured reading

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0 # frame B origin is on the pivot axis
radius_mm = 0.0 # indicated centre, no finder radius
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-2fl" # op 5 rougher touches the raw top first
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 15, 20, 28, 29, 32, 33, 34, 40] # retouch before each changed cutting tool, including every rod-hole tool, the return to the rougher and the 1/4 in top-edge rougher; op 10's tool is set by the measured touch above

# Frame B reverses Y: op 5 and op 10 face the walled internal field between the
# lower rail Y 20..28 and the upper rail Y -37..-31.7, inside the ears outside
# X ±160. The raster's cutter edge finishes on those walls, so each box is its coverage.
[[setups.ops]]
op = 5
do = "rough_face"
feature = "hub_faces"
faces = ["#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"] # exported -Z hub end, upward in frame B
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.20 # author's choice, finish hub face Z0 + 0.20 allowance
rough_allowance_mm = 0.20 # author's choice, same leave as the strap and profile roughs
doc_mm = 1.5 # author's choice, largest step per pass over the 4.27175 mm from the raw top
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the retained rails
note = "Field raster: passes along X, stepping from the upper rail toward the lower rail. The field is walled on all four sides, so at every pass start plunge the centre-cutting end mill straight down to the level Z at light quill feed, then feed the pass; lift to the retract Z and rapid back to the next start. The rails and ears stay at raw height. Then mic the hub length from the S1 hub face to this face, clear of burrs: the op 10 Z re-touch is set from that reading."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.2375, 150.2375], y = [-26.935, 15.225], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: on-grid rows Y -26.935..15.225 at 5.270 (55% of the 9.525 cutter), pass ends X ±155.000; the cutter edge stops 0.0025/0.0125 short of the rail walls Y -31.7/20 and 0.24 short of the ear walls X ±160
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [0.0, 5.0] }

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"] # exported -Z hub end, upward in frame B
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # lower hub face; Z0 is set from the measured hub length before op 10
doc_mm = 0.3 # author's choice: one level removes the measured stock left by op 5 (0.20 nominal, up to 0.30 on a thick blank)
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the retained rails
note = "Finish raster: the same passes as op 5 at one depth to Z 0, after the measured Z re-touch; plunge at each pass start as in op 5."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.2375, 150.2375], y = [-26.935, 15.225], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: same on-grid rows as op 5
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [0.0, 5.0] }

[setups.ops.checks]
length = "micrometers/0-1in"

[[setups.ops]]
op = 15
do = "rough_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825
rough_allowance_mm = 0.20
direction = "conventional"
doc_mm = 1.5 # author's choice, largest step per pass over the 2.07825 mm below Z0
approach_mm = 5.0
note = "Field raster round the hub island on the supported lower strap: the same passes as op 5 at each level, leaving 0.20 mm for the finish pass. The Ø11.0 island keep-out (hub Ø10.2 plus 0.20 rough allowance and 0.20 clearance a side) splits each pass that crosses it: stop at the listed end, lift over the island, rapid to the next piece and plunge again. The corners left round the island lie within R7.4 of the pivot axis: the op 28 stairs rough them and op 29 finishes them down to the strap face."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.2375, 150.2375], y = [-26.935, 15.225], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 11.0 }] } # AUTHOR'S CHOICE: op 5 rows; island keep-out about the pivot axis
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [-2.27825, 5.0] }

[[setups.ops]]
op = 20
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm left by op 15
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Finish raster: the op 15 rows at one depth, removing the 0.20 mm left by op 15; plunge at each piece start. Its Ø10.6 island keep-out (hub Ø10.2 plus the 0.20 rough allowance a side) ends each piece 0.20 nearer the hub than op 15, so the finisher also takes op 15's 0.20 clearance ring down to this face. It leaves corners round the island, within R7.3 of the pivot axis, standing to the hub face: the op 28 stairs rough them to 0.20 above this face and the op 29 clean-up finishes them."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-150.2375, 150.2375], y = [-26.935, 15.225], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: op 15 rows, island at the hub's 0.20 leave so the finisher never cuts the allowance the S3F file takes
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, 20.0], z = [-2.27825, 5.0] }

[[setups.ops]]
op = 25
do = "inspect"
feature = "strap_datum_b"
note = "Check the strap thickness with a micrometer after finishing both sides; measure clear of the hub, support contacts and edge burrs."
[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 28
do = "rough_profile"
feature = "hub_od"
faces = ["#518/ADVANCED_FACE[16]/HAF_HUB_OD__P01", "#539/ADVANCED_FACE[17]/HAF_HUB_OD__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # AUTHOR'S CHOICE: 0.20 above the finished strap face Z-2.27825, because a rough op leaves its 0.20 allowance on the strap face as on the hub wall; op 29 finishes the strap face round the hub
doc_mm = 1.5 # author's choice, same axial step as the op 15 face rough
rough_allowance_mm = 0.20
direction = "conventional"
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap for the S3F buttons
note = "Lower hub island about the transferred pilot axis; filed round to the buttons in S3F after the bore is reamed. The stairs also rough the corners the op 15/20 rasters leave round the island, within R7.4 of the pivot axis, down to 0.20 above the strap face."

[[setups.ops]]
op = 29
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # lower strap face, as op 20
doc_mm = 0.2 # author's choice: one level removes the 0.20 mm the op 28 stairs leave on the strap face
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Corner clean-up round the hub: rows along Y at the strap face, 1.95 mm apart, each split round the same Ø10.6 island as op 20 (stop at the listed end, lift over the island, rapid to the next piece and plunge again). They cross the op 20 rows and finish the corners op 20 left round the island, which the op 28 stairs roughed to 0.20 above this face. Then mic the strap thickness clear of the hub."
contour = { method = "linear_table", sweep_frame = "B", sweep_bounds = { x = [-11.7, 11.7], y = [-8.0, 8.0], z = [-2.27825, 5.0] }, open_side = "-x", step_mm = 2.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: rows along Y because they cross the op 20 X rows, and 13 rows X -11.7..11.7 at 1.95 because a straight raster round a round island leaves corners between its piece ends; with op 20 these rows leave stock outside the island only within R5.50 of the pivot axis, inside the 0.5 filing cap the S3F file takes off the hub
stock_removal_bounds = { x = [-8.0, 8.0], y = [-8.0, 8.0], z = [-2.27825, 5.0] } # the op 20 corners lie within R7.3; outside this box op 20 already finished the face

[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 32
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot from the lower strap face in frame B, inside the #2 pilot length (1.98 mm, Machinery's Handbook 27th ed. Table 6 p.873)
approach_mm = 5.0

[[setups.ops]]
op = 33
do = "drill"
feature = "rod_hole"
tool = "rocker-rod-pilot-drill/1.85mm" # illustrative metric purchase, 0.154 mm diametral (0.077 mm, .0030 in, radial) stock for the 2.004 reamer, inside Machinery's Handbook 27th ed. p.1133 reamer depth of cut .003-.004 in for holes 1/8 in or less
holder = "drill-chuck-r8"
exit_mm = 1.5 # author's choice, full drill diameter beyond local strap exit
approach_mm = 5.0
note = "Drill the undersize pilot while the full-thickness outside stock still supports the strap; do not expect a twist drill to hold the reamed rod-hole size the S3/S4 orientation pin needs."

[[setups.ops]]
op = 34
do = "ream"
feature = "rod_hole"
tool = "rocker-rod-reamer/2.0mm" # illustrative purchase, 2.004 mm example working diameter
holder = "drill-chuck-r8"
exit_mm = 1.5 # clears the 0.4 mm lead beyond the 2.5235 mm strap (7.080 hub aim)
approach_mm = 5.0
note = "Ream through the strap while the full-thickness outside stock still supports it."
inspection_note = "Gauge before op 40. If the hole fails a drawing plug or the process hold, stop; do not open the outer pockets until the hole is resolved."
process_holds = [{ feature = "rod_hole", requirement = "dia", band = [2.000, 2.010], gauge = "rocker-rod-limit-gauges", go_no_go = { go = 2.000, no_go = 2.010 }, reason = "AUTHOR'S CHOICE: the S3/S4 diamond pin is an in-process orientation locator in this hole (not datum C); a looser hole spends the S4 position budget" }]
go_no_go = { dia = { go = 2.000, no_go = 2.090 } } # drawing band as printed, 2.00-2.09

[setups.ops.checks]
dia = "rocker-rod-limit-gauges" # three plugs: GO 2.000 (drawing and process hold), process NO-GO 2.010, drawing NO-GO 2.090

[setups.ops.inspection_methods]
dia = "Plug-gauge after deburring both mouths: the drawing GO and NO-GO plugs first, then the process-hold NO-GO plug. Push each plug by hand through the strap; never force it."

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # AUTHOR'S CHOICE: 3.32825 below each hub face from both sides leaves a 0.42 mm web at the 7.080 hub aim
doc_mm = 1.5 # author's choice, same axial step as the face roughs
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.4 } # AUTHOR'S CHOICE: stairs because the R816 arc and tapered ends need two handwheels at once otherwise; S4 op 27 re-roughs the same faces, so the cusp may exceed the filing cap here
note = "Bottom arc, radial lands and tapered ends; rails and ears stay continuous. Work the stair tables in this order: +X join, bottom arc, -X join. Enter each table from the scrap side; never plunge beside the part edge. Move one handwheel at a time to each listed point at the listed Z. Retract clear of stock and fixturing before moving to the next table."
# Frame B reverses Y: the complete upper-land cutter corridor reaches -26.9581.
# It overlaps op 50's top-edge pocket; rails remain Y20..28 and -37..-31.7,
# ears remain outside X ±160, and the opposed cuts retain the 0.42 mm web.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-27.0, 20.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/1-4in-2fl" # AUTHOR'S CHOICE: the 1/4 in rougher keeps the tip-corner sweep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # AUTHOR'S CHOICE: 3.32825 below each hub face from both sides leaves a 0.42 mm web at the 7.080 hub aim
doc_mm = 1.5 # author's choice, same axial step as the face roughs
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.4 } # AUTHOR'S CHOICE: stairs because the R800 edge needs two handwheels at once otherwise; S4 op 25 re-roughs it, so the cusp may exceed the filing cap here
# Upper-rail material remains frame-B Y -37..-31.7; the cutter's whole
# swept diameter stays inside the clearing box and outside the rail.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, -3.24], z = [-3.32825, 5.0] }


# ---------------------------------------------------------------- S3
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S2"
note = "Strap-held ream setup: tram the plate and indicate the empty plate bore before loading. Lower the blank straight down over the permanent rod-hole diamond pin onto the lower-strap support pads, then match the rail-rest shims without lifting the part. Indicate the D pilot and confirm its centre is within 0.20 mm radial of the empty plate-bore reference before tightening. If the rod hole will not drop over the pin with the pilot inside 0.20 mm, stop and inspect S2 hole spacing; do not force it. Re-indicate the pilot as working A, then ream without relocating. The fixture's Z figures are drawn for the CAD part at the bottom of the hub-length band; the 7.080 part sits 0.0235 higher on the same pads and stand, so touch Z on its upper hub face, never on the plate. Remote studs and stepped straps clear the raw rails; do not profile across these straps. The pin stays fitted for S4."

[setups.stock_state]
top_feature = "hub_faces" # Z touches the upper hub face
top_z = 0.0 # upper hub face (S1 op 10)
bottom_z = -7.080 # lower hub face (S2 op 10) at the AUTHOR'S CHOICE 7.080 hub-length aim, inside the 7.0565-7.1065 band
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # the raw rail frame seats on the fixture's outer rests

[setups.stock_state.local_thickness]
pivot_bore = 7.080 # bore runs the full hub length at the 7.080 aim

[setups.stock_state.local_thickness_cite]
pivot_bore = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:542-544"

[setups.stock_state.entry_z]
pivot_bore = 0.0

[setups.hold]
fixture = "rocker-profile-fixture" # illustrative example fixture (inventory solids)
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # fixture frame = frame A
clamps = [
  { ref = "rocker-hub-strap", pose = { origin_mm = [70.0, 3.27, -2.27825], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "rod-side supported toe; bridge clears the raw rail and the stud is outside the blank at Y45" },
  { ref = "rocker-hub-strap", pose = { origin_mm = [-70.0, 3.27, -2.27825], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored supported toe and remote stud" },
  { ref = "rocker-rod-diamond-pin", restraint = "locate", pose = { origin_mm = [133.06740213488345, 8.456064115939025, -4.77825], x = [0.9979869699018047, 0.06341930231573287, 0.0], z = [0.0, 0.0, -1.0] }, note = "permanently fitted in-process orientation locator in the rod hole, unchanged for S4; not datum C; no clamp or lift load" },
]
clamp_order = [1, 2] # only the two hub straps tighten; the permanent pin is a locator
locate = "first tram the plate with its hold-down screws snug: sweep a dial test indicator along its ground -Y reference edge (the edge its bore and pin hole were positioned from) from X -150 to X 150, tap it until the reading varies by no more than 0.01 mm, tighten the four hold-down screws and re-check; then indicate the empty plate bore and retain its X/Y reference; lower the blank straight down over the permanent rod-hole pin onto the pads and indicate the D pilot"
supports = "not_applicable" # the fixture's own support pads carry the strap
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable" # author's choice, supported plate/strap contacts, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "before tightening the straps, confirm the indicated pilot is within 0.20 mm radial of the empty plate-bore reference; then re-indicate the pilot as working datum A" # author's clearance control, not a drawing tolerance
clamp = "two stepped padded straps on upper datum face B, remote studs outside the retained rail frame; supported toes, no stud through the part"
note = "The permanent pin and coarse arm alignment keep the part over its twelve support pads and the strap toes on face B; they do not establish datum C. Seat the lower strap face first, then match the shimmed rail rests to the actual raw rails without lifting the part. The 8 mm stand relief clears the reamer after the 0.20 mm placement check."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.transfer]
from = "S2"
indicate = "pivot_bore"
tool = "rocker-datum-indicator"
runout_limit_mm = 0.02 # same drilled-pilot pickup criterion before the in-place pivot ream

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "reamers-metric/6.5mm" # the only cutter in this setup since the hub moved to the S3F buttons
check_jog_mm = 10.0 # author's choice
retouch_after = []

[[setups.ops]]
op = 20
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, past the 1.0 mm reamer lead
approach_mm = 5.0
note = "Indicate the pilot centre before reaming and record it; re-indicate the reamed bore after op 20 and record the centre shift ______. PROCESS STOP (not a drawing limit): if the reamed centre has moved more than 0.020 mm radially from the pilot, stop the batch; the shift would carry pilot error into datum A and the rod-hole position."

[setups.ops.checks]
dia = "rocker-bore-limit-gauges" # calibrated example GO 6.500 / NO-GO 6.530 plugs
finish_ra = "roughness-comparator"

# ---------------------------------------------------------------- S3F
# EngManualArc: bench filing of the hub OD to filing buttons on the reamed bore A.
[[setups]]
id = "S3F"
machine = "fitting-bench"
frame = "TA"
stock_in = "S3"
coolant = "none: bench filing"
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
note = "AUTHOR'S CHOICE: File the hub round to the filing buttons because the reamed bore A is their pin, so the hub comes out coaxial with A without indicating anything. Off the S3 fixture, clamp the buttons on both hub faces through bore A and grip the stud tail upright in the bench vise."

[setups.stock_state]
top_feature = "hub_faces"
top_z = 0.0 # upper hub face, under the top button
bottom_z = -7.080 # lower hub face, on the lower button, at the AUTHOR'S CHOICE 7.080 hub-length aim
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # the raw rail frame is still on; it is removed in S4 op 27

[setups.hold]
fixture = "bench-vise-4in"
pose = { origin_mm = [0.0, 0.0, -31.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # AUTHOR'S CHOICE: jaw tops 20 mm below the rail frame, closed on the stud tail
clamps = [
  { ref = "rocker-hub-filing-buttons", restraint = "press", pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "stud through reamed bore A, one button on each hub face, nut tightened by hand" },
]
clamp_order = [1]
support = "none"
grip_on = "AUTHOR'S CHOICE: the button stud tail in the vise jaws; the part is clamped between the buttons and never touches the jaws"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: none; steady the arm by hand against the file stroke"
clamp = "M6 nut on the button stud, hand tight, pressing the buttons on the two hub faces"

[[setups.ops]]
op = 10
do = "file_to_line"
feature = "hub_od"
guide = { buttons = "rocker-hub-filing-buttons", bore = "pivot_bore", gauge = "radius-gauge" } # AUTHOR'S CHOICE: buttons because the reamed bore centres them; the radius gauge checks the round
note = "File the upper hub projection, then the lower one, each down to its own hardened button rim: lay a safe-edge hand file flat on that button's rim with the safe edge running on the strap face, so the strap is never cut, and work round the projection in short strokes kept inside the scrap rails; stop when the file rides on the button all round without cutting."

[setups.ops.checks]
dia = "calipers" # illustrative example gauge for the drawing's 1.02 mm OD band; S4 op 60 checks coaxiality to the reamed bore

# ---------------------------------------------------------------- S4
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush"
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S3F"
note = "Lower the part from S3F straight down over the permanent rod-hole pin onto the support pads. Fit the shoulder screw and washer through the reamed pivot bore. Match each shimmed rail rest to the actual raw rail without lifting the part. Rotate the part counterclockwise viewed from above (looking down setup -Z) to preload the rod hole against the closing-cut side of the pin, then tighten the shoulder screw and washer. Indicate the ground screw head after tightening to establish the fixture axis; the head is coaxial with the shoulder, not an exposed part-bore touch. Clamp the scrap rails independently. Touch Z on an unobstructed upper strap patch, not the washer-covered hub. Scribe the outline from the template (ops 10 and 20), rough it outside the line in stairs with light conventional passes (ops 25 and 27), then file it to the line (ops 30 and 40); ops 25 and 27 use a 1/4 in end mill so the cutter keeps clear of both rail walls."

[setups.stock_state]
top_feature = "hub_faces"
top_z = 0.0
bottom_z = -7.080 # lower hub face at the AUTHOR'S CHOICE 7.080 hub-length aim
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # scrap rails remain seated and independently clamped through outline release

[setups.stock_state.entry_z]
# Along the outline the stock top is the upper strap face: the hub island is inside it
# and the retained rails and ears are clear of the whole cutter sweep.
top_edge = -2.27825
profile_outer = -2.27825

[setups.hold]
fixture = "rocker-profile-fixture"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "rocker-pivot-screw", restraint = "press", pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "ground locating shoulder through reamed datum A; bored washer clamps the hub" },
  { ref = "rocker-rod-diamond-pin", restraint = "locate", pose = { origin_mm = [133.06740213488345, 8.456064115939025, -4.77825], x = [0.9979869699018047, 0.06341930231573287, 0.0], z = [0.0, 0.0, -1.0] }, note = "in-process orientation locator (positive tangential stop), not datum C; radial flats allow centre-distance variation, the collar seats on the plate, and the pin carries no clamp or lift load" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [70.0, 34.5, 4.47175], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "upper scrap rail held on its own rest; stud outside the blank" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [-70.0, 34.5, 4.47175], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored upper scrap rail hold-down" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [70.0, -25.5, 4.47175], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "lower scrap rail held on its own rest; stud outside the blank" },
  { ref = "rocker-rail-clamp", restraint = "press", pose = { origin_mm = [-70.0, -25.5, 4.47175], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored lower scrap rail hold-down" },
]
clamp_order = [1, 3, 4, 5, 6] # shoulder screw first, then the four scrap hold-downs; pin 2 never tightens
preload_direction = "counterclockwise" # viewed from above, looking down setup -Z
locate = "reamed bore A on the shoulder screw, lower strap face on support pads, rod hole on the diamond pin as the in-process orientation locator (datum C is the finished land, not the pin)"
supports = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "shoulder screw locates A; preload counterclockwise against the diamond pin before tightening; its radial flats allow centre-distance variation"
clamp = "washer and shoulder screw prevent hub lift; pads carry Z; separate toe clamps retain both scrap rails on matched shimmed rests"
note = "The part and scrap frame are held independently. The web transmits early profile loads to the clamped frame; the hardened diamond pin is an in-process orientation locator, not datum C: it is the positive tangential stop during and after the closing cut in op 27. Keep every scrap clamp tight through op 27. The pin's clearance in the rod hole (S2 op 34 process hold) is part of the orientation budget."

[setups.zero]
tool_touches = []

[setups.zero.transfer]
from = "S3"
indicate = "ground head of the shoulder screw" # indirect fixture-axis pickup; actual A is checked off-machine
tool = "rocker-datum-indicator"
runout_limit_mm = 0.01 # authored ground-head axis pickup criterion; the 1 µm indicator is labelled illustrative inventory

[setups.zero.x]
edge = "ground_shoulder_screw_head_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "ground_shoulder_screw_head_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "strap_datum_b"
edge_mm = -2.27825 # source-backed upper strap station in frame A; the washer covers the hub touch face
# Paper-touch a clear upper strap patch at X40, away from the hub washer and fixture hardware.
method = "paper"
paper_mm = 0.05
tool = "endmills-lms-6784/1-4in-4fl"
check_jog_mm = 10.0
retouch_after = []

[[setups.ops]]
op = 10
do = "scribe"
feature = "top_edge"
layout = "template" # AUTHOR'S CHOICE: template because an R800 line is beyond any trammel on this bench
guide = { template = "rocker-outline-template" }
note = "Blue the upper strap face. Drop the outline template's bush over the shoulder-screw head, clock its sight hole on the rod-hole pin and scribe the top edge along the template."

[[setups.ops]]
op = 20
do = "scribe"
feature = "profile_outer"
layout = "template" # AUTHOR'S CHOICE: template because the R816 arc's centre is 808 mm off the part
guide = { template = "rocker-outline-template" }
note = "Without moving the template, scribe the bottom arc, the tapered ends and both tip lands; lift the template off."

[[setups.ops]]
op = 25
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/1-4in-4fl" # AUTHOR'S CHOICE: the 1/4 in finisher keeps the tip-corner sweep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, 1.2265 below the lower strap face Z-4.80175 at the 7.080 hub aim
exit_mm = 1.2265 # author's choice, through the 2.5235 mm strap; fixture base top is frame-A Z -15.00
doc_mm = 3.75 # author's choice: one full-depth finish level from the strap face (0.20 radial)
rough_allowance_mm = 0.20 # AUTHOR'S CHOICE: the 0.20 radial the earlier roughs left, kept for the file
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap
note = "Rough the top arc outside the scribed line in stairs with light conventional passes. Its two endpoints are the joins for op 27; this cut does not complete the outline release. Keep every scrap-rail clamp tight for the closing stairs in op 27."

[[setups.ops]]
op = 27
do = "rough_profile"
feature = "profile_outer"
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/1-4in-4fl" # AUTHOR'S CHOICE: same 1/4 in end mill as op 25; its join corners near the tips keep >= 3 mm off the upper rail wall
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, 1.2265 below the lower strap face Z-4.80175 at the 7.080 hub aim
exit_mm = 1.2265 # author's choice, same through-profile depth as op 25
doc_mm = 3.75 # author's choice: one full-depth finish level, same as op 25
rough_allowance_mm = 0.20 # AUTHOR'S CHOICE: the 0.20 radial the earlier roughs left, kept for the file
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "stairs", cusp_mm = 0.25 } # AUTHOR'S CHOICE: stairs because a manual mill moves one handwheel at a time; 0.20 allowance + 0.25 cusp leaves 0.45, inside the 0.5 filing cap
note = "Work the stair tables in this order: -X join, bottom arc, +X join; the joins meet the op 25 top-arc end points. The outline releases during this op. Enter each table from the scrap side; never plunge beside the part edge. Move one handwheel at a time at the listed Z, pushing into the counterclockwise-preloaded pin contact. Retract clear of stock and fixturing before moving to the next table. Keep every scrap-rail clamp tight until the op is complete and the cutter is retracted, then remove the scrap. The diamond pin takes the closing-cut load; the shoulder screw and washer prevent lift and the pads carry Z."

[[setups.ops]]
op = 30
do = "file_to_line"
feature = "top_edge"
guide = { template = "rocker-outline-template", gauge = "rocker-profile-template" } # AUTHOR'S CHOICE: file to the scribed line because chords would slant across both handwheels and the R800 centre is off any rotary table
note = "Draw-file the top arc down to the op 10 line, the file square to the strap faces; the part stays on the screw, pin and pads."

[setups.ops.checks]
height_above_pivot = "rocker-profile-template" # final bench inspection on a 6.5 mm pin after removing the fixture screw
radius = "rocker-profile-template"
arc_len = "rocker-profile-template" # engraved arc-length limit lines on the template's top blade
[setups.ops.inspection_methods]
height_above_pivot = [
  "Profile template (make before S4; toolroom-made, example dimensions, plausible, not measured): ground steel base plate 380 x 110 x 12.7 with a pressed 6.500 h6 pivot pin, a 2.000 diamond pin with radial flats at X 133.067, Y 8.456 from the pivot pin (the nominal rod hole) and a Ø14 x 3 deep relief under the hub.",
  "Template blades: two 2.0 ground blades, doweled and screwed round the part position, each working edge 1.00 outside the nominal outline: top blade R799.00 and bottom blade R817.00, both about the arc centre 808.00 above the pivot pin.",
  "Template engraving: a gap station at X 0 on the top blade; arc-length limit lines, radial through the arc centre, on the top blade at X ±144.808 and ±145.309 from the pivot pin (top-edge arc length 291.59 and 292.61) and on the bottom blade at X ±132.668 and ±133.172 (bottom arc length 266.19 and 267.21).",
  "The kit also holds a loose land square (ground steel block with a 40 long convex R800.00 stock face ground with the top blade, and a 12 blade square to the stock face at its end within 0.01 over 10) and a 0.02 to 1.00 feeler set.",
  "Set-up, after op 40: clean the part and the template. Lower the part over both pins onto its lower strap face with the hub in the relief, turn it counterclockwise against the diamond pin and hold it down by hand.",
  "Feeler the top-blade gap at the X 0 station: {X 0 gap}. It must read 0.50 to 1.00 (top edge 8.00 to 8.50 over the pivot).",
]
radius = [
  "Same template set-up as height over pivot. The top edge must lie between R799.49 and R800.51 about the template centre (title-block ±0.51 on R800, no CR).",
  "Slide a 0.49 feeler along the whole top blade, tip to tip; it must enter everywhere: {0.49 enters everywhere, OK / not OK}.",
  "Slide a 1.52 stack (1.00 + 0.50 + 0.02) along the same blade; it must enter nowhere: {1.52 enters nowhere, OK / not OK}.",
]
arc_len = [
  "Same template set-up. Each top-edge tip corner must lie between the top blade's two engraved arc-length lines at its end.",
  "+X corner between its lines: {+X, OK / not OK}.",
  "-X corner between its lines: {-X, OK / not OK}.",
]

[[setups.ops]]
op = 40
do = "file_to_line"
feature = "profile_outer"
# The op 40 filing finishes both exported radial lands, including rod-side datum C.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
guide = { template = "rocker-outline-template", gauge = "rocker-profile-template" } # AUTHOR'S CHOICE: file to the scribed line because chords would slant across both handwheels and the R816 centre is off any rotary table
note = "Draw-file the bottom arc, the tapered ends and both tip lands down to the op 20 line, the file square to the strap faces; the part stays on the screw, pin and pads."

[setups.ops.checks]
bottom_radius = "rocker-profile-template"
bottom_arc_len = "rocker-profile-template"
[setups.ops.inspection_methods]
bottom_radius = [
  "Same profile-template set-up as S4 op 30, after op 40. The bottom edge must lie between R815.49 and R816.51 about the template centre (title-block ±0.51 on R816, no CR).",
  "Slide a 0.49 feeler along the whole bottom blade, end to end; it must enter everywhere: {0.49 enters everywhere, OK / not OK}.",
  "Slide a 1.52 stack (1.00 + 0.50 + 0.02) along the same blade; it must enter nowhere: {1.52 enters nowhere, OK / not OK}.",
]
