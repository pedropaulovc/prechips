note = "After op 40, check the opposite end land width and its 90° angle; inspect both ends separately."
[setups.ops.checks]
tip_land = "calipers"
land_angle_deg = "rocker-profile-template"
[setups.ops.inspection_methods]
land_angle_deg = [
  "Off the template, bed the op 43 land square's R800 stock face on the part's top edge, the blade end at the -X tip corner and the blade across the -X land.",
  "Feeler the gap between blade and land at the land's top-edge end {gap at top} and at its bottom-edge end {gap at bottom}.",
  "Calculate: difference = gap at top - gap at bottom, ignoring sign = {difference}; it must be 0.08 or less.",
]

[[setups.ops]]
op = 50
do = "inspect"
feature = "rod_hole"
note = "Off-machine final A|B|C position check after both C lands are finished: preserve the same fixed-C contact through both height-gauge views."
[setups.ops.checks]
position_dia = "rocker-position-height-gauge"
# Nominals below are projected from the bound v40 STEP: X is outward C normal, Y is B cross C.
# Acceptance is the drawing's Ø0.20 position; the 0.002/0.005 limits only decide whether a reading is valid.
[setups.ops.inspection_methods]
position_dia = [
  "Inspection box (make before S4; shop-made, example dimensions, plausible, not measured): a hollow cast-iron 120 cube with 8 walls. Grind the base, the right side and the front face flat and square to each other within 0.003 per 100, and mark the right side.",
  "Box windows: two 32 x 24 clamp windows through the left wall, 8 to 40 behind the front face, at 38 to 62 and 83 to 107 above the base; one 80 x 80 access window in the back wall.",
  "C stop bar: hardened ground steel 40 x 12 x 12.2, on the front face at its left end, projecting 12 forward with its underside 0.5 above the base. Fix it with two M4 x 12 cap screws and two Ø4 x 16 dowels reamed through bar and wall together, then grind its top 12.70 above the base, parallel to the base within 0.002.",
  "Equilibrate the part, the box, the gauge pins and the gauge blocks on the granite plate at 20 ±1 °C.",
  "Push the largest freely passing gauge pin through bore A and through the rod hole; copy the actual diameters marked on the pins: {pin A Ø} {rod pin Ø}.",
  "Fixed-C contact: stand the box on its base, front face toward you. Lay strap datum B (the upper strap face) flat on the front face, rod end down, with the A axis within 5 of the box's left edge, and lower the part until land C (the +X tip land) sits on the stop bar's ground top; the hub stands clear above the box. Clamp B finger-light with two 3 in toolmaker's parallel clamps through the left windows, without bending or clamping the free span. Keep this C contact and these clamps unchanged through step 12.",
  "Reading a pin: wring a gauge-block stack of known length beside the pin's top, zero the 1 µm test indicator on the stack, then sweep the pin crown at the same height-gauge setting and read the deviation; a higher contact must read positive. Pin-centre height = stack length + deviation - pin radius. The height gauge only carries the indicator; do not use its scale.",
  "View 1, box on its base with C down on the bar (hub pin about 132.4 above the rod pin): read each pin within 2 of an accessible bore face: hub-centre height {H1}, rod-centre height {R1}.",
  "Lean check, view 1: read the hub pin at its accessible mouth {mouth 1} and 10 farther out {out 1}. If they differ by more than 0.005, or B cannot seat without leaning the pin, the readings are not valid: reseat from step 6 and repeat; if it persists, stop and report.",
  "View 2: without unclamping the part or losing C contact, tip the whole box a quarter turn clockwise as you face its front, onto its marked ground right side (rod pin now about 15.8 below the hub pin). Read both pins the same way: hub-centre height {H2}, rod-centre height {R2}.",
  "Reseat check: gently press the non-rod tip toward the stop bar, release, and read both pins again: hub {H3}, rod {R3}. If H3 - R3 and H2 - R2 differ by more than 0.002, the seating did not repeat: reseat from step 6 and redo both views.",
  "Lean check, view 2, as in step 9: {mouth 2} {out 2}.",
  "Calculate: X = H1 - R1 = {X}; Y = H3 - R3 = {Y}.",
  "Calculate: position Ø = 2 × √((X - 132.391)² + (Y - 15.843)²) = {position Ø}; compare it with the drawing limit on the op row (RFS, no bonus). 132.391 and 15.843 are the CAD nominals for this inspection set-up, not the milling X/Y.",
]

[[setups.ops]]
op = 60
do = "inspect"
feature = "hub_od"
note = "Final verification of both upper and lower hub patches against reamed datum A, not only the S1 pilot."
[setups.ops.checks]
dia = "calipers"
coaxiality_dia = "dial-indicator"
[setups.ops.inspection_methods]
coaxiality_dia = [
  "After removing the part, support a close-fitting calibrated pin through the reamed bore in the inspection V-block.",
  "Rotate the pin and indicate both hub patches: {upper TIR} {lower TIR}.",
  "Allow for pin clearance and indicator resolution, then compare each reading with the coaxiality limit on the op row.",
]


