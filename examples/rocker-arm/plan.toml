  "+X end between its lines: {+X, OK / not OK}.",
  "-X end between its lines: {-X, OK / not OK}.",
]

[[setups.ops]]
op = 43
do = "inspect"
feature = "tip_land_pos_x"
note = "After the op 40 filing, check the rod-hole-end land width and its 90° angle to the top edge."
[setups.ops.checks]
