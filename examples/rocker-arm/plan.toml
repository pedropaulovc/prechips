note = "Finish the bottom arc, both tapered ends and both radial tip lands with the listed contour and straight end joins meeting the op 30 top-arc endpoints. Follow the numbered waypoint tables in this sequence: -X join, bottom arc, +X join. Re-enter in the scrap corridor, ramping rather than plunging at a fragment's first waypoint, then make a single light conventional pass at the listed Z; fully retract clear of stock and fixturing before repositioning between disconnected fragments. These joins finish tip_land_pos_x (rod-side datum C) and tip_land_neg_x; the outline releases during this op, not in a later land pass. Use the direction that pushes into the counterclockwise-preloaded pin contact. Keep every scrap-rail clamp tight through completion and retract before removing scrap. The hardened diamond pin reacts the tangential closing-cut load; do not rely on hub friction to react the long-arm cutting torque. The shoulder screw and washer prevent lift, and the nearby pads carry Z; the pin carries no clamp or lift load."

