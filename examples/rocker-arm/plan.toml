# ---------------------------------------------------------------- S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice; brush-on cutting oil, supply/suitability to confirm
deburr_mm = 0.25 # title block: break edges R0.25 or chamfer 0.25 max
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "P5" # the squared blank P1-P5 make ([stock.prepared])
note = "Upper side: rough-face, then finish-face the internal field to make the upper hub face Setup S1 Z0; rough and finish the upper strap face around the hub island; rough the hub, top edge and outer profile; spot and drill the pivot pilot. The face rasters cut the field out to the rail walls (wide rail Y -20, narrow rail Y 31.7) and the ear walls (X ±160); the rails and ears stay full thickness and continuous. The op 50 top-edge rough uses a 1/4 in end mill, so the cutter stays at least 3.2 mm clear of the narrow rail wall (Y 31.7) at both tips."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the upper hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, raw model Z8 minus frame A origin 3.52825
bottom_z = -11.52825 # author's choice, raw model Z-8 minus frame A origin 3.52825

[setups.stock_state.local_thickness]
pivot_bore = 11.52825 # author's choice derived: S1 op 10 entry Z0 to raw blank bottom -11.52825

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "rocker-riser-bars"
riser = "rocker-riser-bars"
riser_up = "height" # matched 25.4 mm ground height
riser_along = "length" # 76.2 mm edge along the jaws; 63.5 mm edge across the 65 mm opening
riser_centres_mm = [[-40.0, 4.5], [40.0, 4.5]] # author's choice, both parallels fully carried inside the jaws
parallels_centres_mm = [[0.0, -25.5], [0.0, 34.5]] # author's choice, wholly under retained full-thickness rails
grip_on = "full-thickness rectangular rails"
grip_mm = 6.0 # author's choice, minimum vertical jaw engagement on the full-thickness retained rails
jaw_above_parallels_mm = 6.8453 # nominal stack: 44.9453 measured jaw - 25.4 example riser - 12.7 example parallel
jaw_center_along_mm = 0.0369 # set by the end stop: its 90.7 nose reach off the fixed jaw's left end puts the blank end at X-170, so the jaw end is at X-79.3 (jaws 158.6738 wide)
stop_fixture = "rocker-vise-stop"
stop_pose = { origin_mm = [-79.3, 37.0, -4.68295], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # magnetic base against the fixed jaw's left end
stop = "switch on the magnetic fixed-jaw end stop and bring the left blank end gently against its nose; positioning contact only, no cutting load"
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Grip the full-thickness rails on the matched riser pair plus 1/2 in parallels. Risers: two O1 bars 76.2 long (along the jaws) x 63.5 wide x 25.4 high, cut from one precision-ground flat bar so their heights match within 0.01, ends milled square; check the pair together on the surface plate before use. Stand both on the vise floor, ground faces up and down, centred X -40 and X +40, Y 4.5, with a 3.8 gap between them at X 0; the 63.5 width fits between the 65 mm closed jaws. Stand the two parallels on the risers, wholly on both bars, under the retained rails at Y -25.5 and Y 34.5. Use light conventional cuts at the outboard tips; stop and resolve chatter before deepening the cut."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.x]
edge = "blank_left_end"
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -170.0 # author's choice, left end of the centred 340 mm blank
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "blank_datum_edge"
from = "-y"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -28.0 # author's choice, model Y -20 minus frame-A origin Y8
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-2fl" # op 5 rougher touches the raw top first
check_jog_mm = 10.0 # author's choice
retouch_after = [5, 10, 20, 25, 30, 32, 40, 50, 60] # op 10 makes the hub face Z0; each op listed is followed by a tool change

# Op 5 and op 10 face the walled internal field: the lower rail is Y -28..-20,
# the upper rail Y 31.7..37 and the ears lie outside X ±160. The raster's cutter
# edge finishes on those walls (pass ends X ±155.235 put the Ø9.525 edge 0.0025
# short of X ±160), so each face op's box is exactly its coverage.
[[setups.ops]]
op = 5
do = "rough_face"
feature = "hub_faces"
faces = ["#374/ADVANCED_FACE[8]/HAF_HUB_FACES__P02"] # exported +Z hub end only
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
