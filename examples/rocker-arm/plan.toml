contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.4725, 150.4725], y = [-15.225, 26.935], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 11.0 }] } # AUTHOR'S CHOICE: op 5 rows and pass ends; island keep-out about the pivot axis
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [-2.27825, 5.0] }

[[setups.ops]]
