note_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:4"

[[setups.ops]]
op = 90
do = "inspect"
feature = "pivot_bore"
note = "After black oxide: re-gauge datum bore A before release."
[setups.ops.checks]
dia = "rocker-bore-limit-gauges"
[setups.ops.inspection_methods]
