doc_mm = 1.5 # author's choice, largest step per pass over the 4.27175 mm from the raw top
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the blank
note = "Field raster: passes along X, stepping from the front rail toward the back rail. The field is walled on all four sides, so at every pass start plunge the centre-cutting end mill straight down to the level Z at light quill feed, then feed the pass; lift to the retract Z and rapid back to the next start. The cutter edge finishes on the rail walls and ear walls; the rails and ears stay at raw height."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.4725, 150.4725], y = [-15.225, 26.935], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: on-grid rows Y -15.225..26.935 at 5.270 (55% of the 9.525 cutter), pass ends X ±155.235; the cutter edge stops 0.0125/0.0025 short of the rail walls Y -20/31.7 and 0.0025 short of the ear walls X ±160
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [0.0, 5.0] }

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#374/ADVANCED_FACE[8]/HAF_HUB_FACES__P02"] # exported +Z hub end only
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # the upper hub face becomes frame A Z0; the lower face stays overstock for S2
