# Rocker-arm illustrative process plan: four explicit holding states.
# Vise S1/S2 retain a full-thickness rail frame around a 340 x 65 mm blank.
# S3 straps hold the supported part for upper-hub finishing and pivot reaming;
# S4 shoulder-screw/pin location holds the part while separately clamped scrap
# rails release. Authored process dimensions are proposals, not shop measurements.
# RPM/feed come from the illustrative example cutting data; the R8 drill chuck,
# 6.5 H7 reamer and supported profile fixture are illustrative example items.
part = "rocker-arm"
features = "features.toml"
construction = "one_piece"   # author's route: all rocker features cut from one prepared blank
quantity = 20
quantity_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:5"

[drawing]
number = "MHA-071"
revision = "v40" # source manifest revision; illustrative plan, not released or approved
cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:2", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "1018 low-carbon steel" # rev-3 author's pick inside the drawing's family; not a sourced grade
material_verify = false # illustrative example: 1018 accepted for the pilot
drawing_material = "LOW-CARBON STEEL OR GRAY IRON"
material_cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:3", "harmonic-analyzer/cad/config/parts/_defaults.yaml:25-27", "rev-3 rocker-arm/plan.yaml:7"]
form = "flat_bar" # AUTHOR'S CHOICE: the sawn bar P1 receives; P1-P5 square it to [stock.prepared]
section_mm = [76.2, 19.05] # 3 x 3/4 in flat bar: model Y width / model Z thickness
length_mm = 345.0 # AUTHOR'S CHOICE: sawn 2.5 mm over each 340 blank end
origin_mm = [-172.5, -25.6, -9.525] # AUTHOR'S CHOICE: bar corner, model X -172.5..172.5, Y -25.6..50.6, Z -9.525..9.525: 5.6 over each edge, 1.525 over each face
axis = [1.0, 0.0, 0.0] # length direction
section_axis = [0.0, 1.0, 0.0] # 76.2 mm section direction; axis × section_axis is 19.05 mm Z
note = "The squared 340 x 65 x 16 mm blank (P1-P5), length left-to-right with the future rod-hole end at +X. Relative to Setup S1 zero, the blank is X -170..170 and Y -28..37. The S1/S2 face rasters cut the internal field out to two full-thickness rails and the end ears (outside X ±160): the 8 mm wide rail (S1 Y -28..-20) and the 5.3 mm narrow rail beside the R800 top edge (S1 Y 31.7..37). S2 turns the part over about X, so in S2 the narrow rail lies at Y -37..-31.7 and the wide rail at Y 20..28. The rails and ears stay continuous to S4. The opposed S1/S2 rough pockets leave a 0.42 mm web at the 7.080 mm hub-length aim. Make the hub integral with the bar; no brazed boss, loose bushing, rod tap or counterbore."
prerequisite = "bandsaw 345 mm off 3 x 3/4 in 1018 cold-finished flat bar, laid flat in the 4x6 bandsaw vise: 4/6 bi-metal blade, 200 ft/min belt step, dry, light steady feed — let the blade cut, never force it" # AUTHOR'S CHOICE: printed as the job page's Before P1 line. Speed: Machinery's Handbook 27th ed. p.1142 Bimetal Band Saw Speeds, 1018 = 300 fpm with coolant; dry -30-50% = 150-210 fpm; 200 is the shop saw's nearest belt step (inventory machines.bandsaw-4x6). 4/6 pitch: the inventory blade, p.1138 chart, 3 in length of cut
cite = ["AUTHOR'S CHOICE: 3 x 3/4 in, a common US flat-bar section over 65 x 16, because it leaves a clean-up skim on every face; 345 mm saws 2.5 mm over each 340 end"]
as_is_faces = [] # every finished face is cut

[stock.prepared] # the squared blank P1-P5 hand S1
setup = "S1"
origin_mm = [-170.0, -20.0, -8.0] # author's model-frame blank corner
section_mm = [65.0, 16.0] # author's choice: rails outside the full 9.525 mm cutter sweep
length_mm = 340.0 # author's choice: 10 mm retained ears beyond X ±160
tolerance_mm = [0.1, 0.05, 0.2] # AUTHOR'S CHOICE: 65.0 ±0.1, 16.0 ±0.05, 340.0 ±0.2
cite = ["AUTHOR'S CHOICE: 16.0 held to +/-0.05 because S1 and S2 face the hubs from both broad faces", "AUTHOR'S CHOICE: 65.0 and 340.0 held loosely because the rails and ears are scrap"]

[stock.prepared.checks] # read after P5, before S1
length = "calipers-18in" # 340.0 ±0.2 over the two side-milled ends
section_0 = "micrometers/2-3in" # 65.0 ±0.1 over the two faced edges
section_1 = "micrometers/0-1in" # 16.0 ±0.05 over the two broad faces
flat = "dti"
square = "dti"
parallel = "dti"

[stock.prepared.methods] # AUTHOR'S CHOICE: the DTI on the height gauge over the granite plate, because the plate is the shop's flat reference
flat = "Lay each broad face on the granite plate; it must not rock. Sweep the DTI on the height gauge along the face above at both edges and the middle and read the needle's total movement."
square = "Stand the blank on the granite against a 1-2-3 block's ground side; sweep the DTI up each edge and each end and read the needle's total movement over the face."
parallel = "Lay the lower face on the granite and sweep the DTI on the height gauge along the upper face at both edges and the middle. Stand it on the datum edge and sweep the opposite edge end to end. Read the needle's total movement on each sweep."

[stock.prepared.form_mm] # the most each methods sweep may move the needle
flat = 0.05 # AUTHOR'S CHOICE: S1 and S2 face the hubs from both broad faces
square = 0.05
parallel = 0.05 # AUTHOR'S CHOICE: one limit for the faces and the edges, because one DTI sweep procedure reads both

# Stock preparation (P1-P5): the six blank faces as plan process faces. Each is a planar
# face of the squared blank; it earns no drawing coverage. at = a point on the face,
# axis = toward the kept material.
[process_features.blank_top]
kind = "end_face"
at = [0.0, 12.5, 8.0]
axis = [0.0, 0.0, -1.0]
note = "the reference face: the upper broad face, faced flat first"
cite = ["AUTHOR'S CHOICE: the upper face is the reference because P2/P3 seat it on the fixed jaw"]

[process_features.blank_datum_edge]
kind = "end_face"
at = [0.0, -20.0, 0.0]
axis = [0.0, 1.0, 0.0]
note = "the first edge, square to the upper face"
cite = ["AUTHOR'S CHOICE: the datum edge is faced first because S1 edge-finds it"]

[process_features.blank_opposite_edge]
kind = "end_face"
at = [0.0, 45.0, 0.0]
axis = [0.0, -1.0, 0.0]
note = "the opposite edge, 65.0 from the datum edge"
cite = ["AUTHOR'S CHOICE: faced from the datum edge because the 65.0 width is measured over the two edges"]

[process_features.blank_bottom]
kind = "end_face"
at = [0.0, 12.5, -8.0]
axis = [0.0, 0.0, 1.0]
note = "the opposite broad face, 16.0 from the upper face"
cite = ["AUTHOR'S CHOICE: faced last of the four long faces because it is sized from the reference"]

[process_features.blank_right_end]
kind = "end_face"
at = [170.0, 12.5, 0.0]
axis = [-1.0, 0.0, 0.0]
note = "the first sawn end, side-milled square to the datum edge"
cite = ["AUTHOR'S CHOICE: side-milled first because P5 zeros X on it"]

[process_features.blank_left_end]
kind = "end_face"
at = [-170.0, 12.5, 0.0]
axis = [1.0, 0.0, 0.0]
note = "the second sawn end, 340.0 from the right end"
cite = ["AUTHOR'S CHOICE: side-milled in the same P5 setup because the 340 length then comes from one DRO move"]

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs" # manual §7.4 Axis Set in ABS
radius_mode = true # manual §6.2
units = "mm"

[dro.direction] # manual §6.2 Direction; set once before S1, proved by each check jog
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames. The export's A/B frames carry binding = "unknown";
# TA/TB repeat their transforms and record how each is bound on the machine.
[frames.TA]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal" # S1: Z0 is the faced upper hub face; S3: indicated on the reamed pilot
note = "AUTHOR'S CHOICE: Setup S1/S3 zero is the upper hub face at the pivot axis, established by the S1 op 10 touch and the S3 indicated pilot."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

[frames.TB]
origin = [0.0, 8.0, -3.55175]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal" # S2: X/Y indicated on the S1 pilot, Z0 the faced lower hub face
note = "AUTHOR'S CHOICE: Setup S2 zero is the lower hub face at the pivot axis, rod-hole end at +X: X/Y indicated on the S1 pilot, Z set from the measured hub length before op 10. Z0 is that face at the 7.080 hub-length aim, 7.080 below the S1 hub face (model Z 3.52825 - 7.080 = -3.55175), so every S2 Z (incoming top, rails, roughing levels) follows from the same aim as the S1 output."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

# Stock-preparation frames (P1-P5). Each Z0 is the blank face the setup faces; X/Y are
# picked up on the bar as it arrives in that setup.
[frames.PA]
origin = [-170.0, -20.0, 8.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal" # P1: Z0 the faced upper face
note = "AUTHOR'S CHOICE: P1 bar flat, upper face up. In this Setup, the faced upper face is Z0; the sawn bar is X -2.5..342.5 and Y -5.6..70.6."
cite = ["AUTHOR'S CHOICE"]

[frames.PB]
origin = [-170.0, -20.0, 8.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "nominal" # P2: Z0 the faced datum edge, upper face on the fixed jaw at Y0
note = "AUTHOR'S CHOICE: P2 bar on edge, datum edge up, faced upper face against the fixed jaw. In this Setup, the faced datum edge is Z0 and the upper face is Y0."
cite = ["AUTHOR'S CHOICE"]

[frames.PC]
origin = [170.0, 45.0, 8.0]
x = [-1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, 1.0, 0.0]
binding = "nominal" # P3: Z0 the faced opposite edge, 65.0 above the datum edge
note = "AUTHOR'S CHOICE: P3 bar on edge, opposite edge up, faced upper face against the fixed jaw, right end to the left. In this Setup, the faced opposite edge is Z0, the datum edge Z -65.0 and the upper face Y0."
cite = ["AUTHOR'S CHOICE"]

[frames.PD]
origin = [-170.0, -20.0, -8.0]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal" # P4: Z0 the faced lower face, 16.0 above the upper face
note = "AUTHOR'S CHOICE: P4 bar flat, lower face up, datum edge against the fixed jaw. In this Setup, the faced lower face is Z0, the upper face Z -16.0 and the datum edge Y0."
cite = ["AUTHOR'S CHOICE"]

[frames.PE]
origin = [170.0, -20.0, 8.0]
x = [-1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal" # P5: X0 the side-milled right end, Z0 the upper face
note = "AUTHOR'S CHOICE: P5 bar flat, upper face up, datum edge against the fixed jaw, both ends overhanging the jaws. In this Setup, the side-milled right end is X0, the left end X 340.0, the datum edge Y0 and the upper face Z0."
cite = ["AUTHOR'S CHOICE"]

# The hub length and the strap thickness the lower faces are cut to. The model carries the
# 7.0565 band minimum; S2 faces the lower hub face and the lower strap face to these
# values, so the kernel cuts the part with those two faces moved to them.
[aims.hub_faces]
requirement = "length"
value_mm = 7.080
face = "#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"
reason = "AUTHOR'S CHOICE: 7.080, the middle of the 7.0565-7.1065 band (7.0815) on the 0.005 DRO grid, because it leaves about 0.024 either side for the hub-length touch-off and the facing passes"

[aims.strap_faces]
requirement = "thickness"
value_mm = 2.5235
face = "#410/ADVANCED_FACE[9]/HAF_STRAP_FACES__P01"
reason = "AUTHOR'S CHOICE derived: the 7.080 hub aim less the two 2.27825 hub-proud steps (S1 op 25, S2 op 20), inside the 1.99-3.01 band"

# ================================================================ P1-P5: square the blank
[[setups]]
id = "P1"
machine = "PM-30MV"
frame = "PA"
coolant = "cutting_oil_brush" # AUTHOR'S CHOICE: brush cutting oil on the cut
deburr_mm = 0.25 # AUTHOR'S CHOICE: stone the faced edges so the next face seats flat
stock_in = "stock"

[setups.stock_state] # frame PA, the sawn bar
top_z = 1.525 # raw upper face, 1.525 over
bottom_z = -17.525 # raw lower face

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x" # AUTHOR'S CHOICE: jaws on the two raw edges, bar flat
fixed_jaw = "rear"
align = { indicator = "dti", limit_mm = 0.0254, over_mm = 100.0, cite = "AUTHOR'S CHOICE: the fixed jaw squared to 0.001 in (0.0254 mm) over 100 mm of the 6 in jaw because the shop test indicator (gauges.dti) reads 0.0005 in, so the limit is two graduations it resolves" }
parallels = "parallels-lms-6745/1-1-4in"
jaw_center_along_mm = 170.0 # AUTHOR'S CHOICE: the 345 mm bar centred in the jaws, 93.5 overhanging each side
stop = "No end stop: centre the bar in the jaws on the parallels." # AUTHOR'S CHOICE
grip_mm = 13.1953 # measured jaw 1.7695 in - 1-1/4 in parallels, x 25.4
jaw_above_parallels_mm = 13.1953
clamp = "hand plus quarter turn, then tap the bar down onto the parallels with a soft hammer" # AUTHOR'S CHOICE: seat the raw face before the first cut
parallels_along = "x"
parallels_centres_mm = [[170.0, -3.0], [170.0, 68.0]] # AUTHOR'S CHOICE: under both edges of the bar
note = "Bar flat on 1-1/4 in parallels, upper face up. Face the upper face just enough to clean up: it is the reference face for every later setup."

[setups.zero.x]
edge = "sawn left end"
edge_mm = -2.5 # AUTHOR'S CHOICE: the sawn end, 2.5 over the left end
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "raw datum edge"
edge_mm = -5.6 # AUTHOR'S CHOICE: the bar's raw datum edge above the jaw, 5.6 over the datum edge
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # AUTHOR'S CHOICE; not an inventory measurement
tool = "endmills-lms-6784/3-4in-4fl"
check_jog_mm = 10.0
retouch_after = [] # one cutter, one op: no tool change follows

[[setups.ops]]
op = 10
do = "face"
feature = "blank_top"
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
approach_mm = 5.0 # AUTHOR'S CHOICE: rapid plane above the raw face
to_z = 0.0
direction = "conventional" # AUTHOR'S CHOICE: hand-fed mill
doc_mm = 1.525 # AUTHOR'S CHOICE: one 1.525 pass, inside the .250 in end-mill depth basis of Machinery's Handbook 27th ed. Table 15a p.1054
stock_removal_bounds = { x = [-4.5, 344.5], y = [-5.6, 70.6], z = [0.0, 1.525] } # the whole raw upper face; AUTHOR'S CHOICE: X runs 2 mm past each bar end because every pass then starts in air and enters the end from the side, never fed down into the stock
contour = { method = "linear_table", step_mm = 12.7 } # AUTHOR'S CHOICE: 2/3 of the 19.05 cutter per pass
note = "Face the whole upper face flat, from Z +1.525 to Z0. Mark it as the reference face."

[[setups]]
id = "P2"
machine = "PM-30MV"
frame = "PB"
coolant = "cutting_oil_brush" # AUTHOR'S CHOICE
deburr_mm = 0.25 # AUTHOR'S CHOICE: stone the faced edges so the next face seats flat
stock_in = "P1"

[setups.stock_state] # frame PB
top_z = 5.6 # raw datum edge, 5.6 over
bottom_z = -70.6 # raw opposite edge

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x" # AUTHOR'S CHOICE: bar on edge, jaws on the two broad faces
fixed_jaw = "rear" # the faced upper face against the fixed jaw
parallels = "parallels-lms-6745/1-2in"
jaw_bar = "jaw-round-bar" # AUTHOR'S CHOICE: round bar against the moving jaw because the raw lower face is not parallel to the faced upper face; the bar lets the upper face seat flat on the fixed jaw
jaw_center_along_mm = 170.0 # AUTHOR'S CHOICE: the 345 mm bar centred in the jaws
stop = "No end stop: centre the bar in the jaws on the parallels." # AUTHOR'S CHOICE
grip_mm = 32.2453 # measured jaw 1.7695 in - 1/2 in parallels, x 25.4
jaw_above_parallels_mm = 32.2453
clamp = "hand plus quarter turn, then tap the bar down onto the parallels with a soft hammer" # AUTHOR'S CHOICE
parallels_along = "x"
parallels_centres_mm = [[170.0, -2.5], [170.0, -15.0]] # AUTHOR'S CHOICE: under both faces of the bar
note = "Before clamping, file the burrs off the faced edges and wipe the bar, jaws and parallels. Bar on edge on 1/2 in parallels, the faced upper face against the fixed jaw. The datum edge comes out square to the upper face."

[setups.zero.x]
edge = "sawn left end"
edge_mm = -2.5 # AUTHOR'S CHOICE: the sawn end, 2.5 over the left end
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "blank_top"
edge_mm = 0.0 # the faced upper face, above the fixed jaw
from = "+y"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # AUTHOR'S CHOICE; not an inventory measurement
tool = "endmills-lms-6784/3-4in-4fl"
check_jog_mm = 10.0
retouch_after = [] # one cutter, one op: no tool change follows

[[setups.ops]]
op = 10
do = "face"
feature = "blank_datum_edge"
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
approach_mm = 5.0 # AUTHOR'S CHOICE: rapid plane above the raw edge
to_z = 0.0
direction = "conventional" # AUTHOR'S CHOICE: hand-fed mill
doc_mm = 2.8 # AUTHOR'S CHOICE: two passes of 2.8, inside the .250 in end-mill depth basis of Machinery's Handbook 27th ed. Table 15a p.1054
stock_removal_bounds = { x = [-4.5, 344.5], y = [-17.525, 0.0], z = [0.0, 5.6] } # the whole raw datum edge; AUTHOR'S CHOICE: X 2 mm past each bar end so every pass starts in air
contour = { method = "linear_table", step_mm = 12.7 } # AUTHOR'S CHOICE: 2/3 of the 19.05 cutter per pass
note = "Face the datum edge from Z +5.6 to Z0 in two passes."

[[setups]]
id = "P3"
machine = "PM-30MV"
frame = "PC"
coolant = "cutting_oil_brush" # AUTHOR'S CHOICE
deburr_mm = 0.25 # AUTHOR'S CHOICE: stone the faced edges so the next face seats flat
stock_in = "P2"

[setups.stock_state] # frame PC
top_z = 5.6 # raw opposite edge, 5.6 over
bottom_z = -65.0 # the faced datum edge

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x" # AUTHOR'S CHOICE: bar on edge, jaws on the two broad faces
fixed_jaw = "rear" # the faced upper face against the fixed jaw
parallels = "parallels-lms-6745/1-2in"
jaw_bar = "jaw-round-bar" # AUTHOR'S CHOICE: round bar against the moving jaw because the raw lower face is not parallel to the faced upper face; the bar lets the upper face seat flat on the fixed jaw
jaw_center_along_mm = 170.0 # AUTHOR'S CHOICE: the 345 mm bar centred in the jaws
stop = "No end stop: centre the bar in the jaws on the parallels." # AUTHOR'S CHOICE
grip_mm = 32.2453 # measured jaw 1.7695 in - 1/2 in parallels, x 25.4
jaw_above_parallels_mm = 32.2453
clamp = "hand plus quarter turn, then tap the bar down onto the parallels with a soft hammer" # AUTHOR'S CHOICE
parallels_along = "x"
parallels_centres_mm = [[170.0, -2.5], [170.0, -15.0]] # AUTHOR'S CHOICE: under both faces of the bar
note = "Before clamping, file the burrs off the faced edges and wipe the bar, jaws and parallels. Bar on edge on 1/2 in parallels, the faced datum edge down and the faced upper face against the fixed jaw."

[setups.zero.x]
edge = "sawn right end"
edge_mm = -2.5 # AUTHOR'S CHOICE: the sawn end, 2.5 over the right end
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "blank_top"
edge_mm = 0.0 # the faced upper face, above the fixed jaw
from = "+y"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set" # AUTHOR'S CHOICE: the raw edge is not reliably 70.6 over the datum edge
gauge = "micrometers/2-3in"
measure = "before clamping: mike the bar from the faced datum edge to the raw opposite edge"
offset_mm = -65.0 # Axis Set Z = M - 65.0 + paper puts Z0 on the 65.0 face
paper_mm = 0.05 # AUTHOR'S CHOICE; not an inventory measurement
tool = "endmills-lms-6784/3-4in-4fl"
check_jog_mm = 10.0
retouch_after = [] # one cutter, one op: no tool change follows

[[setups.ops]]
op = 10
do = "face"
feature = "blank_opposite_edge"
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
approach_mm = 5.0 # AUTHOR'S CHOICE: rapid plane above the raw edge
to_z = 0.0
direction = "conventional" # AUTHOR'S CHOICE: hand-fed mill
doc_mm = 2.8 # AUTHOR'S CHOICE: two passes of 2.8, inside the .250 in end-mill depth basis of Machinery's Handbook 27th ed. Table 15a p.1054
stock_removal_bounds = { x = [-4.5, 344.5], y = [-17.525, 0.0], z = [0.0, 5.6] } # the whole raw opposite edge; AUTHOR'S CHOICE: X 2 mm past each bar end so every pass starts in air
contour = { method = "linear_table", step_mm = 12.7 } # AUTHOR'S CHOICE: 2/3 of the 19.05 cutter per pass
note = "Face the opposite edge to Z0, 65.0 over the datum edge, in two passes." # AUTHOR'S CHOICE: the levels assume the nominal edge; the measured M sets the real one, and the sheet's DRO ZERO prints the raw-edge correction from offset_mm and doc_mm

[[setups]]
id = "P4"
machine = "PM-30MV"
frame = "PD"
coolant = "cutting_oil_brush" # AUTHOR'S CHOICE
deburr_mm = 0.25 # AUTHOR'S CHOICE: stone the faced edges so the next face seats flat
stock_in = "P3"

[setups.stock_state] # frame PD
top_z = 1.525 # raw lower face, 1.525 over
bottom_z = -16.0 # the faced upper face

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x" # AUTHOR'S CHOICE: jaws on the two faced edges, bar flat
fixed_jaw = "rear" # the faced datum edge against the fixed jaw
parallels = "parallels-lms-6745/1-1-4in"
jaw_center_along_mm = 170.0 # AUTHOR'S CHOICE: the 345 mm bar centred in the jaws
stop = "No end stop: centre the bar in the jaws on the parallels." # AUTHOR'S CHOICE
grip_mm = 13.1953 # measured jaw 1.7695 in - 1-1/4 in parallels, x 25.4
jaw_above_parallels_mm = 13.1953
clamp = "hand plus quarter turn, then tap the bar down until both parallels are pinned" # AUTHOR'S CHOICE: the upper face seats flat on both parallels
parallels_along = "x"
