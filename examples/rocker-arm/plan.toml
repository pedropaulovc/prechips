land_angle_deg = "rocker-profile-template" # the kit's loose land square, bedded on the part's own top edge, against the title-block ±1° band
[setups.ops.inspection_methods]
land_angle_deg = [
  "Take the part off the profile template onto a clean bench.",
  "Bed the land square's R800 stock face on the part's top edge, the blade end at the +X tip corner and the blade across the +X land. The square registers on the top edge, so hole clocking does not affect the reading.",
  "Feeler the gap between blade and land at the land's top-edge end {gap at top} and at its bottom-edge end {gap at bottom}.",
  "Calculate: difference = gap at top - gap at bottom, ignoring sign = {difference}; it must be 0.08 or less (89° to 91° over the shortest 5.08 land).",
]

[[setups.ops]]
op = 44
