# Rocker-arm illustrative process plan: four explicit holding states.
# Vise S1/S2 retain a full-thickness rail frame around a 340 x 65 mm blank.
# S3 straps hold the supported part for upper-hub finishing and pivot reaming;
# S4 shoulder-screw/pin location holds the part while separately clamped scrap
# rails release. Authored process dimensions are proposals, not shop measurements.
# RPM/feed come from the illustrative example cutting data; the R8 drill chuck,
# 6.5 H7 reamer and supported profile fixture are illustrative example items.
part = "rocker-arm"
features = "features.toml"
construction = "one_piece"   # author's route: all rocker features cut from one prepared blank
quantity = 20
quantity_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:5"

[drawing]
number = "MHA-071"
revision = "v40" # source manifest revision; illustrative plan, not released or approved
cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:2", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
material = "1018 low-carbon steel" # rev-3 author's pick inside the drawing's family; not a sourced grade
material_verify = false # illustrative example: 1018 accepted for the pilot
drawing_material = "LOW-CARBON STEEL OR GRAY IRON"
material_cite = ["harmonic-analyzer/cad/config/parts/rocker-arm.yaml:3", "harmonic-analyzer/cad/config/parts/_defaults.yaml:25-27", "rev-3 rocker-arm/plan.yaml:7"]
form = "rectangular_blank" # rev-3 prepared blank with rectangular reference edges; no stock on hand claimed
form_verify = false # illustrative example: prepared blank accepted for the pilot
section_mm = [65.0, 16.0] # author's choice: rails outside the full 9.525 mm cutter sweep
length_mm = 340.0 # author's choice: 10 mm retained ears beyond X ±160
origin_mm = [-170.0, -20.0, -8.0] # author's model-frame blank corner
axis = [1.0, 0.0, 0.0] # length direction
section_axis = [0.0, 1.0, 0.0] # 65 mm section direction; axis × section_axis is 16 mm Z
note = "Illustrative prepared 340 x 65 x 16 mm blank, length left-to-right with the future rod-hole end at +X. Relative to Setup S1 zero, the raw blank is X -170..170, Y -28..37, Z -11.52825..4.47175. Retain the full-thickness lower rail at Y -28..-20, upper rail at Y 31.7..37 and end ears outside X ±160, clear of the whole 9.525 mm cutter sweep. Keep a 0.40 mm web connecting the opposed rough pockets. Make the hub integral with the bar; no brazed boss, loose bushing, rod tap or counterbore. These are authored example dimensions, not stock on hand."
as_is_faces = [] # every finished face is cut

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
mode = "abs" # manual §7.4 Axis Set in ABS
radius_mode = true # manual §6.2
units = "mm"

[dro.direction] # manual §6.2 Direction; set once before S1, proved by each check jog
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames. The export's A/B frames carry binding = "unknown";
# TA/TB repeat their transforms and record how each is bound on the machine.
[frames.TA]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal" # S1: Z0 is the faced upper hub face; S3: indicated on the reamed pilot
note = "AUTHOR'S CHOICE: Setup S1/S3 zero is the upper hub face at the pivot axis, established by the S1 op 10 touch and the S3 indicated pilot."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

[frames.TB]
origin = [0.0, 8.0, -3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal" # S2: X/Y indicated on the S1 pilot, Z0 the faced lower hub face
note = "AUTHOR'S CHOICE: Setup S2 zero is the lower hub face at the pivot axis. Roll the blank over about its length, keeping the rod-hole end at +X; indicate the S1 pilot and touch the S2 op 10 faced hub."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:72-72", "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-117"]

# ---------------------------------------------------------------- S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice; brush-on cutting oil, supply/suitability to confirm
deburr_mm = 0.25 # title block: break edges R0.25 or chamfer 0.25 max
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "stock"
note = "Upper side: qualify the upper hub face as Setup S1 Z0, finish the upper strap face, rough the hub, top edge and outer profile, spot and drill the pivot pilot. Keep the rails and ears continuous. Contour tables are nominal boundary offsets: interrupt at clamped rails/ears, preserve the 0.40 mm web, and confirm actual cutter access before using any checkpoint."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the upper hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, raw model Z8 minus frame A origin 3.52825
bottom_z = -11.52825 # author's choice, raw model Z-8 minus frame A origin 3.52825

[setups.stock_state.local_thickness]
pivot_bore = 11.52825 # author's choice derived: S1 op 10 entry Z0 to raw blank bottom -11.52825

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "rocker-riser-bars"
riser = "rocker-riser-bars"
riser_up = "height" # matched 25.4 mm ground height
riser_along = "length" # 76.2 mm edge along the jaws; 64 mm edge across the 65 mm opening
riser_centres_mm = [[-40.0, 4.5], [40.0, 4.5]] # author's choice, both parallels fully carried inside the jaws
parallels_centres_mm = [[0.0, -25.5], [0.0, 34.5]] # author's choice, wholly under retained full-thickness rails
grip_on = "full-thickness rectangular rails"
grip_mm = 6.0 # author's choice, minimum vertical jaw engagement on the full-thickness retained rails
jaw_above_parallels_mm = 6.8453 # nominal stack: 44.9453 measured jaw - 25.4 example riser - 12.7 example parallel
jaw_center_along_mm = 0.0 # author's choice: jaws centred on the 340 mm blank
stop_fixture = "rocker-vise-stop"
stop_pose = { origin_mm = [-79.3369, 37.0, -4.68295], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # magnetic base against the fixed jaw's left end
stop = "switch on the magnetic fixed-jaw end stop and bring the left blank end gently against its nose; positioning contact only, no cutting load"
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Grip the full-thickness rails on matched narrow risers plus 1/2 in parallels. The 64 mm risers fit between the 65 mm closed jaws and fully carry both parallels. Keep the cutter's whole swept diameter inside the clearing bounds, not just its centre."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.x]
edge = "blank_left_end"
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -170.0 # author's choice, left end of the centred 340 mm blank
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "blank_front_edge"
from = "-y"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
edge_mm = -28.0 # author's choice, model Y -20 minus frame-A origin Y8
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 20, 25, 50, 60] # op 10 makes the hub face Z0; each later op listed is followed by a tool change

[[setups.ops]]
op = 10
do = "face"
feature = "hub_faces"
faces = ["#374/ADVANCED_FACE[8]/HAF_HUB_FACES__P02"] # exported +Z hub end only
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # the upper hub face becomes frame A Z0; the lower face stays overstock for S2
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the blank

[[setups.ops]]
op = 20
do = "rough_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # author's choice, finish strap Z-2.27825 + 0.20 allowance
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Around the hub island, keeping the rails."

[[setups.ops]]
op = 25
do = "finish_face"
feature = "strap_datum_b"
faces = ["#118/ADVANCED_FACE[5]/HAF_STRAP_DATUM_B__P01"] # exported +Z broad strap face (datum B)
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # upper strap face: HUB_PROUD = (7.0565 - 2.5)/2 below the hub face
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0

[[setups.ops]]
op = 30
do = "rough_profile"
feature = "hub_od"
faces = ["#75/ADVANCED_FACE[3]/HAF_HUB_OD__P02", "#464/ADVANCED_FACE[10]/HAF_HUB_OD__P02"] # upper hub patches
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825 # author's choice, finish upper hub-wall Z-2.27825 + 0.20
rough_allowance_mm = 0.20 # author's choice, radial allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 } # author's choice, continuous circle through checkpoints
note = "Upper hub island about the pivot axis; finished in S3 with the bore."

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, model mid-plane Z-3.52825 + 0.20; retained web
rough_allowance_mm = 0.20 # author's choice, normal allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
note = "Bottom arc, radial lands and tapered ends; rails and ears stay continuous. The 5.59 lands are profile lines, not chamfers."
# Clear the bottom arc, tapers and lands round both tips. The retained lower
# rail is frame-A Y -28..-20, beyond the full cutter sweep, and the end ears
# are outside X ±160. Op 50 clears the upper pocket. Stop the cutter's whole
# swept solid inside these bounds; retain the central 0.40 mm web.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 24.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, model mid-plane Z-3.52825 + 0.20; retained web
rough_allowance_mm = 0.20 # author's choice, radial allowance restored from rev 3
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
note = "R800 top edge and the upper ends of the tapers; leave the rails and ears connected."
# Clear above the top edge round both tips, preserving the upper rail
# frame-A Y 31.7..37 and the ears outside X ±160.
stock_removal_bounds = { x = [-160.0, 160.0], y = [3.24, 31.7], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 60
do = "spot"
feature = "pivot_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot inside the #2 pilot length
approach_mm = 5.0

[[setups.ops]]
op = 70
do = "drill"
feature = "pivot_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, full drill diameter beyond raw exit face
approach_mm = 5.0
note = "6.2484 mm letter-D pilot leaves about 0.264 mm diametral stock under the example 6.512 mm reamer in S3. Indicate this pilot for S2/S3 pickups; final bore size and Ra still require inspection."

# ---------------------------------------------------------------- S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "TB"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S1"
note = "Lower side: roll the blank over about its length, keeping the rod-hole end at +X. Indicate the S1 pilot, qualify the lower hub face, and rough before finishing the lower strap face and hub OD. Adjust the two support jacks to just bear on the S1-finished strap without lifting the rail frame from its parallels. Spot, drill and ream the rod hole before opening the outer pockets; then rough the opposed pockets leaving the 0.40 mm web. Final A|B|C position inspection follows S4 land finishing."

[setups.stock_state]
top_feature = "hub_faces" # the Z-touch face is the lower hub face; strap face ops do not move it
top_z = 4.47175 # author's choice, flipped raw model Z-8 relative to frame B Z-3.52825
bottom_z = -7.0565 # S1 hub face, HUB_LENGTH below frame B Z0 (nominal; band +0.05/0)
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # author's choice, raw model Z8 after flip; rails, not faced hub, seat on supports

[setups.stock_state.local_thickness]
rod_hole = 2.5 # both strap faces are finished before the spot/pilot/ream sequence

[setups.stock_state.local_thickness_cite]
rod_hole = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:542-545"

[setups.stock_state.entry_z]
rod_hole = -2.27825 # lower strap face, uppermost in frame B

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear" # author's choice
parallels = "parallels-lms-6745/1-2in"
supports = "rocker-riser-bars"
riser = "rocker-riser-bars"
riser_up = "height"
riser_along = "length"
riser_centres_mm = [[-40.0, -4.5], [40.0, -4.5]] # author's choice, frame B (Y flipped)
parallels_centres_mm = [[0.0, -34.5], [0.0, 25.5]] # author's choice, wholly under retained rails
clamps = [
  { ref = "rocker-s2-support-jack", pose = { origin_mm = [40.0, -1.0, -4.77825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, -1.0] }, note = "passive upward-bearing support jack, not a clamp; adjust to touch the finished strap without lifting the rail frame, then lock the jack" },
  { ref = "rocker-s2-support-jack", pose = { origin_mm = [-40.0, -1.0, -4.77825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, -1.0] }, note = "mirrored support jack, adjusted and locked independently without preload" },
]
clamp_order = [] # the jack entries are passive supports, not tightening actions
grip_on = "full-thickness rectangular rails and ears"
grip_mm = 6.0 # author's choice, minimum vertical jaw engagement on the full-thickness retained rails/ears
jaw_above_parallels_mm = 6.8453 # nominal stack: 44.9453 measured jaw - 25.4 example riser - 12.7 example parallel
jaw_center_along_mm = 0.0 # author's choice: jaws centred on the 340 mm blank
stop_fixture = "rocker-vise-stop"
stop_pose = { origin_mm = [-79.3369, 28.0, -4.68295], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
stop = "switch on the magnetic fixed-jaw end stop and bring the left blank end gently against its nose; then indicate the pilot to transfer datum"
clamp = "hand snug, then quarter turn; confirm seating and rail engagement" # author's choice
note = "Seat the retained rails, not the thin strap or a hub rim."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.transfer]
from = "S1"
indicate = "pivot_bore" # the S1 pilot
tool = "rocker-datum-indicator"

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0 # frame B origin is on the pivot axis
radius_mm = 0.0 # indicated centre, no finder radius
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0 # author's choice
retouch_after = [10, 15, 20, 28, 30, 50, 60] # retouch before each changed cutting tool

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#510/ADVANCED_FACE[15]/HAF_HUB_FACES__P01"] # exported -Z hub end, upward in frame B
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = 0.0 # lower hub face; approach the length from long, never below 7.0565
direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the retained rails

[setups.ops.checks]
length = "micrometers/0-1in"

[[setups.ops]]
op = 15
do = "rough_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825
rough_allowance_mm = 0.20
direction = "conventional"
approach_mm = 5.0
note = "Take stepped roughing passes on the supported lower strap, leave 0.20 mm for the finish pass."

[[setups.ops]]
op = 20
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825
to_z_cite = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:122"
direction = "conventional" # author's choice
approach_mm = 5.0

[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 25
do = "inspect"
feature = "strap_datum_b"
note = "Check the 2.50 mm strap thickness with a micrometer after finishing both sides; measure clear of the hub, support contacts and edge burrs."
[setups.ops.checks]
thickness = "micrometers/0-1in"

[[setups.ops]]
op = 28
do = "rough_profile"
feature = "hub_od"
faces = ["#518/ADVANCED_FACE[16]/HAF_HUB_OD__P01", "#539/ADVANCED_FACE[17]/HAF_HUB_OD__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.07825
rough_allowance_mm = 0.20
direction = "conventional"
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 }

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "hub_od"
faces = ["#518/ADVANCED_FACE[16]/HAF_HUB_OD__P01", "#539/ADVANCED_FACE[17]/HAF_HUB_OD__P01"] # lower hub patches
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # lower hub OD runs down to the lower strap face
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 } # author's choice, continuous circle
note = "Lower hub OD about the transferred pilot axis."

[setups.ops.checks]
dia = "calipers" # illustrative example gauge for the drawing's 1.02 mm OD band
coaxiality_dia = "dial-indicator"

[[setups.ops]]
op = 32
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.50 # author's choice, shallow spot from the lower strap face in frame B
approach_mm = 5.0

[[setups.ops]]
op = 33
do = "drill"
feature = "rod_hole"
tool = "rocker-rod-pilot-drill/1.90mm" # illustrative metric purchase, 0.104 mm diametral stock for the following ream
holder = "drill-chuck-r8"
exit_mm = 1.5 # author's choice, full drill diameter beyond local strap exit
approach_mm = 5.0
note = "Drill the undersize pilot while the full-thickness outside stock still supports the strap; do not expect a twist drill to hold the final fixture-clock size band."

[[setups.ops]]
op = 34
do = "ream"
feature = "rod_hole"
tool = "rocker-rod-reamer/2.0mm" # illustrative purchase, 2.004 mm example working diameter
holder = "drill-chuck-r8"
exit_mm = 1.5 # clears the 0.4 mm lead beyond the 2.5 mm strap
approach_mm = 5.0
note = "Ream and gauge before roughing the outside pockets. Process GO 2.000 must enter and process NO-GO 2.010 must not; the unchanged drawing band is 1.994..2.094. This controls clearance over the 1.9875 mm diamond clocking stop without relying on a close twist-drilled hole."

[setups.ops.checks]
dia = "rocker-rod-limit-gauges" # process GO 2.000 / NO-GO 2.010; drawing GO 1.994 / NO-GO 2.094

[[setups.ops]]
op = 40
do = "rough_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03", "#495/ADVANCED_FACE[13]/HAF_TIP_LAND_POS_X__P01", "#483/ADVANCED_FACE[12]/HAF_TIP_LAND_NEG_X__P01"]
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, symmetric rough depth leaves 0.40 mm web with S1
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
# Frame B reverses Y: lower-rail material remains Y20..28; the clearing
# wraps around both tips while the ears remain outside X ±160.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-24.0, 20.0], z = [-3.32825, 5.0] }

[[setups.ops]]
op = 50
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-2fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -3.32825 # author's choice, symmetric rough depth leaves 0.40 mm web with S1
rough_allowance_mm = 0.20 # author's choice, restored rev-3 allowance
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
# Upper-rail material remains frame-B Y -37..-31.7; the cutter's whole
# swept diameter stays inside the clearing box and outside the rail.
stock_removal_bounds = { x = [-160.0, 160.0], y = [-31.7, -3.24], z = [-3.32825, 5.0] }


# ---------------------------------------------------------------- S3
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush" # author's choice
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S2"
note = "Strap-held hub setup: indicate the empty plate bore before loading. Lower the blank straight down over the permanent rod-hole diamond pin onto the lower-strap support pads, then match the rail-rest shims without lifting the part. Indicate the D pilot and confirm its centre is within 0.20 mm radial of the empty plate-bore reference before tightening. If the rod hole will not drop over the pin with the pilot inside 0.20 mm, stop and inspect S2 hole spacing; do not force it. Re-indicate the pilot as working A, then finish the upper hub OD and ream without relocating. Remote studs and stepped straps clear the raw rails; do not profile across these straps. The pin stays fitted for S4."

[setups.stock_state]
top_feature = "hub_faces" # Z touches the upper hub face
top_z = 0.0 # upper hub face (S1 op 10)
bottom_z = -7.0565 # lower hub face (S2 op 10), nominal hub length
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # the raw rail frame seats on the fixture's outer rests

[setups.stock_state.local_thickness]
pivot_bore = 7.0565 # bore runs the full hub length

[setups.stock_state.local_thickness_cite]
pivot_bore = "harmonic-analyzer/cad/scripts/build_rocker_arm.py:542-544"

[setups.stock_state.entry_z]
pivot_bore = 0.0

[setups.hold]
fixture = "rocker-profile-fixture" # illustrative example fixture (inventory solids)
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } # fixture frame = frame A
clamps = [
  { ref = "rocker-hub-strap", pose = { origin_mm = [70.0, 3.27, -2.27825], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "rod-side supported toe; bridge clears the raw rail and the stud is outside the blank at Y45" },
  { ref = "rocker-hub-strap", pose = { origin_mm = [-70.0, 3.27, -2.27825], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored supported toe and remote stud" },
  { ref = "rocker-rod-diamond-pin", pose = { origin_mm = [133.06740213488345, 8.456064115939025, -4.77825], x = [0.9979869699018047, 0.06341930231573287, 0.0], z = [0.0, 0.0, -1.0] }, note = "permanently fitted rod-hole pin, unchanged for S4; no clamp or lift load" },
]
clamp_order = [1, 2] # only the two hub straps tighten; the permanent pin is a locator
locate = "first indicate the empty plate bore and retain its X/Y reference; lower the blank straight down over the permanent rod-hole pin onto the pads and indicate the D pilot"
supports = "not_applicable" # the fixture's own support pads carry the strap
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable" # author's choice, supported plate/strap contacts, not vise jaws
jaw_above_parallels_mm = "not_applicable"
stop = "before tightening the straps, confirm the indicated pilot is within 0.20 mm radial of the empty plate-bore reference; then re-indicate the pilot as working datum A" # author's clearance control, not a drawing tolerance
clamp = "two stepped padded straps on upper datum face B, remote studs outside the retained rail frame; supported toes, no stud through the part"
note = "The permanent pin and coarse arm alignment keep the part over its twelve support pads and the strap toes on face B; they do not establish datum C. Seat the lower strap face first, then match the shimmed rail rests to the actual raw rails without lifting the part. The 8 mm stand relief clears the reamer after the 0.20 mm placement check."

[setups.zero]
tool_touches = [] # one Z touch per tool change, listed in retouch_after

[setups.zero.transfer]
from = "S2"
indicate = "pivot_bore"
tool = "rocker-datum-indicator"

[setups.zero.x]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.y]
edge = "pivot_bore_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0 # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05 # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0 # author's choice
retouch_after = [10] # finish endmill to reamer

[[setups.ops]]
op = 10
do = "finish_profile"
feature = "hub_od"
faces = ["#75/ADVANCED_FACE[3]/HAF_HUB_OD__P02", "#464/ADVANCED_FACE[10]/HAF_HUB_OD__P02"] # upper hub patches
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -2.27825 # upper hub OD runs down to the upper strap face
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 10.0 } # author's choice, continuous circle
note = "Upper hub OD and pivot ream without relocation. Lower hub patches were finished in S2 about the transferred pilot; inspect both patches to the reamed datum after profiling."

[setups.ops.checks]
dia = "calipers" # author's choice
coaxiality_dia = "dial-indicator"

[setups.ops.inspection_methods]
coaxiality_dia = "preliminary spindle indication about the transferred pilot; final verification uses both hub patches against the reamed-bore datum in S4"

[[setups.ops]]
op = 20
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
exit_mm = 2.0 # author's choice, past the 1.0 mm reamer lead
approach_mm = 5.0
note = "Indicate and record the pilot centre before reaming, re-indicate the reamed bore after op 20, and record the centre shift. The example process limit is 0.020 mm radial shift; stop the batch if exceeded rather than carrying pilot error into datum A and the rod-position check."

[setups.ops.checks]
dia = "rocker-bore-limit-gauges" # calibrated example GO 6.500 / NO-GO 6.530 plugs
finish_ra = "roughness-comparator"

# ---------------------------------------------------------------- S4
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "TA"
coolant = "cutting_oil_brush"
deburr_mm = 0.25
deburr_cite = "harmonic-analyzer/cad/config/title_block.yaml:43-45"
stock_in = "S3"
note = "Remove the S3 straps, lift the blank clear of the permanent rod-hole pin and reload onto the same pin and support pads. Fit the shoulder screw and washer through the reamed pivot bore. Match each shimmed rail rest to the actual raw rail without lifting the part. Rotate the part counterclockwise viewed from above (looking down setup -Z) to preload the rod hole against the closing-cut side of the pin, then tighten the shoulder screw and washer. Indicate the ground screw head after tightening to establish the fixture axis; the head is coaxial with the shoulder, not an exposed part-bore touch. Clamp the scrap rails independently. Touch Z on an unobstructed upper strap patch, not the washer-covered hub. Finish the outline with light conventional passes."

[setups.stock_state]
top_feature = "hub_faces"
top_z = 0.0
bottom_z = -7.0565
bottom_z_cite = "harmonic-analyzer/cad/scripts/rocker_arm_spec.py:117-121"
retained_rail_bottom_z = -11.52825 # scrap rails remain seated and independently clamped through outline release

[setups.hold]
fixture = "rocker-profile-fixture"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "rocker-pivot-screw", pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "ground locating shoulder through reamed datum A; bored washer clamps the hub" },
  { ref = "rocker-rod-diamond-pin", pose = { origin_mm = [133.06740213488345, 8.456064115939025, -4.77825], x = [0.9979869699018047, 0.06341930231573287, 0.0], z = [0.0, 0.0, -1.0] }, note = "positive tangential clocking stop; radial flats allow centre-distance variation, the collar seats on the plate, and the pin carries no clamp or lift load" },
  { ref = "rocker-rail-clamp", pose = { origin_mm = [70.0, 34.5, 4.47175], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "upper scrap rail held on its own rest; stud outside the blank" },
  { ref = "rocker-rail-clamp", pose = { origin_mm = [-70.0, 34.5, 4.47175], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored upper scrap rail hold-down" },
  { ref = "rocker-rail-clamp", pose = { origin_mm = [70.0, -25.5, 4.47175], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "lower scrap rail held on its own rest; stud outside the blank" },
  { ref = "rocker-rail-clamp", pose = { origin_mm = [-70.0, -25.5, 4.47175], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "mirrored lower scrap rail hold-down" },
]
clamp_order = [1, 3, 4, 5, 6] # shoulder screw first, then the four scrap hold-downs; pin 2 never tightens
preload_direction = "counterclockwise" # viewed from above, looking down setup -Z
locate = "reamed bore A on the shoulder screw, lower strap face on support pads, rod hole on the diamond clocking pin"
supports = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
grip_mm = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "shoulder screw locates A; preload counterclockwise against the diamond pin before tightening; its radial flats allow centre-distance variation"
clamp = "washer and shoulder screw prevent hub lift; pads carry Z; separate toe clamps retain both scrap rails on matched shimmed rests"
note = "The part and scrap frame are held independently. The web transmits early profile loads to the clamped frame; the hardened diamond pin is the positive tangential stop during and after the closing cut. Keep every scrap clamp tight through op 42. The 1.9875 mm pin in a 2.000..2.010 mm process hole has 0.0125..0.0225 mm diametral clearance, included in the clocking budget."

[setups.zero]
tool_touches = []

[setups.zero.transfer]
from = "S3"
indicate = "rocker-pivot-screw ground head" # indirect fixture-axis pickup; actual A is checked off-machine
tool = "rocker-datum-indicator"

[setups.zero.x]
edge = "ground_shoulder_screw_head_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "ground_shoulder_screw_head_axis"
from = "indicated"
tool = "rocker-datum-indicator"
edge_mm = 0.0
radius_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "strap_datum_b"
edge_mm = -2.27825 # source-backed upper strap station in frame A; the washer covers the hub touch face
# Paper-touch a clear upper strap patch at X40, away from the hub washer and fixture hardware.
method = "paper"
paper_mm = 0.05
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0
retouch_after = []

[[setups.ops]]
op = 30
do = "finish_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, lower strap Z-4.77825 minus 1.25 exit
exit_mm = 1.25 # author's choice, through the 2.50 mm strap; fixture base top is frame-A Z -15.00
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice

[setups.ops.checks]
height_above_pivot = "rocker-profile-template" # final bench inspection on a 6.5 mm pin after removing the fixture screw
radius = "rocker-profile-template"
arc_len = "rocker-profile-template" # scribed arc-end marks on the template

[[setups.ops]]
op = 40
do = "finish_profile"
feature = "profile_outer"
# Same whole outline; the export names both radial lands separately.
faces = ["#225/ADVANCED_FACE[7]/HAF_PROFILE_OUTER__P01", "#84/ADVANCED_FACE[4]/HAF_PROFILE_OUTER__P02", "#475/ADVANCED_FACE[11]/HAF_PROFILE_OUTER__P03"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # author's choice, lower strap Z-4.77825 minus 1.25 exit
exit_mm = 1.25 # author's choice, same through-profile depth as op 30
direction = "conventional" # author's choice
approach_mm = 5.0
contour = { method = "arc_table", step_deg = 1.0 } # author's choice
note = "Bottom arc and tapered ends in one contour with ops 41/42; the rails and ears come off when op 42 closes the outline, only under the fixture's support."

[setups.ops.checks]
bottom_radius = "rocker-profile-template"
bottom_arc_len = "rocker-profile-template"

[[setups.ops]]
op = 41
do = "finish_profile"
feature = "tip_land_pos_x" # rod-side radial land, datum C
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # same contour depth as op 40
exit_mm = 1.25
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Light conventional finish passes only. The hardened diamond pin is the positive tangential clocking stop; the shoulder screw and washer prevent lift, and the nearby pads carry Z. Do not rely on hub friction to react the long-arm cutting torque."

[[setups.ops]]
op = 42
do = "finish_profile"
feature = "tip_land_neg_x"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
to_z = -6.02825 # same contour depth as op 40
exit_mm = 1.25
direction = "conventional" # author's choice
approach_mm = 5.0
note = "Close the outline with a light conventional pass along the negative-X land, in the direction that pushes into the counterclockwise-preloaded pin contact. Keep every scrap-rail clamp tight; the pin reacts tangential cutting load, never clamp or lift load."

[[setups.ops]]
op = 43
do = "inspect"
feature = "tip_land_pos_x"
note = "After ops 41/42, check the rod-hole-end land width and its 90° angle to the drawing's title-block ±1° limit."
[setups.ops.checks]
tip_land = "calipers" # author's choice
land_angle_deg = "rocker-profile-template" # 90° land template against the drawing's title-block ±1° band

[[setups.ops]]
op = 44
do = "inspect"
feature = "tip_land_neg_x"
note = "Check the opposite end land to the same width and 90° angle limits; inspect both ends separately."
[setups.ops.checks]
tip_land = "calipers"
land_angle_deg = "rocker-profile-template"

[[setups.ops]]
op = 50
do = "inspect"
feature = "rod_hole"
note = "Final position verification after datum-C lands are finished and after removing the part from the fixture."
[setups.ops.checks]
position_dia = "rocker-position-height-gauge"
[setups.ops.inspection_methods]
position_dia = "Seat upper datum face B against an angle plate and square the rod-side land C to the surface plate. Fit a 6.5 mm pin in datum bore A and the largest calibrated go pin that fits the rod hole; measure over both pins with the height gauge in two orthogonal orientations, subtract pin radii, and compare the centre offsets to the basic drawing coordinates within the Ø0.20 zone."

[[setups.ops]]
op = 60
do = "inspect"
feature = "hub_od"
note = "Final verification of both upper and lower hub patches against reamed datum A, not only the S1 pilot."
[setups.ops.checks]
dia = "calipers"
coaxiality_dia = "dial-indicator"
[setups.ops.inspection_methods]
coaxiality_dia = "After removing the part, support a close-fitting calibrated pin through the reamed bore in the inspection V-block. Rotate the pin and indicate both hub patches; each patch must remain within 0.50 mm TIR, accounting for pin clearance and indicator resolution, corresponding to the drawing's Ø0.50 coaxial zone."


[[setups.ops]]
op = 70
do = "deburr"
feature = "profile_outer"
note = "Author's choice: hand-file and stone burrs, visually check edges and hole entries to R0.25 or 0.25 chamfer max without changing lands, top height, strap or bore edges; abrasive supplies to confirm."

[[setups.ops]]
op = 80
do = "coating"
feature = "profile_outer"
note = "Matte black oxide after machining, as the drawing calls for; no bath or vendor in the shop list. Protect or re-measure the bore."
note_cite = "harmonic-analyzer/cad/config/parts/rocker-arm.yaml:4"
