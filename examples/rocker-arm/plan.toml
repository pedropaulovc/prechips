direction = "conventional" # author's choice
approach_mm = 5.0 # author's choice: rapid plane above the blank
note = "Finish raster: the same passes as op 5 at one depth, removing the 0.20 mm left by op 5; plunge at each pass start as in op 5."
contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.4725, 150.4725], y = [-15.225, 26.935], z = [0.0, 5.0] }, open_side = "-y", step_mm = 6.0 } # AUTHOR'S CHOICE: same on-grid rows and pass ends as op 5
stock_removal_bounds = { x = [-160.0, 160.0], y = [-20.0, 31.7], z = [0.0, 5.0] }

[[setups.ops]]
