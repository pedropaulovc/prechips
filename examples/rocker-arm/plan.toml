# H1 — Manufacture MHA-CH-12 hub supply from ordered1/2in1018 round; not from finished purchased hub.
[[setups]]
id = "H1"
machine = "PM-1127VF-LB"
frame = "H_FRONT"
stock_in = "stock.hub"
note = "Manufacture MHA-CH-12 hub supply from ordered 1/2 in 1018 round; not from finished purchased hub."
coolant = "cutting oil brushed on"
deburr_mm = 0.0 # Preserve sharp press land; remove loose burrs without an edge break.

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "not_applicable"
grip_on = "last 25 mm of raw 1/2 in bar; no finished thin sleeve clamping"
grip_mm = 25.0
stickout_mm = 17.0
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = { "origin_mm" = [0.0, 0.0, -15.0], "x" = [1.0, 0.0, 0.0], "z" = [0.0, 0.0, 1.0] }
jaw_clock_deg = 0.0
stop = "Rule-set 17 mm raw stickout; confirm actual blank length 42 before this authored grip."
clamp = "Tighten chuck pinions, remove key; indicate raw OD. Place catch tray clear below cut; stop spindle before final breakthrough, finish the remaining thin web by hand with the bar stationary and remove sleeve only after isolation."
note = "Short rigid chuck-held bar; stopped-spindle retrieval of parted sleeve on a nonrotating catch tray, never a finger or a captive mandrel. Support is integral to the chuck; no separate support fixture."

[setups.stock_state]
od_mm = 12.7
north_end_z = 2.0
south_end_z = -40.0

[setups.zero.x]
method = "trial_cut_measure"
gauge = "outside-micrometer-0-25mm"
tool = "hss-toolbit-3-8-rh"
check_jog_mm = 0.5

[setups.zero.z]
face = "raw front"
method = "paper"
paper_mm = 0.05
tool = "hss-toolbit-3-8-rh"
edge_mm = 2.0
check_jog_mm = 2.0
retouch_after = [20, 30, 50]

[[setups.ops]]
op = 10
do = "face"
feature = "hub_supply_front"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0
doc_mm = 0.5
feed_mm_rev = 0.05
direction = "toward_axis"
note = "Face raw front to supply datum; touch Z again on the new clean face. Leave final hub face stock."

[[setups.ops]]
op = 20
do = "rough_turn"
feature = "hub_land"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -8.5
to_dia = 10.4
rough_allowance_mm = 0.21206
doc_mm = 0.4
feed_mm_rev = 0.08
direction = "toward_chuck"
note = "Turn full supply length, not merely the strap engagement. No finished OD may remain raw."

[[setups.ops]]
op = 30
do = "finish_turn"
feature = "hub_land"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -8.5
to_dia = 10.18794
doc_mm = 0.10603
feed_mm_rev = 0.04
direction = "toward_chuck"
checks = { "dia" = "outside-micrometer-0-25mm" }
inspection_methods = { "dia" = "DEMONSTRATION: calibrated 0.001 mm outside micrometer, masters bracketing 10.188 mm, expanded uncertainty<=0.003 mm. Clean/cool land; read both ends/middle in two directions, guard-band every result inside 10.18286–10.19302. Actual readings not recorded." }
note = "Finish supply press land .4009-.4013 in. Preserve it through all later handling; no compound or brazing substitute."

[[setups.ops]]
op = 40
do = "spot"
feature = "hub_supply_bore"
tool = "bracket-spot-drill"
holder = "drill-chuck-tailstock-mt3"
depth_mm = 0.5
feed_mm_rev = 0.03
note = "Spot supply bore on lathe axis before drilling; confirm this selected spot drill geometry and mounting."

[[setups.ops]]
op = 50
do = "drill"
feature = "hub_supply_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-tailstock-mt3"
depth_mm = 10.0
feed_mm_rev = 0.08
note = "Full diameter to 10 mm; 118 deg letter-D point reaches 11.87721 mm within the 12 mm guard, beyond the 8.50 mm kept sleeve but ahead of the nominal chuck front at 15 mm. Confirm actual point/reach and chuck clearance. Never call this under-size supply bore final datum A."
checks = { "dia" = "small-bore-comparator-6-10mm" }
inspection_methods = { "dia" = "DEMONSTRATION: small-bore comparator set with traceable master; uncertainty<=0.005 mm. Read both mouths/middle in two directions, guarded 6.2484–6.3500 over full 8.50 supply length after separation." }

[[setups.ops]]
op = 60
do = "inspect"
feature = "hub_land"
checks = { "dia" = "outside-micrometer-0-25mm" }
inspection_note = "Record land sizes and verify planned supply length 8.50 >=8.128 mm (.32 MIN), with stock at both final faces. Supply wall from smallest land/largest supply bore is at least 1.91643 mm before final ream. Reject taper, scored land or out-of-band bore; retain lot identification."
inspection_methods = { "dia" = "DEMONSTRATION: calibrated 0.001 mm outside micrometer, masters bracketing 10.188 mm, expanded uncertainty<=0.003 mm. Clean/cool land; read both ends/middle in two directions, guard-band every result inside 10.18286–10.19302. Actual readings not recorded." }

[[setups.ops]]
op = 70
do = "part_off"
feature = "hub_supply_parting"
tool = "parting-blade-lms-1728"
holder = "qctp-axa-lms-2280/7-parting"
to_z = -8.5
feed_mm_rev = 0.025
doc_mm = 0.1
direction = "toward_axis"
note = "Set kept/front blade edge at supply Z-8.50; blade width lies toward chuck. Catch tray below, not touching rotating work. Stop spindle with a thin remaining web, isolate, sever web by hand and retrieve; stone only the sacrificial parted end. Parting end is supply, not final hub length."

