contour = { method = "linear_table", sweep_frame = "A", sweep_bounds = { x = [-150.4725, 150.4725], y = [-15.225, 26.935], z = [-2.27825, 5.0] }, open_side = "-y", step_mm = 6.0, keep_out = [{ at = [0.0, 0.0], dia_mm = 10.6 }] } # AUTHOR'S CHOICE: op 20 rows and pass ends, island at the hub's 0.20 leave so the finisher never cuts the allowance the S3F file takes
