["notes"]
"manufacturing" = []
"process" = "Centred 1.64 x 1.58 x .96 rail-1 block with integral nut lug, 3.47 overall across. Lug starts .87 from the block's spindle end and runs flush to the block's far end: one continuous +X face, no step. The feed nut seats on that +X face, body away from spindle. Drill the leadscrew clearance to print; transfer the four taps through the MHA-CH-06-TL-VN-84 FeedNut at TL-00 assembly. Keep carriage counterbore floors .570 above the bottom; pivot seat bored .3755-.3765 with a flat floor, .359 deep from top, with a 5/16-18 tapped through hole below."
