"manufacturing" = ["A2, B2: Y .964 ±.002 FROM THE A1-B1 AXIS LINE"]
"process" = "saw a 21.3 in length from the 1/2 x 6 bar; clamp it flat on 1-2-3 blocks on the mill table under strap clamps (the 6 in width does not fit the 5 3/4 in vise jaws flat, and on edge the jaws grip too little of its height), no bandsaw rip; mill it to 20.5 x 5.1 and face to .47 drawing thickness; locate holes from the hole table's origin, the plate's lower-left corner on sheet 2; use .XXX coordinates at the title-block ±.005, except the flagged A2/B2 Y .964 ±.002 row; drill and ream the four pivot-pin holes with the .3760 reamer; drill and tap the CL and CR end-clamp holes #8-32 THRU, then the riser and feed-lever holes. Break edges, the pin holes' underside edges included (the spacers seat on them). At the assembled jig's HUB DRO setting (assembly step 10), spindle-guide the tap drill and tap for the ordinary #8-32 THRU HUB receiver; its table location is REF, never an independent predrilling control. Each strap is drilled and reamed at that same setting through the riser's relief; there is no precision carrier HUB bore, underside hub chamfer, or carrier counterbore. The CAD shows the finished assembly-machined HUB tap, not a separate manufactured hole-location requirement. The pivot bores turn on shoulder screws; the underside seats on spacers."
"edge_break" = "REMOVE BURRS AND BREAK SHARP EDGES R.010 OR CHAMFER .010 MAX"

