"process" = "start from 1/4 x 1-3/4 in 6061 bar; face to .24 and mill to 1.69 x 13.80; drill the two #30 loose end-stop pin holes through at their printed .XX stations; at assembly spot the four #4 screw, HUB, CL and CR holes from the carrier: run the installed #4-40 riser screws and common #8-32 clamp screws up through its taps from below until just proud, blue the tips, press the riser down on them and drill at the marks; drill #30 for the four #4 clearances and countersink 82 degrees; both #30 sizes print the three-place design nominal .128 under DRILLED HOLES +.004/0, containing the actual .1285 drill (rounding to .129 would incorrectly exclude it); drill the 12 mm HUB relief and #9 CL and CR clearances through; self-cut the band with the 9/16 cutter before loading the strap; break edges"
