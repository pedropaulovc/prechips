bottom_z = -74.66            # raw bar face, model Z -24

[setups.stock_state.local_thickness]
crank_bore = 74.66           # faced +Z boss face through the raw -Z bar face

[setups.hold]
fixture = "BS-0"
chuck = "chuck-4jaw-5-bs0"
pose = { origin_mm = [-27.3, 0.0, -50.66], x = [0.0, 0.0, 1.0], z = [1.0, 0.0, 0.0] }
jaw_clock_deg = 0.0          # jaw 1 on the +Z bar face
grip_mm = 20.0               # author's choice: model Y100..120 in the jaws
support = "none"             # the foot end is free; the BS-0 tailstock would block the foot face
grip_on = "raw rectangular tail, model Y100..120"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "bar end against the jaw steps"   # author's choice
clamp = "four-jaw: set the body axis on the spindle (model Z offset 14.1 from the bar centre) with a dial on the raw faces, then tighten opposite pairs; remove key"   # author's choice
jaw_protection = "none: the tail is scrap"
stickout_mm = 100.0          # jaw face model Y100 to datum B at Y0
note = "BS-0 horizontal, spindle axis along table X, chuck on the left. Head locked at 0 deg (crank boss up) for this setup."

[setups.zero.transfer]
from = "S1"
indicate = ["foot_seat"]
gauge = "dti"
runout_limit_mm = 0.02       # author's choice: face runout of datum B turning the head through 360 deg

[setups.zero.x]
