# Illustrative one-piece process plan for MHA-016 (cone pivot post), PLANNED,
# not a verified machining route. Senior-machinist route on the PM-30MV:
#   S1  vise, bar upright: face the foot (datum B) square to the bar.
#   S2-S5  BS-0 dividing head horizontal on the table, a 5 in independent
#       four-jaw on the raw rectangular tail above the head top. One chucking,
#       indexed: S2 crank boss and crank bore (0 deg), S3 -Z crank land
#       (180 deg, direct), S4 north cone pad and the journal bore (+12.5182 deg,
#       plate B/23), S5 south cone pad (+180 deg, direct).
#   S6  same chucking, head crank free: rotary-mill the body and head cylinders.
#   S7  vise, foot down on parallels: mill off the tail to the head top, then
#       spot, drill and counterbore the two mounting holes.
# Blank, allowances, holding, zero recipes, feeds and depths are example choices
# (plausible, not measured). Invented shop facts live in inventory with
# measured.by = "example (plausible, not measured)".
part = "cone-pivot-post"
features = "features.toml"
construction = "one_piece"   # author's route: every feature cut from one 2 x 3 in bar
quantity = 1
quantity_cite = ["harmonic-analyzer/cad/config/parts/cone-pivot-post.yaml:5"]

[drawing]
number = "MHA-016"           # parts/cone-pivot-post.yaml:2
revision = "unknown"         # export v40 exists (release.yaml:next_revision); release/operator matching pending

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
form = "flat_bar"
material = "1018 low-carbon steel"   # AUTHOR'S CHOICE within LOW-CARBON STEEL OR GRAY IRON (parts/_defaults.yaml ferrous_noncritical)
material_cite = ["harmonic-analyzer/cad/config/parts/cone-pivot-post.yaml:cone-pivot-post.material_family", "harmonic-analyzer/cad/config/parts/_defaults.yaml:material_families.ferrous_noncritical.material"]
section_mm = [50.8, 76.2]            # AUTHOR'S CHOICE: 2 x 3 in cold-rolled flat bar
length_mm = 123.0                    # AUTHOR'S CHOICE: foot allowance 3 + post 86 + tail 34 (sawn)
origin_mm = [-25.4, -3.0, 52.2]      # blank corner: model X -25.4..25.4, Y -3..120, Z 52.2..-24
axis = [0.0, 1.0, 0.0]               # length along the post axis (model Y)
section_axis = [1.0, 0.0, 0.0]       # 50.8 along model X; axis x section_axis = -Z carries the 76.2
on_hand = false                      # inventory stock = []: known none on hand; no procurement claimed
as_is_faces = []                     # every finished face is cut
note = "AUTHOR'S CHOICE: the 76.2 side runs model Z -24..52.2 so the crank boss (Z to 50.66) and the -Z land (Z -21.38) sit inside the bar with 1.5 and 2.6 mm to clean up. Model Y86..120 is a sacrificial rectangular tail: the BS-0 four-jaw grips Y100..120 and S7 mills the tail off to the head top."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33,49-67"]

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = true           # mill only: X/Y display the physical position

[dro.direction]              # EL400 §6.2 Direction; set once, same on every sheet
x = "right"
y = "away"
z = "up"

# Plan-owned setup frames (docs/plan.md "frames"). Origins and axes are model
# coordinates. The four BS-0 frames share setup x = model -Y (the head axis
# along the table, chuck on the left, foot on the right); each index turns the
# post about that axis under a fixed vertical spindle.
[frames.V1]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "nominal"          # Z0 is the foot faced by S1 op 10
note = "AUTHOR'S CHOICE: S1 bar upright in the vise, foot up; model (X,Y,Z) -> (X, Z, -Y). Raw foot z = 3, tail end z = -120."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33"]

[frames.C0]
origin = [0.0, 72.7, 50.66]
x = [0.0, -1.0, 0.0]
y = [1.0, 0.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"          # X from the foot (B), Y on the head axis, Z on the faced crank +Z face
note = "AUTHOR'S CHOICE: BS-0 index 0 deg, crank boss up; origin on the crank axis at the +Z boss face. Foot x = 72.7, head axis z = -50.66."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:49-57"]

[frames.C180]
origin = [0.0, 72.7, -21.38]
x = [0.0, -1.0, 0.0]
y = [-1.0, 0.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: BS-0 index 180 deg, crank -Z land up; origin on the crank axis at the land. Foot x = 72.7, head axis z = -21.38."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:49-57"]

[frames.JN]
origin = [-4.552936314157771, 33.368, -20.506140572258435]
x = [0.0, -1.0, 0.0]
y = [-0.9762272058393484, 0.0, 0.21674972336567902]
z = [-0.21674972336567902, 0.0, -0.9762272058393484]
binding = "nominal"
note = "AUTHOR'S CHOICE: BS-0 index 192.5182 deg, north cone pad up; origin on the journal axis at the north pad (21.0055 from the bore centre). Foot x = 33.368, head axis z = -21.0055."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:59-67"]

[frames.JS]
origin = [4.552936314157771, 33.368, 20.506140572258435]
x = [0.0, -1.0, 0.0]
y = [0.9762272058393484, 0.0, -0.21674972336567902]
z = [0.21674972336567902, 0.0, 0.9762272058393484]
binding = "nominal"
note = "AUTHOR'S CHOICE: BS-0 index 12.5182 deg, south cone pad up; origin on the journal axis at the south pad. Foot x = 33.368, head axis z = -21.0055."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:59-67"]

[frames.V7]
origin = [0.0, 86.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"          # Z0 is the head top faced by S7 op 10
note = "AUTHOR'S CHOICE: S7 foot down in the vise; model (X,Y,Z) -> (X, -Z, Y - 86). Foot z = -86, crank boss toward -y."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33,79-81,100"]

# ======================================================================= S1
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "V1"
coolant = "CRC cutting oil brushed on"   # author's choice
deburr_mm = 0.25             # title block: break edges R0.25 OR CHAMFER 0.25 MAX
deburr_cite = ["harmonic-analyzer/cad/config/title_block.yaml:45"]
stock_in = "stock"

[setups.stock_state]
top_z = 3.0                  # raw sawn foot end
bottom_z = -120.0            # raw tail end on the parallels

[setups.stock_state.local_thickness]   # S1 drills nothing

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "y"             # jaws close across the 50.8 thickness on the 76.2 faces
fixed_jaw = "left"           # author's choice
parallels = "parallels-lms-6745/1-2in"
parallels_along = "y"
parallels_centres_mm = [[-22.0, 14.1], [22.0, 14.1]]   # author's choice: under the bar edges
jaw_center_along_mm = 14.1   # bar centred along the jaws (y -24..52.2)
grip_mm = 32.245             # jaw height 1.7695 in - 1/2 in parallels, x 25.4
jaw_above_parallels_mm = 32.245
stop = "none: the bar stands on the parallels"   # author's choice
clamp = "hand plus quarter turn; tap the bar down on the parallels"   # author's choice
note = "Bar upright, tail down on 1/2 in parallels, 32 mm in the jaws and 91 mm standing above them. Light facing passes only."

[setups.zero.x]
edge = "bar_left"
edge_mm = -25.4              # raw 50.8 bar face, model X -25.4
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0          # author's choice

[setups.zero.y]
edge = "bar_front"
edge_mm = -24.0              # raw 76.2 bar face, model Z -24
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0          # author's choice

[setups.zero.z]
face = "top"
method = "paper"
paper_mm = 0.05              # author's choice
tool = "endmills-lms-6784/3-8in-4fl"
check_jog_mm = 10.0          # author's choice
retouch_after = [10]

[[setups.ops]]
op = 10
do = "face"
feature = "foot_seat"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
approach_mm = 5.0            # author's choice: rapid plane above the stock top
to_z = 0.0                   # datum B, model Y0
doc_mm = 0.25                # author's choice: light passes off the 3 mm sawn allowance (4 D projection)
direction = "conventional"   # author's choice for a hand-fed mill
note = "Face the sawn end flat in 0.25 mm passes; this face is datum B."

[setups.ops.checks]
finish_ra = "roughness-comparator"

# ======================================================================= S2
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "C0"
coolant = "CRC cutting oil brushed on"
