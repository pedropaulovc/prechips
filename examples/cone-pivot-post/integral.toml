tool = "cone-ball-endmill-6mm"
holder = "cone-r8-collets/6mm"
stock_to_leave_mm = 0.0
rpm = 900
feed_mm_min = 24
doc_mm = 0.25
ae_mm = 0.25
direction = "single_axis_longitudinal_raster"
note = """AUTHOR'S CHOICE, example value (realistic, not a shop measurement). Physical manual method: true hemispherical R3 cutter, NOT a flat endmill; indicate its pole and centre (+3 above tip). For a free body-cylinder patch, sphere-centre chart is X=(20.955+3)sin(theta), Zc=(20.955+3)cos(theta), tool-tip Z=Zc-3, theta=-90..+90deg. At theta0: X0 Ztip20.955; theta30: X11.9775 Ztip17.7456; theta60: X20.7456 Ztip8.9775; theta90: X23.955 Ztip-3.000. At each chart row lock X/Z and feed Y only; lift above incoming stockZ+5 before returning or changing X/Z. Use angular steps<=1deg, Y segment steps<=0.25mm where boundaries slope. Tool centre arc spacing<=0.419mm gives ball scallop<0.008mm on a free patch; add0.005mm DRO rounding and0.010mm chosen refixture budget, not a claimed measured contour error.
Retain the UNION of exact four solids, not just this cylinder: body X²+Z²<=20.955²,Y0..68.072; head X²+Z²<=21.336²,Y68.072..94.742; cone p=t*(.224969885921,0,.974365716981)+(0,38.1,0)+radial vector, |t|<=21.0055, radial radius8.636; crank X²+(Y-81.3735)²<=10.922²,Z-21.3753..50.6591. Crank centre81.3735 is the common-axis choice, NOT changed CAD. Keep0.20mm cap allowance on both cone and crank end planes for axial facing. Retain the sacrificial tail until S2:10.
For EVERY constant-X/Y row, forbid any ball-centre point within3mm of that retained union; the minimum permitted positiveZ centre is the upper envelope of the four solids expanded by an R3 sphere. Where another solid raises the envelope, stop the longitudinal stroke before its expanded boundary, retract, and resume from air beyond it. Use the exact sphere-distance inequality distance((X,Y,Zc),solid)>=3, not max of raw surface heights, and round Z AWAY from retained material. Rough in0.25mm vertical layers from raw stock toward this chart. Never plunge through a pad, bridge a forbidden segment, or remove a complete bounding box.
NATIVE REPRESENTATION HOLD: current contour schema does not encode this three-dimensional sphere-centre raster/union exclusion as replayable moves; do not accept default flat-end sweep/full-face credit. Analytic chart is physical method, not native swept-volume proof. R3 inaccessible concave cusps are intermediate stock, NOT authorized fillets: S2F explicitly hand-finishes them to actual intersecting-cylinder envelopes before subsequent operations. Neither file-edge radius nor finite measurement resolution creates CAD radius permission."""
[[setups.ops]]
op = 20
do = "profile"
feature = "head"
faces = ["#347/ADVANCED_FACE[11]/HAF_HEAD__P01", "#1073/ADVANCED_FACE[26]/HAF_HEAD__P01"]
