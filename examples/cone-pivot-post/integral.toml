[frames.P2]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "example value (realistic, not a shop measurement): horizontal body in plus-z cradle; spindle approaches from model+Z; B stop locates modelY0"
note = "Single-axis longitudinal milling; collar grips only finished Y1..21 band. Opposed indicator pickup recovers bodyX0; B stop setsY0. Touch ball POLE to already turned upper bandZ+20.955 and assign poleZ20.955, then retract; sphere centre is3mm above pole. Never touch rawØ110 and call it the finished axis."
