# Manual root finishing removes the actual material that S2B/S2BR/S2H cannot reach
# (1-3mm, quantified below); it never relabels stock as an acceptable fillet or native-proved surface.
[[setups]]
id = "S2F"
machine = "finishing-bench"
frame = "P2"
stock_in = "S2H"
coolant = "none: manual filing, scraping and blue transfer"
deburr_mm = 0.25
deburr_cite = ["AUTHOR'S CHOICE: example value (realistic, not a shop measurement)", "harmonic-analyzer/cad/config/title_block.yaml:in.edge_break"]
[setups.stock_state]
top_z = 50.8591
bottom_z = -23.0
note = "Conservative carried bound in P2 after S2B/S2BR prep and S2H rotary arcs; S2H attained radii are UNKNOWN until measured. Computed design-intent leftovers (not observations): body cone sectors outside the S2H windows ~940mm3 total, 440mm2 of body surface, up to 2.04 radial (S1 Ø46 envelope); head crown sectors within 54deg of +-Z beside the crank ~2400mm3, 1370mm2, mostly 1.0..2.7, max 3.06 at terrace corners; crank OD 0.15..0.25 above Z21.5 (S2B stairs) and both crank/head saddles. Never reset to finished geometry. S2 tail removal precedes this mandatory root work."
[setups.hold]
fixture = "cone-body-index-cradle/plus-z"
support = "none" # bolted base is part of the selected cradle
grip_on = "finished lower-body modelY1..21"
grip_mm = 20.0
fixed_jaw = "not_applicable"
stop = "With work loosely seated, locate B on its buttons and recover the pinned model X meridian; part completely removed from powered machine."
clamp = "Bolt base to bench; locate B/body/meridian with work loosely seated, then secure the lower-band split clamp for light hand work. AFTER final tightening recheck B, body seating and meridian; recover location and repeat the clamp/recheck sequence if disturbed, STOP if not recoverable. Repeat in the matching minus-z cradle for reverse access; never reach across a live spindle."
note = "Base, split collar and B buttons are integral to the bench-bolted selected cradle; no separate support assembly. Frame legend: model X/Z describe the part radial section, model Y is part height from B; P2 is the selected setup frame, not an instruction to copy model coordinates to a DRO. Physical root work is mandatory. Source section masters have zero design allowance; no corner radius is granted. Actual observations/results are absent."
[setups.hold.pose]
origin_mm = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
z = [0.0, 0.0, 1.0]
[[setups.ops]]
op = 10
do = "file_to_line"
feature = "body"
tool = "cone-root-finishing-kit"
holder = "cone-root-file-handle"
guide = { template = "cone-root-profile-masters", gauge = "cone-root-profile-masters" }
note = "Example mandatory root finishing, not fillet acceptance. Actual material: body band Y28.4..52.675 inside the two sectors that the S2H side windows excluded (polar ~-20..47 and ~160..227deg, narrowest at Y37..41; beyond Y49.325 the S2H:120 full turn physically sweeps them again without credit, so measure and file only the actual residual), up to 2.04 radial over ~440mm2, ~940mm3 total. Mark actual body X²+Z²=20.955² and cone u²+(Y-38.1)²=8.636², u=.974365716981X-.224969885921Z, with cone-root-profile-masters sections at Y29.464/46.736 and 30,32,34,36,38.1,40,42,44,46. BEFORE cutting, qualify each master against its source section (actual size/error band recorded) and match it repeatably to the S2H-finished body beside the sector. Bulk FIRST: bench second-cut then smooth safe-edge hand files (finishing-bench files) on the accessible protrusion, uncut safe edge bearing on the finished body, short strokes AWAY from the cone; re-offer the masters after each small bite. THEN only for the last cusp/inside corner (within ~0.10 of the blue line): kit 2/3/4mm safe-edge needle/warding files, then the 0.3 thin blades/scrapers; blue high contact, scrape, wash, repeat until no raised material or undercut against BOTH adjoining boundaries. The 0.3 blades do NOT remove bulk stock. No internal edge break, powered rotary burr or inside-fillet permission; actual nominal intersecting surfaces are the target. Declared root-file geometry does not represent the coarse whole-file envelope: native filing replay/exact-corner qualification stays HOLD, never permission to omit physical finishing."
[setups.ops.checks]
dia = "cone-root-profile-masters"
[setups.ops.inspection_methods]
dia = "Source-section blue contact on BOTH adjoining surfaces, optical open-root/replica comparison and datum-scanning-cmm adjacent-cylinder scans. Actual body41.656..42.164 diametric envelope and no raised cusp/gouge at every section; refine section spacing where curvature changes. CMM2mm ball cannot contact zero-radius concavity; thin masters/optical replicas cover the line instead. Finite .005 observation capability is NOT CAD fillet permission; ambiguous conformance is qualification HOLD, no pass supplied."
[[setups.ops]]
op = 20
do = "file_to_line"
feature = "cone_boss"
