x = [0.9743657169814578, 0.0, -0.22496988592078224]
y = [0.0, 1.0, 0.0]
z = [0.22496988592078224, 0.0, 0.9743657169814578]
binding = "example value (realistic, not a shop measurement): dowelled reverse-J3 cradle attitude, A located with removable expanding arbor, B clocked"
