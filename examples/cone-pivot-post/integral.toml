# Realistic demonstration fixture, not a shop observation or released process.
# Shared inventory marker: example value (realistic, not a shop measurement).
# Exact v47 CAD export from cd98207012d02b9b3653287ef8ce18735e12cdff;
# not a regenerated current-main/v48 export. Manifest and STEP are unmodified.
# Held integral solid-stock process candidate; not enrolled for machining.
# CAD authority: current dt_cone_pivot_post_spec and drawing contracts.
# FINISH UNRESOLVED: owner selected solid stock; the drawing still requires
# paint and MASK MACHINED FACES. No paint/mask split has been authorized.
# Chosen designs, simulated instrument capabilities and cutting settings below are
# example value (realistic, not a shop measurement); never a shop observation.
# Unrepresented raster cuts and sharp internal corners remain explicit native debt.
# Fixed-axis hemispherical raster replay/side windows are not represented by the
# current axial whole-face claim schema. Retained STEP refs below identify the
# intended physical surfaces, NOT accepted full-face or swept-clearance proof.
# The preserved v3 cutter/shank/holder collision findings remain failures until
# the actual finite raster is represented and checked; no larger/unknown tool
# or bounding-box stock deletion is substituted for that missing proof.
# Boring/honing set these precision bores by measured adjustment, not pilot
# drill diameter. Preserved v3 sizing findings selected the undersize pilots;
# those drills must not be enlarged to imitate a precision finishing process.
part = "dt-cone-pivot-post"
features = "features.toml"
construction = "one_piece"
purpose = "demonstration"
quantity = 1 # parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.quantity
quantity_cite = ["harmonic-analyzer/cad/config/parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.quantity"]

[drawing]
number = "MHA-DT-05" # parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.number
revision = "v47" # exact preserved export; not machining approval

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
form = "round_bar"
material = "1018" # AUTHOR'S CHOICE: low-carbon steel, not a purchased heat/grade claim
on_hand = false # proposed blank; no allocation or ownership claim
 dia_mm = 110.0 # AUTHOR'S CHOICE: radius55 covers hypot(50.6591,21.844/2)=51.8231
length_mm = 128.742 # AUTHOR'S CHOICE: BLOCK_HEIGHT + foot allowance6 + sacrificial grip28
north_allowance_mm = 6.0 # AUTHOR'S CHOICE: exposed foot-facing allowance
south_grip_mm = 28.0 # AUTHOR'S CHOICE: beyond the finished BLOCK_HEIGHT
origin_mm = [0.0, -6.0, 0.0]
axis = [0.0, 1.0, 0.0]
as_is_faces = []
note = "AUTHOR'S CHOICE; example value (realistic, not a shop measurement): buy/saw 110mm round low-carbon 1018 steel x128.742, axis modelY, foot allowance6 and grip28; no stock allocation or material certificate is asserted. R55 covers crank envelope hypot(50.6591,10.922)=51.8231. Keep both integral pads. Native swept-envelope qualification is separate from this stock design."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BLOCK_HEIGHT,CRANK_BOSS_END_Z,CRANK_BOSS_DIA"]

# Demonstration DRO conventions only; every tool change is physically touched
# against the same datum/master before feeding. Tool lengths are not interchangeable.
[dro]
controller = "Electronica EL400 demonstration installation; not an observed machine installation"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = false # AUTHOR'S CHOICE: a physical10mm X jog displays20mm on the lathe
[dro.direction]
x = "away_from_spindle_axis" # AUTHOR'S CHOICE; verify each machine's positive sense
y = "away" # AUTHOR'S CHOICE: existing EL400 positive mill-Y convention
z = "toward_exposed_end"

# Owner-selected common manufacturing axis, centred in the permitted printed
# separation band. The original CAD/manifest and setup frames stay unchanged.
# Native placement proof must preserve boss/bore concentricity and head support.
[axis_placements.crank]
boss = "crank_boss"
bore = "crank_bore"
caps = "crank_boss_faces"
support = "head"
separation_mm = 43.2735

# Plan-owned setup frames (PLAN.md §4.1; docs/plan.md "frames"). The exported
# manifest declares only `model` and an unknown `setup`; the original
# T1/M2/J3/C4 axes convention is retained, with current post origins and yaw.
# Origins and axes are model coordinates; bindings below are explicit demonstration designs.
[frames.T1]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "example value (realistic, not a shop measurement): body axis coaxial lathe spindle; foot toward tailstock; body +modelY toward chuck; X displays diameter"
note = "Indicate raw OD at two axial stations to <=0.02mm TIR, face B, trial-turn lower band and measure diameter. Check physical10mm radial withdrawal displays+20mm and footward10mm displaysZ+10. Installation is simulated, not a measured machine."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BLOCK_HEIGHT"]

# Head top follows dt_cone_pivot_post_spec.BLOCK_HEIGHT.
[frames.M2]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "example value (realistic, not a shop measurement): B on three foot-nest pads, body axis vertical +machineZ; modelX machineX; model-Z machineY"
note = "Centre lower turned body by opposed DTI readings at two heights; modelX meridian from the cradle witness mark, not a round OD alone. Touch nest B master plane and transfer its known0 height to Z0. Verify10mm positive jogs and re-indicate after clamping."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BLOCK_HEIGHT"]

# Origin = exported journal_bore at; setup -Z = exported journal_bore axis.
