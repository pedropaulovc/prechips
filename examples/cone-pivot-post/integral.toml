# Realistic demonstration fixture, not a shop observation or released process.
# Shared inventory marker: example value (realistic, not a shop measurement).
# Exact v47 CAD export from cd98207012d02b9b3653287ef8ce18735e12cdff;
# not a regenerated current-main/v48 export. Manifest and STEP are unmodified.
# Held integral solid-stock process candidate; not enrolled for machining.
# CAD authority: current dt_cone_pivot_post_spec and drawing contracts.
# FINISH UNRESOLVED: owner selected solid stock; the drawing still requires
# paint and MASK MACHINED FACES. No paint/mask split has been authorized.
# Unknown tools, fixtures, reach, speed, metrology and physical frame bindings
# remain explicit debt. AUTHOR'S CHOICE values are proposals, not observations.
part = "dt-cone-pivot-post"
features = "features.toml"
construction = "one_piece"
quantity = 1 # parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.quantity
quantity_cite = ["harmonic-analyzer/cad/config/parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.quantity"]

[drawing]
number = "MHA-DT-05" # parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.number
revision = "v47"

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
form = "round_bar"
material = "unknown" # source only pins ferrous_noncritical, not a purchased grade
on_hand = false # proposed blank; no allocation or ownership claim
 dia_mm = 110.0 # AUTHOR'S CHOICE: radius55 covers hypot(50.6591,21.844/2)=51.8231
length_mm = 128.742 # AUTHOR'S CHOICE: BLOCK_HEIGHT + foot allowance6 + sacrificial grip28
north_allowance_mm = 6.0 # AUTHOR'S CHOICE: exposed foot-facing allowance
south_grip_mm = 28.0 # AUTHOR'S CHOICE: beyond the finished BLOCK_HEIGHT
origin_mm = [0.0, -6.0, 0.0]
axis = [0.0, 1.0, 0.0]
as_is_faces = []
note = "AUTHOR'S CHOICE: bar parallel model Y. The complete crank boss reach fits inside radius55; no Ø45 envelope is claimed. Keep both integral journal pads during roughing. Catalogue identity and material grade unknown; M4 swept-envelope/clearance proof not supplied."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BLOCK_HEIGHT,CRANK_BOSS_END_Z,CRANK_BOSS_DIA"]

# Existing shaft convention: X diametric, Z toward the exposed end. The EL400
# is only a manual reference; its installation on this lathe remains unknown.
[dro]
controller = "unknown"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = false # AUTHOR'S CHOICE: a physical10mm X jog displays20mm on the lathe
[dro.direction]
x = "away_from_spindle_axis" # AUTHOR'S CHOICE; verify each machine's positive sense
y = "away" # AUTHOR'S CHOICE: existing EL400 positive mill-Y convention
z = "toward_exposed_end"

# Plan-owned setup frames (PLAN.md §4.1; docs/plan.md "frames"). The exported
# manifest declares only `model` and an unknown `setup`; the original
# T1/M2/J3/C4 axes convention is retained, with current post origins and yaw.
# Origins and axes are model coordinates; physical bindings remain unknown.
[frames.T1]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: foot-exposed frame for one-piece lathe S1; +Z toward the foot, +X radial withdrawal on the lathe."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BLOCK_HEIGHT"]

# Head top follows dt_cone_pivot_post_spec.BLOCK_HEIGHT.
[frames.M2]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: foot-down milling; Z0 at finished foot, head top follows the current post body height."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BLOCK_HEIGHT"]

# Origin = exported journal_bore at; setup -Z = exported journal_bore axis.
[frames.J3]
origin = [0.0, 38.1, 0.0]
x = [0.9743657169814578, 0.0, -0.22496988592078224]
y = [0.0, -1.0, 0.0]
z = [-0.22496988592078224, 0.0, -0.9743657169814578]
binding = "unknown"
note = "AUTHOR'S CHOICE: spindle toward the north cone-boss face; trig basis follows the configured horizontal plan incline, not a bore tilt."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:BORE_HEIGHT,INCLINE_DEG"]

# Origin = current CRANK_BORE_HEIGHT and CRANK_BOSS_START_Z.
[frames.C4]
origin = [0.0, 81.19564350289599, -21.3753]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: crank boss north face Z0; depth goes into boss along negative setup Z."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:CRANK_BORE_HEIGHT,CRANK_BOSS_START_Z"]

[frames.JR]
origin = [0.0, 38.1, 0.0]
x = [0.9743657169814578, 0.0, -0.22496988592078224]
y = [0.0, 1.0, 0.0]
z = [0.22496988592078224, 0.0, 0.9743657169814578]
binding = "unknown"
note = "AUTHOR'S CHOICE: reverse journal-axis presentation for the south cone-boss cap; physical registration unresolved."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:CONE_BOSS_LENGTH,INCLINE_DEG"]

[frames.CR]
origin = [0.0, 81.19564350289599, 50.6591]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: reverse crank-axis presentation at the far cap; physical registration unresolved."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:CRANK_BOSS_END_Z"]

