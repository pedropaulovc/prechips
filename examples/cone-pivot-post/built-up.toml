# x 0.26 in^3/min = 0.41 hp at 200 ft/min); each saddle's two hardened dowels carry 2 x 3,600 lb in
# single shear (MH 27th Table 1 p.1670), over 100 times that. The feed thrust at the cut, 30 mm
# outside the head-side saddle, lifts the foot end with about 0.4 kN at the bridge, hence the
# wrench-tight bridge nuts.
note = "Cradle and bridge: made once before first use to the two SHOP-MADE FIXTURE tables and their Make: lines (sheet 2). Contact check before the first cut: wipe layout blue on the north-cap pad and the brass pad, seat the post and tighten the bridge, then take the bridge off and lift the post out. Each pad must print on its cap annulus and leave no blue on the body. Tighten the bridge nuts wrench-tight: the saw's feed thrust tries to lift the foot end."
[[setups.ops]]
