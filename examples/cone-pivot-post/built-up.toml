jaw_buttons = "cone-cap-jaw-buttons"
jaw_protection = "AUTHOR'S CHOICE: the jaw buttons. Make two from 6061 aluminium bar on the lathe: face Ø16.0 x 3.0 thick, with a Ø12.2 x 2.0 long spigot turned on one side (0.06-0.09 mm loose in the 12.256-12.286 journal bore, so it drops in by hand), both faces flat and parallel, edges broken. The journal bore runs through, so the spigot cannot bottom and the 3.0 face seats on the cap. A Ø16 face is smaller than the Ø17.26 socket mouth, so it bears on the cap annulus only, never on the body, and holds the jaw 3 mm off the body."
stop = "AUTHOR'S CHOICE: foot B on two 1/2 in tall, 1/8 in thick parallels against the jaws, under the foot at Y+-17.8..21.0, clear of both hole exits at X+-12.67."
clamp = "AUTHOR'S CHOICE: seat a button in each end of the journal bore, close the soft jaws on the two buttons with the crank sleeve over the front jaw, tap B down on the parallels and tighten. Contact check before cutting: look along each jaw: daylight must show between the jaw and the body all round both buttons. The cap faces square the cross-bore to the jaws, so no clocking is needed; the jaw tops stay 8.6 mm under the head shoulder and 10.9 mm under the crank sleeve."
note = "AUTHOR'S CHOICE: Soft jaws: made once before first use, because the hardened plates stand 18.55 mm too low to reach the caps over the parallels. Two plates from the 1 x 3 in 6061 flat (stock), each sawn 162 long and six faces milled on the PM-30MV to 158.67 (the hardened plate's length) x 63.5 x 19.15, faces parallel within 0.02. Take a hardened plate off, clamp it on a blank with the bottom edges and ends flush, and spot through its two bolt holes; drill 7/16 in (drill-index-115; M10 normal fit 10.80, MH 27th Table 21 p.1557) and counterbore with the 11/16 in end mill (endmills-lms-6784; M10 counterbore 17.25, MH 27th Table 21 p.1557) from the gripping face to the hardened plate's counterbore depth plus 1.25, so the vise's own M10 screws reach the same thread. Bolt the plates on with their bottom edges on the bed, then skim each gripping face 0.10 in place with the 3/4 in end mill (endmills-lms-6784), to 19.05 thick, so the faces close parallel within 0.02 over their length. Buttons: see Jaw protection."
