clamp = "none"
[[setups.ops]]
op = 10
do = "coating"
feature = "body"
process = "ral-6005-alkyd"
# AUTHOR'S CHOICE: paint the non-functional turned surfaces because the all-turned built-up post has no unmachined surface for the finish note's paint and mask split.
note = "Paint the non-functional turned surfaces; they stand in for the unmachined surfaces the finish note assumes: the body diameter from 21 mm above foot B to the head shoulder, the shoulder, the head diameter and the projecting length of the crank sleeve. SSPC-SP 3: power-tool clean those areas to bright, scuffed metal and blow off the dust. Mask foot B and the first 21 mm of the body (it sits in the cradle saddle), the head top, both cone caps, both crank-sleeve end faces, both bores and the two mount holes with their counterbores. Brush RAL 6005 alkyd to 50-75 um dry film and let it cure as the can states. Check the dry film with the coating-thickness gauge at five places on the paint; then unmask."
[[setups.ops]]
op = 20
do = "coating"
feature = "body"
process = "oil-iso-vg32"
note = "After unmasking, wipe a thin film of ISO VG 32 oil on every masked face: foot B and the saddle band, the head top, the cone caps, the crank-sleeve end faces, into both bores and the mount holes."
