note = "Degrease the cross-bore and the sleeve outside with a residue-free solvent cleaner and let them dry; keep oil and cutting fluid off both. Bore-gauge the cross-bore at both mouths with the 10-18 mm bore gauge and mic the sleeve at both ends: bore minus sleeve must read 0.044-0.076. Stop if it does not."
