y = [-0.21674972336567902, 0.0, -0.9762272058393484]
z = [0.0, 1.0, 0.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: foot-down milling, turned 12.5182 deg about the post axis so the cone cross-bore axis is setup Y: the north cap faces +Y and the south cap -Y at Y+-21.0055. Z0 at finished foot B, head top at Z86; the crank sleeve points toward setup -Y, 12.5182 deg off it."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33,59-67,79-81,373-376"]

