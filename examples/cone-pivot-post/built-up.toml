policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"
[stock]
form = "built_up"
material = "unknown"
on_hand = false # inventory stock=[]; no purchase or on-hand identity asserted
note = "AUTHOR'S CHOICE: block body plus separately turned pressed crank boss. The example manifest permits built-up construction, but no joint detail, press, arbor, actual stock grade or catalogue identity is supplied. Physical joint preparation and assembly remain stops."
