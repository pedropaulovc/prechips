do = "fit"
feature = "cone_boss"
note = "With both op 10 readings in band, run a continuous bead of compound round the leading end of the sleeve and wet the bore. Push the sleeve in with a turning motion until the north cap sits on both cone pins; a 0.05 mm feeler must not enter under the cap at either pin. The two pins, level and in line with the post axis, clock the post through the cap: with the cap on both, the crank socket is vertical. Check it at once, before the compound grabs: height-gauge the head top at the -X and +X edges of the crank-socket mouth (DTI on the height gauge, highest reading on each side); the two readings agree within 0.05 (0.13° of roll). If not, roll the post until the cap sits on both pins. Wipe the excess off both mouths, then leave the post undisturbed for the 24 h cure."
