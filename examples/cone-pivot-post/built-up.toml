separation = "AUTHOR'S CHOICE: stand the post on foot B on the surface plate. With the DTI on the height gauge, read the top and bottom of each bore at both mouths; each bore centre is the mean of its top and bottom readings. Separation = crank centre - journal centre, accept 39.34-39.70."
angularity_dia = "AUTHOR'S CHOICE: the crank axis must lie in a Ø0.10 cylinder over its 72.03 bore, at 12.5182 deg to journal axis A and parallel to foot B. Read the bottom of each bore with the DTI on the height gauge. Slide the gauge base along a parallel clamped in line with the bore and step it by setting a 1-2-3 block between a stop block and the base: 1 in face (25.4) for the journal, 2 in face (50.8) for the crank. A rise is the reading change over that step, taken toward the south-cap and projecting crank-sleeve side for both bores. (1) Foot B on the plate: read journal rise rJ1 and crank rise rC1 on the DTI; e1 = 1.418 x rC1 - 2.768 x rJ1. (2) Lay the post on the plate on its head and body, chocked with the 1-2-3 blocks, and roll it until the journal rise reads within 0.05 with the projecting crank-sleeve end rising. Read journal rise rJ2 on the DTI; for crank rise rC2 raise the height gauge until the DTI returns to its first reading (ideal 50.8 x tan 12.5182 deg = 11.279); e2 = 1.351 x (rC2 - 11.279) - 2.836 x rJ2. Accept sqrt(e1^2 + e2^2) <= 0.10."

