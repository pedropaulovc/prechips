clamp = "AUTHOR'S CHOICE: close the soft jaws on both cone caps with the crank sleeve over the front jaw, tap B down on the parallels and tighten. The cap faces square the cross-bore to the jaws, so no clocking is needed; the jaw tops stay 8.6 mm under the head shoulder and 10.9 mm under the crank sleeve."
