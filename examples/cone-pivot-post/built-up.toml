# AUTHOR'S CHOICE feed control: 65 mm/min takes about 40 s through the 43 mm section (2.25 sq in), an
# average 3.4 sq in/min, under the MH 27th p.1140 graph rate of about 4.8 sq in/min for a 4/6 blade
# at 200 fpm (p.1142's worked example reads the same 4/6 line at about 4 sq in/min at 130 fpm); p.1140
# says to start from that rate and adjust by the chips; p.1142 says to break a new blade in at low feed.
note = "With the post clamped, slide the cradle in the open saw vise until the blade touches the scribed line, then close the vise on the cradle base; the 1.5 mm kerf leaves the post 87 mm from foot B to the sawn top, and the cradle base ends 3 mm on the kept side of the kerf. Set the blade guides outside the 44.45 mm tail. Feed: set the bow's downfeed control (the hydraulic cylinder valve, or the spring where the saw has no cylinder) so the blade sinks about 1 mm a second, 65 mm/min: about 10 mm in 10 s against a steel rule held beside the bow, and about 40 s through the post. That averages 3.4 sq in/min over the 2.25 sq in section, under the MH 27th p.1140 cutting-rate graph's about 4.8 sq in/min for a 4/6 blade at 200 fpm; p.1140 says to start there and adjust by the chips. Then judge by the chips: curly, silvery and warm is right; burned and heavy, ease the feed; thin or powdery, feed harder. A new blade: start at a light feed and build up over its first few cuts (MH 27th p.1142). Saw with the blade centred on the line; the tail drops clear as the cut breaks through, leaving 1 mm on the head top for S11."

