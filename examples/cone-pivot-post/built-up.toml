# ======================================================================= S4
# S4-S5 share one dividing-head chucking on the raw tail; both sockets are finished
# before either sleeve is bonded.
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "RH"
stock_in = "S1"
coolant = "CRC cutting oil brushed on"
deburr_mm = 0.1
deburr_cite = ["AUTHOR'S CHOICE: small socket edge break keeps the bonded length"]
[setups.stock_state]
top_z = 22.225
bottom_z = -22.225
entry_z = { crank_socket = 21.3753 }
local_thickness = { crank_socket = 43.1753 } # AUTHOR'S CHOICE: nominal entry to the bottom of the largest head the drawing allows (Ø43.6, Z-21.8), so the full diameter breaks through on any head
note = "AUTHOR'S CHOICE: turned post horizontal in the dividing head; the raw tail is the highest point. The socket enters at the top of the head. Z0 is on the post axis (set on the body crest); break-through depths are set for the largest head the drawing allows (Ø43.6), so the exit Zs in the operations sit below the feature map's nominal head face."
[setups.hold]
fixture = "BS-0"
chuck = "chuck-4jaw-5-bs0"
support = "none"
grip_on = "AUTHOR'S CHOICE: the last 20 mm of the raw tail; the tail end seats on the chuck body face"
grip_mm = 20.0
stickout_mm = 105.0
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = { origin_mm = [-105.0, 0.0, 0.0], x = [0.0, 0.0, 1.0], z = [1.0, 0.0, 0.0] }
jaw_clock_deg = 0.0
stop = "AUTHOR'S CHOICE: caliper the post from foot B to the raw tail end first: it must read 125.0, as S1 op 10 left it. Tail end against the chuck body face, so 105 mm of post stands out of the jaws. Indicate the turned head and body to run true within 0.02 mm, then indicate foot B square to the head axis."
clamp = "AUTHOR'S CHOICE: tighten each independent jaw a little at a time while indicating. Then align the head with the table: with the DTI in the spindle, sweep the top of the body along X from foot B to the shoulder, then its side; tap the head on the table until each sweep reads within 0.01 mm, tighten the head bolts and re-check both sweeps and the runout. Remove the key and lock the spindle before drilling."
note = "AUTHOR'S CHOICE: reamer trial bores, made once before the dividing head goes on the table, because a solid reamer has no size adjustment and the part is only reamed after the sleeves are bonded: the 0.4500 in reamer (11.430) sits 0.013 under the top of the 11.413-11.443 crank band, and the 0.4835 in reamer (12.281) only 0.005 under the top of the 12.256-12.286 journal band. Saw two 1018 offcuts about 15 mm long, one from the 25 mm crank bar and one from the 3/4 in cone bar, and grip each in the mill vise on parallels with the bore line clear of them. Crank offcut: spot it with the #2 centre drill, drill 11.2 through at the S8 op 20 speed and feed, then ream it with the 0.4500 in reamer at the S8 op 30 speed and feed. Journal offcut: spot it, drill 12.05 through at the S9 op 20 speed and feed, then ream it with the 0.4835 in reamer at the S9 op 30 speed and feed. Use cutting oil and a steady quill feed; run each drill point and the reamer lead fully out of the far side. Bore-gauge each trial bore at both mouths: the crank trial must read 11.413-11.443 and the journal trial 12.256-12.286. If either reads over, that reamer cuts oversize: do not take it to the part; replace it and ream a new trial."
[setups.hold.index]
fixture = "BS-0"
feature = "crank_bore"
angle_deg = 0.0
positions = 1
[setups.zero.transfer]
from = "S1"
indicate = ["head", "body", "foot_seat"]
gauge = "dti"
runout_limit_mm = 0.02
[setups.zero.y]
feature = "head"
edge_mm = 0.0
from = "indicated"
method = "indicate_axis"
tool = "dti"
check_jog_mm = 10.0
[setups.zero.x]
edge = "foot_seat"
edge_mm = 0.0
from = "+x"
tool = "edge-finder"
check_jog_mm = 10.0
[setups.zero.z]
face = "body" # AUTHOR'S CHOICE: the body crest, not the head: S1 op 50 holds the body to 41.99-42.03 (radius within 0.01 of 21.0055), while the head may be anywhere in its 42.0-43.6 drawing band, so Z0 lands on the post axis
edge_mm = 21.0055
from = "+z"
method = "touch_then_set"
tool = "center-drills-lms-4859/2"
paper_mm = 0.0
check_jog_mm = 10.0
retouch_after = []
[[setups.ops]]
op = 10
do = "spot"
feature = "crank_socket"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 2.0 # example (plausible, not measured); Machinery's Handbook 27th ed. Table 6 p.873 size 2 combined drill and countersink: 5/64 in (1.98 mm) drill diameter, 5/64 in (1.98 mm) drill length, so the 60° countersink just starts
approach_mm = 5.0
[[setups.ops]]
op = 20
do = "drill"
feature = "crank_socket"
tool = "drill-index-115/7-16in"
holder = "drill-chuck-r8"
exit_mm = 0.5
approach_mm = 5.0
note = "Pilot through the head, pecking every 6 mm to clear chips."
[[setups.ops]]
op = 30
do = "drill"
feature = "crank_socket"
tool = "cone-joint-drill-21p8" # 21.8 leaves 0.21 diametral (0.105 mm, .0041 in, radial) for the 22.01 reamer: inside Machinery's Handbook 27th ed. p.833 reaming allowance 0.005-0.010 in (0.127-0.254 mm) and p.1133 reamer depth of cut .004-.008 in for holes over 1/8 in
holder = "drill-chuck-r8"
exit_mm = 0.5
approach_mm = 5.0
note = "Open the pilot; this leaves 0.21 mm on diameter for the reamer."
[[setups.ops]]
op = 40
do = "ream"
feature = "crank_socket"
tool = "cone-joint-reamer-22p01" # 45 fpm (200 rpm) from cutting-data.toml: inside Machinery's Handbook 27th ed. Table 17 p.1061 HSS reaming 40-65 fpm for plain carbon steels 1006-1026; p.1063 no diameter adjustment
holder = "drill-chuck-r8"
exit_mm = 0.5
approach_mm = 5.0
note = "Run the full-diameter lands out of the far side, then withdraw without reversing. Gauge both mouths and the middle."
[setups.ops.checks]
dia = "cone-socket-bore-gauge"

