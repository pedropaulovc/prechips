# ======================================================================= S10
[[setups]]
id = "S10"
machine = "bandsaw-4x6"
frame = "B6"
stock_in = "S9"
coolant = "none: dry cut"
deburr_mm = 0.1
deburr_cite = ["AUTHOR'S CHOICE: retain the finished journal's 0.1 mm maximum rim break"]
note = "AUTHOR'S CHOICE: the post lies in a shop-made saw cradle gripped by the bandsaw vise; the raw tail overhangs the cradle end and falls clear after the cut."
[setups.stock_state]
top_z = 51.8315
bottom_z = -23.2437
note = "AUTHOR'S CHOICE: post horizontal, cone cross-bore vertical; the crank sleeve's far end rim is the highest point and the low rim of its north face the lowest, 6.76 mm above the cradle base."
[setups.hold]
fixture = "cone-saw-cradle"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "cone-cap-bridge", restraint = "press", pose = { origin_mm = [52.632, 0.0, 21.0055], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "brass pad on the south cap annulus; the load runs down the cone sleeve onto the north-cap pad, not through the bonded joint; studs at Y+-30 clear the body" },
]
clamp_order = [1]
locate = "body in both cradle saddles, north cap annulus on the cap pad; the cap faces square the cone cross-bore to the saw bed"
supports = "not_applicable"
support = "none"
grip_on = "AUTHOR'S CHOICE: finished body in two 42.011 mm saddles at model Y6..20 and Y44..58, north cap on the 16 mm pad, south cap under the bridge pad; no load on the head, the crank sleeve or the raw tail"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: scribe model Y87.75 for the blade centre; slide the cradle in the saw vise until the blade touches the scribed line, then close the vise. The 1.5 mm kerf leaves the head at Y87, and the cradle base ends 3 mm on the kept side of the kerf."
clamp = "AUTHOR'S CHOICE: lay the post in the saddles with the crank sleeve up and the north cap on the pad; turn it until the south cap sits flat under the bridge pad, then tighten both bridge nuts evenly. Grip the cradle base in the saw vise. Set the blade guides outside the 44.45 mm tail; let the tail drop clear as the cut breaks through."
[[setups.ops]]
op = 10
do = "saw_cut"
tool = "bandsaw-blade-10-14"
cut_plane = { axis = "x", value = -1.75, keep = "above" }
note = "Saw the tail off with the blade centre on the Y87.75 line; this leaves 1 mm on the head top for S11."

# ======================================================================= S11
