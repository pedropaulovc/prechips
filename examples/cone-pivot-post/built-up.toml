# Illustrative built-up route for MHA-016 (cone pivot post): a turned body with two
# bonded sleeves. PLANNED, not a verified machining route. The example drawing permits
# built-up construction; this is not an unmodified CAD export.
#   S1  lathe: face foot B, turn the head and body diameters on one piece of round bar;
#       the raw bar beyond the head is a sacrificial tail for every later chucking.
#   S2  lathe: turn the cone sleeve (Ø17.2 x 42.011) from round bar, face the north cap.
#   S3  lathe: turn the crank sleeve (Ø21.93 x 72.0344) from round bar.
#   S4  BS-0 on the mill, spindle along table X, tail in the four-jaw: drill and ream the crank socket.
#   S5  same chucking, index 12.5182 deg: drill and ream the cone cross-bore.
#   S6  bench: bond the cone sleeve with retaining compound; cure.
#   S7  bench: bond the crank sleeve with retaining compound; cure.
#   S8  BS-0, tail re-chucked, crank sleeve face up: drill and ream the crank bore.
#   S9  same chucking, index 12.5182 deg: drill and ream journal bore A through the cone sleeve.
#   S10 bandsaw, post in a saw cradle under a cap bridge: saw the tail off 1 mm above the head top.
#   S11 vise with soft jaws on the cone caps, foot down: face the head top, drill and counterbore the mounting holes.
# All shop facts are plausible examples, not measurements of Pedro's real equipment.
part = "cone-pivot-post"
features = "features.toml"
construction = "built_up"
quantity = 1
quantity_cite = ["harmonic-analyzer/cad/config/parts/cone-pivot-post.yaml:5"]
[drawing]
number = "MHA-016"
revision = "v40"
[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"
[stock]
form = "built_up"
material = "1018 low-carbon steel"
on_hand = false
as_is_faces = [] # AUTHOR'S CHOICE: every finished face is turned, faced, drilled or reamed; none is left as bar stock
note = "AUTHOR'S CHOICE: a turned body and head from one round bar, plus two turned sleeves bonded in reamed bores with anaerobic retaining compound. The cone and crank bores are reamed only after the compound has cured. Stock sizes and placements are illustrative purchase/process choices, not on-hand measurements."
cite = ["AUTHOR'S CHOICE: illustrative bonded-sleeve construction permitted for this example", "harmonic-analyzer/cad/config/parts/cone-pivot-post.yaml:3,7", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:349-355"]
[[stock.components]]
id = "body"
form = "round_bar"
dia_mm = 44.45 # AUTHOR'S CHOICE: 1-3/4 in cold-finished 1018 round, over the Ø42.7506 head
length_mm = 127.0 # AUTHOR'S CHOICE: 2 mm foot allowance + 86 mm post + 39 mm sacrificial tail
origin_mm = [0.0, -2.0, 0.0]
axis = [0.0, 1.0, 0.0]
note = "AUTHOR'S CHOICE: 1-3/4 in round bar, 127 mm long: 2 mm to face off foot B, the 86 mm post, and a 39 mm raw tail beyond the head top. The tail stays raw as the grip for the lathe, the dividing head and the saw; it is sawn off in S10."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33"]
[[stock.components]]
id = "cone"
form = "round_bar"
dia_mm = 19.05 # AUTHOR'S CHOICE: 3/4 in cold-finished 1018 round, over the Ø17.2 sleeve
length_mm = 75.0 # AUTHOR'S CHOICE: 1 mm facing allowance + 42.01 sleeve + parting width and clearance + 25 mm grip
origin_mm = [-4.76968603752345, 33.368, -21.48236777809778]
axis = [0.21674972336567902, 0.0, 0.9762272058393484]
note = "AUTHOR'S CHOICE: 3/4 in round bar, 75 mm long, for the cone sleeve: 1 mm to face off the north cap, the 42.01 mm sleeve, the parting cut and a 25 mm grip."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:59-67"]
[[stock.components]]
id = "crank"
form = "round_bar"
dia_mm = 25.0 # AUTHOR'S CHOICE: 25 mm cold-finished 1018 round, over the Ø21.93 sleeve
