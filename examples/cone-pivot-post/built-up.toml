separation = "AUTHOR'S CHOICE: probe the finished journal A and crank bore at multiple axial stations and circumferential points; report the centre separation in the B-referenced post direction against 39.332-39.702 mm, not the shortest distance between skew axes."
angularity_dia = "AUTHOR'S CHOICE: outsourced tactile CMM service fits the full journal cylinder as primary datum A and the finished foot plane as secondary datum B. Probe the crank bore along its full 72.0344 mm length; orient the nominal axis at the BASIC 12.5182 degree relationship in that datum frame and evaluate its derived axis within a diameter 0.10 mm cylindrical orientation zone. Record the actual fitted-axis deviations and datum alignment in the report. The 0.02 mm machining pickup budget is a separate process choice, not this acceptance limit."
