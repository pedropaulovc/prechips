height = "calipers"
# AUTHOR'S CHOICE: Machinery's Handbook 27th ed. Table 1 p.730 puts Ra 1.6 (63 µin) inside reaming's
# average-application band (Ra 3.2-0.8 µm); p.724 names roughness comparison specimens (ASME B46.1).
# No plate reaches inside a Ø12.3 bore, so the wall is cast in replica compound and the cast is compared.
[setups.ops.inspection_methods]
finish_ra = [
  "AUTHOR'S CHOICE: cast the journal bore before any gauge rod goes in. Swab the bore with isopropyl alcohol until the swab comes out clean, and let it dry: any oil spoils the cast.",
  "Lay the post on its side on the bench, chocked with a parallel each side, so the bore lies level. Tape over the far mouth. Push a 150 mm length of M3 threaded rod in until it touches the tape, centred in the bore, as the pull handle. Fill the bore from the tape end back to the near mouth through the kit's mixing nozzle, withdrawing the nozzle as it fills.",
  "Wait the kit's cure time (about 5 min). Peel the tape and draw the cast out by the rod in one steady pull.",
  "Under the measuring loupe, in one light, lay the cast beside the kit plate's reamed Ra 1.6 and Ra 3.2 patches. Along its whole length the cast must look no rougher than the Ra 1.6 patch, with no chatter band, tear or score. Write yes or no: {cast}",
]
[[setups.ops]]
op = 110
do = "inspect"
feature = "crank_bore"
note = "Cast the crank bore for Ra first, then recheck its size, the crank-to-journal separation and the crank-bore angularity on the surface plate."
[setups.ops.checks]
finish_ra = "bore-replica-kit"
dia = "bore-gauge-small"
separation = "height-gauge"
angularity_dia = "height-gauge"
[setups.ops.inspection_methods]
finish_ra = [
  "AUTHOR'S CHOICE: cast the crank bore as op 100 casts the journal bore, before the gauge rods go in: swab it clean and dry, lay the post with the bore level, tape the far mouth, centre the M3 pull rod, fill, cure, peel the tape and pull the cast.",
  "Under the measuring loupe, in one light, lay the cast beside the kit plate's reamed Ra 1.6 and Ra 3.2 patches. Along its whole length the cast must look no rougher than the Ra 1.6 patch, with no chatter band, tear or score. Write yes or no: {cast}",
]
separation = "AUTHOR'S CHOICE: stand the post on foot B on the surface plate. With the DTI on the height gauge, read the top and bottom of each bore at both mouths; each bore centre is the mean of its top and bottom readings. Separation = crank centre - journal centre, accept 39.34-39.70."
# AUTHOR'S CHOICE: the crank axis must lie in a Ø0.10 cylinder over its 72.03 bore, at 12.5182 deg
# to journal axis A and parallel to foot B. Gauge rods resting in the bores carry each axis outside
# the part, so the DTI never reaches into a bore. With rise r over step S and L = 72.0344:
# e1 = (L / S_crank) r_C1 - (L / S_journal) cos(12.5182) r_J1;
# e2 = (L / S_crank) cos^2(12.5182) (r_C2 - S_crank tan(12.5182)) - (L / S_journal) r_J2.
# S_crank 76.2 (3 in face), S_journal 50.8 (2 in face): 0.945, 1.384, 0.901, 16.918, 1.418.
# (The former 50.8 / 25.4 steps give the former 1.418, 2.768, 1.351, 11.279, 2.836.)
angularity_dia = [
  "AUTHOR'S CHOICE: qualify each gauge rod before use. Micrometer it at both ends and the middle: the three readings must agree within 0.0001 in (one division) and match its size. Then lay it in the V-blocks on the surface plate, DTI tip on top over each block and at the middle, and turn it one full turn: each reading must stay within one dial division (0.0005 in). A rod that fails either check is not used.",
  "AUTHOR'S CHOICE: slide the Ø11.405 gauge rod through the crank bore and the Ø12.250 gauge rod through the journal bore, each with about 40 mm out of both ends. By the op 100 and op 110 bore readings each rod is 0.006-0.038 mm under its bore. Seat each rod by gravity on the low line of its bore, pressing it down by hand at both mouths: lying along that line over the full bore length, the rod stays parallel to the bore axis, so the clearance moves both readings of a rise equally and cancels.",
  "Mount the DTI on the height gauge, tip on top of the rod with the lever lifted to mid-travel (about 0.015 in of its 0.030 in); a higher rod reads +. At each position sweep the tip across the rod and take the highest reading. Write every reading in mm: inch dial × 25.4.",
  "Seating check, at every position: read, press the rod down with a finger at the far mouth, read again; the two must agree within one dial division (0.0005 in). If not, the rod rocks on a bellmouthed mouth: wipe rod and bore, reseat and repeat. Then roll the rod half a turn in its bore and repeat the rise; record the mean of the two rises, so a bend in the rod cancels.",
  "Lay a parallel on the plate in line with the rod and stand the second 1-2-3 block at its end as the stop. Position A: height-gauge base against the stop. Position B: the first 1-2-3 block between stop and base, 2 in face (50.8) for the journal rod, 3 in face (76.2) for the crank rod. Rise = reading at B − reading at A.",
  "Place the stop so position A puts the tip about 4 mm outside the north cap on the journal rod, or about 2 mm outside the flush crank-sleeve end on the crank rod; position B then lands just outside the south cap, or just outside the projecting crank-sleeve end.",
  "Orientation 1, foot B on the plate. Journal rod rise: {rJ1}",
  "Orientation 1, foot B on the plate. Crank rod rise: {rC1}",
  "Orientation 2: lay the post on the plate on its head and body, chocked with a 1 in parallel each side, and wrap tape round the crank rod at its lower mouth so it cannot slide. Roll the post until the journal rod rise reads within ±0.05 with the projecting crank-sleeve end rising. Journal rod rise: {rJ2}",
  "Orientation 2, crank rod: set the DTI to zero at A, move to B and raise the height gauge until the DTI reads zero again. Height-gauge rise (ideal 76.2 × tan 12.5182° = 16.918): {rC2}",
  "Calculate: 0.945 × rC1 − 1.384 × rJ1 = {e1}",
  "Calculate: 0.901 × (rC2 − 16.918) − 1.418 × rJ2 = {e2}",
  "Calculate: √(e1² + e2²) = {result}; accept 0.10 or less.",
]

# ======================================================================= S12
# Drawing finish (built-up variant, example divergence in features.toml material.finish, HA #1215
# comment): SSPC-SP 3 clean, paint RAL 6005 alkyd 50-75 um DFT on the non-functional turned ODs,
# mask bores, faces and joint surfaces, oil the bare faces ISO VG 32.
[[setups]]
id = "S12"
machine = "cone-bond-bench"
frame = "R0"
stock_in = "S11"
coolant = "none: bench finishing"
deburr_mm = 0.0
deburr_cite = ["AUTHOR'S CHOICE: S11 already broke every machined edge; finishing cuts no edges"]
note = "AUTHOR'S CHOICE: paint and oil the finished post on the assembly bench, resting in the bonding cradle, to the built-up finish note on the job page."
[setups.stock_state]
top_z = 50.66
bottom_z = -22.375
note = "AUTHOR'S CHOICE: the finished post in the S7 cradle position, crank sleeve up."
[setups.hold]
fixture = "cone-bond-cradle"
support = "none"
grip_on = "AUTHOR'S CHOICE: gravity only: body in the cradle saddle 10-20 mm from foot B, foot B against the foot stop, north cap on the two cone pins"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
stop = "AUTHOR'S CHOICE: the foot stop locates foot B; the cone pins carry the north cap. Op 10 ends with the post standing on masked foot B on a clean sheet so the saddle band can be painted."
clamp = "none"
[[setups.ops]]
op = 10
do = "coating"
feature = "body"
process = "ral-6005-alkyd"
# AUTHOR'S CHOICE: the built-up finish note (features.toml material.finish divergence) names the paint/mask split; the saddle band is painted last, off the cradle, so every non-functional OD is painted.
note = "Finish note, built-up variant: paint RAL 6005 on the non-functional turned ODs; mask bores, faces and joint surfaces. Paint areas: the body OD from foot B to the shoulder, the head OD, and the crank-sleeve OD where it projects from the head. Mask the faces: foot B, the head top, the 0.37 mm shoulder step between body and head (tape edge on the shoulder corner), both cone caps and both crank-sleeve end faces. Mask the bores: plug the crank bore, the journal bore and both mount holes with their counterbores. Mask the joint surfaces: a 2 mm ring round the crank sleeve where it leaves the head, its bond line. SSPC-SP 3: power-tool clean the paint areas to bright, scuffed metal and blow off the dust. Brush RAL 6005 alkyd to 50-75 um dry film on the paint areas except the body band 10-20 mm from foot B that rests in the cradle saddle. When dry to handle, lift the post out by the masked head top, stand it on masked foot B on a clean sheet, brush the saddle band to the same film and leave it standing to cure as the can states. Check the dry film with the coating-thickness gauge at five places, one on the saddle band: each 50-75 um."
[[setups.ops]]
op = 20
do = "coating"
feature = "body"
process = "oil-iso-vg32"
note = "After the paint cures, unmask and wipe a thin film of ISO VG 32 oil on every masked surface: foot B, the head top, the shoulder step, both cone caps, both crank-sleeve end faces and the sleeve's bond-line ring, into the crank and journal bores, and the mount holes and counterbores."
