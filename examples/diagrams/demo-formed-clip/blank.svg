<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="22">Top view: the strip in the soft jaws, sawn and filed to its developed length; the bend line scribed</text>
  <rect class="clamp" x="60" y="70" width="140" height="34"/>
  <rect class="clamp" x="60" y="166" width="140" height="34"/>
  <text class="label-on-clamp" x="74" y="92">fixed jaw</text>
  <text class="label-on-clamp" x="74" y="188">moving jaw</text>
  <rect class="part-kept" x="80" y="110" width="600" height="50"/>
  <rect class="part-removed" x="680" y="110" width="20" height="50"/>
  <line class="centre-line" x1="320" y1="96" x2="320" y2="174"/>
  <text class="label" x="300" y="88">bend line</text>
  <line class="dims" x1="80" y1="230" x2="680" y2="230"/>
  <line class="dims" x1="80" y1="165" x2="80" y2="238"/>
  <line class="dims" x1="680" y1="165" x2="680" y2="238"/>
  <text class="label" x="300" y="252">developed length, filed square at both ends</text>
  <line class="dims" x1="80" y1="205" x2="320" y2="205"/>
  <line class="dims" x1="320" y1="174" x2="320" y2="212"/>
  <text class="label" x="120" y="222">base end to the bend line</text>
  <line class="leader" x1="690" y1="135" x2="720" y2="90"/>
  <text class="label" x="640" y="80">sawn waste</text>
</svg>
