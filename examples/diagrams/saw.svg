  <path d="M466 60H600L592 78L606 96L594 114L600 132H466Z" fill="#f2f2f2" stroke="#111" stroke-width="1.5"/>
  <line x1="251" y1="50" x2="251" y2="142" stroke="#a33" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="464" y1="50" x2="464" y2="142" stroke="#a33" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="144.5" y="101" text-anchor="middle">BLANK 1</text>
  <text x="357.5" y="101" text-anchor="middle">BLANK 2</text>
  <text x="530" y="101" text-anchor="middle">1/2 × 6 bar</text>

  <!-- length dimensions -->
  <g stroke="#111" stroke-width="1">
