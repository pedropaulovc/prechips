    <line x1="249" y1="48" x2="249" y2="40"/>
    <line x1="253" y1="48" x2="253" y2="40"/>
    <line x1="462" y1="48" x2="462" y2="40"/>
    <line x1="41" y1="44" x2="248" y2="44" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="254" y1="44" x2="461" y2="44" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="144.5" y="37" text-anchor="middle">17 7/16 in</text>
  <text x="357.5" y="37" text-anchor="middle">17 7/16 in</text>

  <!-- width dimension -->
  <g stroke="#111" stroke-width="1">
    <line x1="38" y1="60" x2="20" y2="60"/>
    <line x1="38" y1="132" x2="20" y2="132"/>
    <line x1="26" y1="61" x2="26" y2="131" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text transform="translate(17 96) rotate(-90)" text-anchor="middle">6 in</text>

  <!-- cutline label -->
  <text x="357" y="168" text-anchor="middle">cutlines</text>
  <g stroke="#111" stroke-width="1" fill="none">
    <line x1="326" y1="160" x2="253" y2="144"/>
    <line x1="388" y1="160" x2="462" y2="144"/>
  </g>

