  <text x="40" y="196" fill="#555" font-style="italic">Side view</text>
  <path d="M40 220H600L596 226L600 232H40Z" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <line x1="251" y1="212" x2="251" y2="240" stroke="#a33" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="248" y="176" width="6" height="42" fill="#555"/>
  <line x1="268" y1="198" x2="268" y2="216" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="292" y="190">saw blade</text>
  <line x1="288" y1="185" x2="256" y2="185" stroke="#111" stroke-width="1"/>

  <rect x="190" y="232" width="120" height="50" fill="#b5b9bf" stroke="#111" stroke-width="1.5"/>
  <path d="M245 233V250H257V233" fill="#fff" stroke="#111" stroke-width="1.2"/>
