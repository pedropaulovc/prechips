    <rect x="87" y="236" width="6" height="44"/>
    <rect x="74" y="280" width="32" height="4"/>
    <rect x="500" y="232" width="40" height="4"/>
    <rect x="517" y="236" width="6" height="44"/>
    <rect x="504" y="280" width="32" height="4"/>
  </g>
  <text x="100" y="262">support</text>
  <text x="530" y="262">support</text>
  <line x1="30" y1="284" x2="640" y2="284" stroke="#555" stroke-width="1.5"/>
