<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
    <pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a33" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="720" height="330" fill="#fff"/>

  <!-- mill table, top view -->
  <rect x="20" y="40" width="510" height="240" fill="#f1f2f3" stroke="#999"/>
  <g fill="#d6d8db">
    <rect x="20" y="64" width="510" height="8"/>
    <rect x="20" y="156" width="510" height="8"/>
    <rect x="20" y="248" width="510" height="8"/>
  </g>

  <!-- blank -->
  <rect x="60" y="80" width="453" height="156" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <rect x="60" y="223" width="453" height="13" fill="url(#cut)"/>
  <line x1="60" y1="223" x2="513" y2="223" stroke="#a33" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- crosswise parallels (under the bar) -->
  <g fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="98" y="74" width="5" height="142"/>
    <rect x="470" y="74" width="5" height="142"/>
  </g>
  <!-- centre screw jack (under the bar) -->
  <circle cx="286" cy="150" r="14" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- far-edge stops and right-end stop -->
  <g fill="#8a9099" stroke="#111" stroke-width="1.2">
    <rect x="190" y="56" width="36" height="24"/>
    <rect x="340" y="56" width="36" height="24"/>
    <rect x="513" y="96" width="24" height="40"/>
  </g>
  <!-- straps over the parallels, far half -->
  <g fill="#6b7178" stroke="#111" stroke-width="1.2">
    <rect x="88" y="54" width="25" height="86"/>
    <rect x="460" y="54" width="25" height="86"/>
  </g>
  <circle cx="100.5" cy="66" r="6" fill="#ddd" stroke="#111"/>
  <circle cx="472.5" cy="66" r="6" fill="#ddd" stroke="#111"/>

  <!-- cutter at near edge and feed -->
  <circle cx="130" cy="232" r="9" fill="#c9a227" stroke="#111" stroke-width="1.2"/>
  <line x1="150" y1="266" x2="360" y2="266" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="271">+X feed</text>

  <!-- 5.50 finished width from far edge -->
  <g stroke="#111" stroke-width="1">
    <line x1="58" y1="80" x2="36" y2="80"/>
    <line x1="58" y1="223" x2="36" y2="223"/>
    <line x1="42" y1="81" x2="42" y2="222" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text transform="translate(34 152) rotate(-90)" text-anchor="middle">5.50</text>

  <!-- in-figure labels -->
  <text x="150" y="125">blank, flat on parallels</text>
  <text x="306" y="155">screw jack</text>
  <text x="283" y="32" text-anchor="middle">extruded far edge: indicate</text>
  <line x1="283" y1="36" x2="283" y2="79" stroke="#111" stroke-width="1"/>
  <text x="60" y="302">1/2 in end mill</text>
  <line x1="110" y1="290" x2="128" y2="243" stroke="#111" stroke-width="1"/>

  <!-- right-hand labels -->
  <text x="548" y="50">2 far-edge stops</text>
  <line x1="544" y1="46" x2="377" y2="62" stroke="#111" stroke-width="1"/>
  <text x="548" y="74">strap over parallel</text>
  <line x1="544" y1="70" x2="486" y2="72" stroke="#111" stroke-width="1"/>
  <text x="548" y="120">right-end stop</text>
  <line x1="544" y1="116" x2="538" y2="116" stroke="#111" stroke-width="1"/>
  <text x="548" y="172">1 in parallel</text>
  <text x="548" y="190">(crosswise)</text>
  <line x1="544" y1="168" x2="476" y2="190" stroke="#111" stroke-width="1"/>
  <text x="548" y="230">ZERO EDGE (cut)</text>
  <line x1="544" y1="226" x2="505" y2="223" stroke="#111" stroke-width="1"/>

  <!-- axes -->
  <g stroke="#111" stroke-width="1.5">
    <line x1="600" y1="305" x2="650" y2="305" marker-end="url(#arr)"/>
    <line x1="600" y1="305" x2="600" y2="262" marker-end="url(#arr)"/>
  </g>
  <text x="656" y="310">+X</text>
  <text x="608" y="268">+Y away</text>
</svg>
