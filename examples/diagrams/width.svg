<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
    <pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a33" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="720" height="340" fill="#fff"/>

  <!-- mill table, top view -->
  <rect x="10" y="60" width="640" height="226" fill="#f1f2f3" stroke="#999"/>
  <g fill="#d6d8db">
    <rect x="10" y="114" width="640" height="8"/>
    <rect x="10" y="224" width="640" height="8"/>
  </g>

  <!-- blank; opposite edge stock (hatched) and front cleanup -->
  <rect x="90" y="92" width="470" height="162" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <rect x="90" y="92" width="470" height="14" fill="url(#cut)"/>
  <line x1="90" y1="106" x2="560" y2="106" stroke="#a33" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="90" y="249" width="470" height="5" fill="url(#cut)"/>
  <line x1="90" y1="249" x2="560" y2="249" stroke="#a33" stroke-width="3"/>

  <!-- two inboard 1-2-3 blocks under the blank -->
  <g fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="125" y="130" width="27" height="86"/>
    <rect x="498" y="130" width="27" height="86"/>
  </g>

  <!-- straps at mid-width of each end -->
  <g fill="#8a9099" stroke="#111" stroke-width="1.2">
    <rect x="36" y="158" width="16" height="30"/>
    <rect x="598" y="158" width="16" height="30"/>
  </g>
  <g fill="#6b7178" stroke="#111" stroke-width="1.2">
    <rect x="44" y="162" width="104" height="22"/>
    <rect x="502" y="162" width="104" height="22"/>
  </g>
  <circle cx="76" cy="173" r="6" fill="#ddd" stroke="#111"/>
  <circle cx="574" cy="173" r="6" fill="#ddd" stroke="#111"/>

  <!-- pass 1: front edge, +X -->
  <circle cx="180" cy="256" r="7" fill="#c9a227" stroke="#111" stroke-width="1.2"/>
  <line x1="200" y1="272" x2="330" y2="272" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="277">+X</text>
  <text x="20" y="310">1  Front edge, +X: finish .005–.010 → A / ZERO EDGE</text>

  <!-- pass 2: opposite edge, -X -->
  <circle cx="470" cy="99" r="7" fill="#c9a227" stroke="#111" stroke-width="1.2"/>
  <line x1="450" y1="78" x2="320" y2="78" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="83">−X</text>
  <text x="20" y="40">2  Opposite edge, −X: rough 5.515, finish 5.500</text>

  <!-- 5.50 from ZERO EDGE -->
  <g stroke="#111" stroke-width="1">
    <line x1="88" y1="106" x2="22" y2="106"/>
    <line x1="88" y1="249" x2="22" y2="249"/>
    <line x1="28" y1="107" x2="28" y2="248" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text transform="translate(22 150) rotate(-90)" text-anchor="middle">5.50</text>

  <!-- in-figure labels -->
  <text x="325" y="145" text-anchor="middle">flat on 2 inboard 1-2-3 blocks</text>
  <text x="325" y="178" text-anchor="middle">straps at mid-width of each end</text>
  <text x="325" y="211" text-anchor="middle">both long edges overhang, clear</text>
  <text x="560" y="300" text-anchor="end">A / ZERO EDGE</text>
  <line x1="500" y1="288" x2="480" y2="251" stroke="#111" stroke-width="1"/>

  <!-- axes -->
  <g stroke="#111" stroke-width="1.5">
    <line x1="610" y1="325" x2="655" y2="325" marker-end="url(#arr)"/>
    <line x1="610" y1="325" x2="610" y2="290" marker-end="url(#arr)"/>
  </g>
  <text x="660" y="330">+X</text>
  <text x="618" y="300">+Y</text>
</svg>
