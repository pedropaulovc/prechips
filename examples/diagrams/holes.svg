<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fff"/>

  <!-- vise jaws (top view) -->
  <rect x="241" y="56" width="192" height="16" fill="#8a9099" stroke="#111" stroke-width="1.2"/>
  <rect x="241" y="248" width="192" height="16" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>

  <!-- bar, C'BORE SIDE up, ZERO EDGE at back -->
  <rect x="60" y="72" width="555" height="176" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <line x1="60" y1="73" x2="615" y2="73" stroke="#a33" stroke-width="3"/>

  <!-- parallels and jacks under the bar -->
  <g fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="243" y="75" width="188" height="5"/>
    <rect x="243" y="240" width="188" height="5"/>
    <circle cx="190" cy="215" r="10"/>
    <circle cx="566" cy="130" r="9"/>
  </g>

  <!-- rail holes R1-R8, 8-32 tapped, Y -3.5000 -->
  <g fill="#fff" stroke="#111" stroke-width="1.2">
    <circle cx="78.9" cy="184" r="3.5"/>
    <circle cx="154.5" cy="184" r="3.5"/>
    <circle cx="230.1" cy="184" r="3.5"/>
    <circle cx="305.7" cy="184" r="3.5"/>
    <circle cx="381.3" cy="184" r="3.5"/>
    <circle cx="456.9" cy="184" r="3.5"/>
    <circle cx="532.4" cy="184" r="3.5"/>
    <circle cx="608" cy="184" r="3.5"/>
  </g>

  <!-- bracket holes B1-B8 with counterbores from top -->
  <g fill="#fff" stroke="#111" stroke-width="1.2">
    <circle cx="131.8" cy="79.8" r="5"/><circle cx="131.8" cy="79.8" r="3"/>
    <circle cx="131.8" cy="100.9" r="5"/><circle cx="131.8" cy="100.9" r="3"/>
    <circle cx="131.8" cy="128.6" r="5"/><circle cx="131.8" cy="128.6" r="3"/>
    <circle cx="131.8" cy="149.6" r="5"/><circle cx="131.8" cy="149.6" r="3"/>
    <circle cx="599.2" cy="79.8" r="5"/><circle cx="599.2" cy="79.8" r="3"/>
    <circle cx="599.2" cy="100.9" r="5"/><circle cx="599.2" cy="100.9" r="3"/>
    <circle cx="599.2" cy="128.6" r="5"/><circle cx="599.2" cy="128.6" r="3"/>
    <circle cx="599.2" cy="149.6" r="5"/><circle cx="599.2" cy="149.6" r="3"/>
  </g>

  <!-- slots S1, S2 -->
  <g fill="#fff" stroke="#111" stroke-width="1.2">
    <rect x="79.3" y="125.6" width="17" height="22.1" rx="8.5"/>
    <rect x="542.7" y="220.3" width="17" height="22.1" rx="8.5"/>
  </g>

  <!-- feature labels -->
  <text x="250" y="120">C'BORE SIDE up</text>
  <text x="144" y="112">B1–B4</text>
  <text x="548" y="105">B5–B8</text>
  <text x="101" y="142">S1</text>
  <text x="538" y="236" text-anchor="end">S2</text>
  <text x="240" y="208">R1–R8, Y −3.5000</text>
  <text x="205" y="225">jack</text>
  <text x="554" y="135" text-anchor="end">jack</text>

  <!-- datum origin X0/Y0 at back-left -->
  <circle cx="60" cy="72" r="7" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <path d="M60 72V65A7 7 0 0 1 67 72Z M60 72V79A7 7 0 0 1 53 72Z" fill="#111"/>
  <text x="4" y="62">X0 Y0</text>
  <text transform="translate(46 160) rotate(-90)" text-anchor="middle">ZERO END</text>
  <text x="337" y="46" text-anchor="middle">fixed jaw: ZERO EDGE against it</text>

  <!-- axes -->
  <g stroke="#111" stroke-width="1.5">
    <line x1="630" y1="22" x2="680" y2="22" marker-end="url(#arr)"/>
    <line x1="630" y1="22" x2="630" y2="58" marker-end="url(#arr)"/>
  </g>
  <text x="686" y="27">+X</text>
  <text x="640" y="60">−Y</text>

  <!-- front jaw and length -->
  <text x="337" y="282" text-anchor="middle">front jaw · 1-3/8 parallels under bar</text>
  <g stroke="#111" stroke-width="1">
    <line x1="60" y1="252" x2="60" y2="308"/>
    <line x1="614" y1="252" x2="614" y2="308"/>
    <line x1="61" y1="303" x2="613" y2="303" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="337" y="322" text-anchor="middle">17.32</text>
</svg>
