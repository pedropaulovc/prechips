  <rect x="595.5" y="121.2" width="12.4" height="7.5" fill="#555" stroke="#111"/>
  <!-- rail on the opposite face -->
  <rect x="508.4" y="141.6" width="27.2" height="27.1" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>

  <text x="430" y="108">C'BORE SIDE</text>
  <line x1="490" y1="111" x2="500" y2="120" stroke="#111" stroke-width="1"/>
  <text x="716" y="108" text-anchor="end">#8-32 head below top</text>
  <line x1="598" y1="112" x2="601" y2="121" stroke="#111" stroke-width="1"/>
  <text x="430" y="196">HGR15 rail, opposite face</text>
  <line x1="480" y1="184" x2="510" y2="167" stroke="#111" stroke-width="1"/>
  <text x="716" y="180" text-anchor="end">ZERO EDGE</text>
  <line x1="680" y1="168" x2="683" y2="142" stroke="#111" stroke-width="1"/>

  <text x="430" y="240">1/2-13 stud slides in both slots</text>
  <line x1="428" y1="234" x2="374" y2="176" stroke="#111" stroke-width="1"/>
