  <rect x="411" y="130.5" width="8.8" height="13" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>

  <g fill="#fff" stroke="#111" stroke-width="1.1">
    <circle cx="43" cy="137" r="2.5"/>
    <circle cx="95" cy="137" r="2.5"/>
    <circle cx="146.9" cy="137" r="2.5"/>
    <circle cx="198.9" cy="137" r="2.5"/>
    <circle cx="250.9" cy="137" r="2.5"/>
    <circle cx="302.8" cy="137" r="2.5"/>
    <circle cx="354.8" cy="137" r="2.5"/>
    <circle cx="406.8" cy="137" r="2.5"/>
    <circle cx="79.4" cy="65.4" r="3.4"/><circle cx="79.4" cy="65.4" r="2.2"/>
    <circle cx="79.4" cy="79.8" r="3.4"/><circle cx="79.4" cy="79.8" r="2.2"/>
    <circle cx="79.4" cy="98.9" r="3.4"/><circle cx="79.4" cy="98.9" r="2.2"/>
    <circle cx="79.4" cy="113.4" r="3.4"/><circle cx="79.4" cy="113.4" r="2.2"/>
    <circle cx="400.7" cy="65.4" r="3.4"/><circle cx="400.7" cy="65.4" r="2.2"/>
    <circle cx="400.7" cy="79.8" r="3.4"/><circle cx="400.7" cy="79.8" r="2.2"/>
    <circle cx="400.7" cy="98.9" r="3.4"/><circle cx="400.7" cy="98.9" r="2.2"/>
    <circle cx="400.7" cy="113.4" r="3.4"/><circle cx="400.7" cy="113.4" r="2.2"/>
    <rect x="43.3" y="96.9" width="11.6" height="15.1" rx="5.8"/>
    <rect x="361.9" y="162" width="11.6" height="15.1" rx="5.8"/>
