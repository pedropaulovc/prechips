  <line x1="394" y1="208" x2="416" y2="145" stroke="#111" stroke-width="1"/>

  <!-- Section A-A -->
  <text x="430" y="84">Section A–A (through B5–B8)</text>
  <rect x="430" y="120" width="253" height="21.6" fill="url(#sec)" stroke="#111" stroke-width="1.5"/>
  <g fill="#fff">
    <rect x="664.5" y="119" width="14.4" height="9.7"/><rect x="667.2" y="128" width="9" height="14.6"/>
    <rect x="634.3" y="119" width="14.4" height="9.7"/><rect x="637" y="128" width="9" height="14.6"/>
    <rect x="594.5" y="119" width="14.4" height="9.7"/><rect x="597.2" y="128" width="9" height="14.6"/>
    <rect x="564.3" y="119" width="14.4" height="9.7"/><rect x="567" y="128" width="9" height="14.6"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.2">
    <path d="M664.5 120V128.7H667.2V141.6M676.2 141.6V128.7H678.9V120"/>
    <path d="M634.3 120V128.7H637V141.6M646 141.6V128.7H648.7V120"/>
    <path d="M594.5 120V128.7H597.2V141.6M606.2 141.6V128.7H608.9V120"/>
    <path d="M564.3 120V128.7H567V141.6M576 141.6V128.7H578.7V120"/>
