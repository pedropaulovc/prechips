# Demo: a block from 1/2 in hex brass on a CNC mill: both ends faced, a #4-40
# tapped hole on the axis in each end (the bottom one blind, the top one
# into the cross bore) and an F-drill bore through two opposite corners.
# Sizes, bands, the tap reaches and the corner-down seat come from the
# manifest through the hex_block adapter; the pictures are its hex-block
# templates. Upright the block stands on two thin parallels, one against
# each jaw; for the cross bore it lies corner down between them. Each tapped
# hole is tapped by hand in the setup that drilled it, the tap wrench guided
# by a spring tap guide in the stopped spindle.
title = "Demo hex block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "Brass hex, 1/2 in across flats (alloy not on record)"
stock = "{{process.blank_af_in:.3dot}} in hex bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in length."
note = "Inches unless mm; G-code and console entries in mm. Finished {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} long. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home, so no offset from an earlier session is trusted. After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Finish: bare machined brass. The drawing calls for brass black; no blackening chemical is on the shop records, so it is NOT done here."
shop = "shop.toml"
material_key = "hex-block-brass"
milling_material = "brass"

[cad]
file = "cad/hex-block-v51.toml"
adapter = "hex_block"
part = "hex-block"

[parameters]
quantity = 1
blank_af_in = 0.5
blank_length_min_in = 1.25
blank_length_max_in = 1.30
kerf_in = 0.125
bottom_skim_mm = 0.508
face_step_max_mm = 1.27
face_cutter_dia_mm = 12.7
face_stepover_mm = 6.35
end_spot_dia_mm = 2.032
corner_spot_dia_mm = 4.572
peck_43_mm = 2.032
cross_drill_past_mm = 1.0
spot_feed_per_min_mm = 71.12
drill_43_feed_per_min_mm = 71.12
drill_f_feed_per_min_mm = 243.84
parallel_height_mm = 25.4
parallel_thickness_mm = 3.175
cross_parallel_end_mm = 9.525
vise_bed_height_mm = 73.3044
vise_jaw_height_mm = 44.9453
vise_jaw_width_mm = 158.6738
vise_centred_inset_mm = -72.0
upright_grip_mm = 19.5453
r8_collet_gauge_mm = 6.3
drill_chuck_gauge_mm = 95.0
half_mill_projection_min_mm = 25.4
drill_f_oal_mm = 104.775
centre_drill_oal_mm = 47.625
upright_top_max_mm = 32.512
rod_tip_height_mm = 18.37
thumb_tip_height_mm = 19.27
cross_tip_height_mm = -4.794
tap_stack_max_mm = 269.24
# The spring tap guide's 1/2 in body and 3/16 in point (shop
# tools.tap-guide-fisher, its sellers' sizes), as the tap pictures draw them.
tap_guide_dia_mm = 12.7
tap_guide_point_dia_mm = 4.7625

[[tools]]
id = "em-half"
name = "1/2 in carbide end mill"
ref = "hex-block-em-half"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "jig-spot"
[[tools]]
id = "drill-43"
name = "#43 drill"
ref = "jig-drill-43"
[[tools]]
id = "drill-f"
name = "F drill"
ref = "jig-drill-f"
[[tools]]
id = "tap-guide"
name = "Fisher spring tap guide"
ref = "tap-guide-fisher"
[[tools]]
id = "tap-4-40"
name = "4-40 plug tap"
ref = "jig-tap-4-40-plug"
[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "files"
name = "Files"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/demo-hex-block/saw.svg", alt = "The 1/2 in hex bar with one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Caliper the piece on hand. {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long: use it as it is. Longer: saw it to that length, the hex lying on a flat in the saw's vise. Shorter than {{process.blank_length_min_in:.2f}}: stop, it is too short. File the burr off both ends and the corners so it seats flat on the parallels; mic across one pair of flats ({{process.blank_af_in:.3dot}} nominal) and write the reading down: Setups 2–4 set Y0 from it."
feed = "hand"
inspection = "Blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long; across flats read and noted."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.blank_length_min_mm}}", "{{cad.blank_length_max_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "Bottom end: face, drill and tap the rod hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels, 1/8 in thick, one against each jaw. The blank upright on them, BOTTOM end up (either end of a fresh blank), gripped across one pair of flats, a corner pointing LEFT and one RIGHT, centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. Its top stands about {{process.upright_top_max_mm:in.2f}} above the parallels, {{process.vise_jaw_height_mm:in.2f}} − 1.00 in of it in the jaws."
datum = "Programs MC01_bottom and MC02_rod_tap. G54: X0 Y0 the hex axis, Z0 the faced bottom end; +Y toward the fixed jaw. Tool lengths from the tool setter at each M6; every file starts with an M6 for its first tool."
diagram = { file = "diagrams/demo-hex-block/bottom-drill.svg", alt = "The blank upright on two parallels in the vise, bottom end up; the 1/2 in end mill faces it in two passes, the centre drill spots the axis and the #43 drill drills the rod hole." }
envelope = { x_span_mm = ["{{cad.ac_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.rod_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.af_mm}}", along_jaws_mm = "{{cad.ac_mm}}", part_height_mm = "{{cad.blank_length_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_centred_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { diameter = "{{cad.af_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill ($H). Touch off G54: Y0 the hex axis, from the fixed jaw's face; X0 midway between the left and right corners; Z0 {{process.bottom_skim_mm:in.3dot}} below the highest point of the sawn top."
instruction_detailed = "Home the mill first ($H). Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet). Edge finder on the fixed jaw's face beside the blank: G10 L20 P1 Y(half your across-flats reading in mm − 2.540): for .500, Y3.810. Edge finder on the LEFT corner from the left: G10 L20 P1 X0; then on the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading). T1 back in, spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z{{process.bottom_skim_mm:.3f}} + 0.051, i.e. Z0.559."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MC01_bottom (M6 T1, 1/2 in end mill; set 2800): face the bottom end at Z0, {{process.bottom_skim_mm:in.3dot}} off the high point, two passes. At the M6 T2 stop: the whole end must be faced; a sawn patch left: abort, set Z0 {{process.bottom_skim_mm:in.3dot}} below the faced end and run MC01 again. No chamfer or spotface at this end: it is the mating rod's shoulder seat."
settings = "hex-block-em-half-brass"
milling_cuts = [
  { name = "bottom face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.bottom_skim_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the axis Ø{{process.end_spot_dia_mm:in.3dot}}, under the #43 drill; set 2800."
settings = "hex-block-spot-brass"
milling_cuts = [
  { name = "rod spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.end_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-4-40" }
instruction = "Same file, M6 T3: #43 drill, {{cad.rod_drill_depth_in:.2dot}} deep to the full diameter, pecks of {{process.peck_43_mm:in.3dot}} with full retract; set 2800. A drop of Tapmatic Gold. The depth ({{cad.rod_drill_depth_min_in:.3dot}}–{{cad.rod_drill_depth_max_in:.3dot}}) is the program's Z from the faced end, not gauged. Then the block stays in the vise for the tap."
settings = "hex-block-drill-43-brass"
hole_depth_mm = "{{cad.rod_drill_depth_mm}}"
peck = { step_mm = 2.032, retract = "full" }
milling_cuts = [
  { name = "rod drill", kind = "drill", phase = "rough", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the tap guide from its tip to the collet's face and the 4-40 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). The two together must be at most {{process.tap_stack_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, this blank, the collet and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup. Set the tap's depth flag: a turn of masking tape on the tap with its edge {{cad.rod_tap_reach_min_in:.3dot}}–{{cad.rod_tap_reach_max_in:.3dot}} from the point, by the calipers' depth rod (aim {{cad.rod_tap_reach_in:.3dot}})."
feed = "hand"
inspection = "Flag edge {{cad.rod_tap_reach_min_in:.3dot}}–{{cad.rod_tap_reach_max_in:.3dot}} from the tap's point (calipers)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.rod_tap_reach_band_mm}}" }]

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MC02_rod_tap: M6 T5 (the spring tap guide in its 1/2 in collet; the tool setter measures it), Z to the machine top, over the hole, end. The spindle stays off."
diagram = { file = "diagrams/demo-hex-block/bottom-tap.svg", alt = "The blank upright in the vise, bottom end up; the 4-40 tap in the T-handle wrench in the rod hole, the spring tap guide in the spindle, its point seated in the wrench's centre hole; the tape flag on the tap at the tap-reach band." }

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "The 4-40 plug tap in the T-handle wrench, point in the hole, a drop of Tapmatic Gold; jog Z down until the tap guide's point sits in the wrench's centre hole and is pushed partway into its body: its spring keeps light pressure on the tap, it does not push it in. Turn the wrench, backing off a half turn each turn to break the chip, jogging Z down to keep the point seated and short of fully retracted. Stop when the flag reaches the face: thread {{cad.rod_thread_depth_min_in:.3dot}}–{{cad.rod_thread_depth_max_in:.3dot}} full, the point short of the drilled depth. Jog Z up clear, back the tap out by hand, blow the hole out. The thread depth is held by the flag at the face, not gauged on the part."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Cross bore through the corners"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Same two 1 in parallels against the jaws ({{cad.cross_parallel_gap_mm:in.3dot}} gap between them), slid along so their RIGHT ends stand {{process.cross_parallel_end_mm:in.3dot}} in from where the block's bottom end will be and run out to the LEFT. The block lies along the jaws, a corner straight UP and one DOWN, the faced bottom end to the LEFT: its two lower diagonal flats rest on the parallels' inner top edges (the lower corner {{cad.cross_corner_drop_mm:in.3dot}} below their tops, between them), gripped on the two vertical flats ({{cad.flat_width_mm:in.3dot}} tall, the Z flats). Under the bore nothing but air: the parallels stop {{cad.cross_parallel_clear_mm:in.3dot}} short of the drill. Tap it down onto both edges while closing the vise; the top corner level, checked by eye along the jaws."
datum = "Program MC03_cross_bore. G54: X0 the faced bottom end, +X toward the top end; Y0 the hex axis, +Y toward the fixed jaw; Z0 the top corner. Tool lengths from the tool setter at each M6."
diagram = { file = "diagrams/demo-hex-block/cross.svg", alt = "The block lying along the jaws, corner up, its lower diagonal flats on the parallels' inner edges at the bottom end; the centre drill spots the top corner and the F drill drills through both corners {{cad.bore_height_in:.2dot}} from the bottom end, into air below." }
envelope = { x_span_mm = ["{{cad.block_height_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.cross_top_height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.cross_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_f_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = "other"
beam = { axis = "x", hold = "solid", extent_mm = [0, "{{cad.block_height_mm}}"], seat = "gripped full length in the vise jaws, the bottom end on the parallels' edges", seat_mm = [0, "{{cad.block_height_mm}}"] }

[[setups.operations]]
instruction = "Home the mill ($H). Touch off G54: Y0 the hex axis, from the fixed jaw's face; X0 the faced bottom end; Z0 the top corner."
instruction_detailed = "Home the mill first ($H). Edge finder on the fixed jaw's face: G10 L20 P1 Y(half your across-flats reading in mm − 2.540): for .500, Y3.810. On the block's faced bottom end from the left: G10 L20 P1 X-2.540. Console M6 T1 (1/2 in end mill), spindle stopped, its tip just dragging a .002 feeler leaf on the top corner: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run MC03_cross_bore (M6 T2, centre drill; set 2800): spot the top corner Ø{{process.corner_spot_dia_mm:in.3dot}} at X {{cad.bore_height_mm:.3f}} mm (the program's station), on the axis."
settings = "hex-block-spot-brass"
milling_cuts = [
  { name = "corner spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.corner_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.bore_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-f"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Same file, M6 T4: F drill through both corners, no peck, its full diameter {{process.cross_drill_past_mm:in.3dot}} past the lower corner, into the air between the parallels; set 2400. A drop of Tapmatic Gold."
settings = "hex-block-drill-f-brass"
hole_depth_mm = "{{cad.ac_mm}}"
peck = "none"
milling_cuts = [
  { name = "cross drill", kind = "drill", phase = "rough", cutter_dia_mm = 6.5278, flutes = 2, rpm = 2400, feed_mm_min = "{{process.drill_f_feed_per_min_mm}}", stations_mm = "{{cad.bore_height_mm}}" },
]
inspection = "Bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}} by drill shanks, before unclamping: mic the F drill's shank first, .2560–.2575 to use it as the GO, and the G drill's shank, .2600–.2610 to use it as the NO-GO. The F shank enters, the G shank does not. The F drill holds the lower limit: the GO checks it only to the F shank's reading, not to a gauge class."
gauge_checks = [{ gauge = "hex-block-bore-drill-shanks", band_mm = "{{cad.bore_dia_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Top end: face to length, drill and tap the thumb hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The parallels back against the jaws, full length under the block. The block upright, TOP end up (the faced bottom end down on both parallels), gripped across the same pair of flats as Setup 2 (the bore's ends to the LEFT and RIGHT), centred on the jaws. Tap it down onto both parallels while closing the vise."
datum = "Programs MC04_top and MC05_thumb_tap. G54: X0 Y0 the hex axis, Z0 the parallels' top (the faced bottom end); +Y toward the fixed jaw. Tool lengths from the tool setter at each M6."
diagram = { file = "diagrams/demo-hex-block/top-drill.svg", alt = "The block upright on two parallels, top end up, the bore's ends left and right; the 1/2 in end mill faces the top to length in levels, the centre drill spots the axis and the #43 drill drills down into the bore." }
envelope = { x_span_mm = ["{{cad.ac_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.thumb_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.af_mm}}", along_jaws_mm = "{{cad.ac_mm}}", part_height_mm = "{{process.upright_top_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_centred_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{process.upright_top_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { diameter = "{{cad.af_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill ($H). Touch off G54: Y0 the hex axis, from the fixed jaw's face; X0 midway between the left and right corners; Z0 the parallels' top."
instruction_detailed = "Home the mill first ($H). Edge finder on the fixed jaw's face: G10 L20 P1 Y(half your across-flats reading in mm − 2.540). Edge finder on the LEFT corner from the left: G10 L20 P1 X0; on the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading). Console M6 T1, spindle stopped, its tip just dragging a .002 feeler leaf on a parallel's top beside the block: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MC04_top (M6 T1, 1/2 in end mill; set 2800): face the top end down to Z {{cad.block_height_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}}, two passes each, from {{process.upright_top_max_mm:in.3dot}} (the longest blank: a shorter one cuts air first). At the M6 T2 stop: mic the length at two corners."
settings = "hex-block-em-half-brass"
inspection = "Length {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} at two corners, at the M6 T2 stop (over: abort, G10 L2 P1 Z(G54 Z − the excess) and run MC04 again; under: scrap)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.block_height_band_mm}}" }]
milling_cuts = [
  { name = "top face", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the axis Ø{{process.end_spot_dia_mm:in.3dot}}; set 2800."
settings = "hex-block-spot-brass"
milling_cuts = [
  { name = "thumb spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.end_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.block_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-4-40" }
instruction = "Same file, M6 T3: #43 drill down into the bore, its full diameter to the bore's axis, {{cad.thumb_drill_depth_in:.2dot}} deep; pecks of {{process.peck_43_mm:in.3dot}} with full retract; set 2800. A drop of Tapmatic Gold. The depth ({{cad.thumb_drill_depth_min_in:.3dot}}–{{cad.thumb_drill_depth_max_in:.3dot}}) is the program's Z, not gauged; look through the bore: the drill has broken into it."
settings = "hex-block-drill-43-brass"
hole_depth_mm = "{{cad.thumb_drill_depth_mm}}"
peck = { step_mm = 2.032, retract = "full" }
milling_cuts = [
  { name = "thumb drill", kind = "drill", phase = "rough", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = "{{cad.block_height_mm}}" },
]

[[setups.operations]]
instruction = "Set the tap's flag again: its edge {{cad.thumb_tap_reach_min_in:.3dot}}–{{cad.thumb_tap_reach_max_in:.3dot}} from the point (aim {{cad.thumb_tap_reach_in:.3dot}}). The stop check of Setup 2 covers this setup: the block is shorter now."
feed = "hand"
inspection = "Flag edge {{cad.thumb_tap_reach_min_in:.3dot}}–{{cad.thumb_tap_reach_max_in:.3dot}} from the tap's point (calipers)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thumb_tap_reach_band_mm}}" }]

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MC05_thumb_tap: M6 T5 (the spring tap guide), Z to the machine top, over the hole, end. The spindle stays off."
diagram = { file = "diagrams/demo-hex-block/top-tap.svg", alt = "The block upright in the vise, top end up; the 4-40 tap in the T-handle wrench in the thumb hole, the spring tap guide in the spindle, its point seated in the wrench's centre hole; the tape flag on the tap." }

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap the thumb hole as the rod hole: Tapmatic Gold, the tap guide's point seated by jogging Z, a half turn back each turn; stop when the flag reaches the face (the thread runs into the bore: .25 REF). Jog Z up clear, back the tap out, blow the hole and the bore out."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/demo-hex-block/inspect.svg", alt = "The finished block: length end to end, the cross bore's height from the bottom end and its offset from a Z flat, the two tapped holes on the axis." }
envelope = "other"
vise_hold = "other"
beam = "other"
inspection = ["Length {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} (micrometers, at two corners). Bore height {{cad.bore_height_min_in:.3dot}}–{{cad.bore_height_max_in:.3dot}}: the F drill's shank pushed through the bore, calipers from the bottom end to the shank's far side less the shank's miked Ø/2. Bore from a Z flat {{cad.bore_flat_location_min_in:.3dot}}–{{cad.bore_flat_location_max_in:.3dot}}: calipers from that flat over the shank, less the shank's Ø/2. Each tapped hole from the same Z flat {{cad.tap_location_min_in:.3dot}}–{{cad.tap_location_max_in:.3dot}}: the #43 drill's shank in the hole, calipers from the flat over the shank less its Ø/2; and the same from the hole's own diagonal flat beside it. Both threads: a 4-40 screw runs in by hand. Edges R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max, except the bottom end's rod-hole mouth: no chamfer or spotface (the mating rod's seat), burr only."]
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.block_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bore_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bore_flat_location_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.tap_location_band_mm}}" },
]

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr: the bore's ends at both corners and inside, the top tap's mouth and the block's edges, scraper from the deburring set and a smooth file, to R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max. The bottom end and its rod-hole mouth: burr off only, no chamfer, no spotface (the mating rod's shoulder seat). Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "Finish: leave it bare machined brass. The drawing calls for brass black; no blackening chemical is on the shop records, so the blackening is NOT done in this traveler."
feed = "hand"
