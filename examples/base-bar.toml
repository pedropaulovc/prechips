# ch-rocker-arm-tl-oblique-base-bar-traveler-2026-11-05.html; drawing MHA-CH-06-TL-20 v47.
title = "Oblique trammel base bar — two identical"
part = "MHA-CH-06-TL-20"
revision = "v47"
material = "6061-T6511 aluminium"
stock = "1/2 × 6 in bar; two 17 7/16 in blanks."
note = "Inches unless mm. Finished 17.32 × 5.50 × .47, each ±.01. Not mirrored; flip bar 2 in assembly."

[[tools]]
id = "saw"
description = "Aluminium saw, stock support, file"
[[tools]]
id = "em-half"
description = "1/2 in centre-cutting 2-flute end mill; flutes ≥5/8 in"
[[tools]]
id = "em-face"
description = "3/4 in 4-flute end mill"
[[tools]]
id = "edge-finder"
description = ".200 in edge finder"
[[tools]]
id = "spot"
description = "#2 centre drill"
[[tools]]
id = "rail-drill"
description = "#29 (.136 in) drill"
[[tools]]
id = "bracket-drill"
description = "#9 (.196 in) drill"
[[tools]]
id = "slot-drill"
description = "3/8 in drill"
[[tools]]
id = "tap"
description = "8-32 plug tap, T-handle, tapping fluid"
[[tools]]
id = "counterbore"
description = "5/16 in centre-cutting 2-flute end mill"
[[tools]]
id = "measure"
description = "Collets, drill chuck; calipers, 0–1 in micrometer, rule, indicator/base, marker, dead-blow"
[[tools]]
id = "deburr"
description = "Deburrer; HGR15 rail, eight #8-32 × 3/4 screws, one × 5/8; 1/2-13 stud; Ra comparator/instrument"

[[setups]]
title = "Saw / rail check"
machine = "Saw / bench"
holding = "Support stock/offcut."
datum = "Rail end flush with ZERO END: holes 15/75/135/195/255/315/375/435 mm, ±.08 mm. Stop on mismatch."

[[setups.operations]]
tool = "saw"
instruction = "Saw blanks; file burrs; measure stock allowances."
feed = "hand"

[[setups]]
title = "Mill width"
machine = "PM-30MV; inch DRO"
holding = "Vise off; crosswise 1 in parallels, far-half straps, two independently clamped far-edge 1-2-3 stops, right-end stop with 1/2-13 mounting, .90–1.18 in jack touching."
datum = "Indicate extruded far edge within .002 end-to-end; near cut becomes ZERO EDGE. +X right, +Y away. Check 18.5 in travel/clearances."

[[setups.operations]]
tool = "em-half"
instruction = "Lock head; short stickout, mark creep; oil. Cutter .04–.08 below underside. Conventional +X cleanup, .020–.040 radial. Measure W; Axis Set Y = −(W − 5.500). Rough .080 radial; return −Y .040 clear, return X; approach +Y. Finish last ~.020 at Y0. Mark edge both faces. Stop motion before retracting if grabbing."
rpm = 1250
feed = "6 in/min"
inspection = "Width ends/middle; check creep."

[[setups]]
title = "Square / face"
machine = "PM-30MV / vise, swivel off"
holding = "Flat on matched 1-3/8 in parallels, ZERO EDGE at fixed jaw; 3.9–5.5 in jack under overhang. Check cutter/edge-finder clearances before mounting vise."
datum = "Jaw indicated <.001 along X; Z0 underside from measured thickness."

[[setups.operations]]
tool = "em-half"
instruction = "Slide each end beyond jaws; jack touching, not lifting. Cutter .04 below bar, clear parallels. Square in .020 passes: left −Y, right +Y. Leave .02–.04 length allowance."
rpm = 1250
feed = "6 in/min"

[[setups.operations]]
tool = "em-face"
instruction = "Measure thickness/allowance. Face two supported halves; touch off, lock head. Rough .010 deep, +X, +Y stepover .60; lift .040 returning. Reposition, verify Z. Remove half allowance side 1; flip/clean/reseat, remeasure/touch off; finish side 2 to .4700. Mark ZERO END and C'BORE SIDE (assembly underside)."
rpm = 840
feed = "3.3 in/min rough; 2.4 finish"

[[setups]]
title = "Finish length / holes / slots"
machine = "PM-30MV; inch DRO"
holding = "Same parallels; ZERO EDGE at back jaw, ZERO END left, C'BORE SIDE up; ~5.7 in overhang each end. Seat/retighten; drill over air."
datum = "Back-left X0 Y0; +X right, −Y operator. Rail X ±.003; bracket X/Y ±.005; rail row/slot positions ±.01."

[[setups.operations]]
tool = "edge-finder"
instruction = "Approach left end: Axis Set X −.1000; back edge: Y +.1000. Retouch; verify signs/corner."
rpm = 1000
feed = "hand"

[[setups.operations]]
tool = "em-half"
instruction = "Jack under right end. Measure cutter D; bottom .04 below bar. Cut +Y, .010 passes; final X = 17.3200 + D/2."
rpm = 1250
feed = "6 in/min"

[[setups.operations]]
tool = "spot"
instruction = """
Spot 18 holes, ~.125 cone:
R1–8 Y −3.5000; X .5906/2.9528/5.3150/7.6772/10.0394/12.4016/14.7638/17.1260.
B1–8: X 2.2441/16.8504; each Y −.2450/−.9020/−1.7680/−2.4250.
S1: X .8700 Y −2.0200; S2: X 15.3500 Y −4.9800.
All drills: oil, .125 pecks, breakthrough +.125.
"""
rpm = 3000
feed = "hand"

[[setups.operations]]
tool = "rail-drill"
instruction = "R1–8 through."
rpm = 3000
feed = "hand"

[[setups.operations]]
tool = "bracket-drill"
instruction = "B1–8 through."
rpm = 3000
feed = "hand"

[[setups.operations]]
tool = "slot-drill"
instruction = "S1–2 through."
rpm = 2000
feed = "hand"

[[setups.operations]]
tool = "tap"
instruction = "Power OFF; quill-guided hand start R1–8; T-handle through."
feed = "hand"

[[setups.operations]]
tool = "counterbore"
instruction = "Touch top B1, zero quill; stop .189 deep. Oil/plunge B1–8. Check first diameter/depth and recessed screw head before continuing."
rpm = 2000
feed = "slow hand plunge"

[[setups.operations]]
tool = "em-half"
instruction = "Rough .500 slots, depths .12/.24/.36/.49 below top, traverse/back: X .8700, Y −1.9400 to −2.1000; X 15.3500, Y −4.9000 to −5.0600. Finish rounded slots to .530 wide, .160 end-centre spacing; do not use rectangular lap."
rpm = 1250
feed = "5 in/min"

[[setups.operations]]
tool = "edge-finder"
instruction = "Right-end approach: accept 17.4100–17.4300. Lower jack; unload."
rpm = 1000
feed = "hand"

[[setups]]
title = "Deburr / inspect both"
machine = "Bench / clean mill table"
holding = "Protect faced seats."
datum = "Marked end/edge; rail on unmarked face."
inspection = ["Record each bar: overall dimensions above, width ends/middle, thickness corners/middle; no rocking or chatter. Ra 125 µin both faces.", "Verify hole coordinates/tolerances above. Brackets Ø.196–.200; counterbores Ø.308–.318 × .184–.194 deep, heads recessed. Rail screws hand-start without sideways force, rail end flush; uncut 450 mm rail overhang expected.", "Slots: width .52–.54; overall length minus width .15–.17; far wall ≥.080; stud slides end-to-end."]

[[setups.operations]]
tool = "deburr"
instruction = "Edges R.010 or chamfer .010 max; clear threads; fit rail/screws and slot stud."
feed = "hand"
