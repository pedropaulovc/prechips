title = "Oblique trammel base bar — two identical"
part = "MHA-CH-06-TL-20"
revision = "v47"
material = "6061-T6511 aluminium"
stock = "1/2 × 6 in bar; two 17 7/16 in blanks."
note = "Inches unless mm. Finished 17.32 × 5.50 × .47, each ±.01. Not mirrored; flip bar 2 in assembly."

