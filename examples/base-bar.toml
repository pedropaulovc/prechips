[[setups]]
title = "Saw blanks"
machine = "Saw / bench"
diagram = { file = "diagrams/saw.svg", alt = "Two 17 7/16 in blanks marked on the 1/2 × 6 in bar; bar supported level on saw bed and stands at the cutline." }

[[setups.operations]]
tool = "saw"
instruction = "Saw two 17 7/16 in blanks from 1/2 × 6 in bar."
feed = "hand"

[[setups]]
title = "Mill both long edges"
machine = "PM-30MV; inch DRO"
holding = "Vise off; 1-2-3 blocks inboard, supporting middle ~4 in; both long edges overhang .75–1 in. Strap across mid-width of each end, clear of both long-edge cuts."
datum = "Front machined edge becomes ZERO EDGE. X along length; +X cutter right, +Y away. Required X travel ~18.5 in."
diagram = { file = "diagrams/width.svg", alt = "Blank on inboard 1-2-3 blocks with straps at mid-width of each end; both long edges exposed. Front edge cut in +X makes ZERO EDGE; opposite edge cut in −X finishes width without moving the bar." }

[[setups.operations]]
tool = "em-half"
instruction = "Cutter .04–.08 below underside. Mill front edge in +X, conventional; rough .050–.080 radial, finish .005–.010. Mark ZERO EDGE both faces. Keep this clamping for opposite edge."
rpm = 1250
feed = "6 in/min"

[[setups.operations]]
tool = "em-half"
instruction = "Mill opposite long edge in −X, conventional; rough .050–.080 radial to 5.515 width, finish to 5.500 from ZERO EDGE."
rpm = 1250
feed = "6 in/min"
inspection = "Width at ends/middle."

[[setups]]
title = "Square both ends on table"
machine = "PM-30MV; inch DRO"
holding = "Keep bar fixed on inboard supports; supports clear of both end cuts."
datum = "First squared end becomes ZERO END / X0. Retain ZERO EDGE."
diagram = { file = "diagrams/ends.svg", alt = "Bar stays fixed on table supports. Add straps over finished long edges near mid-length before removing end straps; end mill squares the left end in −Y and finishes the right end in +Y to 17.32 from ZERO END." }

[[setups.operations]]
instruction = "Add two straps over finished long edges near mid-length and tighten before removing end straps. Do not move bar."

[[setups.operations]]
tool = "em-half"
instruction = "Cutter .04 below bar. Square left end in −Y, .020 passes; mark ZERO END both faces and set X0 there. Measure cutter D; cut right end in +Y, .010 passes, final X = 17.3200 + D/2."
rpm = 1250
feed = "6 in/min"

[[setups]]
title = "Face both sides in vise"
machine = "PM-30MV / vise, swivel off"
holding = "Flat on 1-3/8 in parallels, ZERO EDGE at fixed jaw; screw jack (3.9–5.5 in range) under each overhanging end."
datum = "Jaw indicated <.001 along X; Z0 underside from measured thickness. Preserve marked ZERO END."
diagram = { file = "diagrams/face.svg", alt = "Bar in vise on 1-3/8 in parallels, ZERO EDGE at fixed jaw, jacks under both overhangs; 3/4 in end mill faces left and right halves. After both faces, orient ZERO END left and ZERO EDGE back before marking upper face C'BORE SIDE." }

[[setups.operations]]
tool = "em-face"
instruction = "Face left and right halves of each face. Rough .010 per pass, +X, +Y stepover .60; remove half allowance on side 1. Flip end-for-end, ZERO EDGE still at fixed jaw; finish side 2 to .4700. Reorient ZERO END left, ZERO EDGE back; mark upper face C'BORE SIDE."
rpm = 840
feed = "3.3 in/min rough; 2.4 finish"

[[setups]]
title = "Drill / tap / counterbore / slots"
machine = "PM-30MV; inch DRO"
holding = "ZERO EDGE at back jaw, ZERO END left, C'BORE SIDE up; 1-3/8 in parallels. Support both ~5.7 in overhangs with jacks clear of hole/slot paths."
datum = "Drawing lower edge = ZERO EDGE; left end = ZERO END; far face = C'BORE SIDE. Back-left X0/Y0; +X right, drawing Y dimensions become −Y."
diagram = { file = "diagrams/holes.svg", alt = "Finished 17.32 in bar in vise: C'BORE SIDE up, ZERO EDGE at back fixed jaw, ZERO END left, X0 Y0 back-left; rail holes R1–R8, counterbored B1–B8, slots S1–S2 and jacks under both overhangs." }

[[setups.operations]]
instruction = "Before drilling: from the rail end that goes at ZERO END, check hole centres 15, 75, 135, 195, 255, 315, 375, 435 mm, each ±0.08 mm. Stop if different."

[[setups.operations]]
tool = "spot"
instruction = "Spot 18 holes to Ø.125. All drills: .125 pecks, drill tip .125 past underside. Inches; IDs follow coordinate order. Rail X ±.003; bracket X/Y ±.005; rail row/slot positions ±.01."
rpm = 3000
feed = "hand"

[setups.operations.table]
columns = ["Holes", "X", "Y"]
rows = [
  ["Rail R1–8", ".5906, 2.9528, 5.3150, 7.6772,\n10.0394, 12.4016, 14.7638, 17.1260", "−3.5000"],
  ["Bracket B1–8", "2.2441, 16.8504\n(each X with all four Y)", "−.2450, −.9020,\n−1.7680, −2.4250"],
  ["Slot S1", ".8700", "−2.0200"],
  ["Slot S2", "15.3500", "−4.9800"],
]

[[setups.operations]]
tool = "rail-drill"
instruction = "R1–8 through."
rpm = 3000
feed = "hand"

[[setups.operations]]
tool = "bracket-drill"
instruction = "B1–8 through."
rpm = 3000
feed = "hand"

[[setups.operations]]
tool = "slot-drill"
instruction = "S1–2 through."
rpm = 2000
feed = "hand"

[[setups.operations]]
tool = "tap"
instruction = "Tap R1–8 through."
feed = "hand"

[[setups.operations]]
tool = "counterbore"
instruction = "Counterbore B1–8, .189 deep from top."
rpm = 2000
feed = "slow hand plunge"

[[setups.operations]]
tool = "em-half"
instruction = "Rough slots with .500 cutter, depths .12/.24/.36/.49 below top. Traverse between arc centres: X .8700, Y −1.9400 to −2.1000; X 15.3500, Y −4.9000 to −5.0600."
rpm = 1250
feed = "5 in/min"

[[setups.operations]]
tool = "slot-finish"
instruction = "Finish both slots at .49 below top, same X and arc-centre Y ranges as roughing. Result: .53125 wide with .160 arc-centre spacing."
# Authored starting settings from the source guide's 165 ft/min HSS milling
# speed and .002 in/tooth: 12*165/(pi*17/32)=1186 rpm, rounded to 1200;
# 1200 rpm * 2 flutes * .002 in/tooth = 4.8 in/min.
rpm = 1200
feed = "4.8 in/min"

[[setups]]
title = "Deburr / inspect both"
machine = "Bench / clean mill table"
datum = "Marked end/edge; rail on face opposite C'BORE SIDE."
diagram = { file = "diagrams/inspect.svg", alt = "Finished bar from C'BORE SIDE with section through B5–B8: socket heads recessed in counterbores; HGR15 rail on the opposite face, flush at ZERO END and overhanging the right end; slot stud fit." }

[[setups.operations]]
instruction = "Edges R.010 or chamfer .010 max; clear threads; fit rail/screws and slot stud."
feed = "hand"

[setups.operations.table]
columns = ["Inspect", "Requirement"]
rows = [
  ["Overall size", "17.32 × 5.50 × .47 (±.01 each); length both edges;\nwidth ends/mid; thickness corners/mid; ends square to ZERO EDGE"],
  ["Seats", "No rock on mill table; no chatter marks; Ra 125 µin both faces"],
  ["Bracket holes / counterbores", "Holes Ø.196–.200; counterbores Ø.308–.318 × .184–.194 deep;\ncheck #8-32 × 5/8 socket screw head sits recessed"],
  ["Rail fit", "450 mm HGR15 rail; 8× #8-32 × 3/4 socket screws;\nall hand-start, no side force; flush ZERO END, overhang opposite"],
  ["Slots", "Width .52–.54; overall length minus width .15–.17;\n1/2-13 slot-fit stud slides end-to-end"],
