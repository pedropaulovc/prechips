feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "slot-drill"
sizing = "other"
instruction = "{{cad.slot_range}} through."
rpm = 2000
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap"
sizing = "other"
instruction = "Tap {{cad.rail_range}} through."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "counterbore"
sizing = { kind = "band", band_mm = "{{cad.counterbore_dia_band_mm}}" }
instruction = "Counterbore {{cad.bracket_range}}, {{cad.counterbore_depth_in:.3f}} deep from top."
