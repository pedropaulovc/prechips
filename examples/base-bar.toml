[[setups.operations]]
speed_kind = "spindle"
tool = "slot-finish"
sizing = { kind = "band", band_mm = "{{cad.slot_width_band_mm}}" }
instruction = "Finish {{cad.slot_range}} at {{cad.slot_depth_in:.2f}} below top, same X and arc-centre Y ranges as roughing. Drawing target: {{cad.slot_width_in:.3f}} wide with {{cad.slot_spacing_in:.3f}} arc-centre spacing."
settings = "basebar-slot-finish-6061-t6511"
cut_diameter_mm = "{{cad.slot_finish_diameter_mm}}"

[[setups]]
machine_kind = "other"
title = "Deburr / inspect both"
machine = "Bench / clean mill table"
indexing = "none"
datum = "Marked end/edge; rail on face opposite C'BORE SIDE."
diagram = { file = "diagrams/inspect.svg", alt = "Finished bar from C'BORE SIDE with section through bracket holes {{cad.bracket_range}}: socket heads recessed in counterbores; HGR15 rail on the opposite face, flush at ZERO END and overhanging the right end; slot stud fit." }

[[setups.operations]]
instruction = "Edges R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max; clear threads; fit rail/screws and slot stud."
feed = "hand"

