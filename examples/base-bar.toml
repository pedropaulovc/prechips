[[setups]]
machine_kind = "other"
title = "Saw blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "{{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks marked on the {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; bar supported level on saw bed and stands at the cutline." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks from {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Mill both long edges"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off; 1-2-3 blocks inboard, supporting middle ~4 in; both long edges overhang .75–1 in. Strap across mid-width of each end, clear of both long-edge cuts."
datum = "Front machined edge becomes ZERO EDGE. X along length; +X cutter right, +Y away. Required X travel ~18.5 in."
diagram = { file = "diagrams/width.svg", alt = "Blank on inboard 1-2-3 blocks with straps at mid-width of each end; both long edges exposed. Front edge cut in +X makes ZERO EDGE; opposite edge cut in −X finishes width without moving the bar." }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04–.08 below underside. Mill front edge in +X, conventional; rough .050–.080 radial, finish .005–.010. Mark ZERO EDGE both faces. Keep this clamping for opposite edge."
settings = "basebar-edge-6061-t6511"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Mill opposite long edge in −X, conventional; rough .050–.080 radial to {{cad.width_rough_in:.3f}} width, finish to {{cad.width_in:.3f}} from ZERO EDGE."
settings = "basebar-edge-6061-t6511"
inspection = "Width at ends/middle."

[[setups]]
machine_kind = "other"
title = "Square both ends on table"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Keep bar fixed on inboard supports; supports clear of both end cuts."
datum = "First squared end becomes ZERO END / X0. Retain ZERO EDGE."
diagram = { file = "diagrams/ends.svg", alt = "Bar stays fixed on table supports. Add straps over finished long edges near mid-length before removing end straps; end mill squares the left end in −Y and finishes the right end in +Y to {{cad.length_in:.2f}} from ZERO END." }

[[setups.operations]]
instruction = "Add two straps over finished long edges near mid-length and tighten before removing end straps. Do not move bar."

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04 below bar. Square left end in −Y, .020 passes; mark ZERO END both faces and set X0 there. Measure cutter D; cut right end in +Y, .010 passes, final X = {{cad.length_in:.4f}} + D/2."
settings = "basebar-edge-6061-t6511"

[[setups]]
machine_kind = "other"
title = "Face both sides in vise"
machine = "PM-30MV / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat on 1-3/8 in parallels, ZERO EDGE at fixed jaw; screw jack (3.9–5.5 in range) under each overhanging end."
datum = "Jaw indicated <.001 along X; Z0 underside from measured thickness. Preserve marked ZERO END."
diagram = { file = "diagrams/face.svg", alt = "Bar in vise on 1-3/8 in parallels, ZERO EDGE at fixed jaw, jacks under both overhangs; 3/4 in end mill faces left and right halves. After both faces, orient ZERO END left and ZERO EDGE back before marking upper face C'BORE SIDE." }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face left and right halves of each face. Rough .010 per pass, +X, +Y stepover .60; remove half allowance on side 1. Flip end-for-end, ZERO EDGE still at fixed jaw; finish side 2 to {{cad.thickness_in:.4f}}. Reorient ZERO END left, ZERO EDGE back; mark upper face C'BORE SIDE."
rpm = 840
feed = "3.3 in/min rough; 2.4 finish"

[[setups]]
machine_kind = "other"
title = "Drill / tap / counterbore / slots"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "ZERO EDGE at back jaw, ZERO END left, C'BORE SIDE up; 1-3/8 in parallels. Support both overhangs with jacks clear of hole/slot paths."
datum = "Drawing lower edge = ZERO EDGE; left end = ZERO END; far face = C'BORE SIDE. Back-left X0/Y0; +X right, drawing Y dimensions become −Y."
diagram = { file = "diagrams/holes.svg", alt = "Finished {{cad.length_in:.2f}} in bar in vise: C'BORE SIDE up, ZERO EDGE at back fixed jaw, ZERO END left, X0 Y0 back-left; rail holes {{cad.rail_range}}, counterbored {{cad.bracket_range}}, slots {{cad.slot_range}} and jacks under both overhangs." }

[[setups.operations]]
instruction = "Before drilling: from the rail end that goes at ZERO END, check the {{cad.rail_count:d}} hole centres at {{cad.rail_stations_mm}} mm, each ±{{cad.rail_position_tol_mm:.2f}} mm. Stop if different."

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot {{cad.spot_count:d}} holes to Ø.125. All drills: .125 pecks, drill tip .125 past underside. Inches; IDs follow coordinate order. Rail X ±{{cad.rail_position_tol_in:.3f}}; bracket X/Y ±{{cad.bracket_position_tol_in:.3f}}; rail row ±{{cad.rail_row_tol_in:.2f}}; slot positions ±{{cad.slot_position_tol_in:.2f}}."
rpm = 3000
feed = "hand"

[setups.operations.table]
columns = ["Holes", "X", "Y"]
rows = "{{cad.hole_rows}}"

[[setups.operations]]
speed_kind = "spindle"
tool = "rail-drill"
sizing = { kind = "tap_drill", tap = "tap" }
instruction = "{{cad.rail_range}} through."
rpm = 3000
feed = "hand"

[[setups.operations]]
