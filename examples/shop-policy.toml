# Shop-owned policy; a process plan cannot waive required findings.
# PLAN.md rev 6 §3.4 ships these first seven rules on every subject.
# ILLUSTRATIVE EXAMPLE NUMBERS: the shop limits below are plausible hobby-shop
# values chosen for the pilot examples (AGENTS.md "Examples policy"), not
# logbook measurements or transcribed handbook limits.
# Reconciled examples supply explicitly labelled fixture and inspection capability
# observations; they do not waive these limits or the required rules below.
# An unresolved exported requirement (including the cone FINISH owner ruling)
# remains unresolved even when all demonstration equipment is present.
revision = 8

[required]
tool_resolves = "*"
sizing = "*"
op_chain = "*"
blind_depth = "*"
inspection = "*"
coordinates = "*"
zero_check = "*"

[numbers]
refixture_budget_mm = 0.05   # example: worst repeatability accepted after an unindicated re-fixture
thin_wall_floor_mm = 1.5     # example: thinnest wall the shop grips in vise jaws without soft jaws
stickout_ld_max = 4.0        # example: unsupported stickout limit, length / diameter
near_jaw_mm = 10.0           # example: a lathe cut ending this close to the spinning jaws carries its clearance on the op row
max_filing_stock_mm = 0.5    # EngManualArc example: most radial stock a rough stair or chain drill leaves for the bench file
saw_min_teeth_in_work = 3    # example: fewest saw teeth in the thickness the blade crosses

[numbers_cite]
refixture_budget_mm = "illustrative example value (plausible hobby-shop vise re-seat repeatability), not measured"
thin_wall_floor_mm = "illustrative example value (plausible hobby-shop grip floor for steel), not measured"
stickout_ld_max = "illustrative example value (common 4:1 unsupported turning rule of thumb), not a transcribed limit"
near_jaw_mm = "AUTHOR'S CHOICE: illustrative example value (plausible hobby-lathe hand-feed margin before spinning jaws), not measured"
max_filing_stock_mm = "AUTHOR'S CHOICE: illustrative example value (plausible radial stock a hand file takes down to a scribed line on steel after rough stairs or a chain drill), not measured"
saw_min_teeth_in_work = "example value: the common rule of at least 3 teeth in the work, as Starrett's 'Sawing Starts With the Material' states it (no fewer than 3 teeth in the material at all times), https://www.starrett.com/news-events/sawing-starts-with-the-material"

[numbers_verify]
refixture_budget_mm = false
thin_wall_floor_mm = false
stickout_ld_max = false
near_jaw_mm = false
max_filing_stock_mm = false
saw_min_teeth_in_work = false
