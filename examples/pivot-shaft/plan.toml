[[setups.ops]]
op = 20
do = "form_dome"
feature = "south_dome"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -1.524                # apex 0.0, base -1.524, sphere R 4.069 centred at -4.069
doc_mm = 0.1                 # author's proposed axial rough-stair increment, not a shop observation
rough_allowance_mm = 0.2     # author's proposed diametral leave before the compensated finish table
direction = "apex_to_base"   # author's choice
contour = { method = "axial_table", step_mm = 0.1 }  # generated noseR0.4-compensated finish table; rough0.1mm steps leave0.2mm diametral stock
feed_mm_rev = 0.05
rpm = 1000
note_cite = "../cutting-data.toml: HSS form_dome90 sfm/.05 mm per rev"
note = "Finish south dome with existing noseR0.4 compensated table and smooth interpolation, light overlapping hand traverse apex to base; no broad form plunge. Repeat light spring traverse preserving apexZ0 and baseZ−1.524. Inspect local optical profile; no loose abrasive around rotating shaft."

[setups.ops.checks]
