# Hand-authored PLAN rev 6 reference plan for MHA-065 (pivot shaft).
# Route kept from the rev-3 fixture: the three-jaw chuck drives, the tailstock
# dead centre supports S1, then explicit rechucks expose each dome. No lathe
# dog, drive plate or between-centres drive is claimed (the drawing process
# line says "between centres", parts/pivot-shaft.yaml:9; this route differs).
# No cross-hole, flat or indexing exists on the part ("NO FLATS.",
# pivot_shaft_spec.py:187). Every rev-3 RPM, rough allowance and handling
# length was an unsourced authored number and is now "unknown".
part = "pivot-shaft"
features = "features.toml"
quantity = 1                 # harmonic-analyzer/cad/config/parts/pivot-shaft.yaml:6

[drawing]
number = "MHA-065"           # parts/pivot-shaft.yaml:2
revision = "unknown"         # no certified STEP/drawing pair supplied

[paths]
inventory = "../inventory/pedro-shop.toml"
policy = "../shop-policy.toml"
cutting_data = "../cutting-data.toml"

[stock]
form = "round_bar"
material = "AISI 1018 cold-finished steel bar, Ø10"  # parts/pivot-shaft.yaml:4
dia_mm = 10.0                # "STOCK 10 BAR" (pivot_shaft_spec.py:185); actual bar not measured
length_mm = "unknown"        # rev-3 proposed 215 = 175 + 15 + 25 (authored, unsourced); verify
north_allowance_mm = "unknown"  # sacrificial centre-seat stub past the north apex; rev-3 proposed 15
south_grip_mm = "unknown"    # sacrificial chuck grip past the supply station; rev-3 proposed 25
supply_length_mm = 175       # "SUPPLY 175 LONG, PLAIN END UNCUT." (pivot_shaft_spec.py:182,186)
on_hand = false              # inventory stock = [] (pedro-shop.toml:7)
prerequisite = "north centre seat for the dead centre; geometry not stated (drawing: CENTRES OK)"

# The lathe has no DRO listed in the inventory (pedro-shop.toml:51-88). The
# EL400 functions below are the manual's; whether one is fitted to the
# PM-1127VF-LB, its Direction per axis and its Radial/Diametric setting are
# not known. Recipe: EL400 Operation Manual §9.2.1 p62 (trial cut outside,
# withdraw without disturbing X, measure, enter X; face or touch the end,
# withdraw without Z motion, enter Z); §6.2 p20 Direction and Radial/Diametric;
# §7.4 p31 Axis Set; §8.1 p37 Preset is distance-to-go and never used for zero.
[dro]
controller = "unknown"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = "unknown"      # Radial/Diametric per axis, manual §6.2; lathe X is usually diametric but not confirmed

[dro.direction]
x = "unknown"
z = "unknown"

# ---------------------------------------------------------------- S1
[[setups]]
id = "S1"
machine = "PM-1127VF-LB"
frame = "T1"
coolant = "unknown"
deburr_mm = 0.25             # title block: break edges R0.25 OR CHAMFER 0.25 MAX (title_block.yaml:45)
stock_in = "prepared_blank"

[setups.stock_state]
od_mm = 10.0                 # bar as bought, nominal; not measured
north_end_z = "unknown"      # T1: 7.5 + north_allowance_mm
south_end_z = "unknown"      # T1: depends on stock length and grip

[setups.stock_state.local_thickness]
# no holes on this part: nothing to pierce

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "dead_centre_tailstock_mt3"   # PM-1127VF-LB standard accessory (pedro-shop.toml:61)
grip_on = "south grip allowance, past the supply station"
grip_mm = "unknown"
fixed_jaw = "not_applicable"            # scroll chuck (pedro-shop.toml:445)
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "unknown"
clamp = "unknown"
centre_lubrication = "unknown"
stickout_mm = "unknown"                 # supported by the tailstock; distance not declared

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"            # EL400 §9.2.1 p62
tool = "turning-tools-warner-lms-4132/AR"
gauge = "micrometers/0-1in"
check_jog_mm = "unknown"

[setups.zero.z]
face = "shoulder_north"
edge_mm = 0.0
from = "+z"
method = "face_then_set"                # EL400 §9.2.1 p62: face, withdraw without Z motion
after_op = 10
tool = "turning-tools-warner-lms-4132/AR"
paper_mm = 0.0                          # tool on the cut face, no paper
check_jog_mm = "unknown"
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "shoulder"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0                    # creates the shoulder north face = T1 origin
direction = "unknown"
note = "Cut the step that makes the shoulder north face; its station on the bar depends on the unknown north allowance."

[[setups.ops]]
op = 20
do = "rough_turn"
feature = "north_journal"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = 7.5                    # out to the north apex plane: the dome is formed from this O.D.
rough_allowance_mm = "unknown"  # rev-3 proposed 0.2 on diameter (authored, unsourced)
direction = "unknown"

[[setups.ops]]
op = 30
do = "finish_turn"
feature = "north_journal"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = 7.5
direction = "unknown"

[setups.ops.checks]
dia = "micrometers/0-1in"
finish_ra = "unknown"         # no roughness comparator in the inventory

[[setups.ops]]
op = 40
do = "rough_turn"
feature = "body"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = -1.5
z_to = "unknown"              # through the supply station toward the chuck; datum of "175" not stated
rough_allowance_mm = "unknown"
direction = "unknown"

[[setups.ops]]
op = 50
do = "finish_turn"
feature = "body"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = -1.5
z_to = "unknown"
direction = "unknown"

[setups.ops.checks]
dia = "micrometers/0-1in"
finish_ra = "unknown"

[[setups.ops]]
op = 60
do = "face"
feature = "shoulder_thrust"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = -1.5                   # shoulder south face, 1.5 from the north face
direction = "unknown"

[setups.ops.checks]
finish_ra = "unknown"

[[setups.ops]]
op = 70
do = "finish_turn"
feature = "shoulder"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = -1.5
z_to = 0.0
direction = "unknown"
note = "Leave the Ø10 bar as supplied if it measures inside the band; otherwise skim it."

[setups.ops.checks]
dia = "micrometers/0-1in"
length = "calipers"

[[setups.ops]]
op = 80
do = "form_relief"
feature = "north_relief"
tool = "turning-tools-warner-lms-4132/E"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = 2.0
direction = "unknown"
note = "Profile the groove flush to the shoulder north face; insert nose radius and reach are not in the inventory."

[setups.ops.checks]
dia = "calipers"
width = "calipers"

[[setups.ops]]
op = 90
do = "form_relief"
feature = "south_relief"
tool = "turning-tools-warner-lms-4132/E"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = -1.5
z_to = -3.5
direction = "unknown"
note = "Profile the groove flush to the shoulder south face."

[setups.ops.checks]
dia = "calipers"
width = "calipers"

# ---------------------------------------------------------------- S2
[[setups]]
id = "S2"
machine = "PM-1127VF-LB"
frame = "T2"
coolant = "unknown"
deburr_mm = 0.25
stock_in = "S1"

[setups.stock_state]
od_mm = 6.35                  # finished journal/body O.D., nominal
north_end_z = "unknown"       # T2: 0.0 + north_allowance_mm
south_end_z = "unknown"

[setups.stock_state.local_thickness]
# no holes on this part

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "none"              # tailstock withdrawn for dome access
grip_on = "finished body near the shoulder, south of the south relief"
grip_mm = "unknown"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "unknown"
clamp = "unknown"
jaw_protection = "unknown"    # jaws close on the Ra 1.6 body
stickout_mm = "unknown"

[setups.zero.transfer]
from = "S1"
indicate = "body"
gauge = "dial-indicator"
runout_limit_mm = "unknown"   # no coaxiality tolerance on the drawing

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # on the north allowance stub, EL400 §9.2.1 p62
tool = "turning-tools-warner-lms-4132/AR"
gauge = "micrometers/0-1in"
check_jog_mm = "unknown"

[setups.zero.z]
face = "shoulder_north"
edge_mm = -7.5                # shoulder north face in T2: -(6.0 + 1.5)
from = "+z"
method = "touch"              # EL400 §9.2.1 p62: touch, withdraw without Z motion
tool = "turning-tools-warner-lms-4132/AR"
paper_mm = 0.0
check_jog_mm = "unknown"
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "north_dome"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0                    # temporary face at the north apex plane
direction = "unknown"
note = "Face off the north allowance and centre seat down to the apex plane."

[[setups.ops]]
op = 20
do = "form_dome"
feature = "north_dome"
tool = "turning-tools-warner-lms-4132/E"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -1.5                   # apex 0.0, base -1.5, sphere R 4.11 centred at -4.11
direction = "unknown"
contour = "unknown"           # hand-formed; no ball turner or form tool in the inventory
note = "Forms the dome and with it the north end of the journal (JournalLength)."

[setups.ops.checks]
height = "unknown"            # dome base is an edge, not a face: method not resolved

[[setups.ops]]
op = 30
do = "inspect"               # manual: no tool, holder or cut
feature = "north_journal"
note = "JournalLength runs from the dome base edge (formed in op 20) to the shoulder north face."

[setups.ops.checks]
length = "unknown"            # edge-to-face method not resolved

# ---------------------------------------------------------------- S3
