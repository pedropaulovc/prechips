method = "measure_then_set"
measure = "north apex to south stub end, measured before holding"
offset_mm = -162.56
measure_before_hold = true
gauge = "height-gauge"       # 12 in range; stand square stub on plate, measure north apex before holding
tool = "hss-toolbit-3-8-rh"
paper_mm = 0.0               # the stub end is waste
check_jog_mm = 10.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "parting-blade-lms-1728"
x_method = "spindle stopped: touch the blade tip on the stub's trial-cut land through cigarette paper (0.05); Axis Set the miked diameter"  # author's choice
