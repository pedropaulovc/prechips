to_dia = 0.0
direction = "radially_inward"  # author's choice
note = "Face deterministically to Z0, the nominal 162.560 mm overall tip-to-tip target, before starting the dome at Z0. Inspect the drawing acceptance band separately with the 12 in height gauge on the surface plate using the guided upright method below; the 6 in caliper cannot span this shaft."
