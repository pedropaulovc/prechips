# ---------------------------------------------------------------- S4
# Both flats in one setup, so they lie in line, one side ("BOTH FLATS IN
# LINE, ONE SIDE."). Each is stationed 5.588 (.22) from its own end's tip: the north
# one from X0 (the north apex), the south one from the measured overall
# length, so it sits 5.588 from the south apex whatever the length within its
# band.
[[setups]]
id = "S4"
machine = "PM-30MV"
frame = "M3"                 # plan.frames.M3 (author's choice; exported `setup` stays unknown)
coolant = "CRC cutting oil brushed on"  # author's choice
deburr_mm = 0.254
stock_in = "S3"
note = "S4 EL400 switches to ABS metric linear XYZ;10mm physical jog reads+10 each axis. Stationary flat blade spans dome apex forX; opposed stationary indicator contacts establish cylindrical-side midpointY0; paper tool touch establishesZ."

[setups.stock_state]
od_mm = 6.35
top_z = 3.175                # static CAD-MAX screen at D6.350; actual loaded crown is D - 3.175
bottom_z = -3.175            # fixed lower-saddle bottom datum for the whole drawing diameter band
top_feature = "pivot_bearing" # untouched middle crown at X70/Y0 remains the measured upper reference through both end-flat cuts
entry_z = { north_flat = 3.175, south_flat = 3.175 } # conservative independent start planes, up to 0.02032 above the actual crown
note = "M3 is the nominal CAD-MAX screen, not a claim that the Ø6.340 aim equals the source Ø6.350 geometry. The fixed lower-saddle bottom is Z-3.175. For measured diameter D in 6.32968..6.350, actual axis Z=(D-6.350)/2 and crown Z=D-3.175; caps close down by 6.350-D, at most 0.02032. At D6.340, axis=-0.005 and cap closure=0.010. Flat AF5.334 from the fixed bottom still gives Z2.159. North apex X0, south apex measured overall, nominal X162.56."

[setups.stock_state.local_thickness]
# no holes on this part

[setups.hold]
fixture = "shaft-flat-split-cradle"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
stop_face = "north_dome"
support = "none"             # no separate centre/rest; the split cradle below is the primary fixture
grip_on = "shaft in drawing-MAX Ø6.350 split bores at X25..50 and X112..137; caps adjusted to measured D, not a free-air Ø6.340 grip"
grip_mm = 50.0
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "Seat the 10x10x2mm shaft-apex-contact-blade normal to X, inner flat against the north apex at X0 and outer flat at X-2. With the spindle-mounted edge finder, pick up only the outer FLAT from -X and Axis Set X=-2 minus its measured radius (nominal -4.540); retract/remove blade and stand before machining. Never rotate the finder against the curved dome."
clamp = "Bolt common base to mill table. Seat shaft at the fixed lower-saddle bottom Z-3.175; adjust upper caps down by 6.350-D for measured diameter D, preserving at least 0.22968 mm split gap. Snug each pair of M6 studs at Y±9 alternately to the demonstration 4 N m; caps contact the actual shaft top and apply friction antiroll. Witness shaft/caps and verify no movement under spindle-stopped hand load before cutting."
note = "Designed adjustable split cradle: common bore at drawing maximum Ø6.350, split gap0.25. Cap closure0..0.02032 accommodates the diameter band with fixed lower tangent Z-3.175; native rigid solids depict only D6.350/cap closure0, not every adjustment or actual preload. Two 25mm blocks at X25..50/112..137 on their connected base, raised by a positively anchored 20mm spacer: shaft axis is45mm above table in the nominal screen. Highest cap nuts/studs Z15; all crossing moves retract the tool tip to Z20 for5mm clearance. North/south cutter-to-block axial gaps16.364/16.924mm, base gaps11.364/11.924mm. The shortened18mm cutter installation plus6mm holder gauge puts the spindle nose71.159mm above table at the nominal flat floor,10.199mm above the stated60.96mm machine minimum. Actual diameter/preload/contact adjustment is not replaced by an air-gap grip."
# Cradle load path: shaft -> lower half bores/cap friction -> both blocks -> common bolted base -> mill table; no separate centre/rest.
align = { indicator = "dti", limit_mm = 0.01, over_mm = 112.0, face = "pivot_bearing", cite = "by='example value (realistic, not a shop measurement)', date='2026-10-11', instrument='example fixture (no physical measurement)'; sweep X25..137 before cutting" }

[setups.zero.transfer]
from = "S3"
indicate = "pivot_bearing"
gauge = "dial-indicator"
runout_limit_mm = 0.01

[setups.zero]
procedure = "X: spindle stopped while seating the flat blade against the north apex; then edge-find only its stationary outer flat from -X, set -2 minus measured finder radius, retract and remove blade/stand. Y: use the same unchanged finder for both contacts at X70, without resetting; move to their midpoint and Axis Set Y0. The sensing cylinder must span the shaft's widest section. Retract the tool tip to Z20 before crossing any caps or studs (maximum Z15). Z: measure D at the untouched middle crown X70/Y0, touch paper and Axis Set D-3.175+0.05 using the fixed bottom datum; at D6.340 this reads Z3.215, while the nominal CAD-MAX screen reads3.225. Remove paper and retract Z20; keep installed tool/zero unchanged between flats. This middle crown is not cut by either end-flat operation and remains the top reference. All values are disclosed demonstration settings, not shop observations."

[setups.zero.x]
feature = "north_dome"
edge_mm = -2.0               # outer flat of the 2mm blade; its inner flat contacts the dome apex at X0
from = "-x"
method = "edge_find"
tool = "edge-finder"
gauge = "shaft-apex-contact-blade"
check_jog_mm = 10.0

[setups.zero.y]
feature = "pivot_bearing"
edge_mm = 0.0
from = "unknown"             # two opposed contacts, not one approach direction
method = "opposed_edge_midpoint"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "pivot_bearing"
edge_mm = 3.175              # bar top = axis + 6.35/2
from = "+z"
method = "measure_then_set"
gauge = "micrometers/0-1in"
measure = "measured shaft diameter D with fixed cradle bottom Z-3.175"
offset_mm = -3.175
tool = "endmills-lms-6784/3-16in-2fl"
paper_mm = 0.05              # author's choice: cigarette paper
check_jog_mm = 10.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "endmills-lms-6784/3-16in-2fl"
z_face = "pivot_bearing"
edge_mm = 3.175
paper_mm = 0.05
method = "measure_then_set"
z_gauge = "micrometers/0-1in"
z_measure = "measured shaft diameter D with fixed cradle bottom Z-3.175"
z_offset_mm = -3.175
before_ops = [10, 20]

[[setups.ops]]
op = 10
do = "face"
feature = "north_flat"
tool = "endmills-lms-6784/3-16in-2fl"
holder = "shaft-flat-r8-collet"
faces = ["#22/ADVANCED_FACE[4]/HAF_NORTH_FLAT__P01", "#17/ADVANCED_FACE[3]/NONE", "#285/ADVANCED_FACE[11]/NONE"]
to_z = 2.159                 # flat plane = AF 5.334 - 6.35/2 above the axis
z_from = 3.175               # untouched north crown; independent of the later south flat
approach_mm = 16.825         # nominal crown3.175 +16.825 = tool-tip Z20, 5mm above the highest nuts/studs
contour = { method = "linear_table", step_mm = 0.665, open_side = "-x", sweep_frame = "model", sweep_bounds = { x = [-3.61875, 3.61875], y = [2.159, 3.175], z = [-4.726, -3.401] } }
stock_removal_bounds = { x = [2.540, 8.636], y = [-3.175, 3.175], z = [2.159, 3.175] }
direction = "conventional"
note = "Demonstration Ø4.7625 cutter in the explicit18mm projection installation. Traverse Y+6 to-6 at centre X4.925..6.250, retract tip Z20, then return through air before stepping X. The0.005mm grid leaves small axial wall allowance rather than overcutting exact source faces; inspect flat length/station independently. Start Z3.175 is conservative above the actual crown. Final displayed Z2.160 lies within the AF band, not exact sub-grid nominal2.159 generation."
# Inward grid limits leave 0.00375/0.00475 mm nominal axial wall allowance; they do not prove generation of the exact immutable CAD endwall planes.
doc_mm = 0.25                # conservative engagement with the explicit18mm projection installation
rpm = 1200
feed_mm_min = 60.0
note_cite = "../cutting-data.toml: HSS milling90 sfm/.025mm per tooth;2fl x1200 x.025=60mm/min"

[setups.ops.checks]
height = "micrometers/0-1in"
length = "optical-profile-projector"
station = "optical-profile-projector"

[[setups.ops]]
op = 20
do = "face"
feature = "south_flat"
tool = "endmills-lms-6784/3-16in-2fl"
holder = "shaft-flat-r8-collet"
faces = ["#45/ADVANCED_FACE[5]/HAF_SOUTH_FLAT__P01", "#114/ADVANCED_FACE[7]/NONE", "#4/ADVANCED_FACE[1]/NONE"]
to_z = 2.159
z_from = 3.175               # op10 cuts only the north flat; the south crown remains at its entry height
approach_mm = 16.825         # tool-tip Z20 for all returns and the between-flat transfer
contour = { method = "linear_table", step_mm = 0.665, open_side = "-x", sweep_frame = "model", sweep_bounds = { x = [-3.61875, 3.61875], y = [2.159, 3.175], z = [-156.111, -154.786] } }
stock_removal_bounds = { x = [153.924, 160.020], y = [-3.175, 3.175], z = [2.159, 3.175] }
direction = "conventional"
note = "Same Ø4.7625 cutter in the18mm installation and unchanged measured-D zero. Traverse Y+6 to-6 at centre X156.310..157.635; retract tip Z20 before every return or between-flat move, then step X through air. Translate south stations by measured overall minus162.560 to reference its own tip. Fixed-bottom AF datum remains unchanged. Inward grid rounding leaves small wall allowance; independently inspect length/station and AF. Displayed Z2.160 is within the AF band, not exact nominal2.159 generation."
# Inward grid limits leave 0.00475/0.00375 mm nominal axial wall allowance; exact sub-grid CAD endwall generation remains unsupported, despite dimensional-band fit.
doc_mm = 0.25                # same reduced engagement as the north flat
rpm = 1200
feed_mm_min = 60.0
note_cite = "../cutting-data.toml: same HSS milling recipe as op10"

[setups.ops.checks]
height = "micrometers/0-1in"
length = "optical-profile-projector"
station = "optical-profile-projector"


[[setups.ops]]
op = 30
do = "deburr"
feature = "north_flat"
note = "Spindle stopped: remove burrs at flats and dome base rims with a fine file and slip stone, protecting the running O.D. and dome form. Break only sharp edges to R.010 or .010 in chamfer maximum (0.254 mm); inspect for burrs without changing the drawing sizes."

[[setups.ops]]
op = 31
do = "deburr"
feature = "south_flat"
note = "Spindle stopped: remove south-flat burrs with fine file and slip stone, preserving flat size and running O.D.; R.010 or .010 in chamfer maximum (0.254 mm)."

[[setups.ops]]
op = 32
do = "deburr"
feature = "north_dome"
note = "Spindle stopped: remove burrs at the north dome base rim without changing dome form or running O.D.; R.010 or .010 in chamfer maximum (0.254 mm)."

[[setups.ops]]
op = 33
do = "deburr"
feature = "south_dome"
note = "Spindle stopped: remove burrs at the south dome base rim without changing dome form or running O.D.; R.010 or .010 in chamfer maximum (0.254 mm)."

[[setups.ops]]
op = 40
do = "inspect"
feature = ["north_flat", "south_flat", "pivot_bearing", "north_dome", "south_dome"]
note = "Final demonstration inspection after both flats/deburring: both flats in line on the same side, each from its own tip. Inspect O.D. at both ends and middle clear of flats, both dome heights and overall length; compare turned surface with Ra1.6 turned reference on roughness-comparator under matching light/lay. Comparison is a demonstration method, not claimed shop acceptance or traceable physical release. No assembly cut-to-fit or shoulder applies."
[setups.ops.checks]
north_flat = { height = "micrometers/0-1in", length = "optical-profile-projector", station = "optical-profile-projector" }
south_flat = { height = "micrometers/0-1in", length = "optical-profile-projector", station = "optical-profile-projector" }
pivot_bearing = { dia = "micrometers/0-1in", finish_ra = "roughness-comparator" }
north_dome = { height = "optical-profile-projector" }
south_dome = { height = "optical-profile-projector", length = "height-gauge" }
[setups.ops.inspection_methods]
north_flat = { height = "Micrometer flat anvil centred on flat, opposite anvil on cylindrical underside, spindle normal to shaft; nominal5.334.", length = "Optical-profile-projector20x local view: align shaft axis with stageX, difference of planar endwall positions6.096.", station = "Same local optical view: mean of flat endwall positions minus own north apex extreme5.588." }
south_flat = { height = "Micrometer across flat centre to cylindrical underside5.334; clear endwalls.", length = "Optical-profile-projector20x local south-end silhouette, endwall difference6.096.", station = "Own south apex extreme minus mean south-flat endwall positions5.588; measure independently, not from far tip." }
north_dome = { height = "Optical-profile-projector20x own apex extreme to cylinder/dome tangent rim1.524;50x R4.069 overlay,90deg rotation repeat." }
south_dome = { height = "Same independent local optical silhouette method as north.", length = "Surface plate and shaft-upright-inspection-guide: sleeveZ15..40 lightly guides lower body, no axial clamp. Lower dome apex seats on exposed plate datum, not guide base.12in height-gauge contact atX0/Y0 sweeps upper apex for maximum162.560; reverse and repeat. Pre-S3 M181.060 uses square stub on plate and guided body, sweep north apex. Not6in calipers. by='example value (realistic, not a shop measurement)', date='2026-10-11', instrument='example fixture (no physical measurement)'." }

[[setups.ops]]
op = 50
do = "coating"
feature = "pivot_bearing"
process = "light-machine-oil"
note = "Drawing finish: machined, oiled. Off the machine, remove chips and cutting oil, inspect, then wipe a thin light-machine-oil film over the whole shaft including flats and domes. Oil is not a substitute for the Ra 1.6 running-surface inspection."
