# Hand-written M1 manifest for MHA-065 pivot shaft, mirroring what the
# harmonic-analyzer generator (PLAN rev 6 §3.2, M3) will emit. Not a certified
# export and not a measured part. Consumer citations are to
# C:/src/harmonic-analyzer at 325c56a0 (read 2026-10-02), written as
# "harmonic-analyzer/<path>:<line>".
#
# Drawing dimension cross-check (draw_pivot_shaft.py:105-123,161-171,
# pivot_shaft_spec.py:132-142): 8 printed dimensions — ShaftDia, ShoulderDia,
# ShaftLength (REF), ShoulderLength, JournalLength, DomeHeight ("BOTH ENDS"),
# ReliefWidth and ReliefDia ("BOTH SHOULDER FACES"); 3 Ra symbols
# (draw_pivot_shaft.py:375-404); 2 property notes (manufacturing notes,
# isometric scale note, draw_pivot_shaft.py:409-410). Every one is mapped below:
#   ShaftDia       -> body.dia, north_journal.dia (one O.D. by sketch constraint)
#   ShoulderDia    -> shoulder.dia
#   ShaftLength    -> plain_end.length_reference (REF; the callout governs)
#   ShoulderLength -> shoulder.length
#   JournalLength  -> north_journal.length
#   DomeHeight     -> north_dome.height, south_dome.height (BOTH ENDS)
#   ReliefWidth    -> north_relief.width, south_relief.width (BOTH SHOULDER FACES)
#   ReliefDia      -> north_relief.dia, south_relief.dia (BOTH SHOULDER FACES)
#   Ra 1.6 x3      -> body, north_journal, shoulder_thrust finish_ra
#   notes          -> stock/centres/supply/no-flats facts below and in plan.toml
part = "pivot-shaft"
units = "mm"
# No sheet-wide class: every printed dimension carries its own places
# ("Decimal places are the tolerance", pivot_shaft_spec.py:144-161), set per
# feature below.
precision = "unknown"
step_sha256 = "unknown"     # no STEP was supplied with this bundle
construction = "one_piece"  # no drawing note permits built-up construction
cite = [
  "harmonic-analyzer/cad/config/parts/pivot-shaft.yaml:1-9",
  "harmonic-analyzer/cad/scripts/pivot_shaft_spec.py:1-193",
  "harmonic-analyzer/cad/scripts/build_pivot_shaft.py:13-18,99-208,313-457",
  "harmonic-analyzer/cad/scripts/draw_pivot_shaft.py:105-171,342-410",
]

[drawing]
number = "MHA-065"          # harmonic-analyzer/cad/config/parts/pivot-shaft.yaml:2
revision = "unknown"        # no certified STEP/drawing pair supplied

[material]
spec = "AISI 1018 cold-finished steel bar, Ø10"  # parts/pivot-shaft.yaml:4
name = "Plain Carbon Steel"                      # parts/pivot-shaft.yaml:3
finish = "turned, oiled"                         # parts/pivot-shaft.yaml:5
cite = [
  "harmonic-analyzer/cad/config/parts/pivot-shaft.yaml:3-5",
  "harmonic-analyzer/cad/scripts/pivot_shaft_spec.py:185",
]

# Exact numeric title-block values (value_in x 25.4); the drawing adopts them
# by decimal places (pivot_shaft_spec.py:144-149). The rounded display strings
# (±0.8 / ±0.51 / ±0.13, title_block.yaml:25-27) and the spec's sizing constant
# LINEAR_1PL = 0.8 (pivot_shaft_spec.py:70) are presentation/design context,
# not the adopted band. No angular dimension is printed, so no angular class.
[general_tolerances]
linear_1pl = 0.762   # title_block.yaml:25 value_in 0.03
linear_2pl = 0.508   # title_block.yaml:26 value_in 0.02
linear_3pl = 0.127   # title_block.yaml:27 value_in 0.005
cite = ["harmonic-analyzer/cad/config/title_block.yaml:25-27"]

# Drawing notes (pivot_shaft_spec.py:182-189), carried verbatim.
[notes]
manufacturing = ["STOCK 10 BAR; CENTRES OK.", "SUPPLY 175 LONG, PLAIN END UNCUT.", "NO FLATS."]
process = "turned (steel) between centres from Ø10 bar; plain end cut and domed to fit"  # parts/pivot-shaft.yaml:9
edge_break = "R0.25 OR CHAMFER 0.25 MAX"  # title_block.yaml:45
cite = [
  "harmonic-analyzer/cad/scripts/pivot_shaft_spec.py:182-189",
  "harmonic-analyzer/cad/config/parts/pivot-shaft.yaml:9",
  "harmonic-analyzer/cad/config/title_block.yaml:45",
]

# Part frame: axis along Z, origin on the axis at the north (shouldered) end of
# the cylinder, body toward -Z (pivot_shaft_spec.py:18-22,
# build_pivot_shaft.py:13-18; sketch +u -> model -Z). A shaft carries no
# drawing datums (pivot_shaft_spec.py:104), so these are construction frames.
[frames.model]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "SolidWorks part origin: on the axis at the north end of the cylinder (dome base); body toward -Z"
cite = [
  "harmonic-analyzer/cad/scripts/pivot_shaft_spec.py:18-22",
  "harmonic-analyzer/cad/scripts/build_pivot_shaft.py:13-18",
]

# S1: origin on the shoulder north face, z = -JournalLength = -6.0.
[frames.T1]
origin = [0.0, 0.0, -6.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"   # the face is cut in S1 op 10 and the DRO set on it
note = "shoulder north face (seats on the north ear); +Z toward the north end"
cite = [
  "harmonic-analyzer/cad/scripts/pivot_shaft_spec.py:44",
  "harmonic-analyzer/cad/scripts/pivot_bracket_spec.py:24",
  "harmonic-analyzer/cad/scripts/build_pivot_shaft.py:104-117",
]

# S2: origin at the north apex plane, z = +DomeHeight = +1.5.
[frames.T2]
origin = [0.0, 0.0, 1.5]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"   # found by touching the shoulder north face (T2 z = -7.5)
note = "north apex plane; +Z toward the north end"
cite = [
  "harmonic-analyzer/cad/scripts/pivot_shaft_spec.py:44-45",
  "harmonic-analyzer/cad/scripts/build_pivot_shaft.py:313-326,431",
]

# S3: origin at the scribe the fitter makes at the south ear's outer face,
# +Z toward the plain end. Nominal model position = -ShaftLength REF
# (-156.67); the real position is the installed-ear span, which no input
# supplies.
[frames.T3]
origin = [0.0, 0.0, -156.67]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "unknown"   # awaiting the measured span over both installed MHA-123 ears
note = "scribe at the south ear outer face, shoulder pushed north; +Z toward the plain end"
cite = [
  "harmonic-analyzer/cad/scripts/rocker_bank_layout.py:103-115",
  "harmonic-analyzer/cad/scripts/draw_channel_assembly.py:77-82,101-110",
  "harmonic-analyzer/cad/scripts/build_pivot_shaft.py:85,433",
]

