# Authored shop data: tooling, cutting settings, machines, workholding, gauges
# and limits. Checks use these values as written. Part-specific tool keys do
# not assert tool equivalence. Material identities preserve each source's
# stated stock condition; they are not inferred from the printed material text
# or treated as interchangeable.

