cite = "example (plausible, not measured); UFL MAE Design Lab 'Speeds and Feeds' (web.mae.ufl.edu/designlab/Advanced Manufacturing/Speeds and Feeds) Example 1A TIP2: deeper than 3xD without through-spindle coolant, reduce spindle speed an additional 50%; norsemandrill.com/feeds-speeds-drill.php: reduce feed and speed up to 45-50% (printed '45-50‰') deeper than 4 drill diameters. 80 sfm x 0.5 = 40 sfm, inside Norseman's 80 SFM reduced 45-50% (40-44) and below Machinery's Handbook Pocket Companion (ISBN 978-0-8311-3095-4) p.128 Table 1 AISI 1016-1021 drilling 90 fpm halved; the kept .0039 in/rev stays inside Norseman's 1/4-1/2 in .004-.010 in/rev reduced up to 50%"
