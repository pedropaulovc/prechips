cite = "example (plausible, not measured); cobalt spot drill: speed on the tool body inside Machinery's Handbook 27th ed. (Industrial Press, 2004) Table 17 p.1061 traditional HSS drilling speeds for plain carbon steels 1006-1026, 60-100 fpm (100 at 100-125 HB, 90 at 125-175, 70 at 175-225, 60 at 225-275); 2 flutes x 0.02 mm = .0016 in/rev, inside the same handbook's p.1060 drill feeds for the traditional speeds 0.001-0.003 in/rev for drills smaller than 1/8 in, because a shallow spot cuts only its point (a 2.08 mm spot), and beside p.1132's centre-drill feed .0015 in/rev for holes under 1/8 in"
# --- end pivot-bracket additions ---

# Deep holes: sfm x sfm_factor once the hole's depth exceeds depth_over_dia drill
# diameters (rules-operations.md speeds_feeds); feed per tooth is unchanged.
[[deep_hole]]
operation = "drill"
depth_over_dia = 3.0
sfm_factor = 0.8
cite = "example (plausible, not measured); threshold from Machinery's Handbook 27th ed. (Industrial Press, 2004) p.1065: when drilling holes deeper than three times the drill diameter, withdraw the drill (peck feed) at intervals to clear chips and let coolant reach the tip. The handbook gives no deep-hole speed factor, so 0.8 is chosen to keep 80 fpm x 0.8 = 64 fpm inside Table 17 p.1061 traditional HSS drilling speeds 60-100 fpm for plain carbon steels 1006-1026 (60 at 225-275 HB); the UFL MAE Design Lab 'Speeds and Feeds' Example 1A tip (-50% past 3xD) and norsemandrill.com (-45-50% past 4xD) are secondary and would fall below that range. The feed stays at the p.1060 row value"
