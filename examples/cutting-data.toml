# Versioned reference table. ILLUSTRATIVE EXAMPLE DATA (AGENTS.md "Examples
# policy"): every row is an example starting value, not a measured shop number.
# Each value sits inside the range its cite names in Machinery's Handbook 27th
# edition (Industrial Press, 2004; printed page numbers). The 1018 hardness is not
# supplied, so speed ranges span the handbook's hardness bands for the 1006-1026
# plain carbon steel row. Diameter ranges are mm, inclusive at both ends, one row
# per diameter within a (material, tool, operation); drill rows break at 1/8 in
# (3.175 mm) and 1/2 in (12.7 mm), the handbook's drill-feed size steps.
revision = 5

