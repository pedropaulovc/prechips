feed = "{{process.outline_plunge_feed_per_min_mm:in.1f}} in/min plunge"
milling_cuts = [
  { name = "outline plunge", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", flutes = 3, rpm = 2800, feed_mm_min = "{{process.outline_plunge_feed_per_min_mm}}", traverse_mm = "{{cad.outline_x_mm}}" },
