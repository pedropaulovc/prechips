[[setups.operations]]
instruction = "Per blank. Degrease the plate top and the blank's face 1 with isopropyl alcohol and water. Lay the tape on the plate over the blank's whole footprint, cut away at the counterbore; drop the plug into the counterbore. Lower the blank, face 1 down, hub hole over the plug's pilot, long edge against the fence, and press it down over its whole face (the tape wants about 15 psi). Washer and screw on at the hub, snug. Back the edge clamps off clear of the blank. Wait 20 minutes: the tape is taken at half strength, which it reaches by then."
feed = "hand"

