# Demo: a flat arc strap cut from a 1/8 x 1-1/2 in cold-finished blank on a
# fixture plate. The plate, made beforehand, is gripped in the vise (vise_hold
# grips = "plate") and carries a fence, an end stop and four edge clamps. The
# faces and the hub hole are cut under the clamps: plate holds with clamp
# stations, where a downward push bends nothing. The outline is cut with the
# blank bonded to the plate on double-sided tape and screwed down through the
# reamed hub hole: a bonded plate hold, where each cut's cross-spindle force
# and lift are compared with the tape's derated strengths under every piece
# left on the plate. The tape strengths are a .006 in acrylic foam tape's
# data-sheet values at 72 h dwell; the derating is 0.5 for a 20 minute dwell
# (same sheet) times an authored 0.5. The slot is roughed and its wall
# finished down to a skin; the skin is cut last, into the tape and short of
# the plate. The fence is notched under the strap's tips, where the strip of
# blank against it is milled away first. Lift at the blank's edge: 0.108 MPa
# of 0.1725 on the rough slot, 0.139 MPa under the freed strap on the through
# cut.
title = "Arc strap"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished flat, 1/8 × 1-1/2 in (demo stock)"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in flat; {{process.quantity:d}} × {{process.blank_length_in:g}} in blanks."
note = "Inches unless mm. Finished {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}} thick, ({{cad.overall_length_in:.2f}}) long. One blank at a time through Setups 2–5; the sub-plate stays in the vise. All spindle work is on the PM-30MV low belt (100–2800 rpm): no belt change."
shop = "shop.toml"
material_key = "arc-strap-1018-cold-finished"
milling_material = "steel_1018"

