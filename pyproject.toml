[project]
name = "prechips"
version = "0.9.0"
description = "Printable manual-manufacturing travelers from TOML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prechips = "prechips.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
