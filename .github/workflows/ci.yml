name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its older runs: cancel them instead of
# spending runner time on a head nobody can merge. Each push to main gets its own
# group (run_id), so merges never queue behind or cancel one another.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-shard:
    name: test shard ${{ matrix.group }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shards balanced by the committed .test_durations (CI JUnit times);
        # rebuild it with scripts/ci_shards.py when the balance drifts.
        group: [1, 2, 3, 4, 5, 6]
    env:
      PRECHIPS_REQUIRE_KERNEL: "1"
      PRECHIPS_REQUIRE_PRINT_BROWSER: "1"
      FREECAD_VERSION: "1.1.0"
      FREECAD_SHA256: ef85f171f2d09eec93f358bc49c1730d33f72bfbd353e6465609b30e45acf2f0
      PRECHIPS_KERNEL_CACHE_EPOCH: "1"
      PYTEST_WORKERS: "2"
      PRECHIPS_KERNEL_WORKERS: "1"
      SHARD_COUNT: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        id: freecad-cache
        with:
          path: ~/.cache/prechips-freecad
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_SHA256 }}
      - name: Install pinned FreeCAD kernel
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/prechips-freecad"
          cd "$HOME/.cache/prechips-freecad"
          asset="FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
          curl --fail --location --retry 3 --output "$asset" \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${asset}"
          echo "${FREECAD_SHA256}  ${asset}" | sha256sum --check --strict
          chmod +x "$asset"
          "./$asset" --appimage-extract > /dev/null
          rm "$asset"
          # AppRun sets the bundled Python environment only in the kernel process,
          # not in uv/pytest, which use the project's own Python environment.
          cat > freecadcmd <<'EOF'
          #!/bin/bash
          set -euo pipefail
          root="$(dirname "$(readlink -f "$0")")/squashfs-root"
          exec "$root/AppRun" freecadcmd "$@"
          EOF
          chmod +x freecadcmd
      - name: Select FreeCAD kernel
        shell: bash
        run: |
          echo "FREECAD_CMD=$HOME/.cache/prechips-freecad/freecadcmd" >> "$GITHUB_ENV"
          echo "PRECHIPS_KERNEL_CACHE=$RUNNER_TEMP/prechips-kernel-cache" >> "$GITHUB_ENV"
          "$HOME/.cache/prechips-freecad/freecadcmd" --version
      - name: Digest engine sources
        shell: bash
        run: |
          set -euo pipefail
          digest="$(uv run python -c 'from prechips.kernel import _engine_digest; print(_engine_digest())')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "PRECHIPS_ENGINE_DIGEST=$digest" >> "$GITHUB_ENV"
      # The shard index precedes the run id so this shard's own last entry wins;
      # the shared prefix is the fallback (any shard's or a pre-shard entry).
      - name: Restore successful geometry cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PRECHIPS_KERNEL_CACHE }}
          key: kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_SHA256 }}-epoch${{ env.PRECHIPS_KERNEL_CACHE_EPOCH }}-${{ env.PRECHIPS_ENGINE_DIGEST }}-shard${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_SHA256 }}-epoch${{ env.PRECHIPS_KERNEL_CACHE_EPOCH }}-${{ env.PRECHIPS_ENGINE_DIGEST }}-shard${{ matrix.group }}-
            kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_SHA256 }}-epoch${{ env.PRECHIPS_KERNEL_CACHE_EPOCH }}-${{ env.PRECHIPS_ENGINE_DIGEST }}-
      - name: Run test shard with bounded workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          uv run pytest -n "$PYTEST_WORKERS" --dist loadscope --durations=0 \
            --splits "$SHARD_COUNT" --group "${{ matrix.group }}" \
            --splitting-algorithm duration_based_chunks \
            --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
      - name: Save successful geometry cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRECHIPS_KERNEL_CACHE }}
          key: kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_SHA256 }}-epoch${{ env.PRECHIPS_KERNEL_CACHE_EPOCH }}-${{ env.PRECHIPS_ENGINE_DIGEST }}-shard${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload test durations and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ runner.os }}-${{ runner.arch }}-shard${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn

  # Branch protection requires a check named "test": it passes only when every
  # shard passed and the shards together ran the full collection exactly once.
  test:
    needs: test-shard
    # Run when a shard failed (to report it), but not when the whole run was
    # cancelled by a newer push: a cancelled run must not post a red `test`.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        shell: bash
        run: |
          echo "test-shard result: ${{ needs.test-shard.result }}"
          test "${{ needs.test-shard.result }}" = success
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
      - uses: astral-sh/setup-uv@v5
        if: ${{ !cancelled() }}
        with:
          enable-cache: true
      - run: uv sync --locked
        if: ${{ !cancelled() }}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          pattern: pytest-${{ runner.os }}-${{ runner.arch }}-shard*-${{ github.run_id }}-${{ github.run_attempt }}
          path: shard-results
      - name: Assert shards ran the full collection once
        if: ${{ !cancelled() }}
        shell: bash
        run: uv run scripts/ci_shards.py check shard-results/*/pytest.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Exercise installed wheel and sdist outside checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          for artifact in dist/*.whl dist/*.tar.gz; do
            PRECHIPS_INSTALLED_ARTIFACT="$(realpath "$artifact")" \
              uv run pytest tests/test_cli.py::test_installed_artifact_console_script_matches_module \
              --durations=0 --junitxml="test-results/$(basename "$artifact").xml" \
              2>&1 | tee "test-results/$(basename "$artifact").log"
          done
      - name: Upload installed artifact smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-artifact-smoke
          path: test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
