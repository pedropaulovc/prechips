    sizes_in: {2_and_4_flute: ["3/16", "1/4", "5/16", "3/8", "7/16", "1/2", "9/16", "5/8", "11/16", "3/4"]}
    shank_in: {"3/8": ["3/16", "1/4", "5/16", "3/8", "7/16"], "1/2": ["1/2", "9/16"], "5/8": ["5/8", "11/16"], "3/4": ["3/4"]}
