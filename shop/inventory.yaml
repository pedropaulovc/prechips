# Pedro's shop — rough inventory, to be refined.
# `verify: true` marks a value taken from a vendor page, a forum, a photo or
# memory rather than measured/confirmed on the machine. Rules that depend on a
# `verify: true` value report at `warn`, never `block`, until it is cleared.
# Photo citations refer to C:/src/dt-logs/shop-photos/INVENTORY-DRAFT.md.

machines:
  PM-30MV:
    kind: mill
    make: Precision Matthews
    source: https://www.precisionmatthews.com/products/pm-30mv   # read 2026-10-02
    control: cncjs over grbl-class controller; operated manually via XHC WHB04B-6 pendant + EL400 DRO emulator
    operation_mode: manual_with_digital_positioning   # positions exact, feeds by hand
    spindle: {taper: R8, drawbar: 7/16-20, rpm_min: 50, rpm_max: 3000, hp: 2, drive: belt_bldc, two_ranges: true}
    travel_in: {x: 23, y: 8.75, z: 14, quill: 3}
    spindle_to_table_max_in: 17
    table_in: {length: 33, width: 8.25, t_slot: "9/16 (14 mm)"}
    headstock_tilt_deg: 90
    leadscrew: {tpi: 10, dial_in: 0.001}   # irrelevant under cncjs; kept for hand-crank fallback
    capacity_in: {drill: 1.25, end_mill: 0.75, face_mill: 3.5}   # vendor ratings
    note: "CNC conversion replaces leadscrews/dials; travels may differ slightly — measure soft limits in grbl ($130-$132)."
    verify: true   # until soft limits measured
  PM-1127VF-LB:
    kind: lathe
    make: Precision Matthews
    source: http://web.archive.org/web/20220525213743/https://www.precisionmatthews.com/shop/pm-1127vf-lb/   # discontinued; 2022 snapshot
    operation_mode: manual
    spindle:
      ranges_rpm: [[70, 380], [380, 2200]]   # vendor (2019+ motor) and panel photo 20260707_043127222 agree
      bore_in: 1.5
      mount: D1-4                             # "now standard" on the 2022 page; older units threaded — confirm on the machine
      hp: 1
      drive: vfd
    swing_over_bed_in: 11
    between_centres_in: 27.55
    cross_slide_travel_in: 6
    compound_travel_in: 3
    tailstock: {taper: MT3, quill_travel_in: 4}
    leadscrew: {tpi: 8, cross_feed_ipr: [0.001, 0.0056]}
    threads: {inch_tpi: [8, 9, 10, 11, 12, 13, 14, 16, 18, 20, 22, 24, 26, 28, 32, 36, 40, 44, 48, 52, 56], metric_pitch_mm: [0.5, 3.0]}
    weight_lb: 575
    toolpost: {series: AXA, type: wedge, holders: 5, included: true, note: "a second AXA QCTP (250-111) came off the JET"}
    standard_accessories: [chuck-3jaw-6-d1-4, chuck-4jaw-6-d1-4, faceplate-d1-4, steady_rest, follow_rest, thread_dial, dead_centre_headstock, dead_centre_tailstock_mt3]
    verify: true   # vendor page, not measured
  BS-0:
    kind: dividing_head
    make: Precision Matthews
    sku: DIVIDINGHEAD-BS-0
    source: https://www.precisionmatthews.com/products/dividinghead-bs-0
    worm_ratio: 40
    centre_height_in: 3.9375
    swing_in: 7.875
    spindle: {bore_in: 0.708, mount: "1-1/2 x 8 TPI", taper: BS-7, runout_in: 0.0006}
    tilt_deg: {down: 10, up: 90}
    direct_index: {positions: 24, step_deg: 15}
    plates: 3
    plate_holes:   # PM lists 3 plates but not the circles; standard BS-0 set — count the plates to confirm
      A: [15, 16, 17, 18, 19, 20]
      B: [21, 23, 27, 29, 31, 33]
      C: [37, 39, 41, 43, 47, 49]
    included: [chuck_3jaw_5in_inside_outside_jaws, tailstock_adjustable, spindle_centre, dog_driver]
    verify: true

