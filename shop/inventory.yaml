# Pedro's shop — rough inventory, to be refined.
# `verify: true` marks a value taken from a vendor page, a forum, a photo or
# memory rather than measured/confirmed on the machine. Rules that depend on a
# `verify: true` value report at `warn`, never `block`, until it is cleared.
# Photo citations refer to C:/src/dt-logs/shop-photos/INVENTORY-DRAFT.md.

machines:
  PM-30MV:
    kind: mill
    make: Precision Matthews
    control: cncjs over grbl-class controller; operated manually via XHC WHB04B-6 pendant + EL400 DRO emulator
    operation_mode: manual_with_digital_positioning   # positions exact, feeds by hand
    spindle: {taper: R8, rpm_min: null, rpm_max: 4000, hp: 1, verify: true}
    travel_mm: {x: null, y: null, z: null, verify: true}   # measure on the machine
    table_mm: {length: null, width: null, verify: true}
  PM-1127VF-LB:
    kind: lathe
    make: Precision Matthews
    operation_mode: manual
    spindle:
      ranges_rpm: [[70, 380], [380, 2200]]   # panel legible in photo 20260707_043127222
      bore_in: 1.5                            # "large bore" model; verify
      mount: D1-4                             # later units; verify on the machine
      verify: true
    swing_in: 11
    between_centres_in: 27
    tailstock: {taper: MT3, verify: true}
    toolpost: {series: AXA, type: wedge, note: "QCTP marked 250-111 came off the JET; confirm it moved over", verify: true}
    standard_kit: {note: "PM standard kit — check contents", verify: true}
  BS-0:
    kind: dividing_head
    make: Precision Matthews
    worm_ratio: 40
    plates: null   # list hole circles; verify
    verify: true

