# Local test selection for scripts/affected_tests.py. CI always runs the full suite.
#
# keepers: always run when anything outside `ignore` changed. The golden
# examples drive `prechips` as a subprocess, which per-test coverage cannot
# attribute to any source file, so they guard every source change end to end.
keepers = ["tests/test_examples.py"]

# Changes that select the full suite: what every test imports or runs under.
full = [
    "pyproject.toml",
    "uv.lock",
    "tests/conftest.py",
    "src/prechips/__init__.py",
    ".gitattributes",
]

# Changes that cannot alter a local test outcome.
ignore = [
    "*.md",
    "docs/*",
    ".github/*",
    ".hallmark/*",
    ".gitignore",
    ".test_durations",
    "tokens.css",
    "scripts/ci_shards.py",
]

# Code that runs in a subprocess, which per-test coverage cannot attribute: a
# matching change selects every test module whose source names the token. The
# kernel entries are exactly kernel.ENGINE_SOURCES, the files freecadcmd runs.
[consumers]
"src/prechips/kernel/boolean_pool.py" = "freecad_kernel"
"src/prechips/kernel/chain_boundary.py" = "freecad_kernel"
"src/prechips/kernel/freecad_job.py" = "freecad_kernel"
"src/prechips/kernel/render_diagram.py" = "freecad_kernel"
"src/prechips/kernel/render_png.py" = "freecad_kernel"
"src/prechips/kernel/step_faces.py" = "freecad_kernel"
"src/prechips/cli.py" = "run_cli("

# Non-Python inputs, read by tests that coverage cannot attribute them to.
[paths]
"examples/*" = [
    "tests/test_angularity.py",
    "tests/test_chain_drill_speed.py",
    "tests/test_cli.py",
