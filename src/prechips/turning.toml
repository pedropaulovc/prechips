# Prototype static longitudinal-turning, milling and drilling screens, not
# machining approval.
# References: Machinery's Handbook corpus/pages/NNNN.md (PDF page NNNN).
# Coefficients below are condition/family proxies, not measured stock properties.
# Override any leaf in a custom TOML; new materials require both numeric fields.

[limits]
# Authored screening criteria on RADIAL bending at the tool, NOT handbook
# tolerances. Diameter error left behind is about twice the radial value.
rough_mm = 0.10
# User-selected finish radial-bending limit (about 0.010 mm on diameter).
finish_mm = 0.005

[force]
# AUTHORED assumption Fr/Ft, not a universal handbook force-component ratio.
# Radial force = Ft * radial_ratio is what bends the work toward/away from the
# tool; Ft itself only moves the work along the cutting direction (reported,
# not compared). Small DOC on a nose radius pushes Fr toward Ft, hence 1.0.
radial_ratio = 1.0
# Table 5, PDF 1408 / printed 1087: normal rough and light finish wear factors.
rough_wear = 1.30
finish_wear = 1.10
# Complete turning Table 4, PDF 1408 / printed 1087: [feed in/rev, factor C].
# Linear interpolation is our implementation choice; no extrapolation.
feed_factors = [
    [0.001, 1.60],
    [0.002, 1.40],
    [0.003, 1.30],
    [0.004, 1.25],
    [0.005, 1.19],
    [0.006, 1.15],
    [0.007, 1.11],
    [0.008, 1.08],
    [0.009, 1.06],
    [0.010, 1.04],
    [0.011, 1.02],
    [0.012, 1.00],
    [0.013, 0.98],
    [0.014, 0.97],
    [0.015, 0.96],
    [0.016, 0.94],
    [0.018, 0.92],
    [0.020, 0.90],
    [0.022, 0.88],
    [0.025, 0.86],
    [0.028, 0.84],
    [0.030, 0.83],
    [0.032, 0.82],
    [0.035, 0.80],
    [0.040, 0.78],
    [0.060, 0.72],
]

# Unit power Kp: hp/(in^3/min), sharp-tool basis, PDF 1405-1407 / pp1084-1086.
# Fc=396000*Kp*C*W*DOC(in)*feed(in/rev) lbf derives from Q=12Vfd and hp.
# Do not multiply by motor-drive efficiency: this is cutting-edge force.
[materials.aluminum]
# Table 3a PDF1406/p1085: rolled (hard) aluminum, not the cast row.
unit_power_hp_min_per_in3 = 0.33
# PDF0525/p204: wrought 2014-T6, 10.6 million psi, rounded GPa family proxy.
elastic_modulus_gpa = 73.0
# Table 8 PDF1411/p1090: most aluminum alloys.
drill_kd = 7000.0

[materials.aluminum_6061]
# Table 3a PDF1406/p1085: rolled (hard) aluminum, the closest row for
# 6061-T6/T6511; the table has no alloy-specific aluminum row.
unit_power_hp_min_per_in3 = 0.33
# PDF0741/p420 Typical Elastic Properties: 6061-T6, 10.2 million psi.
elastic_modulus_gpa = 70.3
# Table 8 PDF1411/p1090: most aluminum alloys.
drill_kd = 7000.0

[materials.brass]
# Table 3a PDF1406/p1085: medium brass (not leaded/soft/hard universal value).
unit_power_hp_min_per_in3 = 0.50
# PDF0525/p204: naval brass, 15 million psi, rounded family proxy.
elastic_modulus_gpa = 103.0
# Table 8 PDF1411/p1090: most brasses (leaded brass is 7,000).
drill_kd = 14000.0

[materials.bronze]
# Table 3a PDF1406/p1085: medium bronze; hard bronze has a different row.
unit_power_hp_min_per_in3 = 0.50
# PDF0525/p204: phosphor bronze ASTM B159, 15 million psi family proxy.
elastic_modulus_gpa = 103.0
# No drill_kd: Table 8 has no bronze row, so drilling bronze refuses until a
# shop config supplies one.

[materials.steel_1018]
# AUTHORED condition proxy: plain carbon steel 160-180 HB, Table 3b PDF1407/p1086.
# Not a grade-specific 1018 measurement or universal cold-drawn hardness.
unit_power_hp_min_per_in3 = 0.78
# PDF0795/p474 Table 13: SAE1025 low-carbon steel, 30 million psi proxy.
elastic_modulus_gpa = 207.0
# Table 8 PDF1411/p1090: steel 200 Bhn, the first row at or above 180 HB.
drill_kd = 24000.0

[materials.steel_o1]
# AUTHORED annealed tool-steel 200-250 HB proxy, Table 3a PDF1406/p1085.
# NOT hardened O1. Actual stock hardness/condition must suit the chosen data.
unit_power_hp_min_per_in3 = 0.88
# PDF0795/p474: 30 million psi steel-family proxy, not O1-specific measurement.
elastic_modulus_gpa = 207.0
# Table 8 PDF1411/p1090: steel 300 Bhn, the first row at or above 250 HB.
drill_kd = 31000.0

[materials.stainless_304]
# AUTHORED annealed type 304 proxy, at most 200 HB: Table 3a PDF1406/p1085
# stainless steel 175-200 HB. Not cold-worked or work-hardened stock.
unit_power_hp_min_per_in3 = 0.72
# PDF0741/p420 Typical Elastic Properties: stainless steel 18-8, 27.6 million psi.
elastic_modulus_gpa = 190.3
# Table 8 PDF1411/p1090: austenitic stainless (type 316) thrust row, which the
# handbook bases on a limited number of tests.
drill_kd = 35000.0

# Beam formulas: PDF0586/p265 cases11-12 (chuck cantilever), PDF0582/p261
# cases2-3 (pinned supports at actual load position). Round I=pi*D^4/64:
# PDF0576/p255. Follower uses chuck/pad point supports only AFTER land engagement.
# Uniform minimum section is conservative for stepped solid round sections;
# no hollow stock, gaps, profiles, machine compliance, chatter, thermal effects,
# plasticity, axial-force buckling, or motion/physical setup certification.

[milling]
# Milling and drilling bending at the cut station, compared per declared
# bending axis. AUTHORED screening criteria, NOT handbook tolerances.
# Finish: one-tenth of the drawings' tightest general band (.XXX +/-.005 in,
# 0.254 mm wide), about .001 in. Rough: as turning, under the smallest authored
# finish allowance (.005 in = 0.127 mm) so the finish pass still cleans up.
rough_mm = 0.10
finish_mm = 0.025
# AUTHORED ratios to the handbook mean tangential force Ft, not measurements.
# Across the spindle the force rotates with the cutter; its resultant
# Ft*sqrt(1 + radial_ratio^2) is applied in each declared horizontal axis.
# 1.0 as turning: thin chips push the radial component toward Ft.
radial_ratio = 1.0
# Along the spindle: helix lift on side and slot cuts, end-tooth push on end
# and face cuts. Ft*tan(helix) is the first-order estimate; 1.0 = tan 45 deg
# covers the 30-45 deg helices of general-purpose and aluminium end mills.
axial_ratio = 1.0
# Table 5 PDF1408/p1087: end and slab milling 1.10; face cuts take 1.25, the
# top of light and medium face milling (1.10-1.25). Milling feed factors are
# force.feed_factors: Table 4 reads in/tooth for milling.
wear = 1.10
face_wear = 1.25
# Ft = 396000*Kp*C*W*w*d*ft*nt/(pi*D) lbf (in): Pc = Kp*C*Q*W with Q = fm*w*d,
# fm = ft*nt*N (Table 7, PDF1409/p1088), and Ft = 33000*Pc/V, V = pi*D*N/12.
# This is the mean force over a revolution; intermittent tooth peaks are higher.
# Beams: cantilever F*L^3/(3EI) (case 11, PDF0586/p265); pinned span
# F*a^2*b^2/(3EI*l) at the load (case 3, PDF0582/p261), and F*c^2*(c+l)/(3EI)
# on an overhang c beyond one support (case 8, PDF0585/p264); rectangle
# I=b*d^3/12 (PDF0560/p239), round I=pi*D^4/64 (PDF0576/p255).

[drilling]
# Thrust T = 2*Kd*Ff*FT*B*W + Kd*D^2*J*W lb, D in (PDF1412/p1091 eq. 1),
# along the spindle only. Plunging end mills reuse it as an authored proxy.
# Table 5 PDF1408/p1087 and PDF1411/p1090: 1.30 for ordinary drilling.
wear = 1.30
# Table 9 PDF1412/p1091: standard drill, c/d = 0.18 (split points are lower).
chisel_thrust_b = 1.355
chisel_thrust_j = 0.030
# Table 10 PDF1413/p1092, inch: [feed in/rev, Ff].
feed_factors = [
