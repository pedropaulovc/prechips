# Machinery's Handbook go-to packet for the blind traveler review.
#
# Only page numbers live here; the handbook is never vendored. scripts/machinist_review.py
# reads each page from <handbook>/corpus/pages/NNNN.md (NNNN = `pdf`, the PDF page)
# and embeds its text in the prompt, labelled with `printed`, the handbook folio. The
# corpus page header must name the same printed page, and the corpus README must name
# `source_pdf_sha256`, or the run is refused.
#
# Pages come from the corpus README's verified "Go-to machining pages" list for the
# pilot operations (every pilot is 1018 low-carbon steel): carbide and HSS turning
# with the feed/depth factors, end milling with its factors, drilling and reaming,
# the reamer stock-allowance prose (the handbook has no allowance table), centre
# drills, band-saw speeds, automatic-screw-machine cutoff/form/recess data for the
# HSS parting and plunge tools, and inch and metric tap drills.

edition = "Machinery's Handbook 27th edition"
source_pdf_sha256 = "014d2b9b63458ccc4d02ff96e4ab2557f1243b6f9eec3a9ed918f1bb35403ccb"

