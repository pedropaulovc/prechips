# --- alternatives the churn report compares ------------------------------------------------
[[variant]]
name = "family-only"  # model/ per input family, the whole plan schema in one file
base = "model"
[variant.merge]
"src/prechips/model/stock.py" = "src/prechips/model/plan.py"
"src/prechips/model/holding.py" = "src/prechips/model/plan.py"
"src/prechips/model/zero.py" = "src/prechips/model/plan.py"
"src/prechips/model/operation.py" = "src/prechips/model/plan.py"
"src/prechips/model/inspection.py" = "src/prechips/model/plan.py"
"src/prechips/model/joints.py" = "src/prechips/model/plan.py"
"src/prechips/model/cutting_data.py" = "src/prechips/model/policy.py"

[[variant]]
name = "helpers-only"  # sheet/ helpers and literals out, _Traveler whole
base = "sheet"
whole_classes = true

[[variant]]
name = "helpers-only"  # engine helpers out, _Job and _Setup whole
base = "freecad_job"
whole_classes = true

