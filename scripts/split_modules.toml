# Split spec for scripts/split_modules.py; the design and evidence are in
# docs/module-split.md. Each [[module]] moves the top-level symbols (fnmatch patterns on
# names; "Class.method" for a method of a split class) into the listed target files;
# every symbol no pattern names stays in `rest`. A `variant` is an alternative the
# `churn` report compares; `plan` and `apply` take the variant-less entry by default.

# Every file that parses, compiles or executes Python source (ast.parse, inspect.getsource,
# built-in compile/exec, also inside probe scripts), with the split
# modules whose source it reads: apply refuses an unlisted one and prints the readers of
# the module it splits, to port by hand in that PR.
[parses_source]
"scripts/split_modules.py" = []
"tests/test_split_modules.py" = []
"tests/test_kernel_checkpoints.py" = ["src/prechips/kernel/freecad_job.py"]
"tests/test_render_png.py" = ["src/prechips/kernel/freecad_job.py"]
"tests/test_guided_sweep.py" = ["src/prechips/kernel/freecad_job.py"]
# Its probe compiles a mutated copy of freecad_job.py.
"tests/test_kernel_unknown_stock_own_cut.py" = ["src/prechips/kernel/freecad_job.py"]
# Walks the kernel's import graph, whatever files hold the code.
"tests/test_engine_digest.py" = []

# --- model.py -> model/ per input family, the plan schema per plan concern ----------------
[[module]]
name = "model"
source = "src/prechips/model.py"
rest = "src/prechips/model/plan.py"
style = "package"
init = { "src/prechips/model/__init__.py" = """The five TOML input schemas, one module per input family (the plan's by concern).

Literal unknown is never a numeric default.
""" }

[module.docs]
"src/prechips/model/plan.py" = "The plan schema's root: the plan, its setups and their shared plan-level records."
"src/prechips/model/common.py" = "Shared schema vocabulary: unknown, records, citations and requirement names."
"src/prechips/model/stock.py" = "Plan stock: components, prepared blanks and stock states."
